<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Cuál es más creativo?</title>
<style>
  :root { --bg:#fff8ec; --ink:#2b2140; --a:#ff6b6b; --b:#4dabf7; --card:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui, sans-serif; background:var(--bg); color:var(--ink);
         min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:16px; }
  h1 { font-size:clamp(24px,5vw,40px); margin:8px 0 4px; text-align:center; }
  p.sub { margin:0 0 16px; opacity:.7; text-align:center; font-size:18px; }
  .reg { background:var(--card); border-radius:24px; padding:24px; width:min(420px,100%);
         box-shadow:0 8px 30px #0001; display:flex; flex-direction:column; gap:14px; }
  label { font-size:20px; font-weight:600; }
  input { font-size:24px; padding:12px 16px; border-radius:14px; border:3px solid #ddd; width:100%; }
  button.go { font-size:26px; font-weight:700; padding:16px; border:0; border-radius:18px;
              background:var(--ink); color:#fff; cursor:pointer; }
  .duelo { display:grid; grid-template-columns:1fr 1fr; gap:16px; width:min(1000px,100%); }
  @media (max-width:640px){ .duelo { grid-template-columns:1fr; } }
  .op { background:var(--card); border:6px solid transparent; border-radius:28px; padding:12px;
        cursor:pointer; transition:transform .12s, border-color .12s; box-shadow:0 8px 30px #0001; }
  .op:hover { transform:scale(1.02); }
  .op.a:hover, .op.a.sel { border-color:var(--a); }
  .op.b:hover, .op.b.sel { border-color:var(--b); }
  .op img { width:100%; aspect-ratio:1; display:block; border-radius:18px; background:#fff; }
  .op .btn { margin-top:10px; text-align:center; font-size:24px; font-weight:800; padding:12px;
             border-radius:16px; color:#fff; }
  .op.a .btn { background:var(--a); } .op.b .btn { background:var(--b); }
  .barra { margin-top:18px; font-size:20px; display:flex; gap:12px; align-items:center; }
  .estrellas { font-size:28px; letter-spacing:2px; }
  .salir { background:none; border:2px solid var(--ink); border-radius:12px; padding:8px 14px;
           font-size:16px; cursor:pointer; color:var(--ink); }
  .msg { font-size:24px; text-align:center; margin-top:40px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<h1>🎨 ¿Cuál es más creativo?</h1>
<p class="sub" id="sub">Mira los dos dibujos y toca el que te parezca más original.</p>

<form class="reg" id="reg">
  <label for="alias">¿Cómo te llamas? (un apodo)</label>
  <input id="alias" maxlength="30" required autocomplete="off">
  <label for="edad">¿Cuántos años tienes?</label>
  <input id="edad" type="number" min="3" max="110" required inputmode="numeric">
  <button class="go">¡Empezar!</button>
</form>

<div id="juego" hidden>
  <div class="duelo">
    <div class="op a" data-k="a"><img id="ia" alt="Dibujo A"><div class="btn">¡Este!</div></div>
    <div class="op b" data-k="b"><img id="ib" alt="Dibujo B"><div class="btn">¡Este!</div></div>
  </div>
  <div class="barra"><span>Votos: <b id="n">0</b></span><span class="estrellas" id="est"></span>
    <button class="salir" id="salir">Terminar</button></div>
</div>
<div class="msg" id="msg" hidden></div>

<script>
const $ = id => document.getElementById(id);
const modelo = new URLSearchParams(location.search).get("modelo") || "haiku";
let ev = null, par = null, t0 = 0, n = 0, ocupado = false;
try { ev = JSON.parse(sessionStorage.getItem("ev")); } catch {}

$("reg").onsubmit = async e => {
  e.preventDefault();
  const r = await fetch("/api/registro", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({alias:$("alias").value, edad:+$("edad").value})});
  if (!r.ok) return alert("Revisa el apodo y la edad");
  ev = (await r.json()).id;
  try { sessionStorage.setItem("ev", JSON.stringify(ev)); } catch {}
  empezar();
};

async function siguiente() {
  const r = await fetch(`/api/duelo?evaluador=${ev}&modelo=${modelo}`);
  if (!r.ok) { fin(r.status === 410 ? "¡Viste todos los dibujos! Gracias 🎉" : "Todavía no hay dibujos."); return; }
  par = await r.json();
  $("ia").src = "/svg/" + par.a; $("ib").src = "/svg/" + par.b;
  document.querySelectorAll(".op").forEach(o => o.classList.remove("sel"));
  t0 = Date.now(); ocupado = false;
}

document.querySelectorAll(".op").forEach(o => o.onclick = async () => {
  if (ocupado || !par) return; ocupado = true;
  o.classList.add("sel");
  const g = par[o.dataset.k], p = par[o.dataset.k === "a" ? "b" : "a"];
  const r = await fetch("/api/voto", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({evaluador:ev, ganador:g, perdedor:p, ms:Date.now()-t0})});
  n = (await r.json()).votos; $("n").textContent = n;
  $("est").textContent = "⭐".repeat(Math.min(10, Math.floor(n / 5)));
  setTimeout(siguiente, 250);
});

function empezar() { $("reg").hidden = true; $("juego").hidden = false; siguiente(); }
function fin(t) { $("juego").hidden = true; $("msg").hidden = false; $("msg").textContent = t; }
$("salir").onclick = () => { try { sessionStorage.removeItem("ev"); } catch {}
  fin(`¡Gracias! Hiciste ${n} votos 🙌`); setTimeout(() => location.reload(), 2500); };

if (ev) empezar();
</script>
</body>
</html>
