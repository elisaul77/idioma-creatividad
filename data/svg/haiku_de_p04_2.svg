<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="himmel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe6ff"/>
      <stop offset="1" stop-color="#ffe9c7"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#himmel)"/>

  <!-- Sonne -->
  <circle cx="330" cy="62" r="28" fill="#ffd166"/>

  <!-- Wolken -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="70" cy="70" rx="34" ry="14"/>
    <ellipse cx="90" cy="60" rx="22" ry="14"/>
    <ellipse cx="200" cy="44" rx="26" ry="11"/>
  </g>

  <!-- Hügel -->
  <path d="M0,330 Q200,296 400,334 L400,400 L0,400 Z" fill="#9be38a"/>

  <!-- Schornstein mit Rauchkringeln -->
  <rect x="262" y="104" width="26" height="54" rx="4" fill="#6b4fb8"/>
  <g fill="none" stroke="#c9b8f0" stroke-width="5" stroke-linecap="round">
    <path d="M270,92 q-10,-10 0,-20 q10,-10 0,-20"/>
    <path d="M282,80 q-8,-8 0,-16"/>
  </g>

  <!-- Hörner -->
  <path d="M168,100 Q156,70 136,58 Q152,84 162,112 Z" fill="#ffd166"/>
  <path d="M232,100 Q244,70 264,58 Q248,84 238,112 Z" fill="#ffd166"/>

  <!-- Hauskörper -->
  <rect x="100" y="172" width="200" height="158" rx="18" fill="#8e6cd8"/>

  <!-- Zottiges Dach -->
  <path d="M76,184 L200,84 L324,184 Q312,176 300,184 Q288,176 276,184 Q264,176 252,184 Q240,176 228,184 Q216,176 200,186 Q184,176 172,184 Q160,176 148,184 Q136,176 124,184 Q112,176 100,184 Q88,176 76,184 Z" fill="#f06292"/>

  <!-- Augen (Fenster) -->
  <g>
    <circle cx="160" cy="222" r="26" fill="#ffffff"/>
    <circle cx="166" cy="226" r="12" fill="#2d1b4e"/>
    <circle cx="170" cy="222" r="4" fill="#ffffff"/>
    <circle cx="240" cy="222" r="26" fill="#ffffff"/>
    <circle cx="246" cy="226" r="12" fill="#2d1b4e"/>
    <circle cx="250" cy="222" r="4" fill="#ffffff"/>
  </g>

  <!-- Augenbrauen als freundliche Bögen -->
  <g fill="none" stroke="#2d1b4e" stroke-width="4" stroke-linecap="round">
    <path d="M136,186 Q160,172 184,186"/>
    <path d="M216,186 Q240,172 264,186"/>
  </g>

  <!-- Wangen -->
  <ellipse cx="130" cy="262" rx="12" ry="7" fill="#ff8fab" opacity="0.7"/>
  <ellipse cx="270" cy="262" rx="12" ry="7" fill="#ff8fab" opacity="0.7"/>

  <!-- Tür als lächelnder Mund -->
  <path d="M172,332 L172,296 Q200,266 228,296 L228,332 Z" fill="#3b1f5c"/>
  <g fill="#ffffff">
    <polygon points="180,292 188,292 184,302"/>
    <polygon points="192,286 200,286 196,298"/>
    <polygon points="204,286 212,286 208,298"/>
    <polygon points="216,292 224,292 220,302"/>
  </g>

  <!-- Türgriff als Zunge -->
  <path d="M200,332 Q200,344 208,342 Q214,340 210,332 Z" fill="#ff8fab"/>

  <!-- Weg und Stufen -->
  <path d="M184,332 L216,332 L238,400 L162,400 Z" fill="#f9d8a6"/>
  <g fill="#e8c28a">
    <ellipse cx="200" cy="372" rx="10" ry="4"/>
  </g>

  <!-- Blumen -->
  <g>
    <circle cx="70" cy="330" r="6" fill="#ff6b9a"/>
    <circle cx="70" cy="330" r="2" fill="#ffd166"/>
    <circle cx="96" cy="346" r="6" fill="#ffd166"/>
    <circle cx="96" cy="346" r="2" fill="#ff6b9a"/>
    <circle cx="318" cy="332" r="6" fill="#ff6b9a"/>
    <circle cx="318" cy="332" r="2" fill="#ffd166"/>
    <circle cx="340" cy="352" r="6" fill="#c9b8f0"/>
    <circle cx="340" cy="352" r="2" fill="#ffd166"/>
  </g>
  <g stroke="#4caf50" stroke-width="2">
    <line x1="70" y1="336" x2="70" y2="360"/>
    <line x1="96" y1="352" x2="96" y2="374"/>
    <line x1="318" y1="338" x2="318" y2="362"/>
    <line x1="340" y1="358" x2="340" y2="380"/>
  </g>
</svg>