<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1433"/>
      <stop offset="1" stop-color="#2a2a5e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6c8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff6c8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Night sky -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- Moon and glow -->
  <circle cx="320" cy="80" r="70" fill="url(#glow)"/>
  <circle cx="320" cy="80" r="34" fill="#fff6c8"/>
  <circle cx="334" cy="70" r="30" fill="#161e45"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="40" cy="40" r="2"/>
    <circle cx="90" cy="28" r="1.5"/>
    <circle cx="160" cy="50" r="2"/>
    <circle cx="210" cy="22" r="1.5"/>
    <circle cx="260" cy="150" r="1.5"/>
    <circle cx="370" cy="170" r="2"/>
    <circle cx="30" cy="130" r="1.5"/>
    <circle cx="150" cy="110" r="1.5"/>
    <circle cx="385" cy="30" r="1.5"/>
  </g>

  <!-- Floor and rug -->
  <rect x="0" y="300" width="400" height="100" fill="#3b2a4f"/>
  <ellipse cx="200" cy="322" rx="160" ry="26" fill="#7a4f8f"/>
  <ellipse cx="200" cy="322" rx="130" ry="18" fill="none" stroke="#a77bc0" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Teddy bear, waving -->
  <g>
    <ellipse cx="110" cy="265" rx="38" ry="42" fill="#c48a5a"/>
    <ellipse cx="150" cy="240" rx="12" ry="26" transform="rotate(-35 150 240)" fill="#c48a5a"/>
    <ellipse cx="70" cy="265" rx="12" ry="24" transform="rotate(15 70 265)" fill="#c48a5a"/>
    <circle cx="110" cy="200" r="30" fill="#c48a5a"/>
    <circle cx="86" cy="178" r="12" fill="#c48a5a"/>
    <circle cx="134" cy="178" r="12" fill="#c48a5a"/>
    <circle cx="86" cy="178" r="6" fill="#e6b98a"/>
    <circle cx="134" cy="178" r="6" fill="#e6b98a"/>
    <path d="M97 198 Q102 203 107 198 M113 198 Q118 203 123 198" stroke="#2b1d12" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="110" cy="213" rx="12" ry="9" fill="#e6b98a"/>
    <ellipse cx="110" cy="209" rx="4" ry="3" fill="#2b1d12"/>
    <ellipse cx="95" cy="300" rx="14" ry="8" fill="#8a5a36"/>
    <ellipse cx="125" cy="300" rx="14" ry="8" fill="#8a5a36"/>
  </g>

  <!-- Toy robot, wide awake -->
  <g>
    <rect x="208" y="238" width="14" height="10" rx="3" fill="#5aa9c9"/>
    <rect x="278" y="238" width="14" height="10" rx="3" fill="#5aa9c9"/>
    <rect x="225" y="236" width="50" height="60" rx="6" fill="#8fd3e8"/>
    <rect x="232" y="250" width="36" height="14" rx="3" fill="#1d2b53"/>
    <circle cx="241" cy="257" r="4" fill="#ffd166"/>
    <circle cx="259" cy="257" r="4" fill="#ffd166"/>
    <rect x="230" y="180" width="40" height="40" rx="6" fill="#b8ecf7"/>
    <circle cx="240" cy="196" r="5" fill="#ffd166"/>
    <circle cx="260" cy="196" r="5" fill="#ffd166"/>
    <path d="M246 208 Q250 212 254 208" stroke="#1d2b53" stroke-width="2" fill="none" stroke-linecap="round"/>
    <line x1="250" y1="180" x2="250" y2="164" stroke="#5aa9c9" stroke-width="3"/>
    <circle cx="250" cy="160" r="5" fill="#ff6b6b"/>
    <rect x="232" y="292" width="12" height="10" rx="2" fill="#5aa9c9"/>
    <rect x="256" y="292" width="12" height="10" rx="2" fill="#5aa9c9"/>
  </g>

  <!-- Spinning top with motion arcs -->
  <g>
    <path d="M318 280 Q330 268 342 280" stroke="#ffd6a5" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M312 288 Q330 272 348 288" stroke="#ffd6a5" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M308 300 L352 300 L330 332 Z" fill="#ffb703"/>
    <ellipse cx="330" cy="300" rx="22" ry="6" fill="#fb8500"/>
    <line x1="330" y1="294" x2="330" y2="268" stroke="#fb8500" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Bouncing ball with sparkle -->
  <g>
    <circle cx="60" cy="338" r="14" fill="#ef476f"/>
    <ellipse cx="60" cy="354" rx="12" ry="3" fill="#000000" opacity="0.25"/>
    <path d="M60 318 L62 324 L68 326 L62 328 L60 334 L58 328 L52 326 L58 324 Z" fill="#ffd166"/>
  </g>

  <!-- Sparkles -->
  <g fill="#ffd166">
    <path d="M180 260 L182 266 L188 268 L182 270 L180 276 L178 270 L172 268 L178 266 Z"/>
    <path d="M385 230 L386 234 L390 235 L386 236 L385 240 L384 236 L380 235 L384 234 Z"/>
    <path d="M24 230 L25 233 L28 234 L25 235 L24 238 L23 235 L20 234 L23 233 Z"/>
  </g>
</svg>