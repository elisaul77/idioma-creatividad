<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CBEBFF"/>
      <stop offset="1" stop-color="#FFF6DE"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C4B5FF"/>
      <stop offset="1" stop-color="#9F8CF0"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="345" cy="60" r="30" fill="#FFF2A8"/>
  <circle cx="345" cy="60" r="42" fill="#FFF2A8" opacity="0.35"/>

  <!-- Clouds -->
  <g fill="#FFFFFF" opacity="0.9">
    <ellipse cx="95" cy="68" rx="30" ry="16"/>
    <ellipse cx="120" cy="60" rx="26" ry="20"/>
    <ellipse cx="142" cy="70" rx="22" ry="13"/>
  </g>

  <!-- Hill / grass -->
  <ellipse cx="200" cy="350" rx="210" ry="70" fill="#A8E6A1"/>
  <ellipse cx="200" cy="360" rx="180" ry="50" fill="#93DA8E" opacity="0.6"/>

  <!-- Flowers -->
  <g>
    <circle cx="55" cy="352" r="5" fill="#FFD86B"/>
    <circle cx="55" cy="352" r="2" fill="#FFFFFF"/>
    <circle cx="70" cy="372" r="4" fill="#FF9EC4"/>
    <circle cx="338" cy="358" r="5" fill="#FFD86B"/>
    <circle cx="338" cy="358" r="2" fill="#FFFFFF"/>
    <circle cx="322" cy="378" r="4" fill="#FF9EC4"/>
    <circle cx="360" cy="340" r="3.5" fill="#FFFFFF"/>
    <circle cx="40" cy="330" r="3.5" fill="#FFFFFF"/>
  </g>

  <!-- Horns (roof) -->
  <path d="M135 152 Q118 112 140 90 Q152 122 172 146 Z" fill="#FFB36B" stroke="#C97A3A" stroke-width="3" stroke-linejoin="round"/>
  <path d="M265 152 Q282 112 260 90 Q248 122 228 146 Z" fill="#FFB36B" stroke="#C97A3A" stroke-width="3" stroke-linejoin="round"/>

  <!-- Monster body (house) -->
  <path d="M110 175 Q110 140 150 140 L250 140 Q290 140 290 175 L290 320 Q275 345 260 320 Q245 345 230 320 Q215 345 200 320 Q185 345 170 320 Q155 345 140 320 Q125 345 110 320 Z"
        fill="url(#body)" stroke="#6B5BCF" stroke-width="4" stroke-linejoin="round"/>

  <!-- Body spots -->
  <g fill="#D9CDFF" opacity="0.8">
    <circle cx="125" cy="182" r="5"/>
    <circle cx="276" cy="178" r="6"/>
    <circle cx="282" cy="270" r="4"/>
    <circle cx="122" cy="282" r="4"/>
  </g>

  <!-- Eyes (windows) -->
  <circle cx="168" cy="205" r="28" fill="#FFFFFF" stroke="#4A3B7A" stroke-width="3"/>
  <circle cx="232" cy="205" r="28" fill="#FFFFFF" stroke="#4A3B7A" stroke-width="3"/>
  <circle cx="172" cy="210" r="12" fill="#3B2F6B"/>
  <circle cx="236" cy="210" r="12" fill="#3B2F6B"/>
  <circle cx="176" cy="204" r="4" fill="#FFFFFF"/>
  <circle cx="240" cy="204" r="4" fill="#FFFFFF"/>

  <!-- Cheeks -->
  <ellipse cx="138" cy="246" rx="13" ry="8" fill="#FF9EC4" opacity="0.75"/>
  <ellipse cx="262" cy="246" rx="13" ry="8" fill="#FF9EC4" opacity="0.75"/>

  <!-- Door (smiling mouth) -->
  <path d="M172 320 L172 288 Q200 262 228 288 L228 320 Z" fill="#5B4590"/>
  <ellipse cx="200" cy="312" rx="12" ry="7" fill="#FF8FB1"/>

  <!-- Floating hearts -->
  <path d="M0 6C-12-4-6-14 0-6C6-14 12-4 0 6Z" fill="#FF7FA8" transform="translate(75 120) scale(2.2)"/>
  <path d="M0 6C-12-4-6-14 0-6C6-14 12-4 0 6Z" fill="#FF9EC4" transform="translate(325 150) scale(1.6)"/>
  <path d="M0 6C-12-4-6-14 0-6C6-14 12-4 0 6Z" fill="#FFB3D1" transform="translate(340 205) scale(1.1)"/>

  <!-- Sparkles -->
  <g fill="#FFFFFF">
    <circle cx="110" cy="110" r="2.5"/>
    <circle cx="300" cy="115" r="2"/>
    <circle cx="60" cy="180" r="2"/>
  </g>
</svg>