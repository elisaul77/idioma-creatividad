<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf6ec"/>
      <stop offset="1" stop-color="#ffe9d6"/>
    </linearGradient>
    <radialGradient id="drop" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#8fd3ff"/>
      <stop offset="0.5" stop-color="#2b7de0"/>
      <stop offset="1" stop-color="#143c86"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4aa3ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4aa3ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5bbcff"/>
      <stop offset="1" stop-color="#1f5fbf"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- soft halo -->
  <circle cx="200" cy="190" r="150" fill="url(#glow)"/>

  <!-- ripples -->
  <g fill="none" stroke="#7fbfff" stroke-width="3" stroke-linecap="round" opacity="0.6">
    <ellipse cx="200" cy="330" rx="150" ry="22"/>
    <ellipse cx="200" cy="330" rx="110" ry="15" opacity="0.8"/>
    <ellipse cx="200" cy="330" rx="70" ry="9" opacity="0.6"/>
  </g>

  <!-- main drop -->
  <path d="M200 80 C200 80 118 176 118 238 C118 284 155 318 200 318 C245 318 282 284 282 238 C282 176 200 80 200 80 Z" fill="url(#drop)"/>

  <!-- highlight -->
  <ellipse cx="170" cy="215" rx="14" ry="30" fill="#ffffff" opacity="0.6" transform="rotate(20 170 215)"/>
  <circle cx="183" cy="252" r="5" fill="#ffffff" opacity="0.5"/>

  <!-- small companion drops -->
  <path d="M305 135 C305 135 280 165 280 180 C280 192 289 200 305 200 C321 200 330 192 330 180 C330 165 305 135 305 135 Z" fill="url(#wave)" opacity="0.85"/>
  <path d="M96 150 C96 150 78 172 78 184 C78 194 85 200 96 200 C107 200 114 194 114 184 C114 172 96 150 96 150 Z" fill="url(#wave)" opacity="0.7"/>

  <!-- sparkles -->
  <g fill="#2b7de0">
    <path d="M330 290 L334 300 L344 304 L334 308 L330 318 L326 308 L316 304 L326 300 Z" opacity="0.8"/>
    <path d="M70 280 L73 287 L80 290 L73 293 L70 300 L67 293 L60 290 L67 287 Z" opacity="0.6"/>
    <circle cx="340" cy="90" r="4" opacity="0.5"/>
    <circle cx="60" cy="90" r="3" opacity="0.4"/>
  </g>
</svg>