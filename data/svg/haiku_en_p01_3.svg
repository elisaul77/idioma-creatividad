<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="sky" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#2a1b4d"/>
      <stop offset="60%" stop-color="#110a26"/>
      <stop offset="100%" stop-color="#05030c"/>
    </radialGradient>
    <linearGradient id="wingL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7ab8" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#8f6bff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#38e1ff" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="wingR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#ff7ab8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#8f6bff" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4b26b"/>
      <stop offset="100%" stop-color="#b8603a"/>
    </linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b8603a"/>
      <stop offset="100%" stop-color="#38e1ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38e1ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38e1ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scales" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M0 8 Q4 0 8 8 Q12 0 16 8" fill="none" stroke="#7a3a1f" stroke-width="1.2" opacity="0.6"/>
      <path d="M0 16 Q4 8 8 16 Q12 8 16 16" fill="none" stroke="#7a3a1f" stroke-width="1.2" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#sky)"/>
  <g fill="#ffffff">
    <circle cx="40" cy="50" r="1.5" opacity="0.8"/>
    <circle cx="90" cy="30" r="1" opacity="0.6"/>
    <circle cx="150" cy="60" r="1.8" opacity="0.9"/>
    <circle cx="320" cy="45" r="1.5" opacity="0.7"/>
    <circle cx="360" cy="90" r="1" opacity="0.6"/>
    <circle cx="260" cy="25" r="1.2" opacity="0.8"/>
    <circle cx="30" cy="150" r="1" opacity="0.5"/>
    <circle cx="375" cy="175" r="1.4" opacity="0.7"/>
    <circle cx="60" cy="330" r="1.2" opacity="0.6"/>
    <circle cx="345" cy="340" r="1.6" opacity="0.8"/>
  </g>

  <!-- Moon-like glow behind -->
  <circle cx="200" cy="170" r="150" fill="url(#glow)" opacity="0.35"/>

  <!-- Wings -->
  <path d="M170 200 C120 110, 40 90, 20 150 C10 190, 60 220, 100 230 C60 250, 70 300, 120 300 C150 300, 165 265, 170 240 Z" fill="url(#wingL)"/>
  <path d="M230 200 C280 110, 360 90, 380 150 C390 190, 340 220, 300 230 C340 250, 330 300, 280 300 C250 300, 235 265, 230 240 Z" fill="url(#wingR)"/>
  <path d="M170 200 C140 150, 90 140, 60 160" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
  <path d="M230 200 C260 150, 310 140, 340 160" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>

  <!-- Tail -->
  <path d="M250 265 C300 280, 320 320, 300 345 C285 362, 265 340, 280 325 C295 310, 275 295, 240 285 Z" fill="url(#tail)"/>
  <path d="M300 345 C320 360, 345 355, 350 330 C345 350, 330 368, 300 360 Z" fill="#38e1ff" opacity="0.8"/>

  <!-- Legs -->
  <g stroke="#8a4526" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M160 262 L150 325"/>
    <path d="M178 268 L172 335"/>
    <path d="M222 268 L228 335"/>
    <path d="M240 262 L252 325"/>
  </g>
  <g fill="#38e1ff">
    <circle cx="150" cy="328" r="3"/>
    <circle cx="172" cy="338" r="3"/>
    <circle cx="228" cy="338" r="3"/>
    <circle cx="252" cy="328" r="3"/>
  </g>

  <!-- Body -->
  <ellipse cx="200" cy="235" rx="72" ry="48" fill="url(#body)"/>
  <ellipse cx="200" cy="235" rx="72" ry="48" fill="url(#scales)"/>

  <!-- Neck -->
  <path d="M170 205 Q180 170 190 160 L215 160 Q225 180 232 205 Z" fill="url(#body)"/>

  <!-- Ears -->
  <path d="M176 128 L168 88 L196 116 Z" fill="#f4b26b"/>
  <path d="M224 128 L232 88 L204 116 Z" fill="#f4b26b"/>
  <path d="M178 118 L174 98 L190 114 Z" fill="#ff7ab8" opacity="0.8"/>
  <path d="M222 118 L226 98 L210 114 Z" fill="#ff7ab8" opacity="0.8"/>

  <!-- Head -->
  <path d="M160 135 Q200 100 240 135 Q250 160 225 178 Q200 192 175 178 Q150 160 160 135 Z" fill="url(#body)"/>
  <path d="M160 135 Q200 100 240 135 Q250 160 225 178 Q200 192 175 178 Q150 160 160 135 Z" fill="url(#scales)"/>

  <!-- Crystal antlers -->
  <g stroke="#9ff3ff" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M180 108 L170 60 M170 80 L155 72 M172 66 L178 48"/>
    <path d="M220 108 L230 60 M230 80 L245 72 M228 66 L222 48"/>
  </g>
  <g fill="#c8fbff">
    <path d="M170 60 L166 52 L174 52 Z"/>
    <path d="M178 48 L175 40 L181 40 Z"/>
    <path d="M230 60 L226 52 L234 52 Z"/>
    <path d="M222 48 L219 40 L225 40 Z"/>
  </g>

  <!-- Eyes -->
  <circle cx="182" cy="150" r="12" fill="url(#glow)"/>
  <circle cx="218" cy="150" r="12" fill="url(#glow)"/>
  <ellipse cx="182" cy="150" rx="5" ry="7" fill="#e8fdff"/>
  <ellipse cx="218" cy="150" rx="5" ry="7" fill="#e8fdff"/>
  <ellipse cx="182" cy="150" rx="2" ry="5" fill="#110a26"/>
  <ellipse cx="218" cy="150" rx="2" ry="5" fill="#110a26"/>

  <!-- Snout and nose -->
  <path d="M200 168 Q192 178 186 176 Q200 186 214 176 Q208 178 200 168 Z" fill="#7a3a1f"/>
  <circle cx="200" cy="172" r="3" fill="#38e1ff"/>

  <!-- Mouth glow -->
  <path d="M190 184 Q200 190 210 184" fill="none" stroke="#ff7ab8" stroke-width="1.5" opacity="0.8"/>

  <!-- Floating orbs -->
  <g fill="#ffd166">
    <circle cx="100" cy="200" r="3" opacity="0.8"/>
    <circle cx="300" cy="195" r="2.5" opacity="0.8"/>
    <circle cx="120" cy="90" r="2" opacity="0.7"/>
    <circle cx="285" cy="80" r="2.2" opacity="0.7"/>
  </g>
</svg>