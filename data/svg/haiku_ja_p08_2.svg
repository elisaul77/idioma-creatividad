<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1433"/>
      <stop offset="1" stop-color="#2b1d55"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="robotGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7dffb0" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7dffb0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Night sky -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="30" cy="40" r="1.5" opacity="0.9"/>
    <circle cx="90" cy="25" r="1" opacity="0.7"/>
    <circle cx="150" cy="55" r="1.8" opacity="0.9"/>
    <circle cx="210" cy="30" r="1.2" opacity="0.8"/>
    <circle cx="260" cy="18" r="1" opacity="0.6"/>
    <circle cx="380" cy="150" r="1.5" opacity="0.8"/>
    <circle cx="15" cy="150" r="1" opacity="0.6"/>
    <circle cx="60" cy="110" r="1.2" opacity="0.7"/>
    <circle cx="180" cy="90" r="1" opacity="0.6"/>
    <circle cx="240" cy="80" r="1.4" opacity="0.8"/>
    <circle cx="370" cy="210" r="1" opacity="0.5"/>
    <circle cx="200" cy="200" r="1" opacity="0.4"/>
    <circle cx="25" cy="250" r="1.2" opacity="0.5"/>
  </g>

  <!-- Four-point sparkles -->
  <g fill="#fff3c4" opacity="0.85">
    <path d="M120 80 L122 86 L128 88 L122 90 L120 96 L118 90 L112 88 L118 86 Z"/>
    <path d="M300 120 L302 126 L308 128 L302 130 L300 136 L298 130 L292 128 L298 126 Z"/>
    <path d="M55 180 L56 184 L60 185 L56 186 L55 190 L54 186 L50 185 L54 184 Z"/>
  </g>

  <!-- Moon with glow -->
  <circle cx="330" cy="70" r="60" fill="url(#moonGlow)"/>
  <circle cx="330" cy="70" r="28" fill="#fff3c4"/>
  <circle cx="340" cy="62" r="24" fill="#17183f"/>

  <!-- Floor and rug -->
  <rect x="0" y="320" width="400" height="80" fill="#3d2b5c"/>
  <ellipse cx="200" cy="362" rx="150" ry="22" fill="#7a3e6b" opacity="0.6"/>
  <ellipse cx="200" cy="362" rx="120" ry="14" fill="none" stroke="#c46a9a" stroke-width="2" opacity="0.5"/>

  <!-- Dancing teddy bear -->
  <g>
    <!-- Raised arms -->
    <line x1="72" y1="265" x2="40" y2="215" stroke="#b07a4a" stroke-width="16" stroke-linecap="round"/>
    <line x1="148" y1="265" x2="172" y2="215" stroke="#b07a4a" stroke-width="16" stroke-linecap="round"/>
    <!-- Feet -->
    <ellipse cx="90" cy="318" rx="16" ry="10" fill="#9a6a3c"/>
    <ellipse cx="130" cy="318" rx="16" ry="10" fill="#9a6a3c"/>
    <!-- Body -->
    <ellipse cx="110" cy="275" rx="42" ry="50" fill="#b07a4a"/>
    <ellipse cx="110" cy="285" rx="22" ry="28" fill="#e8c9a4"/>
    <!-- Ears -->
    <circle cx="82" cy="170" r="12" fill="#b07a4a"/>
    <circle cx="138" cy="170" r="12" fill="#b07a4a"/>
    <circle cx="82" cy="170" r="6" fill="#e8b898"/>
    <circle cx="138" cy="170" r="6" fill="#e8b898"/>
    <!-- Head -->
    <circle cx="110" cy="200" r="36" fill="#b07a4a"/>
    <!-- Face -->
    <ellipse cx="110" cy="212" rx="16" ry="12" fill="#e8c9a4"/>
    <ellipse cx="110" cy="206" rx="5" ry="4" fill="#3a2418"/>
    <circle cx="97" cy="194" r="4" fill="#2a1a10"/>
    <circle cx="123" cy="194" r="4" fill="#2a1a10"/>
    <circle cx="98" cy="192" r="1.2" fill="#ffffff"/>
    <circle cx="124" cy="192" r="1.2" fill="#ffffff"/>
    <path d="M104 218 Q110 224 116 218" fill="none" stroke="#3a2418" stroke-width="2" stroke-linecap="round"/>
    <!-- Cheeks -->
    <circle cx="88" cy="206" r="4" fill="#f09a8a" opacity="0.6"/>
    <circle cx="132" cy="206" r="4" fill="#f09a8a" opacity="0.6"/>
  </g>

  <!-- Toy robot -->
  <g>
    <!-- Glow -->
    <circle cx="260" cy="240" r="50" fill="url(#robotGlow)"/>
    <!-- Antenna -->
    <line x1="260" y1="150" x2="260" y2="128" stroke="#9fb8d8" stroke-width="3"/>
    <circle cx="260" cy="124" r="6" fill="#ff6b8a"/>
    <!-- Legs and feet -->
    <rect x="238" y="280" width="18" height="40" fill="#5a7aa3"/>
    <rect x="266" y="280" width="18" height="40" fill="#5a7aa3"/>
    <rect x="232" y="318" width="26" height="10" rx="4" fill="#3d4f6e"/>
    <rect x="262" y="318" width="26" height="10" rx="4" fill="#3d4f6e"/>
    <!-- Body -->
    <rect x="232" y="210" width="56" height="70" rx="6" fill="#6e8fb8"/>
    <circle cx="260" cy="240" r="7" fill="#7dffb0"/>
    <rect x="244" y="256" width="32" height="6" rx="3" fill="#4a6690"/>
    <!-- Left arm -->
    <rect x="212" y="216" width="16" height="44" rx="6" fill="#8aa6cc"/>
    <!-- Right arm waving -->
    <rect x="292" y="216" width="16" height="44" rx="6" fill="#8aa6cc" transform="rotate(-30 300 216)"/>
    <!-- Head -->
    <rect x="226" y="150" width="68" height="56" rx="8" fill="#9fb8d8"/>
    <rect x="238" y="168" width="12" height="12" fill="#ffe066"/>
    <rect x="270" y="168" width="12" height="12" fill="#ffe066"/>
    <rect x="242" y="186" width="36" height="6" rx="3" fill="#3d4f6e"/>
  </g>

  <!-- Music notes floating from the bear -->
  <g fill="#ffe066">
    <ellipse cx="170" cy="160" rx="6" ry="5" transform="rotate(-20 170 160)"/>
    <line x1="175" y1="160" x2="175" y2="130" stroke="#ffe066" stroke-width="2.5"/>
    <ellipse cx="200" cy="128" rx="6" ry="5" transform="rotate(-20 200 128)"/>
    <line x1="205" y1="128" x2="205" y2="100" stroke="#ffe066" stroke-width="2.5"/>
  </g>

  <!-- Bouncing ball with trail -->
  <path d="M300 300 Q322 200 352 242" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 6" opacity="0.4"/>
  <circle cx="352" cy="242" r="18" fill="#ff7a59"/>
  <path d="M338 242 Q352 230 366 242" fill="none" stroke="#ffd166" stroke-width="3"/>

  <!-- Stacked blocks -->
  <rect x="318" y="290" width="36" height="30" fill="#ffd166"/>
  <rect x="322" y="262" width="30" height="28" fill="#06d6a0"/>
  <rect x="326" y="238" width="22" height="24" fill="#ef476f"/>

  <!-- Small rolling ball on the floor -->
  <circle cx="55" cy="332" r="14" fill="#4cc9f0"/>
  <path d="M46 326 Q55 320 64 326" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
</svg>