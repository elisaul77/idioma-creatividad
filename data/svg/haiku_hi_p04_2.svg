<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd8f5"/>
      <stop offset="1" stop-color="#fff3d6"/>
    </linearGradient>
    <linearGradient id="monster" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd47a"/>
      <stop offset="1" stop-color="#5eb35a"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9e2b8"/>
      <stop offset="1" stop-color="#eccb93"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff9c4"/>
      <stop offset="1" stop-color="#ffd54f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="400" height="400" fill="url(#sky)"/>
  <circle cx="330" cy="70" r="70" fill="url(#sun)"/>
  <circle cx="330" cy="70" r="28" fill="#ffd54f"/>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="90" cy="70" rx="38" ry="16"/>
    <ellipse cx="115" cy="60" rx="26" ry="20"/>
    <ellipse cx="200" cy="105" rx="30" ry="12"/>
    <ellipse cx="220" cy="98" rx="20" ry="14"/>
  </g>

  <!-- Distant hills -->
  <path d="M0 260 Q80 200 170 250 T400 240 L400 400 L0 400 Z" fill="#a6dc8e"/>

  <!-- Ground -->
  <path d="M0 320 Q200 290 400 325 L400 400 L0 400 Z" fill="#7cc46a"/>

  <!-- Flowers -->
  <g>
    <circle cx="40" cy="350" r="6" fill="#ff8fab"/>
    <circle cx="36" cy="346" r="3" fill="#ffe082"/>
    <circle cx="70" cy="365" r="6" fill="#ffb74d"/>
    <circle cx="66" cy="361" r="3" fill="#fff59d"/>
    <circle cx="335" cy="355" r="6" fill="#ff8fab"/>
    <circle cx="331" cy="351" r="3" fill="#ffe082"/>
    <circle cx="362" cy="375" r="5" fill="#ce93d8"/>
  </g>

  <!-- House body -->
  <rect x="110" y="190" width="170" height="130" rx="6" fill="url(#wall)"/>
  <rect x="110" y="190" width="170" height="130" rx="6" fill="none" stroke="#c9a46a" stroke-width="3"/>

  <!-- Roof -->
  <path d="M95 200 L195 125 L305 200 Z" fill="#e57373"/>
  <path d="M95 200 L195 125 L305 200" fill="none" stroke="#b85454" stroke-width="3" stroke-linejoin="round"/>
  <!-- Roof chimney -->
  <rect x="250" y="142" width="22" height="40" fill="#b07a5a"/>
  <rect x="246" y="136" width="30" height="8" rx="2" fill="#8d5e43"/>
  <!-- Chimney smoke -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="258" cy="122" r="8"/>
    <circle cx="268" cy="108" r="10"/>
    <circle cx="262" cy="92" r="7"/>
  </g>

  <!-- Round attic window -->
  <circle cx="195" cy="160" r="12" fill="#bbe3f7" stroke="#8d6e63" stroke-width="3"/>
  <line x1="183" y1="160" x2="207" y2="160" stroke="#8d6e63" stroke-width="2"/>
  <line x1="195" y1="148" x2="195" y2="172" stroke="#8d6e63" stroke-width="2"/>

  <!-- Door -->
  <path d="M180 320 L180 255 Q195 238 210 255 L210 320 Z" fill="#8d5e43"/>
  <circle cx="204" cy="290" r="3" fill="#ffd54f"/>

  <!-- Windows -->
  <rect x="130" y="235" width="30" height="28" rx="4" fill="#bbe3f7" stroke="#8d6e63" stroke-width="3"/>
  <line x1="145" y1="235" x2="145" y2="263" stroke="#8d6e63" stroke-width="2"/>
  <line x1="130" y1="249" x2="160" y2="249" stroke="#8d6e63" stroke-width="2"/>
  <rect x="230" y="235" width="30" height="28" rx="4" fill="#bbe3f7" stroke="#8d6e63" stroke-width="3"/>
  <line x1="245" y1="235" x2="245" y2="263" stroke="#8d6e63" stroke-width="2"/>
  <line x1="230" y1="249" x2="260" y2="249" stroke="#8d6e63" stroke-width="2"/>

  <!-- Flower boxes -->
  <rect x="127" y="263" width="36" height="6" rx="2" fill="#8d5e43"/>
  <rect x="227" y="263" width="36" height="6" rx="2" fill="#8d5e43"/>
  <circle cx="133" cy="262" r="4" fill="#ff8fab"/>
  <circle cx="145" cy="260" r="4" fill="#ffd54f"/>
  <circle cx="157" cy="262" r="4" fill="#ff8fab"/>
  <circle cx="233" cy="262" r="4" fill="#ffd54f"/>
  <circle cx="245" cy="260" r="4" fill="#ff8fab"/>
  <circle cx="257" cy="262" r="4" fill="#ffd54f"/>

  <!-- Friendly monster peeking from the right side of the house -->
  <g>
    <!-- Horns -->
    <path d="M340 240 Q336 222 348 216 Q346 232 352 240 Z" fill="#fff3d6"/>
    <path d="M372 240 Q376 222 364 216 Q366 232 360 240 Z" fill="#fff3d6"/>
    <!-- Body / head -->
    <ellipse cx="356" cy="270" rx="34" ry="36" fill="url(#monster)"/>
    <!-- Little arms waving -->
    <path d="M324 285 Q306 270 312 254" fill="none" stroke="#5eb35a" stroke-width="10" stroke-linecap="round"/>
    <path d="M388 285 Q402 270 396 254" fill="none" stroke="#5eb35a" stroke-width="10" stroke-linecap="round"/>
    <!-- Spots -->
    <circle cx="344" cy="258" r="4" fill="#6fc465"/>
    <circle cx="368" cy="282" r="5" fill="#6fc465"/>
    <circle cx="350" cy="290" r="3" fill="#6fc465"/>
    <!-- Eyes -->
    <circle cx="345" cy="262" r="6" fill="#ffffff"/>
    <circle cx="367" cy="262" r="6" fill="#ffffff"/>
    <circle cx="346" cy="263" r="3" fill="#2e3b2f"/>
    <circle cx="368" cy="263" r="3" fill="#2e3b2f"/>
    <!-- Smile -->
    <path d="M343 280 Q356 292 369 280" fill="none" stroke="#2e3b2f" stroke-width="3" stroke-linecap="round"/>
    <!-- Blush -->
    <circle cx="336" cy="276" r="4" fill="#ff8a80" opacity="0.6"/>
    <circle cx="376" cy="276" r="4" fill="#ff8a80" opacity="0.6"/>
  </g>

  <!-- Floating hearts -->
  <g fill="#ff6f91">
    <path d="M60 180 c-4 -8 -14 -4 -10 4 l10 10 l10 -10 c4 -8 -6 -12 -10 -4 z"/>
    <path d="M300 170 c-3 -6 -10 -3 -7 3 l7 7 l7 -7 c3 -6 -4 -9 -7 -3 z" opacity="0.8"/>
    <path d="M90 130 c-2 -4 -7 -2 -5 2 l5 5 l5 -5 c2 -4 -3 -6 -5 -2 z" opacity="0.7"/>
  </g>
</svg>