<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0f2a"/>
      <stop offset="1" stop-color="#1d0b3a"/>
    </linearGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cf7ff"/>
      <stop offset="1" stop-color="#2a3bff"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd6f5" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#ff5fd2" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff5fd2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="leaf" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#5ef2c8"/>
      <stop offset="1" stop-color="#5ef2c8" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Hintergrund -->
  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- Sterne -->
  <g fill="#ffffff">
    <circle cx="40" cy="45" r="1.5" opacity="0.8"/>
    <circle cx="90" cy="25" r="1" opacity="0.6"/>
    <circle cx="345" cy="40" r="1.6" opacity="0.9"/>
    <circle cx="370" cy="110" r="1" opacity="0.6"/>
    <circle cx="30" cy="180" r="1.2" opacity="0.7"/>
    <circle cx="375" cy="230" r="1.4" opacity="0.8"/>
    <circle cx="320" cy="20" r="1" opacity="0.5"/>
    <circle cx="60" cy="280" r="1" opacity="0.5"/>
  </g>

  <!-- Sonne / Energiekern -->
  <circle cx="200" cy="140" r="110" fill="url(#sun)"/>

  <!-- Orbit-Datenringe -->
  <ellipse cx="200" cy="200" rx="175" ry="55" fill="none" stroke="#ff5fd2" stroke-width="1" stroke-dasharray="2 6" opacity="0.6" transform="rotate(-8 200 200)"/>
  <ellipse cx="200" cy="215" rx="150" ry="40" fill="none" stroke="#7cf7ff" stroke-width="1" stroke-dasharray="1 5" opacity="0.5" transform="rotate(6 200 215)"/>

  <!-- Boden -->
  <ellipse cx="200" cy="330" rx="150" ry="22" fill="#0f1433" stroke="#7cf7ff" stroke-width="1.5" opacity="0.8"/>
  <ellipse cx="200" cy="330" rx="100" ry="14" fill="none" stroke="#ff5fd2" stroke-width="1" opacity="0.5"/>

  <!-- Stamm -->
  <path d="M190 330 Q196 280 194 230 L192 200 L208 200 L206 230 Q204 280 210 330 Z" fill="url(#trunk)" filter="url(#glow)"/>

  <!-- Äste -->
  <g fill="none" stroke="#7cf7ff" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)">
    <path d="M194 240 Q160 220 130 170"/>
    <path d="M206 235 Q240 210 272 165"/>
    <path d="M195 210 Q175 180 160 120"/>
    <path d="M205 205 Q225 175 240 118"/>
    <path d="M200 200 Q200 160 200 100"/>
    <path d="M130 170 Q115 150 100 150" stroke-width="2.5"/>
    <path d="M272 165 Q290 150 305 152" stroke-width="2.5"/>
    <path d="M160 120 Q150 100 160 80" stroke-width="2.5"/>
    <path d="M240 118 Q250 98 245 75" stroke-width="2.5"/>
    <path d="M200 100 Q185 80 175 60" stroke-width="2.5"/>
    <path d="M200 100 Q215 80 228 58" stroke-width="2.5"/>
  </g>

  <!-- Knotenpunkte -->
  <g fill="#ff5fd2" filter="url(#glow)">
    <circle cx="130" cy="170" r="3"/>
    <circle cx="272" cy="165" r="3"/>
    <circle cx="160" cy="120" r="3"/>
    <circle cx="240" cy="118" r="3"/>
    <circle cx="200" cy="100" r="3.5"/>
    <circle cx="194" cy="240" r="2.5"/>
    <circle cx="206" cy="235" r="2.5"/>
  </g>

  <!-- Blätter als leuchtende Kristalle -->
  <g filter="url(#glow)">
    <circle cx="100" cy="150" r="16" fill="url(#leaf)"/>
    <circle cx="305" cy="152" r="16" fill="url(#leaf)"/>
    <circle cx="160" cy="80" r="18" fill="url(#leaf)"/>
    <circle cx="245" cy="75" r="18" fill="url(#leaf)"/>
    <circle cx="175" cy="60" r="16" fill="url(#leaf)"/>
    <circle cx="228" cy="58" r="16" fill="url(#leaf)"/>
    <circle cx="200" cy="40" r="20" fill="url(#leaf)"/>
  </g>

  <!-- Kristall-Blattformen -->
  <g fill="#ffffff" opacity="0.85" filter="url(#glow)">
    <polygon points="100,140 104,150 100,160 96,150"/>
    <polygon points="305,142 309,152 305,162 301,152"/>
    <polygon points="160,70 164,80 160,90 156,80"/>
    <polygon points="245,65 249,75 245,85 241,75"/>
    <polygon points="200,30 204,40 200,50 196,40"/>
  </g>

  <!-- Schwebende Energiekugeln -->
  <g filter="url(#glow)">
    <circle cx="70" cy="230" r="3" fill="#ffd6f5"/>
    <circle cx="335" cy="260" r="2.5" fill="#7cf7ff"/>
    <circle cx="90" cy="300" r="2" fill="#ff5fd2"/>
    <circle cx="315" cy="190" r="2" fill="#5ef2c8"/>
    <circle cx="140" cy="260" r="1.8" fill="#ffd6f5"/>
  </g>
</svg>