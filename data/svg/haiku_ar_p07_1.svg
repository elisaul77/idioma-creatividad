<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#1b2a4a"/>
      <stop offset="60%" stop-color="#0b1026"/>
      <stop offset="100%" stop-color="#05060f"/>
    </radialGradient>
    <linearGradient id="trunk" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="branch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="orb1" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </radialGradient>
    <radialGradient id="orb2" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </radialGradient>
    <radialGradient id="orb3" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </radialGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- Stars -->
  <g fill="#e0f2fe">
    <circle cx="40" cy="50" r="1.2" opacity="0.8"/>
    <circle cx="90" cy="25" r="0.9" opacity="0.6"/>
    <circle cx="330" cy="40" r="1.3" opacity="0.9"/>
    <circle cx="365" cy="110" r="1" opacity="0.6"/>
    <circle cx="25" cy="160" r="1" opacity="0.5"/>
    <circle cx="370" cy="230" r="1.1" opacity="0.7"/>
    <circle cx="60" cy="300" r="0.9" opacity="0.5"/>
    <circle cx="300" cy="320" r="1" opacity="0.6"/>
  </g>

  <!-- Sun / energy core -->
  <circle cx="200" cy="150" r="130" fill="url(#sun)" opacity="0.5"/>

  <!-- Orbit rings -->
  <ellipse cx="200" cy="300" rx="170" ry="34" fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1"/>
  <ellipse cx="200" cy="300" rx="130" ry="24" fill="none" stroke="#a78bfa" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="4 6"/>

  <!-- Ground glow -->
  <ellipse cx="200" cy="335" rx="150" ry="18" fill="#22d3ee" opacity="0.25" filter="url(#softGlow)"/>
  <path d="M40 335 Q200 318 360 335" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.7" filter="url(#glow)"/>

  <!-- Trunk -->
  <path d="M188 335 Q192 280 196 240 Q199 215 200 200 Q201 215 204 240 Q208 280 212 335 Z" fill="url(#trunk)" filter="url(#glow)"/>

  <!-- Main branches -->
  <g fill="none" stroke="url(#branch)" stroke-width="5" stroke-linecap="round" filter="url(#glow)">
    <path d="M200 205 Q175 180 150 160 Q128 143 110 120"/>
    <path d="M200 205 Q225 180 250 160 Q272 143 290 120"/>
    <path d="M200 200 Q200 165 200 130 Q200 100 198 75"/>
    <path d="M198 230 Q170 235 145 255 Q125 270 100 270"/>
    <path d="M204 230 Q232 235 257 255 Q277 270 302 270"/>
  </g>

  <!-- Secondary branches -->
  <g fill="none" stroke="#67e8f9" stroke-width="2" stroke-linecap="round" opacity="0.85" filter="url(#glow)">
    <path d="M150 160 Q140 145 128 138"/>
    <path d="M250 160 Q260 145 272 138"/>
    <path d="M200 130 Q180 115 165 100"/>
    <path d="M200 130 Q220 115 235 100"/>
    <path d="M200 100 Q192 90 185 80"/>
    <path d="M200 100 Q208 90 215 80"/>
    <path d="M110 120 Q100 110 92 112"/>
    <path d="M290 120 Q300 110 308 112"/>
    <path d="M145 255 Q130 250 118 252"/>
    <path d="M257 255 Q272 250 284 252"/>
  </g>

  <!-- Circuit nodes -->
  <g fill="#0b1026" stroke="#67e8f9" stroke-width="1.5" filter="url(#glow)">
    <circle cx="150" cy="160" r="3"/>
    <circle cx="250" cy="160" r="3"/>
    <circle cx="200" cy="130" r="3"/>
    <circle cx="165" cy="100" r="2.5"/>
    <circle cx="235" cy="100" r="2.5"/>
    <circle cx="145" cy="255" r="2.5"/>
    <circle cx="257" cy="255" r="2.5"/>
  </g>

  <!-- Crown glow -->
  <circle cx="200" cy="120" r="95" fill="#22d3ee" opacity="0.12" filter="url(#softGlow)"/>

  <!-- Glowing fruit / data orbs -->
  <g filter="url(#glow)">
    <circle cx="110" cy="120" r="14" fill="url(#orb1)"/>
    <circle cx="92" cy="112" r="7" fill="url(#orb2)"/>
    <circle cx="290" cy="120" r="14" fill="url(#orb2)"/>
    <circle cx="308" cy="112" r="7" fill="url(#orb1)"/>
    <circle cx="200" cy="75" r="16" fill="url(#orb3)"/>
    <circle cx="185" cy="80" r="9" fill="url(#orb1)"/>
    <circle cx="215" cy="80" r="9" fill="url(#orb2)"/>
    <circle cx="165" cy="100" r="10" fill="url(#orb2)"/>
    <circle cx="235" cy="100" r="10" fill="url(#orb3)"/>
    <circle cx="128" cy="138" r="8" fill="url(#orb3)"/>
    <circle cx="272" cy="138" r="8" fill="url(#orb1)"/>
    <circle cx="100" cy="270" r="9" fill="url(#orb1)"/>
    <circle cx="302" cy="270" r="9" fill="url(#orb2)"/>
    <circle cx="118" cy="252" r="6" fill="url(#orb3)"/>
    <circle cx="284" cy="252" r="6" fill="url(#orb3)"/>
  </g>

  <!-- Floating particles -->
  <g fill="#fde68a" filter="url(#glow)">
    <circle cx="75" cy="200" r="2"/>
    <circle cx="330" cy="195" r="2"/>
    <circle cx="140" cy="60" r="1.8"/>
    <circle cx="265" cy="55" r="1.8"/>
    <circle cx="200" cy="40" r="2"/>
    <circle cx="60" cy="90" r="1.5"/>
    <circle cx="345" cy="80" r="1.5"/>
  </g>
</svg>