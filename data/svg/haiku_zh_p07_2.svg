<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0f2c"/>
      <stop offset="55%" stop-color="#2a1450"/>
      <stop offset="100%" stop-color="#0f3b4a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff6d5" stop-opacity="1"/>
      <stop offset="60%" stop-color="#7ef5e6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7ef5e6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1c2a3f"/>
      <stop offset="50%" stop-color="#3b5873"/>
      <stop offset="100%" stop-color="#1c2a3f"/>
    </linearGradient>
    <radialGradient id="leaf" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#c8fff4" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#3ff0d0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8a5cff" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="ground" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#1d4d5c"/>
      <stop offset="100%" stop-color="#0a1a24"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="32" cy="40" r="1.2" opacity="0.9"/>
    <circle cx="90" cy="18" r="0.9" opacity="0.7"/>
    <circle cx="150" cy="58" r="1.1" opacity="0.8"/>
    <circle cx="210" cy="24" r="0.8" opacity="0.6"/>
    <circle cx="268" cy="50" r="1.3" opacity="0.9"/>
    <circle cx="335" cy="28" r="1" opacity="0.8"/>
    <circle cx="370" cy="88" r="0.9" opacity="0.6"/>
    <circle cx="48" cy="120" r="0.8" opacity="0.5"/>
    <circle cx="112" cy="104" r="1" opacity="0.7"/>
    <circle cx="300" cy="120" r="0.9" opacity="0.6"/>
    <circle cx="352" cy="160" r="1.1" opacity="0.7"/>
    <circle cx="22" cy="190" r="0.8" opacity="0.5"/>
  </g>

  <!-- Future sun / moon -->
  <circle cx="290" cy="110" r="70" fill="url(#sun)"/>
  <circle cx="290" cy="110" r="34" fill="#fff6d5" opacity="0.95"/>
  <circle cx="290" cy="110" r="34" fill="none" stroke="#7ef5e6" stroke-width="1" opacity="0.6"/>
  <ellipse cx="290" cy="110" rx="58" ry="12" fill="none" stroke="#7ef5e6" stroke-width="1" opacity="0.35" transform="rotate(-14 290 110)"/>

  <!-- Distant crystal hills -->
  <path d="M0 290 L60 252 L110 280 L170 240 L230 276 L300 246 L360 272 L400 258 L400 330 L0 330 Z" fill="#162e44" opacity="0.8"/>
  <path d="M0 310 L80 285 L140 305 L210 280 L280 300 L340 286 L400 304 L400 340 L0 340 Z" fill="#0f2233" opacity="0.9"/>

  <!-- Ground -->
  <ellipse cx="200" cy="350" rx="190" ry="48" fill="url(#ground)"/>
  <ellipse cx="200" cy="352" rx="120" ry="20" fill="#2aa7a0" opacity="0.18" filter="url(#softGlow)"/>

  <!-- Roots glow -->
  <g fill="none" stroke="#3ff0d0" stroke-width="1.5" stroke-linecap="round" opacity="0.6" filter="url(#glow)">
    <path d="M200 345 Q170 352 140 348"/>
    <path d="M200 345 Q230 352 262 347"/>
    <path d="M200 345 Q186 360 176 372"/>
  </g>

  <!-- Trunk -->
  <path d="M188 350 C190 300 184 260 192 210 C196 185 194 160 200 130 C206 160 204 185 208 210 C216 260 210 300 212 350 Z" fill="url(#trunk)"/>

  <!-- Glowing circuit lines on trunk -->
  <g fill="none" stroke="#7ef5e6" stroke-width="1" opacity="0.8" filter="url(#glow)">
    <path d="M198 340 L198 300 L192 290 L192 262"/>
    <path d="M202 320 L208 310 L208 280 L214 272"/>
    <path d="M196 230 L186 220 L186 196"/>
    <path d="M200 178 L210 168 L212 146"/>
  </g>

  <!-- Main branches -->
  <g fill="none" stroke="#2c4a66" stroke-linecap="round">
    <path d="M198 200 Q160 180 128 150 Q108 130 90 124" stroke-width="7"/>
    <path d="M202 196 Q240 176 272 150 Q292 132 312 124" stroke-width="7"/>
    <path d="M200 160 Q194 120 200 84" stroke-width="6"/>
    <path d="M196 180 Q172 160 160 120 Q156 104 146 92" stroke-width="4"/>
    <path d="M205 176 Q230 156 240 116 Q244 102 256 90" stroke-width="4"/>
  </g>

  <!-- Glowing neon branch tracing -->
  <g fill="none" stroke="#7ef5e6" stroke-width="1.6" stroke-linecap="round" opacity="0.85" filter="url(#glow)">
    <path d="M198 200 Q160 180 128 150 Q108 130 90 124"/>
    <path d="M202 196 Q240 176 272 150 Q292 132 312 124"/>
    <path d="M200 160 Q194 120 200 84"/>
    <path d="M196 180 Q172 160 160 120 Q156 104 146 92"/>
    <path d="M205 176 Q230 156 240 116 Q244 102 256 90"/>
  </g>

  <!-- Crown of translucent leaves -->
  <g filter="url(#glow)">
    <circle cx="90" cy="124" r="26" fill="url(#leaf)"/>
    <circle cx="312" cy="124" r="28" fill="url(#leaf)"/>
    <circle cx="200" cy="82" r="38" fill="url(#leaf)"/>
    <circle cx="146" cy="92" r="30" fill="url(#leaf)"/>
    <circle cx="256" cy="90" r="32" fill="url(#leaf)"/>
    <circle cx="128" cy="150" r="22" fill="url(#leaf)" opacity="0.85"/>
    <circle cx="272" cy="150" r="22" fill="url(#leaf)" opacity="0.85"/>
    <circle cx="200" cy="140" r="30" fill="url(#leaf)" opacity="0.8"/>
  </g>

  <!-- Hexagonal data-leaves -->
  <g fill="none" stroke="#c8fff4" stroke-width="1" opacity="0.7" filter="url(#glow)">
    <polygon points="200,62 210,68 210,80 200,86 190,80 190,68"/>
    <polygon points="146,74 154,79 154,89 146,94 138,89 138,79"/>
    <polygon points="256,72 263,77 263,87 256,92 249,87 249,77"/>
    <polygon points="90,108 97,112 97,120 90,124 83,120 83,112"/>
    <polygon points="312,106 319,110 319,118 312,122 305,118 305,110"/>
  </g>

  <!-- Floating light orbs -->
  <g filter="url(#glow)">
    <circle cx="70" cy="200" r="3" fill="#ffd27a"/>
    <circle cx="112" cy="232" r="2" fill="#7ef5e6"/>
    <circle cx="330" cy="210" r="2.5" fill="#ff8fd8"/>
    <circle cx="296" cy="250" r="2" fill="#ffd27a"/>
    <circle cx="150" cy="270" r="1.6" fill="#7ef5e6"/>
    <circle cx="260" cy="300" r="2.2" fill="#c9a8ff"/>
    <circle cx="60" cy="300" r="1.8" fill="#7ef5e6"/>
    <circle cx="355" cy="320" r="1.6" fill="#ffd27a"/>
  </g>

  <!-- Light rising from roots -->
  <g fill="#7ef5e6" opacity="0.5" filter="url(#glow)">
    <circle cx="170" cy="330" r="1.2"/>
    <circle cx="232" cy="318" r="1.4"/>
    <circle cx="188" cy="300" r="1"/>
    <circle cx="222" cy="288" r="1.1"/>
  </g>
</svg>