<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="sky" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#4b3f9e"/>
      <stop offset="60%" stop-color="#2a1f66"/>
      <stop offset="100%" stop-color="#110c33"/>
    </radialGradient>
    <radialGradient id="moon" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fffbe6"/>
      <stop offset="100%" stop-color="#f3d98b"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd86b" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffd86b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="swirl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8ef3ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d89bff" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Night sky -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- Moon glow and moon -->
  <circle cx="200" cy="170" r="110" fill="url(#glow)"/>
  <circle cx="200" cy="170" r="62" fill="url(#moon)"/>
  <circle cx="222" cy="152" r="52" fill="#2a1f66" opacity="0.92"/>

  <!-- Dreamy floating swirls -->
  <path d="M40 300 C90 250, 130 330, 180 290 S270 240, 330 290" fill="none" stroke="url(#swirl)" stroke-width="4" stroke-linecap="round" filter="url(#soft)"/>
  <path d="M60 330 C110 300, 150 360, 210 325 S300 300, 350 335" fill="none" stroke="url(#swirl)" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M30 90 C70 60, 110 110, 150 80" fill="none" stroke="url(#swirl)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Soft clouds -->
  <g fill="#b8a6ff" opacity="0.35" filter="url(#soft)">
    <ellipse cx="90" cy="250" rx="60" ry="18"/>
    <ellipse cx="320" cy="210" rx="55" ry="16"/>
    <ellipse cx="200" cy="360" rx="90" ry="20"/>
  </g>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="50" cy="40" r="2"/>
    <circle cx="120" cy="25" r="1.5"/>
    <circle cx="280" cy="35" r="2.2"/>
    <circle cx="350" cy="70" r="1.5"/>
    <circle cx="330" cy="130" r="1.8"/>
    <circle cx="60" cy="180" r="1.6"/>
    <circle cx="150" cy="130" r="1.2"/>
    <circle cx="370" cy="200" r="1.4"/>
    <circle cx="25" cy="260" r="1.8"/>
    <circle cx="260" cy="260" r="1.3"/>
  </g>
  <g fill="#ffe9a8">
    <path d="M100 60 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>
    <path d="M305 165 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5z"/>
    <path d="M30 140 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/>
  </g>
</svg>