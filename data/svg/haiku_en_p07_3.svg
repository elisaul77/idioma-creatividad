<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0f2c"/>
      <stop offset="60%" stop-color="#1b0b3a"/>
      <stop offset="100%" stop-color="#2a0f3f"/>
    </linearGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22e6d6"/>
      <stop offset="50%" stop-color="#8af5ff"/>
      <stop offset="100%" stop-color="#22e6d6"/>
    </linearGradient>
    <radialGradient id="leaf" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff6a8"/>
      <stop offset="45%" stop-color="#ff7ad9"/>
      <stop offset="100%" stop-color="#6a2bff"/>
    </radialGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd1f5" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ff5fbf" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff5fbf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ground" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dffd2" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2dffd2" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="30" cy="40" r="1.2" opacity="0.9"/>
    <circle cx="90" cy="80" r="0.9" opacity="0.6"/>
    <circle cx="150" cy="30" r="1.1" opacity="0.8"/>
    <circle cx="260" cy="55" r="1" opacity="0.7"/>
    <circle cx="340" cy="30" r="1.3" opacity="0.9"/>
    <circle cx="370" cy="110" r="0.9" opacity="0.6"/>
    <circle cx="48" cy="150" r="0.8" opacity="0.5"/>
    <circle cx="320" cy="160" r="1" opacity="0.7"/>
    <circle cx="200" cy="18" r="0.9" opacity="0.6"/>
  </g>

  <!-- Sun / moon glow -->
  <circle cx="200" cy="170" r="150" fill="url(#sun)"/>
  <circle cx="200" cy="150" r="70" fill="#ff8ad8" opacity="0.18" filter="url(#softGlow)"/>

  <!-- Distant hills -->
  <path d="M0 310 Q80 270 160 300 T320 290 T400 300 L400 400 L0 400 Z" fill="#1a1550"/>
  <path d="M0 330 Q90 300 180 325 T400 320 L400 400 L0 400 Z" fill="#120c3a"/>

  <!-- Ground glow -->
  <ellipse cx="200" cy="340" rx="160" ry="30" fill="url(#ground)"/>

  <!-- Trunk -->
  <path d="M192 340 Q196 300 194 260 Q192 230 200 200 Q208 230 206 260 Q204 300 208 340 Z" fill="url(#trunk)" filter="url(#glow)"/>

  <!-- Main branches -->
  <g fill="none" stroke="url(#trunk)" stroke-linecap="round" filter="url(#glow)">
    <path d="M200 215 Q175 195 150 185" stroke-width="5"/>
    <path d="M200 215 Q225 195 250 185" stroke-width="5"/>
    <path d="M198 240 Q170 230 130 235" stroke-width="4"/>
    <path d="M202 240 Q230 228 270 235" stroke-width="4"/>
    <path d="M200 200 Q195 170 200 135" stroke-width="4"/>
    <path d="M150 185 Q130 160 115 150" stroke-width="3"/>
    <path d="M250 185 Q270 160 285 150" stroke-width="3"/>
    <path d="M200 135 Q180 115 165 105" stroke-width="3"/>
    <path d="M200 135 Q220 115 235 105" stroke-width="3"/>
    <path d="M200 160 Q212 145 225 140" stroke-width="2"/>
    <path d="M115 150 Q100 140 92 125" stroke-width="2"/>
    <path d="M285 150 Q300 140 308 125" stroke-width="2"/>
  </g>

  <!-- Circuit traces on branches -->
  <g fill="none" stroke="#ffffff" stroke-width="1" opacity="0.7">
    <path d="M150 185 L150 172 L160 172"/>
    <path d="M250 185 L250 172 L240 172"/>
    <path d="M200 160 L186 160 L186 150"/>
    <path d="M130 235 L120 235 L120 250"/>
    <path d="M270 235 L280 235 L280 250"/>
  </g>
  <g fill="#8af5ff">
    <circle cx="150" cy="172" r="2"/>
    <circle cx="250" cy="172" r="2"/>
    <circle cx="186" cy="150" r="2"/>
    <circle cx="120" cy="250" r="2"/>
    <circle cx="280" cy="250" r="2"/>
  </g>

  <!-- Crystal canopy leaves -->
  <g filter="url(#glow)">
    <path d="M92 125 L80 110 L95 100 L105 118 Z" fill="url(#leaf)"/>
    <path d="M115 150 L100 150 L104 136 Z" fill="url(#leaf)" opacity="0.9"/>
    <path d="M308 125 L320 110 L305 100 L295 118 Z" fill="url(#leaf)"/>
    <path d="M285 150 L300 150 L296 136 Z" fill="url(#leaf)" opacity="0.9"/>
    <path d="M165 105 L150 92 L158 78 L172 95 Z" fill="url(#leaf)"/>
    <path d="M235 105 L250 92 L242 78 L228 95 Z" fill="url(#leaf)"/>
    <path d="M200 135 L188 118 L200 100 L212 118 Z" fill="url(#leaf)"/>
    <path d="M130 235 L115 225 L122 212 L138 222 Z" fill="url(#leaf)" opacity="0.85"/>
    <path d="M270 235 L285 225 L278 212 L262 222 Z" fill="url(#leaf)" opacity="0.85"/>
    <path d="M150 185 L136 178 L142 165 L156 172 Z" fill="url(#leaf)" opacity="0.9"/>
    <path d="M250 185 L264 178 L258 165 L244 172 Z" fill="url(#leaf)" opacity="0.9"/>
  </g>

  <!-- Floating light seeds -->
  <g fill="#fff6a8" filter="url(#glow)">
    <circle cx="70" cy="200" r="2.5" opacity="0.9"/>
    <circle cx="330" cy="215" r="2.5" opacity="0.9"/>
    <circle cx="90" cy="270" r="1.8" opacity="0.7"/>
    <circle cx="315" cy="285" r="1.8" opacity="0.7"/>
    <circle cx="140" cy="80" r="1.5" opacity="0.8"/>
    <circle cx="265" cy="70" r="1.5" opacity="0.8"/>
    <circle cx="55" cy="90" r="1.3" opacity="0.6"/>
    <circle cx="345" cy="80" r="1.3" opacity="0.6"/>
  </g>

  <!-- Roots and ground nodes -->
  <g fill="none" stroke="#22e6d6" stroke-width="1.5" opacity="0.8" filter="url(#glow)">
    <path d="M200 340 Q170 352 150 350"/>
    <path d="M200 340 Q230 352 250 350"/>
    <path d="M200 342 L200 362"/>
  </g>
  <g fill="#8af5ff" filter="url(#glow)">
    <circle cx="150" cy="350" r="2"/>
    <circle cx="250" cy="350" r="2"/>
    <circle cx="200" cy="362" r="2"/>
  </g>
</svg>