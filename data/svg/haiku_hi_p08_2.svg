<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1030"/>
      <stop offset="1" stop-color="#22306a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3566"/>
      <stop offset="1" stop-color="#2a1d40"/>
    </linearGradient>
  </defs>

  <!-- Night sky -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="30" cy="30" r="2" opacity="0.9"/>
    <circle cx="150" cy="25" r="1.5" opacity="0.7"/>
    <circle cx="200" cy="60" r="2" opacity="0.8"/>
    <circle cx="265" cy="28" r="1.5" opacity="0.7"/>
    <circle cx="385" cy="30" r="2.5" opacity="0.9"/>
    <circle cx="140" cy="100" r="1.5" opacity="0.6"/>
    <circle cx="250" cy="110" r="1.5" opacity="0.8"/>
    <circle cx="20" cy="200" r="1.5" opacity="0.6"/>
    <circle cx="385" cy="235" r="1.5" opacity="0.7"/>
    <circle cx="140" cy="190" r="1" opacity="0.6"/>
    <circle cx="105" cy="130" r="1" opacity="0.5"/>
  </g>

  <!-- Moon with glow and crescent -->
  <circle cx="320" cy="85" r="70" fill="url(#glow)"/>
  <circle cx="320" cy="85" r="36" fill="#fff1bf"/>
  <circle cx="334" cy="76" r="32" fill="#161f4c"/>

  <!-- Floor and rug -->
  <rect x="0" y="290" width="400" height="110" fill="url(#floor)"/>
  <rect x="0" y="288" width="400" height="5" fill="#5a4478"/>
  <ellipse cx="200" cy="330" rx="150" ry="26" fill="#8a4f7d" opacity="0.6"/>

  <!-- Rocket flying with dotted trail -->
  <path d="M76 86 Q110 110 130 150" stroke="#ffb347" stroke-width="3" stroke-dasharray="3 6" fill="none" opacity="0.6"/>
  <g transform="translate(60 60) rotate(-30)">
    <path d="M-10 10 L-20 26 L-10 24 Z" fill="#ff5d6c"/>
    <path d="M10 10 L20 26 L10 24 Z" fill="#ff5d6c"/>
    <ellipse cx="0" cy="0" rx="10" ry="28" fill="#f5f5ff"/>
    <path d="M-10 -20 Q0 -48 10 -20 Z" fill="#ff5d6c"/>
    <circle cx="0" cy="-6" r="5" fill="#6fd3ff"/>
    <path d="M-6 28 Q0 60 6 28 Z" fill="#ffb347"/>
  </g>

  <!-- Teddy bear waving -->
  <circle cx="68" cy="178" r="12" fill="#b97a4b"/>
  <circle cx="112" cy="178" r="12" fill="#b97a4b"/>
  <ellipse cx="72" cy="282" rx="12" ry="10" fill="#b97a4b"/>
  <ellipse cx="108" cy="282" rx="12" ry="10" fill="#b97a4b"/>
  <ellipse cx="90" cy="248" rx="30" ry="36" fill="#b97a4b"/>
  <ellipse cx="90" cy="252" rx="16" ry="22" fill="#e8c39e"/>
  <ellipse cx="56" cy="240" rx="9" ry="18" transform="rotate(20 56 240)" fill="#b97a4b"/>
  <ellipse cx="124" cy="222" rx="9" ry="18" transform="rotate(-35 124 222)" fill="#b97a4b"/>
  <circle cx="90" cy="195" r="28" fill="#b97a4b"/>
  <ellipse cx="90" cy="206" rx="12" ry="9" fill="#e8c39e"/>
  <circle cx="80" cy="188" r="3" fill="#1a1a2e"/>
  <circle cx="100" cy="188" r="3" fill="#1a1a2e"/>
  <ellipse cx="90" cy="202" rx="3" ry="2.5" fill="#1a1a2e"/>

  <!-- Bouncing ball with motion arc -->
  <path d="M150 262 Q168 228 186 262" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="2 4" fill="none" opacity="0.5"/>
  <circle cx="170" cy="276" r="12" fill="#5ee6c4"/>
  <path d="M160 270 Q170 280 180 270" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.7"/>

  <!-- Toy robot -->
  <line x1="220" y1="160" x2="220" y2="142" stroke="#9aa5d6" stroke-width="3"/>
  <circle cx="220" cy="138" r="5" fill="#ff6b8b"/>
  <rect x="194" y="160" width="52" height="44" rx="8" fill="#9fd3e6"/>
  <circle cx="208" cy="180" r="6" fill="#ffd23f"/>
  <circle cx="232" cy="180" r="6" fill="#ffd23f"/>
  <rect x="208" y="193" width="24" height="5" rx="2" fill="#2d3b6e"/>
  <rect x="200" y="208" width="40" height="54" rx="6" fill="#f2a65a"/>
  <circle cx="220" cy="232" r="6" fill="#fff1bf"/>
  <rect x="180" y="214" width="16" height="10" rx="4" fill="#9fd3e6"/>
  <rect x="236" y="196" width="16" height="10" rx="4" fill="#9fd3e6" transform="rotate(-40 244 201)"/>
  <rect x="204" y="262" width="12" height="30" rx="3" fill="#6f7fc2"/>
  <rect x="224" y="262" width="12" height="30" rx="3" fill="#6f7fc2"/>

  <!-- Dancing doll -->
  <line x1="316" y1="240" x2="290" y2="222" stroke="#ffd1b3" stroke-width="6" stroke-linecap="round"/>
  <line x1="344" y1="240" x2="370" y2="218" stroke="#ffd1b3" stroke-width="6" stroke-linecap="round"/>
  <path d="M312 232 L348 232 L360 282 L300 282 Z" fill="#ff7aa2"/>
  <line x1="322" y1="282" x2="316" y2="292" stroke="#ffd1b3" stroke-width="6" stroke-linecap="round"/>
  <line x1="338" y1="282" x2="346" y2="292" stroke="#ffd1b3" stroke-width="6" stroke-linecap="round"/>
  <circle cx="330" cy="205" r="20" fill="#5a2d4d"/>
  <circle cx="330" cy="210" r="16" fill="#ffd1b3"/>
  <circle cx="325" cy="208" r="1.8" fill="#1a1a2e"/>
  <circle cx="335" cy="208" r="1.8" fill="#1a1a2e"/>

  <!-- Floating music notes -->
  <g fill="#fff1bf">
    <circle cx="372" cy="150" r="6"/>
    <rect x="376" y="124" width="2.5" height="26"/>
    <circle cx="300" cy="132" r="5"/>
    <rect x="304" y="108" width="2.5" height="24"/>
  </g>
</svg>