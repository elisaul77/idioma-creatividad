<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f6ff"/>
      <stop offset="0.6" stop-color="#9fd3f5"/>
      <stop offset="1" stop-color="#4a8fd6"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fd4ff"/>
      <stop offset="1" stop-color="#1a4fa0"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7fd1"/>
      <stop offset="1" stop-color="#153f86"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- soft halo -->
  <circle cx="200" cy="210" r="130" fill="#ffffff" opacity="0.22"/>
  <circle cx="200" cy="210" r="95" fill="#ffffff" opacity="0.18"/>

  <!-- scent wisps rising -->
  <g fill="none" stroke="#3b82c4" stroke-linecap="round" opacity="0.55" stroke-width="5" filter="url(#soft)">
    <path d="M172 164 C156 130 190 110 174 70"/>
    <path d="M200 160 C222 122 194 100 214 52"/>
    <path d="M236 164 C220 134 252 108 238 78"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-linecap="round" opacity="0.6" stroke-width="2">
    <path d="M186 150 C172 126 200 110 188 88"/>
    <path d="M222 150 C236 124 214 106 226 80"/>
  </g>

  <!-- glass stem and base -->
  <rect x="197" y="248" width="6" height="88" fill="#dff1ff" opacity="0.9"/>
  <ellipse cx="200" cy="339" rx="52" ry="9" fill="#cfe9ff" stroke="#1a4fa0" stroke-width="3"/>

  <!-- glass bowl -->
  <path d="M118 168 L282 168 L200 250 Z" fill="#ffffff" opacity="0.35" stroke="#1a4fa0" stroke-width="4" stroke-linejoin="round"/>
  <!-- blue liquid -->
  <path d="M130 180 L270 180 L200 245 Z" fill="url(#liquid)"/>
  <path d="M130 180 Q150 174 170 180 T210 180 T250 180 T270 180" fill="none" stroke="#dff6ff" stroke-width="3" opacity="0.8"/>

  <!-- ice cubes -->
  <rect x="172" y="196" width="22" height="22" rx="4" fill="#ffffff" opacity="0.55" transform="rotate(-14 183 207)"/>
  <rect x="204" y="200" width="18" height="18" rx="3" fill="#ffffff" opacity="0.45" transform="rotate(18 213 209)"/>

  <!-- citrus slice on rim -->
  <circle cx="284" cy="160" r="20" fill="#ffd166" stroke="#ffffff" stroke-width="3"/>
  <circle cx="284" cy="160" r="14" fill="#fff3c4"/>
  <g stroke="#ffd166" stroke-width="2">
    <line x1="284" y1="160" x2="284" y2="148"/>
    <line x1="284" y1="160" x2="296" y2="160"/>
    <line x1="284" y1="160" x2="284" y2="172"/>
    <line x1="284" y1="160" x2="272" y2="160"/>
  </g>

  <!-- floating droplets -->
  <circle cx="110" cy="130" r="6" fill="#2f7fd1" opacity="0.7"/>
  <circle cx="92" cy="176" r="4" fill="#2f7fd1" opacity="0.6"/>
  <circle cx="312" cy="112" r="5" fill="#2f7fd1" opacity="0.7"/>
  <circle cx="330" cy="200" r="3.5" fill="#2f7fd1" opacity="0.6"/>
  <circle cx="150" cy="270" r="3" fill="#ffffff" opacity="0.8"/>
  <circle cx="262" cy="292" r="4" fill="#ffffff" opacity="0.7"/>

  <!-- sea / surface waves -->
  <path d="M0 330 Q50 312 100 330 T200 330 T300 330 T400 330 L400 400 L0 400 Z" fill="url(#sea)" opacity="0.7"/>
  <path d="M0 352 Q50 336 100 352 T200 352 T300 352 T400 352 L400 400 L0 400 Z" fill="url(#sea)"/>
  <g fill="none" stroke="#c9ecff" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <path d="M40 370 Q60 364 80 370"/>
    <path d="M250 378 Q272 372 294 378"/>
    <path d="M120 388 Q136 383 152 388"/>
  </g>
</svg>