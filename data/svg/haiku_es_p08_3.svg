<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141a46"/>
      <stop offset="1" stop-color="#3a2b6b"/>
    </linearGradient>
    <radialGradient id="luna" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#fffbe6"/>
      <stop offset="1" stop-color="#f3d98b"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Cielo -->
  <rect width="400" height="400" fill="url(#cielo)"/>

  <!-- Estrellas -->
  <g fill="#ffffff">
    <circle cx="40" cy="45" r="2"/>
    <circle cx="95" cy="25" r="1.5"/>
    <circle cx="150" cy="60" r="2"/>
    <circle cx="210" cy="30" r="1.5"/>
    <circle cx="260" cy="90" r="2"/>
    <circle cx="350" cy="50" r="2.5"/>
    <circle cx="370" cy="140" r="1.5"/>
    <circle cx="25" cy="150" r="1.5"/>
    <circle cx="185" cy="120" r="1.5"/>
    <circle cx="320" cy="200" r="1.5"/>
    <circle cx="60" cy="210" r="1.5"/>
  </g>

  <!-- Ventana y luna -->
  <circle cx="305" cy="105" r="60" fill="url(#halo)"/>
  <rect x="270" y="60" width="90" height="100" rx="4" fill="#24306b" stroke="#8c7ac0" stroke-width="4"/>
  <line x1="315" y1="60" x2="315" y2="160" stroke="#8c7ac0" stroke-width="3"/>
  <line x1="270" y1="110" x2="360" y2="110" stroke="#8c7ac0" stroke-width="3"/>
  <circle cx="300" cy="90" r="16" fill="url(#luna)"/>
  <circle cx="307" cy="85" r="14" fill="#24306b" opacity="0.9"/>

  <!-- Suelo -->
  <rect x="0" y="330" width="400" height="70" fill="#2a1f3d"/>
  <path d="M0 330 Q200 318 400 330" stroke="#4b3a6e" stroke-width="3" fill="none"/>

  <!-- Oso de peluche -->
  <g transform="translate(140 225)">
    <circle cx="-22" cy="-42" r="12" fill="#b07a4b"/>
    <circle cx="22" cy="-42" r="12" fill="#b07a4b"/>
    <circle cx="-22" cy="-42" r="6" fill="#e8b98c"/>
    <circle cx="22" cy="-42" r="6" fill="#e8b98c"/>
    <circle cx="0" cy="-30" r="28" fill="#c58b5a"/>
    <ellipse cx="0" cy="-22" rx="11" ry="8" fill="#e8b98c"/>
    <circle cx="-9" cy="-34" r="3" fill="#2a1f3d"/>
    <circle cx="9" cy="-34" r="3" fill="#2a1f3d"/>
    <ellipse cx="0" cy="-26" rx="3" ry="2" fill="#2a1f3d"/>
    <ellipse cx="0" cy="10" rx="22" ry="26" fill="#c58b5a"/>
    <ellipse cx="0" cy="14" rx="12" ry="14" fill="#e8b98c"/>
    <ellipse cx="-24" cy="8" rx="7" ry="13" fill="#b07a4b" transform="rotate(20 -24 8)"/>
    <ellipse cx="24" cy="4" rx="7" ry="13" fill="#b07a4b" transform="rotate(-50 24 4)"/>
    <ellipse cx="-12" cy="34" rx="8" ry="6" fill="#b07a4b"/>
    <ellipse cx="12" cy="34" rx="8" ry="6" fill="#b07a4b"/>
  </g>

  <!-- Robot de juguete -->
  <g transform="translate(275 240)">
    <line x1="0" y1="-62" x2="0" y2="-80" stroke="#9fb4d6" stroke-width="3"/>
    <circle cx="0" cy="-84" r="5" fill="#ffd166"/>
    <rect x="-24" y="-60" width="48" height="40" rx="6" fill="#7aa2d8"/>
    <rect x="-16" y="-50" width="10" height="8" fill="#ffd166"/>
    <rect x="6" y="-50" width="10" height="8" fill="#ffd166"/>
    <rect x="-12" y="-30" width="24" height="5" rx="2" fill="#24306b"/>
    <rect x="-20" y="-20" width="40" height="46" rx="5" fill="#5f87c2"/>
    <circle cx="0" cy="-2" r="5" fill="#ff7b9c"/>
    <rect x="-40" y="-18" width="16" height="10" rx="5" fill="#7aa2d8" transform="rotate(-30 -40 -18)"/>
    <rect x="24" y="-18" width="16" height="10" rx="5" fill="#7aa2d8" transform="rotate(30 40 -18)"/>
    <rect x="-16" y="26" width="13" height="20" rx="4" fill="#4a6fa8"/>
    <rect x="3" y="26" width="13" height="20" rx="4" fill="#4a6fa8"/>
  </g>

  <!-- Pelota rebotando y estela -->
  <g>
    <path d="M45 300 Q60 240 80 300" stroke="#ff7b9c" stroke-width="2" fill="none" stroke-dasharray="3 4" opacity="0.6"/>
    <circle cx="80" cy="260" r="18" fill="#ff7b9c"/>
    <path d="M62 260 Q80 248 98 260" stroke="#ffd166" stroke-width="4" fill="none"/>
    <path d="M80 242 Q72 260 80 278" stroke="#ffd166" stroke-width="4" fill="none"/>
    <ellipse cx="80" cy="322" rx="20" ry="4" fill="#000000" opacity="0.25"/>
  </g>

  <!-- Coche de juguete -->
  <g transform="translate(340 300)">
    <rect x="-30" y="-14" width="60" height="18" rx="5" fill="#ff9f43"/>
    <path d="M-16 -14 L-10 -26 L12 -26 L20 -14 Z" fill="#ffb86b"/>
    <rect x="-8" y="-23" width="8" height="7" fill="#fff3d1"/>
    <rect x="4" y="-23" width="8" height="7" fill="#fff3d1"/>
    <circle cx="-16" cy="6" r="8" fill="#2a1f3d"/>
    <circle cx="-16" cy="6" r="3" fill="#c9c9d9"/>
    <circle cx="18" cy="6" r="8" fill="#2a1f3d"/>
    <circle cx="18" cy="6" r="3" fill="#c9c9d9"/>
    <path d="M-40 -6 L-32 -6 M-42 0 L-32 0" stroke="#fff3d1" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Cohete de juguete despegando -->
  <g transform="translate(60 120) rotate(-20)">
    <path d="M0 -30 Q12 -10 12 14 L-12 14 Q-12 -10 0 -30 Z" fill="#f5f5ff"/>
    <circle cx="0" cy="-6" r="5" fill="#5fb3d9"/>
    <path d="M-12 6 L-20 18 L-12 14 Z" fill="#ff7b9c"/>
    <path d="M12 6 L20 18 L12 14 Z" fill="#ff7b9c"/>
    <path d="M-7 14 Q0 34 7 14 Z" fill="#ffd166"/>
  </g>
</svg>