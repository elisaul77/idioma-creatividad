<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="himmel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#150f3a"/>
      <stop offset="0.5" stop-color="#3b2a7e"/>
      <stop offset="0.85" stop-color="#c46ba6"/>
      <stop offset="1" stop-color="#f6b59a"/>
    </linearGradient>
    <radialGradient id="blase" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#9fd8ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#e7b6ff" stop-opacity="0.25"/>
    </radialGradient>
    <radialGradient id="mond" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#fffbe6"/>
      <stop offset="1" stop-color="#ffe08a"/>
    </radialGradient>
    <linearGradient id="segel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7fb"/>
      <stop offset="1" stop-color="#ffc2e0"/>
    </linearGradient>
    <linearGradient id="wolke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f3d1ff" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="weich" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Himmel -->
  <rect width="400" height="400" fill="url(#himmel)"/>

  <!-- Sterne -->
  <g fill="#ffffff">
    <circle cx="40" cy="45" r="1.6" opacity="0.9"/>
    <circle cx="90" cy="30" r="1" opacity="0.7"/>
    <circle cx="150" cy="60" r="1.8" opacity="0.95"/>
    <circle cx="370" cy="40" r="1.4" opacity="0.8"/>
    <circle cx="330" cy="75" r="1" opacity="0.6"/>
    <circle cx="25" cy="150" r="1.2" opacity="0.7"/>
    <circle cx="360" cy="180" r="1.5" opacity="0.85"/>
    <circle cx="60" cy="300" r="1" opacity="0.6"/>
    <circle cx="385" cy="290" r="1.3" opacity="0.7"/>
    <circle cx="210" cy="28" r="1.1" opacity="0.8"/>
  </g>
  <!-- Sternenspur in Spirale -->
  <path d="M 300 340 C 360 300, 330 240, 280 262 C 236 282, 262 330, 306 310" fill="none" stroke="#ffe9a8" stroke-width="1.5" stroke-dasharray="2 7" stroke-linecap="round" opacity="0.8"/>

  <!-- Mond mit Glanz -->
  <circle cx="312" cy="112" r="80" fill="#ffd98a" opacity="0.12"/>
  <circle cx="312" cy="112" r="46" fill="url(#mond)" filter="url(#glow)"/>
  <circle cx="330" cy="98" r="40" fill="#3b2a7e" opacity="0.9"/>
  <circle cx="330" cy="98" r="40" fill="none" stroke="none"/>

  <!-- Wolken am Horizont -->
  <g fill="url(#wolke)" opacity="0.8">
    <ellipse cx="90" cy="330" rx="70" ry="16"/>
    <ellipse cx="60" cy="326" rx="30" ry="12"/>
    <ellipse cx="130" cy="324" rx="26" ry="11"/>
    <ellipse cx="300" cy="370" rx="80" ry="14"/>
  </g>

  <!-- Traumblase -->
  <circle cx="200" cy="205" r="122" fill="url(#blase)" stroke="#e8d6ff" stroke-width="1.5" stroke-opacity="0.6"/>
  <path d="M 110 150 A 110 110 0 0 1 170 98" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <circle cx="200" cy="205" r="116" fill="none" stroke="#9fd8ff" stroke-width="0.8" stroke-dasharray="1 6" opacity="0.5"/>

  <!-- Schwebende Insel im Traum -->
  <g>
    <path d="M 130 250 Q 150 236 178 240 Q 200 230 224 242 Q 246 238 262 252 Q 210 262 130 250 Z" fill="#5b3f9e" opacity="0.8"/>
    <path d="M 128 252 Q 196 268 264 252 Q 240 282 200 282 Q 158 282 128 252 Z" fill="#2c1f5c" opacity="0.7"/>
    <path d="M 196 240 Q 200 210 210 194" fill="none" stroke="#ffc2e0" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 210 194 L 210 166" fill="none" stroke="#ffc2e0" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 210 170 Q 232 174 234 190 L 210 190 Z" fill="url(#segel)" opacity="0.95"/>
    <path d="M 210 176 Q 194 180 190 192 L 210 192 Z" fill="#ffe3f1" opacity="0.85"/>
  </g>

  <!-- Schwebende Fragmente, die sich in Punkte auflösen -->
  <g fill="#ffd6f0">
    <ellipse cx="150" cy="170" rx="7" ry="3" transform="rotate(-30 150 170)" opacity="0.85"/>
    <ellipse cx="256" cy="150" rx="5" ry="2.2" transform="rotate(20 256 150)" opacity="0.7"/>
    <circle cx="170" cy="130" r="2.4" opacity="0.8"/>
    <circle cx="186" cy="118" r="1.6" opacity="0.6"/>
    <circle cx="200" cy="106" r="1.1" opacity="0.5"/>
    <circle cx="246" cy="290" r="2" opacity="0.7"/>
    <circle cx="158" cy="300" r="1.4" opacity="0.6"/>
  </g>

  <!-- Weiche Schimmer -->
  <circle cx="200" cy="205" r="122" fill="none" stroke="#ffffff" stroke-width="10" opacity="0.05" filter="url(#weich)"/>
</svg>