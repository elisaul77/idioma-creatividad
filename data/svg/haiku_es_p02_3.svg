<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1040"/>
      <stop offset="55%" stop-color="#4b2a7a"/>
      <stop offset="100%" stop-color="#e88fb0"/>
    </linearGradient>
    <radialGradient id="luna" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#fff8e1"/>
      <stop offset="100%" stop-color="#f7d58a"/>
    </radialGradient>
    <radialGradient id="resplandor" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffd6f0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffd6f0" stop-opacity="0"/>
    </radialGradient>
    <filter id="suave" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#cielo)"/>

  <!-- estrellas -->
  <g fill="#fff" opacity="0.85">
    <circle cx="40" cy="50" r="1.5"/>
    <circle cx="95" cy="28" r="1"/>
    <circle cx="160" cy="45" r="1.8"/>
    <circle cx="330" cy="38" r="1.5"/>
    <circle cx="360" cy="95" r="1"/>
    <circle cx="25" cy="150" r="1.2"/>
    <circle cx="300" cy="140" r="1.4"/>
    <circle cx="375" cy="200" r="1.1"/>
    <circle cx="60" cy="230" r="1"/>
    <circle cx="210" cy="78" r="1.2"/>
  </g>

  <!-- luna creciente -->
  <circle cx="300" cy="100" r="60" fill="url(#resplandor)"/>
  <path d="M300 55 A45 45 0 1 0 330 130 A36 36 0 1 1 300 55 Z" fill="url(#luna)"/>

  <!-- nubes de algodón -->
  <g fill="#c9a6e8" opacity="0.55" filter="url(#suave)">
    <ellipse cx="90" cy="290" rx="80" ry="22"/>
    <ellipse cx="300" cy="310" rx="90" ry="26"/>
  </g>
  <g fill="#f3c6e0" opacity="0.4">
    <ellipse cx="200" cy="330" rx="130" ry="18"/>
  </g>

  <!-- espiral onírica -->
  <path d="M200 200 C 225 180, 255 200, 240 225 C 225 250, 180 240, 185 210 C 190 180, 235 170, 260 195"
        fill="none" stroke="#ffd6f0" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M200 200 C 175 220, 145 200, 160 175 C 175 150, 220 160, 215 190 C 210 220, 165 230, 140 205"
        fill="none" stroke="#9fe3ff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- formas flotantes -->
  <g>
    <circle cx="130" cy="120" r="14" fill="#ffb3d9" opacity="0.7"/>
    <circle cx="130" cy="120" r="7" fill="#fff" opacity="0.6"/>
    <rect x="260" y="200" width="22" height="22" rx="5" fill="#9fe3ff" opacity="0.6" transform="rotate(25 271 211)"/>
    <polygon points="90,190 104,214 76,214" fill="#ffe08a" opacity="0.65"/>
    <circle cx="330" cy="250" r="9" fill="#b8f2e6" opacity="0.6"/>
    <circle cx="70" cy="110" r="5" fill="#fff" opacity="0.7"/>
  </g>

  <!-- puerta de luz en el horizonte -->
  <path d="M175 360 Q200 300 225 360 Z" fill="#fff4d6" opacity="0.35"/>
  <rect x="0" y="352" width="400" height="48" fill="#2a1545" opacity="0.5"/>
</svg>