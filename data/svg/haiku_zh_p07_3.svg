<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050818"/>
      <stop offset="0.55" stop-color="#1a0f3d"/>
      <stop offset="1" stop-color="#3a1458"/>
    </linearGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c2a3a"/>
      <stop offset="0.5" stop-color="#5fd8e8"/>
      <stop offset="1" stop-color="#1c2a3a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd6f5" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#ff7ad9" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff7ad9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ground" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4ef0ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4ef0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="0.35" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#7ff7ff"/>
      <stop offset="1" stop-color="#7ff7ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8fff4"/>
      <stop offset="0.5" stop-color="#3ee6d0"/>
      <stop offset="1" stop-color="#ff6fd8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="30" cy="40" r="1.2" opacity="0.9"/>
    <circle cx="82" cy="18" r="0.9" opacity="0.7"/>
    <circle cx="140" cy="54" r="1" opacity="0.8"/>
    <circle cx="318" cy="30" r="1.3" opacity="0.9"/>
    <circle cx="370" cy="78" r="1" opacity="0.7"/>
    <circle cx="360" cy="150" r="0.8" opacity="0.6"/>
    <circle cx="48" cy="130" r="0.9" opacity="0.6"/>
    <circle cx="260" cy="16" r="0.8" opacity="0.6"/>
    <circle cx="20" cy="210" r="0.9" opacity="0.5"/>
    <circle cx="385" cy="250" r="0.9" opacity="0.5"/>
  </g>

  <!-- Giant future sun / ring -->
  <circle cx="200" cy="170" r="130" fill="url(#sun)"/>
  <ellipse cx="200" cy="170" rx="120" ry="28" fill="none" stroke="#ff9be6" stroke-width="1.5" opacity="0.5" transform="rotate(-12 200 170)"/>
  <ellipse cx="200" cy="170" rx="150" ry="36" fill="none" stroke="#7ff7ff" stroke-width="1" opacity="0.35" transform="rotate(-12 200 170)"/>

  <!-- Ground glow -->
  <ellipse cx="200" cy="352" rx="170" ry="40" fill="url(#ground)"/>
  <path d="M0 340 Q120 320 200 338 T400 336 L400 400 L0 400 Z" fill="#0b0a24"/>
  <path d="M0 340 Q120 320 200 338 T400 336" fill="none" stroke="#4ef0ff" stroke-width="1" opacity="0.6" filter="url(#glow)"/>

  <!-- Trunk -->
  <path d="M188 340 C190 300 194 280 196 250 C198 220 192 200 200 170 C206 200 204 226 206 252 C208 282 212 300 212 340 Z" fill="url(#trunk)" filter="url(#glow)"/>

  <!-- Branches -->
  <g fill="none" stroke="#7ff7ff" stroke-linecap="round" filter="url(#glow)">
    <path d="M198 220 C170 200 150 190 118 150" stroke-width="5"/>
    <path d="M202 214 C230 196 254 180 286 140" stroke-width="5"/>
    <path d="M200 180 C184 160 176 140 170 96" stroke-width="4"/>
    <path d="M200 176 C218 156 226 136 236 90" stroke-width="4"/>
    <path d="M118 150 C100 136 90 124 80 100" stroke-width="3"/>
    <path d="M286 140 C304 126 316 112 326 88" stroke-width="3"/>
    <path d="M170 96 C160 80 150 70 136 56" stroke-width="2.5"/>
    <path d="M236 90 C246 76 258 66 272 54" stroke-width="2.5"/>
    <path d="M200 170 C198 130 202 100 200 62" stroke-width="3"/>
  </g>

  <!-- Crystal canopy glow -->
  <g fill="#7ff7ff" opacity="0.35" filter="url(#softglow)">
    <circle cx="200" cy="110" r="70"/>
  </g>

  <!-- Crystal leaves -->
  <g filter="url(#glow)">
    <path d="M80 100 L92 86 L104 100 L92 114 Z" fill="url(#leaf)"/>
    <path d="M136 56 L146 44 L156 56 L146 68 Z" fill="url(#leaf)"/>
    <path d="M326 88 L338 74 L348 88 L338 102 Z" fill="url(#leaf)"/>
    <path d="M272 54 L282 42 L292 54 L282 66 Z" fill="url(#leaf)"/>
    <path d="M200 62 L210 48 L220 62 L210 76 Z" fill="url(#leaf)"/>
    <path d="M118 150 L128 136 L138 150 L128 164 Z" fill="url(#leaf)"/>
    <path d="M286 140 L296 126 L306 140 L296 154 Z" fill="url(#leaf)"/>
    <path d="M150 96 L160 82 L170 96 L160 110 Z" fill="url(#leaf)"/>
    <path d="M236 90 L244 78 L252 90 L244 102 Z" fill="url(#leaf)"/>
    <path d="M170 130 L178 118 L186 130 L178 142 Z" fill="url(#leaf)"/>
    <path d="M220 128 L228 116 L236 128 L228 140 Z" fill="url(#leaf)"/>
    <path d="M100 180 L108 170 L116 180 L108 190 Z" fill="url(#leaf)"/>
    <path d="M300 190 L307 180 L314 190 L307 200 Z" fill="url(#leaf)"/>
  </g>

  <!-- Floating orbs -->
  <g>
    <circle cx="60" cy="230" r="10" fill="url(#orb)"/>
    <circle cx="340" cy="220" r="8" fill="url(#orb)"/>
    <circle cx="90" cy="290" r="5" fill="url(#orb)"/>
    <circle cx="312" cy="296" r="6" fill="url(#orb)"/>
    <circle cx="150" cy="250" r="4" fill="url(#orb)"/>
    <circle cx="262" cy="262" r="4.5" fill="url(#orb)"/>
    <circle cx="120" cy="60" r="3" fill="url(#orb)"/>
    <circle cx="350" cy="40" r="4" fill="url(#orb)"/>
  </g>

  <!-- Rising data particles -->
  <g fill="#ff9be6" filter="url(#glow)">
    <rect x="176" y="260" width="3" height="3" opacity="0.8"/>
    <rect x="224" y="240" width="2.5" height="2.5" opacity="0.7"/>
    <rect x="200" y="200" width="2" height="2" opacity="0.9"/>
    <rect x="144" y="170" width="2" height="2" opacity="0.6"/>
    <rect x="256" y="200" width="2.5" height="2.5" opacity="0.7"/>
  </g>
</svg>