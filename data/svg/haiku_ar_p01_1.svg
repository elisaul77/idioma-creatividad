<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1030"/>
      <stop offset="1" stop-color="#3a1f5c"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2fd6c4"/>
      <stop offset="1" stop-color="#7b4fe0"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8fab" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="orb">
      <stop offset="0" stop-color="#fffbe6"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#sky)"/>
  <circle cx="60" cy="50" r="1.5" fill="#ffffff"/>
  <circle cx="120" cy="30" r="1" fill="#ffffff"/>
  <circle cx="340" cy="60" r="1.8" fill="#ffffff"/>
  <circle cx="370" cy="150" r="1" fill="#ffffff"/>
  <circle cx="30" cy="200" r="1.2" fill="#ffffff"/>
  <circle cx="205" cy="22" r="1" fill="#ffffff"/>
  <circle cx="260" cy="90" r="1.2" fill="#ffffff"/>
  <ellipse cx="200" cy="352" rx="150" ry="22" fill="#2fd6c4" opacity="0.2"/>

  <!-- Back wing (left) -->
  <path d="M150 200 C90 120 40 130 30 90 C70 100 90 110 110 110 C80 90 90 60 130 70 C125 110 140 150 165 190 Z"
        fill="url(#wing)" opacity="0.85"/>

  <!-- Tail: spiral ending in a glowing orb -->
  <path d="M115 240 C70 250 60 210 80 190 C100 170 70 150 50 170"
        stroke="url(#body)" stroke-width="10" fill="none" stroke-linecap="round"/>
  <circle cx="50" cy="170" r="22" fill="url(#orb)"/>
  <circle cx="50" cy="170" r="8" fill="#ffd166"/>

  <!-- Legs: bird-like talons (front) and branch-like (rear) -->
  <path d="M160 275 L150 320" stroke="#5b3fb0" stroke-width="9" stroke-linecap="round"/>
  <path d="M150 320 l-12 8 M150 320 l0 10 M150 320 l12 6" stroke="#ffd166" stroke-width="3" stroke-linecap="round"/>
  <path d="M200 285 L195 325 M195 310 L185 300 M195 318 L208 306"
        stroke="#5b3fb0" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M225 280 L232 318" stroke="#5b3fb0" stroke-width="9" stroke-linecap="round"/>
  <path d="M232 318 l-8 6 M232 318 l10 4" stroke="#ffd166" stroke-width="3" stroke-linecap="round"/>

  <!-- Body -->
  <ellipse cx="200" cy="235" rx="85" ry="52" fill="url(#body)"/>

  <!-- Scale pattern -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2">
    <path d="M160 215 q10 -10 20 0 q10 -10 20 0 q10 -10 20 0 q10 -10 20 0"/>
    <path d="M150 238 q10 -10 20 0 q10 -10 20 0 q10 -10 20 0 q10 -10 20 0"/>
    <path d="M165 260 q10 -10 20 0 q10 -10 20 0 q10 -10 20 0"/>
  </g>
  <path d="M195 230 c10 -14 30 -6 22 10 c-8 14 -28 4 -18 -10"
        stroke="#ffd166" stroke-width="2" fill="none"/>

  <!-- Front wing (right) -->
  <path d="M230 200 C270 130 330 140 360 100 C340 150 330 170 300 190 C320 200 330 215 335 235 C300 225 260 220 240 215 Z"
        fill="url(#wing)" opacity="0.9"/>

  <!-- Head -->
  <path d="M265 170 L258 120 L285 160 Z" fill="#ff8fab"/>
  <path d="M302 164 Q318 120 328 140 Q312 152 306 166 Z" fill="#ff8fab"/>
  <ellipse cx="290" cy="190" rx="32" ry="28" fill="url(#body)"/>
  <polygon points="280,162 288,128 296,162" fill="#9ef0ff" opacity="0.9" stroke="#ffffff" stroke-width="1"/>
  <path d="M312 196 Q345 190 350 210 Q330 214 312 210 Z" fill="#7b4fe0"/>
  <circle cx="296" cy="184" r="6" fill="#fffbe6"/>
  <circle cx="298" cy="184" r="3" fill="#1b0f3a"/>

  <!-- Floating particles -->
  <g fill="#9ef0ff" opacity="0.6">
    <circle cx="90" cy="300" r="2"/>
    <circle cx="320" cy="300" r="2.5"/>
    <circle cx="350" cy="260" r="1.5"/>
    <circle cx="40" cy="260" r="1.8"/>
    <circle cx="260" cy="60" r="1.5"/>
  </g>
</svg>