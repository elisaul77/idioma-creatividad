<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3ff"/>
      <stop offset="1" stop-color="#e6f7ff"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.45" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#fff7a1"/>
      <stop offset="1" stop-color="#ffc83d"/>
    </radialGradient>
    <radialGradient id="face" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffe066"/>
      <stop offset="1" stop-color="#ffb300"/>
    </radialGradient>
  </defs>

  <!-- 天空 -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- 云朵 -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="70" cy="80" rx="40" ry="18"/>
    <ellipse cx="95" cy="70" rx="28" ry="20"/>
    <ellipse cx="320" cy="110" rx="46" ry="19"/>
    <ellipse cx="345" cy="98" rx="30" ry="22"/>
  </g>

  <!-- 阳光光芒 -->
  <g stroke="#ffd54a" stroke-width="10" stroke-linecap="round">
    <line x1="200" y1="40" x2="200" y2="75"/>
    <line x1="200" y1="325" x2="200" y2="360"/>
    <line x1="40" y1="200" x2="75" y2="200"/>
    <line x1="325" y1="200" x2="360" y2="200"/>
    <line x1="89" y1="89" x2="114" y2="114"/>
    <line x1="311" y1="311" x2="286" y2="286"/>
    <line x1="311" y1="89" x2="286" y2="114"/>
    <line x1="89" y1="311" x2="114" y2="286"/>
  </g>

  <!-- 太阳脸 -->
  <circle cx="200" cy="200" r="90" fill="url(#face)"/>

  <!-- 腮红 -->
  <ellipse cx="160" cy="225" rx="16" ry="10" fill="#ff8a80" opacity="0.6"/>
  <ellipse cx="240" cy="225" rx="16" ry="10" fill="#ff8a80" opacity="0.6"/>

  <!-- 眼睛（弯弯的笑眼） -->
  <path d="M250 178 Q160 0 150 178" fill="none" stroke="none"/>
  <path d="M220 180 Q234 160 248 180" fill="none" stroke="#5a3e00" stroke-width="7" stroke-linecap="round"/>
  <path d="M152 180 Q166 160 180 180" fill="none" stroke="#5a3e00" stroke-width="7" stroke-linecap="round"/>

  <!-- 微笑 -->
  <path d="M250 225 Q200 285 150 225" fill="none" stroke="#5a3e00" stroke-width="7" stroke-linecap="round"/>

  <!-- 草地 -->
  <path d="M0 330 Q100 300 200 325 T400 320 L400 400 L0 400 Z" fill="#7ed957"/>
  <path d="M0 355 Q120 330 240 352 T400 350 L400 400 L0 400 Z" fill="#5cbf3a"/>

  <!-- 花朵 -->
  <g>
    <g transform="translate(60 330)">
      <circle cx="0" cy="-18" r="9" fill="#ff6b9a"/>
      <circle cx="16" cy="-6" r="9" fill="#ff6b9a"/>
      <circle cx="10" cy="12" r="9" fill="#ff6b9a"/>
      <circle cx="-10" cy="12" r="9" fill="#ff6b9a"/>
      <circle cx="-16" cy="-6" r="9" fill="#ff6b9a"/>
      <circle cx="0" cy="0" r="7" fill="#ffe066"/>
      <line x1="0" y1="20" x2="0" y2="60" stroke="#2e7d32" stroke-width="4"/>
    </g>
    <g transform="translate(335 340)">
      <circle cx="0" cy="-18" r="9" fill="#ffa726"/>
      <circle cx="16" cy="-6" r="9" fill="#ffa726"/>
      <circle cx="10" cy="12" r="9" fill="#ffa726"/>
      <circle cx="-10" cy="12" r="9" fill="#ffa726"/>
      <circle cx="-16" cy="-6" r="9" fill="#ffa726"/>
      <circle cx="0" cy="0" r="7" fill="#fff59d"/>
      <line x1="0" y1="20" x2="0" y2="50" stroke="#2e7d32" stroke-width="4"/>
    </g>
    <g transform="translate(130 350)">
      <circle cx="0" cy="-14" r="7" fill="#ba68c8"/>
      <circle cx="12" cy="-4" r="7" fill="#ba68c8"/>
      <circle cx="8" cy="9" r="7" fill="#ba68c8"/>
      <circle cx="-8" cy="9" r="7" fill="#ba68c8"/>
      <circle cx="-12" cy="-4" r="7" fill="#ba68c8"/>
      <circle cx="0" cy="0" r="5" fill="#fff176"/>
    </g>
  </g>

  <!-- 飞舞的小鸟 -->
  <g fill="none" stroke="#3d5a80" stroke-width="4" stroke-linecap="round">
    <path d="M300 60 Q310 50 320 60 Q330 50 340 60"/>
    <path d="M345 45 Q352 38 359 45 Q366 38 373 45"/>
  </g>
</svg>