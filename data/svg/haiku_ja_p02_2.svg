<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#3b2f7a"/>
      <stop offset="55%" stop-color="#1b1747"/>
      <stop offset="100%" stop-color="#0a0820"/>
    </radialGradient>
    <radialGradient id="core" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff6d6" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#ffb3d9" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#7f6bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7ef0ff"/>
      <stop offset="50%" stop-color="#c79bff"/>
      <stop offset="100%" stop-color="#ff9ecf"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="48" cy="60" r="1.6" opacity="0.9"/>
    <circle cx="92" cy="28" r="1.1" opacity="0.7"/>
    <circle cx="150" cy="48" r="1.8" opacity="0.95"/>
    <circle cx="312" cy="36" r="1.4" opacity="0.8"/>
    <circle cx="358" cy="82" r="1.9" opacity="0.9"/>
    <circle cx="372" cy="170" r="1.2" opacity="0.6"/>
    <circle cx="28" cy="190" r="1.3" opacity="0.7"/>
    <circle cx="66" cy="330" r="1.7" opacity="0.85"/>
    <circle cx="130" cy="372" r="1.1" opacity="0.6"/>
    <circle cx="282" cy="360" r="1.6" opacity="0.9"/>
    <circle cx="346" cy="300" r="1.2" opacity="0.7"/>
    <circle cx="232" cy="22" r="1" opacity="0.6"/>
  </g>

  <!-- soft dream glow -->
  <circle cx="200" cy="200" r="120" fill="url(#core)" filter="url(#soft)"/>
  <circle cx="200" cy="200" r="58" fill="url(#core)" opacity="0.85"/>

  <!-- concentric drifting rings -->
  <g fill="none" stroke="#e8d9ff" stroke-width="1">
    <circle cx="200" cy="200" r="90" opacity="0.25" stroke-dasharray="2 10"/>
    <circle cx="200" cy="200" r="140" opacity="0.15" stroke-dasharray="1 14"/>
    <circle cx="200" cy="200" r="182" opacity="0.1"/>
  </g>

  <!-- flowing ribbons -->
  <g fill="none" stroke="url(#ribbon)" stroke-linecap="round" filter="url(#glow)">
    <path d="M200 200 C120 150 80 240 150 290 S300 300 320 220 S260 90 180 110 S110 170 140 200" stroke-width="3" opacity="0.85"/>
    <path d="M200 200 C270 250 320 170 290 120 S150 110 120 170 S170 300 240 280" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- floating dream bubbles -->
  <g fill="none" stroke="#ffffff">
    <circle cx="96" cy="120" r="14" opacity="0.3"/>
    <circle cx="308" cy="262" r="20" opacity="0.25"/>
    <circle cx="324" cy="110" r="8" opacity="0.35"/>
    <circle cx="78" cy="268" r="10" opacity="0.3"/>
    <circle cx="250" cy="332" r="12" opacity="0.25"/>
  </g>
  <g fill="#ffd6f0" opacity="0.5">
    <circle cx="96" cy="120" r="2"/>
    <circle cx="308" cy="262" r="3"/>
    <circle cx="324" cy="110" r="1.5"/>
  </g>

  <!-- ascending ladder of light toward the glow -->
  <g stroke="#fff3c4" stroke-width="1.6" stroke-linecap="round" opacity="0.55" filter="url(#glow)">
    <line x1="168" y1="380" x2="190" y2="330"/>
    <line x1="176" y1="366" x2="200" y2="366"/>
    <line x1="182" y1="352" x2="206" y2="352"/>
    <line x1="190" y1="338" x2="214" y2="338"/>
    <line x1="168" y1="380" x2="176" y2="366"/>
    <line x1="190" y1="330" x2="198" y2="316"/>
  </g>

  <!-- central core highlight -->
  <circle cx="186" cy="186" r="12" fill="#ffffff" opacity="0.8" filter="url(#glow)"/>
</svg>