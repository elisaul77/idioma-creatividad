<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1040"/>
      <stop offset="1" stop-color="#2d1d5e"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff8d6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Anga la usiku -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- Nyota -->
  <g fill="#fff8d6">
    <circle cx="45" cy="190" r="2"/>
    <circle cx="150" cy="40" r="2"/>
    <circle cx="200" cy="90" r="1.5"/>
    <circle cx="260" cy="30" r="2"/>
    <circle cx="370" cy="150" r="2"/>
    <circle cx="175" cy="150" r="1.5"/>
    <circle cx="20" cy="260" r="1.5"/>
    <circle cx="385" cy="220" r="1.5"/>
  </g>

  <!-- Mwezi -->
  <circle cx="330" cy="70" r="30" fill="#fff3b0"/>
  <circle cx="342" cy="60" r="27" fill="#1a1450"/>

  <!-- Dirisha -->
  <rect x="20" y="30" width="110" height="120" rx="4" fill="#1f2a6b" stroke="#6b5b95" stroke-width="6"/>
  <line x1="75" y1="30" x2="75" y2="150" stroke="#6b5b95" stroke-width="4"/>
  <line x1="20" y1="90" x2="130" y2="90" stroke="#6b5b95" stroke-width="4"/>

  <!-- Mwanga wa mwezi unaoingia -->
  <polygon points="20,150 130,150 230,320 60,320" fill="url(#beam)"/>

  <!-- Sakafu -->
  <rect x="0" y="320" width="400" height="80" fill="#3b2a4a"/>
  <line x1="0" y1="340" x2="400" y2="340" stroke="#4d3a5e" stroke-width="2"/>
  <line x1="0" y1="365" x2="400" y2="365" stroke="#4d3a5e" stroke-width="2"/>

  <!-- Dubu -->
  <g>
    <ellipse cx="90" cy="290" rx="30" ry="34" fill="#c98b4f"/>
    <ellipse cx="90" cy="298" rx="16" ry="20" fill="#e8b27a"/>
    <ellipse cx="62" cy="285" rx="9" ry="16" fill="#b8763c" transform="rotate(20 62 285)"/>
    <ellipse cx="118" cy="285" rx="9" ry="16" fill="#b8763c" transform="rotate(-20 118 285)"/>
    <circle cx="90" cy="232" r="24" fill="#c98b4f"/>
    <circle cx="71" cy="212" r="9" fill="#b8763c"/>
    <circle cx="109" cy="212" r="9" fill="#b8763c"/>
    <ellipse cx="90" cy="240" rx="10" ry="7" fill="#e8b27a"/>
    <circle cx="82" cy="228" r="2.5" fill="#2a1a10"/>
    <circle cx="98" cy="228" r="2.5" fill="#2a1a10"/>
    <circle cx="90" cy="237" r="2" fill="#2a1a10"/>
  </g>

  <!-- Roboti -->
  <g>
    <line x1="200" y1="200" x2="200" y2="186" stroke="#c0c8d8" stroke-width="3"/>
    <circle cx="200" cy="184" r="4" fill="#ff6b6b"/>
    <rect x="185" y="200" width="30" height="28" rx="5" fill="#9fe6f5"/>
    <circle cx="193" cy="212" r="4" fill="#ffd23f"/>
    <circle cx="207" cy="212" r="4" fill="#ffd23f"/>
    <rect x="178" y="232" width="44" height="54" rx="6" fill="#7fd3e8"/>
    <rect x="193" y="244" width="14" height="10" rx="2" fill="#4a6fa5"/>
    <rect x="166" y="236" width="10" height="34" rx="4" fill="#5fb8d0"/>
    <rect x="224" y="236" width="10" height="34" rx="4" fill="#5fb8d0"/>
    <rect x="186" y="286" width="12" height="30" rx="3" fill="#4a6fa5"/>
    <rect x="202" y="286" width="12" height="30" rx="3" fill="#4a6fa5"/>
  </g>

  <!-- Mpira unaodunda -->
  <g>
    <line x1="140" y1="120" x2="140" y2="150" stroke="#fff8d6" stroke-width="2" stroke-dasharray="4 4" opacity="0.5"/>
    <line x1="150" y1="130" x2="150" y2="155" stroke="#fff8d6" stroke-width="2" stroke-dasharray="4 4" opacity="0.3"/>
    <circle cx="150" cy="170" r="12" fill="#ffd23f"/>
    <path d="M140 170 Q150 162 160 170" stroke="#e0a800" stroke-width="2" fill="none"/>
  </g>

  <!-- Farasi wa mbao -->
  <g>
    <path d="M300 330 Q330 350 360 330" stroke="#8b5a2b" stroke-width="5" fill="none" stroke-linecap="round"/>
    <line x1="315" y1="300" x2="315" y2="330" stroke="#8b5a2b" stroke-width="4"/>
    <line x1="345" y1="300" x2="345" y2="330" stroke="#8b5a2b" stroke-width="4"/>
    <ellipse cx="330" cy="275" rx="36" ry="18" fill="#e0533d"/>
    <path d="M356 268 L372 240 Q380 232 388 240 L382 262 Z" fill="#e0533d"/>
    <ellipse cx="386" cy="238" rx="9" ry="7" fill="#e0533d"/>
    <circle cx="390" cy="236" r="2" fill="#2a1a10"/>
    <path d="M364 240 L372 226 L378 240 Z" fill="#8b5a2b"/>
    <path d="M300 272 L292 300 M312 272 L306 300" stroke="#e0533d" stroke-width="5" stroke-linecap="round"/>
    <path d="M338 290 L334 306 M350 290 L348 306" stroke="#e0533d" stroke-width="5" stroke-linecap="round"/>
    <circle cx="330" cy="268" r="3" fill="#ffd23f"/>
  </g>

  <!-- Nyota zinazocheza karibu na vinyago -->
  <g fill="#ffd23f">
    <path d="M120 200 l2 5 5 1 -4 3 1 5 -4 -3 -4 3 1 -5 -4 -3 5 -1 z"/>
    <path d="M250 180 l2 5 5 1 -4 3 1 5 -4 -3 -4 3 1 -5 -4 -3 5 -1 z"/>
    <path d="M230 300 l1.5 4 4 1 -3 2.5 1 4 -3.5 -2.5 -3.5 2.5 1 -4 -3 -2.5 4 -1 z"/>
  </g>
</svg>