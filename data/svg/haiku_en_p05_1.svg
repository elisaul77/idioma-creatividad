<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="space" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#1a1f3a"/>
      <stop offset="1" stop-color="#05060d"/>
    </radialGradient>
    <clipPath id="earth">
      <circle cx="200" cy="200" r="170"/>
    </clipPath>
    <radialGradient id="mantle" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e0622f"/>
      <stop offset="1" stop-color="#7a2312"/>
    </radialGradient>
    <radialGradient id="outer" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff9a2a"/>
      <stop offset="1" stop-color="#c83a00"/>
    </radialGradient>
    <radialGradient id="inner" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6a0"/>
      <stop offset="0.6" stop-color="#ffb020"/>
      <stop offset="1" stop-color="#ff6a00"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fdfff" stop-opacity="0"/>
      <stop offset="1" stop-color="#7fdfff" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a94a8"/>
      <stop offset="0.5" stop-color="#e6ecf5"/>
      <stop offset="1" stop-color="#8a94a8"/>
    </linearGradient>
    <radialGradient id="flame" cx="50%" cy="100%" r="100%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff4500" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Space background -->
  <rect width="400" height="400" fill="url(#space)"/>
  <g fill="#ffffff">
    <circle cx="40" cy="50" r="1.2"/>
    <circle cx="352" cy="62" r="1"/>
    <circle cx="326" cy="28" r="1.4"/>
    <circle cx="28" cy="332" r="1"/>
    <circle cx="372" cy="338" r="1.3"/>
    <circle cx="20" cy="200" r="1"/>
    <circle cx="380" cy="196" r="1.1"/>
    <circle cx="90" cy="372" r="1"/>
    <circle cx="300" cy="380" r="1.2"/>
    <circle cx="70" cy="110" r="0.9"/>
  </g>

  <!-- Atmosphere halo -->
  <circle cx="200" cy="200" r="177" fill="none" stroke="#7fdfff" stroke-width="6" opacity="0.18" filter="url(#blur)"/>

  <!-- Earth cross-section -->
  <g clip-path="url(#earth)">
    <circle cx="200" cy="200" r="170" fill="#6b4a2e"/>
    <circle cx="200" cy="200" r="158" fill="url(#mantle)"/>
    <circle cx="200" cy="200" r="95" fill="url(#outer)"/>
    <circle cx="200" cy="200" r="50" fill="url(#inner)"/>

    <!-- Bore tunnel from the surface to the pod -->
    <rect x="191" y="26" width="18" height="142" fill="#05070f" opacity="0.92"/>
    <rect x="198" y="26" width="4" height="150" fill="url(#trail)"/>
  </g>

  <!-- Surface rim -->
  <circle cx="200" cy="200" r="170" fill="none" stroke="#9fd8ff" stroke-width="2" opacity="0.6"/>

  <!-- Pod thruster flame (exhaust points up, pod descends) -->
  <path d="M195 146 Q200 124 205 146 Z" fill="url(#flame)" filter="url(#blur)"/>

  <!-- Vehicle -->
  <g>
    <!-- Body -->
    <ellipse cx="200" cy="165" rx="11" ry="19" fill="url(#hull)" stroke="#5b6780" stroke-width="1.5"/>
    <!-- Cockpit window -->
    <circle cx="200" cy="157" r="4" fill="#7fdfff"/>
    <circle cx="199" cy="156" r="1.3" fill="#ffffff"/>
    <!-- Side fins -->
    <path d="M189 168 L182 178 L190 178 Z" fill="#5b6780"/>
    <path d="M211 168 L218 178 L210 178 Z" fill="#5b6780"/>
    <!-- Drill nose heading toward the core -->
    <path d="M190 181 L210 181 L200 200 Z" fill="#8a94a8" stroke="#5b6780" stroke-width="1"/>
    <path d="M195 186 L205 186 L200 196 Z" fill="#c9d3e0"/>
  </g>

  <!-- Subtle glow around the pod -->
  <circle cx="200" cy="170" r="22" fill="#7fdfff" opacity="0.12" filter="url(#blur)"/>
</svg>