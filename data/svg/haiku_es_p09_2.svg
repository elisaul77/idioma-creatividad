<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2456"/>
      <stop offset="0.55" stop-color="#7a4f9a"/>
      <stop offset="1" stop-color="#f2a65a"/>
    </linearGradient>
    <linearGradient id="suelo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b4526"/>
      <stop offset="1" stop-color="#3b2415"/>
    </linearGradient>
    <pattern id="panal" width="20" height="16" patternUnits="userSpaceOnUse">
      <path d="M5 0 L15 0 L20 8 L15 16 L5 16 L0 8 Z" fill="none" stroke="#7a4f22" stroke-width="1.2"/>
    </pattern>
    <clipPath id="torreB">
      <path d="M140 300 L160 120 Q170 80 200 80 Q230 80 240 120 L260 300 Z"/>
    </clipPath>
    <g id="abeja">
      <ellipse cx="-2" cy="-9" rx="7" ry="4" fill="#e8f6ff" opacity="0.8"/>
      <ellipse cx="3" cy="-8" rx="6" ry="3.5" fill="#e8f6ff" opacity="0.8"/>
      <ellipse cx="0" cy="0" rx="10" ry="6" fill="#ffc52e" stroke="#3a2a00" stroke-width="1"/>
      <rect x="-5" y="-6" width="3" height="12" fill="#2a1d05"/>
      <rect x="0" y="-6" width="3" height="12" fill="#2a1d05"/>
      <circle cx="10" cy="-1" r="3.5" fill="#2a1d05"/>
      <path d="M-10 0 L-15 -1 L-10 2 Z" fill="#2a1d05"/>
    </g>
    <g id="hormiga">
      <circle cx="-6" cy="0" r="4" fill="#1c1410"/>
      <circle cx="0" cy="0" r="2.8" fill="#1c1410"/>
      <circle cx="6" cy="0" r="3" fill="#1c1410"/>
      <path d="M-6 3 L-10 7 M0 3 L-2 7 M6 3 L9 7 M-6 -3 L-10 -7 M0 -3 L-2 -7 M6 -3 L9 -7" stroke="#1c1410" stroke-width="1" fill="none"/>
    </g>
  </defs>

  <!-- Cielo -->
  <rect width="400" height="400" fill="url(#cielo)"/>

  <!-- Sol y estrellas -->
  <circle cx="300" cy="110" r="38" fill="#ffe19a" opacity="0.9"/>
  <circle cx="300" cy="110" r="52" fill="#ffe19a" opacity="0.15"/>
  <circle cx="60" cy="50" r="1.5" fill="#fff"/>
  <circle cx="120" cy="30" r="1.2" fill="#fff"/>
  <circle cx="200" cy="45" r="1.5" fill="#fff"/>
  <circle cx="370" cy="40" r="1.3" fill="#fff"/>
  <circle cx="30" cy="130" r="1.2" fill="#fff"/>

  <!-- Torres hechas de barro -->
  <path d="M40 300 L60 180 Q70 150 90 150 L120 150 Q140 150 150 180 L170 300 Z" fill="#c8a06a"/>
  <path d="M250 300 L268 190 Q275 165 300 165 L330 165 Q352 165 360 195 L372 300 Z" fill="#b98a55"/>
  <path d="M330 300 L340 240 Q345 225 360 225 L380 225 Q392 225 396 240 L400 300 Z" fill="#a8793f"/>

  <path d="M140 300 L160 120 Q170 80 200 80 Q230 80 240 120 L260 300 Z" fill="#d9b27a"/>
  <rect x="140" y="80" width="100" height="220" fill="url(#panal)" clip-path="url(#torreB)"/>

  <!-- Ventanas-celdas -->
  <g fill="#3a2214">
    <circle cx="60" cy="200" r="5"/>
    <circle cx="80" cy="200" r="5"/>
    <circle cx="105" cy="200" r="5"/>
    <circle cx="130" cy="200" r="5"/>
    <circle cx="70" cy="235" r="5"/>
    <circle cx="95" cy="235" r="5"/>
    <circle cx="120" cy="235" r="5"/>
    <circle cx="280" cy="210" r="5"/>
    <circle cx="305" cy="210" r="5"/>
    <circle cx="330" cy="210" r="5"/>
    <circle cx="290" cy="245" r="5"/>
    <circle cx="318" cy="245" r="5"/>
    <circle cx="345" cy="245" r="5"/>
    <circle cx="352" cy="270" r="4"/>
    <circle cx="355" cy="170" r="0"/>
    <circle cx="350" cy="260" r="0"/>
    <circle cx="365" cy="262" r="4"/>
    <circle cx="346" cy="250" r="0"/>
    <circle cx="362" cy="268" r="0"/>
    <circle cx="354" cy="236" r="0"/>
    <circle cx="200" cy="130" r="4"/>
    <circle cx="200" cy="155" r="4"/>
    <circle cx="200" cy="180" r="4"/>
    <circle cx="200" cy="205" r="4"/>
  </g>

  <!-- Suelo y hierba -->
  <rect x="0" y="300" width="400" height="100" fill="url(#suelo)"/>
  <path d="M0 300 Q20 292 40 300 Q60 288 80 300 Q100 292 120 300 Q140 288 160 300 Q180 292 200 300 Q220 288 240 300 Q260 292 280 300 Q300 288 320 300 Q340 292 360 300 Q380 288 400 300 L400 306 L0 306 Z" fill="#4f7a2e"/>
  <path d="M30 300 L33 282 L36 300 M180 300 L184 278 L188 300 M300 300 L303 284 L306 300" stroke="#3d6122" stroke-width="2" fill="none"/>

  <!-- Hormigas en línea -->
  <use href="#hormiga" transform="translate(20 318) scale(1)"/>
  <use href="#hormiga" transform="translate(50 322) scale(1)"/>
  <use href="#hormiga" transform="translate(82 319) scale(1)"/>
  <use href="#hormiga" transform="translate(115 324) scale(1)"/>
  <use href="#hormiga" transform="translate(150 320) scale(1)"/>
  <use href="#hormiga" transform="translate(220 326) scale(1)"/>
  <use href="#hormiga" transform="translate(255 321) scale(1)"/>
  <use href="#hormiga" transform="translate(290 325) scale(1)"/>
  <use href="#hormiga" transform="translate(330 320) scale(1)"/>
  <use href="#hormiga" transform="translate(370 324) scale(1)"/>

  <!-- Abejas volando alrededor de la ciudad -->
  <use href="#abeja" transform="translate(110 90) scale(1.2) rotate(-12)"/>
  <use href="#abeja" transform="translate(70 160) scale(0.8) rotate(8)"/>
  <use href="#abeja" transform="translate(220 50) scale(0.9) rotate(-5)"/>
  <use href="#abeja" transform="translate(370 170) scale(0.7) rotate(10)"/>
  <use href="#abeja" transform="translate(190 260) scale(0.6) rotate(-8)"/>

  <!-- Estela de vuelo -->
  <path d="M95 96 Q75 110 60 120" stroke="#ffe19a" stroke-width="1" fill="none" stroke-dasharray="3 4" opacity="0.6"/>
  <path d="M205 56 Q225 70 240 80" stroke="#ffe19a" stroke-width="1" fill="none" stroke-dasharray="3 4" opacity="0.6"/>
</svg>