<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3f4"/>
      <stop offset="1" stop-color="#ffe6c7"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb3c7"/>
      <stop offset="1" stop-color="#ff8fab"/>
    </linearGradient>
    <linearGradient id="monster" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a7e8a1"/>
      <stop offset="1" stop-color="#6fcf97"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="330" cy="70" r="90" fill="#fff3b0" opacity="0.7"/>
  <circle cx="330" cy="70" r="45" fill="#ffe066"/>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="80" cy="70" rx="40" ry="16"/>
    <ellipse cx="105" cy="60" rx="28" ry="20"/>
    <ellipse cx="62" cy="62" rx="22" ry="14"/>
    <ellipse cx="250" cy="130" rx="34" ry="13"/>
    <ellipse cx="270" cy="122" rx="22" ry="16"/>
  </g>

  <!-- Ground -->
  <ellipse cx="200" cy="370" rx="200" ry="40" fill="#9be38a"/>
  <rect x="0" y="345" width="400" height="55" fill="#9be38a"/>

  <!-- Chimney -->
  <rect x="265" y="95" width="30" height="62" rx="4" fill="#c49a8a"/>
  <rect x="260" y="88" width="40" height="12" rx="4" fill="#a57c6c"/>
  <!-- Chimney smoke puffs (cute monster breath) -->
  <g fill="#ffffff" opacity="0.85">
    <circle cx="280" cy="72" r="10"/>
    <circle cx="293" cy="58" r="13"/>
    <circle cx="310" cy="44" r="9"/>
  </g>

  <!-- House body -->
  <rect x="100" y="180" width="200" height="170" rx="10" fill="url(#wall)"/>

  <!-- Roof -->
  <polygon points="85,190 200,100 315,190" fill="#7b68ee"/>
  <polygon points="200,100 315,190 200,190" fill="#6a5acd" opacity="0.5"/>
  <circle cx="200" cy="150" r="14" fill="#fff3b0" stroke="#7b68ee" stroke-width="5"/>

  <!-- Door (arched) -->
  <path d="M170 350 L170 290 Q170 262 200 262 Q230 262 230 290 L230 350 Z" fill="#8b5e3c"/>
  <path d="M176 350 L176 292 Q176 270 200 270 Q224 270 224 292 L224 350 Z" fill="#a9744f"/>
  <circle cx="218" cy="318" r="4" fill="#ffe066"/>

  <!-- Windows -->
  <rect x="122" y="212" width="36" height="36" rx="8" fill="#d6f5ff" stroke="#ffffff" stroke-width="5"/>
  <line x1="140" y1="212" x2="140" y2="248" stroke="#ffffff" stroke-width="3"/>
  <line x1="122" y1="230" x2="158" y2="230" stroke="#ffffff" stroke-width="3"/>
  <rect x="242" y="212" width="36" height="36" rx="8" fill="#d6f5ff" stroke="#ffffff" stroke-width="5"/>
  <line x1="260" y1="212" x2="260" y2="248" stroke="#ffffff" stroke-width="3"/>
  <line x1="242" y1="230" x2="278" y2="230" stroke="#ffffff" stroke-width="3"/>

  <!-- Friendly monster peeking from the top window area -->
  <g>
    <!-- Little horns -->
    <path d="M186 228 Q182 210 190 202 Q194 214 196 226 Z" fill="#ffd166"/>
    <path d="M214 228 Q218 210 210 202 Q206 214 204 226 Z" fill="#ffd166"/>
    <!-- Body -->
    <ellipse cx="200" cy="246" rx="22" ry="20" fill="url(#monster)"/>
    <!-- Fuzzy bumps -->
    <circle cx="182" cy="250" r="5" fill="#6fcf97"/>
    <circle cx="218" cy="250" r="5" fill="#6fcf97"/>
    <circle cx="190" cy="262" r="5" fill="#6fcf97"/>
    <circle cx="210" cy="262" r="5" fill="#6fcf97"/>
    <!-- Big sparkly eyes -->
    <circle cx="192" cy="240" r="6" fill="#ffffff"/>
    <circle cx="208" cy="240" r="6" fill="#ffffff"/>
    <circle cx="193" cy="241" r="3.5" fill="#333355"/>
    <circle cx="209" cy="241" r="3.5" fill="#333355"/>
    <circle cx="194" cy="239" r="1.2" fill="#ffffff"/>
    <circle cx="210" cy="239" r="1.2" fill="#ffffff"/>
    <!-- Rosy cheeks -->
    <ellipse cx="184" cy="251" rx="4" ry="2.5" fill="#ff8fab" opacity="0.8"/>
    <ellipse cx="216" cy="251" rx="4" ry="2.5" fill="#ff8fab" opacity="0.8"/>
    <!-- Smile -->
    <path d="M193 252 Q200 259 207 252" fill="none" stroke="#333355" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Hands waving -->
    <ellipse cx="172" cy="258" rx="6" ry="5" fill="#6fcf97"/>
    <ellipse cx="228" cy="258" rx="6" ry="5" fill="#6fcf97"/>
  </g>

  <!-- Flower garden -->
  <g>
    <line x1="60" y1="350" x2="60" y2="310" stroke="#4caf50" stroke-width="3"/>
    <circle cx="60" cy="302" r="8" fill="#ff7eb6"/>
    <circle cx="60" cy="302" r="3" fill="#ffe066"/>
    <line x1="340" y1="352" x2="340" y2="318" stroke="#4caf50" stroke-width="3"/>
    <circle cx="340" cy="310" r="8" fill="#ffd166"/>
    <circle cx="340" cy="310" r="3" fill="#ff7eb6"/>
    <line x1="88" y1="362" x2="88" y2="338" stroke="#4caf50" stroke-width="3"/>
    <circle cx="88" cy="332" r="6" fill="#b388ff"/>
    <line x1="318" y1="366" x2="318" y2="344" stroke="#4caf50" stroke-width="3"/>
    <circle cx="318" cy="338" r="6" fill="#ff8fab"/>
  </g>

  <!-- Little stars -->
  <g fill="#ffffff">
    <path d="M40 180 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>
    <path d="M360 200 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z"/>
    <path d="M30 250 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/>
  </g>
</svg>