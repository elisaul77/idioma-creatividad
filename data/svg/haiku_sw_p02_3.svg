<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#1b0f3b"/>
      <stop offset="45%" stop-color="#5b2a86"/>
      <stop offset="75%" stop-color="#d9719b"/>
      <stop offset="100%" stop-color="#ffc49b"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0%" stop-color="#fff9e6"/>
      <stop offset="60%" stop-color="#ffe2a8"/>
      <stop offset="100%" stop-color="#f3b76b" stop-opacity="0.85"/>
    </radialGradient>
    <radialGradient id="orb1" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#8fe3ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8fe3ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ff9ad5" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff9ad5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7ef0e0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7ef0e0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#7ef0e0" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- nebula clouds -->
  <ellipse cx="110" cy="120" rx="120" ry="45" fill="#a58cff" opacity="0.25" filter="url(#softglow)"/>
  <ellipse cx="300" cy="200" rx="110" ry="50" fill="#ff8fb1" opacity="0.22" filter="url(#softglow)"/>
  <ellipse cx="200" cy="300" rx="150" ry="40" fill="#6fd6ff" opacity="0.18" filter="url(#softglow)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="48" cy="58" r="1.6" opacity="0.9"/>
    <circle cx="150" cy="34" r="1.1" opacity="0.7"/>
    <circle cx="232" cy="70" r="1.8" opacity="0.95"/>
    <circle cx="352" cy="45" r="1.3" opacity="0.8"/>
    <circle cx="370" cy="150" r="1" opacity="0.6"/>
    <circle cx="80" cy="170" r="1.2" opacity="0.7"/>
    <circle cx="190" cy="150" r="0.9" opacity="0.6"/>
    <circle cx="30" cy="250" r="1.4" opacity="0.75"/>
    <circle cx="335" cy="265" r="1.1" opacity="0.6"/>
  </g>

  <!-- crescent moon -->
  <circle cx="290" cy="110" r="46" fill="#ffd98a" opacity="0.35" filter="url(#softglow)"/>
  <circle cx="290" cy="110" r="36" fill="url(#moon)"/>
  <circle cx="306" cy="98" r="32" fill="#4a2475" opacity="0.92"/>

  <!-- floating dream orbs -->
  <circle cx="110" cy="210" r="34" fill="url(#orb1)"/>
  <circle cx="110" cy="210" r="12" fill="#ffffff" opacity="0.6" filter="url(#blur)"/>
  <circle cx="250" cy="230" r="26" fill="url(#orb2)"/>
  <circle cx="60" cy="130" r="16" fill="url(#orb2)"/>
  <circle cx="170" cy="90" r="10" fill="url(#orb1)"/>

  <!-- drifting wisps -->
  <path d="M-10 290 Q 60 250 120 290 T 250 290 T 410 280" fill="none" stroke="url(#wave)" stroke-width="10" stroke-linecap="round" filter="url(#blur)"/>
  <path d="M-10 320 Q 80 290 150 320 T 300 318 T 410 305" fill="none" stroke="url(#wave)" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  <path d="M-10 350 Q 90 330 170 352 T 330 348 T 410 340" fill="none" stroke="url(#wave)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- ripples reflecting the dream -->
  <ellipse cx="200" cy="380" rx="170" ry="8" fill="none" stroke="#ffd6f0" stroke-opacity="0.35" stroke-width="1.5"/>
  <ellipse cx="200" cy="380" rx="110" ry="5" fill="none" stroke="#ffd6f0" stroke-opacity="0.25" stroke-width="1"/>

  <!-- tiny sparkles -->
  <g fill="#ffffff" opacity="0.85">
    <path d="M220 170 l2 -7 l2 7 l7 2 l-7 2 l-2 7 l-2 -7 l-7 -2 z"/>
    <path d="M80 300 l1.5 -5 l1.5 5 l5 1.5 l-5 1.5 l-1.5 5 l-1.5 -5 l-5 -1.5 z" opacity="0.7"/>
  </g>
</svg>