<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0" stop-color="#1b1f3b"/>
      <stop offset="1" stop-color="#05060f"/>
    </radialGradient>
    <radialGradient id="mantle" cx="50%" cy="50%" r="50%">
      <stop offset="0.35" stop-color="#e0662a"/>
      <stop offset="1" stop-color="#8a2e12"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6c2"/>
      <stop offset="0.5" stop-color="#ffb833"/>
      <stop offset="1" stop-color="#ff6a00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7f8fa6"/>
      <stop offset="0.5" stop-color="#e8eef7"/>
      <stop offset="1" stop-color="#5a6a80"/>
    </linearGradient>
    <clipPath id="earthClip">
      <circle cx="200" cy="200" r="170"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="40" cy="40" r="1.5"/>
    <circle cx="360" cy="60" r="1.2"/>
    <circle cx="60" cy="350" r="1.5"/>
    <circle cx="350" cy="340" r="1.2"/>
    <circle cx="30" cy="200" r="1"/>
    <circle cx="372" cy="200" r="1.3"/>
    <circle cx="330" cy="120" r="1"/>
    <circle cx="70" cy="120" r="1.2"/>
    <circle cx="90" cy="280" r="1"/>
    <circle cx="315" cy="265" r="1.4"/>
  </g>

  <!-- Atmosphere glow -->
  <circle cx="200" cy="200" r="178" fill="none" stroke="#4a9eff" stroke-width="6" opacity="0.35"/>

  <!-- Earth cross-section -->
  <g clip-path="url(#earthClip)">
    <circle cx="200" cy="200" r="170" fill="#5a3418"/>
    <circle cx="200" cy="200" r="150" fill="url(#mantle)"/>
    <circle cx="200" cy="200" r="90" fill="#c8801e"/>
    <circle cx="200" cy="200" r="60" fill="#e89a2a" opacity="0.6"/>
    <circle cx="200" cy="200" r="50" fill="url(#core)"/>
  </g>
  <circle cx="200" cy="200" r="170" fill="none" stroke="#3b2a1a" stroke-width="4"/>

  <!-- Descent tunnel -->
  <rect x="192" y="40" width="16" height="160" fill="#07080f"/>

  <!-- Vehicle exhaust -->
  <path d="M193 140 L200 106 L207 140 Z" fill="#7ef9ff" opacity="0.9"/>
  <path d="M197 140 L200 122 L203 140 Z" fill="#ffffff"/>

  <!-- Vehicle fins -->
  <path d="M190 166 L180 182 L190 182 Z" fill="#e05a3a"/>
  <path d="M210 166 L220 182 L210 182 Z" fill="#e05a3a"/>

  <!-- Vehicle body -->
  <rect x="190" y="140" width="20" height="40" rx="6" fill="url(#hull)"/>
  <path d="M190 178 L200 198 L210 178 Z" fill="#cfd9e6"/>
  <circle cx="200" cy="152" r="4" fill="#1a3a5a"/>
  <circle cx="200" cy="152" r="2" fill="#7ef9ff"/>

  <!-- Heat glow around vehicle -->
  <circle cx="200" cy="190" r="14" fill="#ff8a3d" opacity="0.25"/>
</svg>