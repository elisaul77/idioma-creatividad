<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#faf7f0"/>
  <g fill="none" stroke="#2b2b2b" stroke-linecap="round" stroke-linejoin="round">
    <!-- staff lines, slightly wobbly like pencil -->
    <path d="M52 150 C120 148 200 152 350 149" stroke-width="1.6" opacity="0.8"/>
    <path d="M50 170 C130 172 210 168 352 171" stroke-width="1.6" opacity="0.8"/>
    <path d="M53 190 C125 188 215 192 348 189" stroke-width="1.6" opacity="0.8"/>
    <path d="M51 210 C140 212 205 208 351 211" stroke-width="1.6" opacity="0.8"/>
    <path d="M52 230 C130 228 220 232 349 229" stroke-width="1.6" opacity="0.8"/>

    <!-- first note head (sketched twice for a hand-drawn look) -->
    <ellipse cx="128" cy="236" rx="15" ry="10" transform="rotate(-22 128 236)" stroke-width="2.4"/>
    <ellipse cx="129" cy="235" rx="14" ry="9.5" transform="rotate(-18 129 235)" stroke-width="1" opacity="0.5"/>
    <path d="M141 232 C142 200 141 175 143 128" stroke-width="2.4"/>

    <!-- second note head -->
    <ellipse cx="212" cy="200" rx="15" ry="10" transform="rotate(-22 212 200)" stroke-width="2.4"/>
    <ellipse cx="213" cy="199" rx="14" ry="9.5" transform="rotate(-18 213 199)" stroke-width="1" opacity="0.5"/>
    <path d="M225 196 C226 170 225 145 227 102" stroke-width="2.4"/>

    <!-- beam connecting the stems -->
    <path d="M143 128 C170 124 200 110 227 102" stroke-width="3"/>
    <path d="M143 136 C170 132 200 118 227 110" stroke-width="1" opacity="0.5"/>

    <!-- pencil line rising from the notes into sound waves -->
    <path d="M250 180 C268 150 282 205 300 170 C314 144 326 190 344 160 C352 146 360 150 368 136"
          stroke-width="2" stroke-dasharray="2 3"/>

    <!-- loose sketch lines beneath, like shading -->
    <path d="M100 290 L300 282" stroke-width="0.8" opacity="0.35"/>
    <path d="M110 298 L290 292" stroke-width="0.8" opacity="0.25"/>
    <path d="M125 306 L270 302" stroke-width="0.8" opacity="0.18"/>

    <!-- pencil tip drawing the final curl -->
    <path d="M300 250 C330 240 350 262 332 276 C316 288 296 270 312 260 C322 254 336 264 340 280"
          stroke-width="2.2"/>
    <path d="M340 280 L362 306" stroke-width="5" stroke="#8a8a8a"/>
    <path d="M362 306 L368 318 L358 312 Z" fill="#2b2b2b" stroke-width="1"/>
  </g>
</svg>