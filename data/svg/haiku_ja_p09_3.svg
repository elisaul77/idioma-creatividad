<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9b0"/>
      <stop offset="0.55" stop-color="#f6a673"/>
      <stop offset="1" stop-color="#7a5aa6"/>
    </linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b5e3c"/>
      <stop offset="1" stop-color="#3f2619"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c26f34"/>
      <stop offset="0.5" stop-color="#eeb068"/>
      <stop offset="1" stop-color="#a95f2c"/>
    </linearGradient>
    <pattern id="hex" width="16" height="14" patternUnits="userSpaceOnUse">
      <path d="M8 0 L16 4.6 L16 9.4 L8 14 L0 9.4 L0 4.6 Z" fill="none" stroke="#fff3c4" stroke-opacity="0.55" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Sky -->
  <rect width="400" height="400" fill="url(#sky)"/>
  <circle cx="318" cy="88" r="34" fill="#fff6d0" opacity="0.9"/>
  <g fill="#fff3dc" opacity="0.6">
    <ellipse cx="80" cy="60" rx="34" ry="10"/>
    <ellipse cx="108" cy="54" rx="22" ry="9"/>
    <ellipse cx="240" cy="40" rx="28" ry="8"/>
  </g>

  <!-- Towers (termite-mound style with honeycomb facades) -->
  <g>
    <rect x="40" y="140" width="60" height="195" rx="10" fill="url(#tower)"/>
    <rect x="40" y="140" width="60" height="195" rx="10" fill="url(#hex)"/>
    <line x1="70" y1="140" x2="70" y2="110" stroke="#6b3b1f" stroke-width="3"/>
    <circle cx="70" cy="106" r="5" fill="#ffd45a"/>

    <rect x="110" y="100" width="50" height="235" rx="8" fill="url(#tower)"/>
    <rect x="110" y="100" width="50" height="235" rx="8" fill="url(#hex)"/>
    <rect x="128" y="78" width="14" height="24" rx="5" fill="#b56a31"/>

    <path d="M160 335 L160 170 Q200 78 240 170 L240 335 Z" fill="url(#tower)"/>
    <path d="M160 335 L160 170 Q200 78 240 170 L240 335 Z" fill="url(#hex)"/>
    <circle cx="200" cy="96" r="4" fill="#ffd45a"/>

    <rect x="260" y="120" width="55" height="215" rx="9" fill="url(#tower)"/>
    <rect x="260" y="120" width="55" height="215" rx="9" fill="url(#hex)"/>
    <line x1="288" y1="120" x2="288" y2="92" stroke="#6b3b1f" stroke-width="3"/>

    <rect x="325" y="190" width="50" height="145" rx="8" fill="url(#tower)"/>
    <rect x="325" y="190" width="50" height="145" rx="8" fill="url(#hex)"/>
  </g>

  <!-- Entrance holes -->
  <g fill="#2a1a10">
    <ellipse cx="70" cy="322" rx="9" ry="6"/>
    <ellipse cx="135" cy="322" rx="8" ry="6"/>
    <ellipse cx="200" cy="322" rx="11" ry="7"/>
    <ellipse cx="287" cy="322" rx="9" ry="6"/>
    <ellipse cx="350" cy="322" rx="8" ry="6"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="330" width="400" height="70" fill="url(#soil)"/>
  <path d="M0 356 Q200 340 400 360" stroke="#c99a6b" stroke-width="6" fill="none" stroke-linecap="round"/>
  <g stroke="#5f8f3a" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M10 332 Q14 318 8 306"/>
    <path d="M22 332 Q26 320 30 312"/>
    <path d="M375 332 Q380 318 372 308"/>
    <path d="M388 332 Q392 322 396 314"/>
    <path d="M250 332 Q254 320 248 310"/>
  </g>

  <!-- Bees -->
  <g transform="translate(150 58) rotate(-12)">
    <ellipse cx="-6" cy="-12" rx="9" ry="13" fill="#ffffff" opacity="0.7" transform="rotate(-25 -6 -12)"/>
    <ellipse cx="6" cy="-12" rx="9" ry="13" fill="#ffffff" opacity="0.55" transform="rotate(25 6 -12)"/>
    <ellipse cx="0" cy="0" rx="15" ry="10" fill="#ffc62b"/>
    <rect x="-6" y="-10" width="4" height="20" fill="#2a1a10"/>
    <rect x="2" y="-10" width="4" height="20" fill="#2a1a10"/>
    <circle cx="14" cy="-2" r="7" fill="#ffc62b"/>
    <circle cx="16" cy="-4" r="1.6" fill="#2a1a10"/>
    <path d="M14 -8 Q18 -18 24 -20 M18 -8 Q22 -16 30 -16" stroke="#2a1a10" stroke-width="1.5" fill="none"/>
  </g>
  <g transform="translate(300 40) rotate(10) scale(0.7)">
    <ellipse cx="-6" cy="-12" rx="9" ry="13" fill="#ffffff" opacity="0.7" transform="rotate(-25 -6 -12)"/>
    <ellipse cx="6" cy="-12" rx="9" ry="13" fill="#ffffff" opacity="0.55" transform="rotate(25 6 -12)"/>
    <ellipse cx="0" cy="0" rx="15" ry="10" fill="#ffc62b"/>
    <rect x="-6" y="-10" width="4" height="20" fill="#2a1a10"/>
    <rect x="2" y="-10" width="4" height="20" fill="#2a1a10"/>
    <circle cx="14" cy="-2" r="7" fill="#ffc62b"/>
  </g>

  <!-- Ants carrying a leaf -->
  <g fill="#2a1a10" stroke="#2a1a10" stroke-width="1.5">
    <ellipse cx="150" cy="350" rx="16" ry="7" fill="#6fbf4a" stroke="#3f7d2a" transform="rotate(-10 150 350)"/>
    <g transform="translate(118 364)">
      <line x1="-6" y1="0" x2="-14" y2="-6"/><line x1="-6" y1="2" x2="-14" y2="6"/>
      <line x1="2" y1="0" x2="-4" y2="-7"/><line x1="2" y1="2" x2="-4" y2="7"/>
      <circle cx="-10" cy="0" r="6" stroke="none"/>
      <circle cx="0" cy="0" r="4" stroke="none"/>
      <circle cx="8" cy="0" r="4" stroke="none"/>
    </g>
    <g transform="translate(180 372) scale(0.9)">
      <line x1="-6" y1="0" x2="-14" y2="-6"/><line x1="-6" y1="2" x2="-14" y2="6"/>
      <line x1="2" y1="0" x2="-4" y2="-7"/><line x1="2" y1="2" x2="-4" y2="7"/>
      <circle cx="-10" cy="0" r="6" stroke="none"/>
      <circle cx="0" cy="0" r="4" stroke="none"/>
      <circle cx="8" cy="0" r="4" stroke="none"/>
    </g>
    <g transform="translate(88 376) scale(0.8)">
      <line x1="-6" y1="0" x2="-14" y2="-6"/><line x1="-6" y1="2" x2="-14" y2="6"/>
      <line x1="2" y1="0" x2="-4" y2="-7"/><line x1="2" y1="2" x2="-4" y2="7"/>
      <circle cx="-10" cy="0" r="6" stroke="none"/>
      <circle cx="0" cy="0" r="4" stroke="none"/>
      <circle cx="8" cy="0" r="4" stroke="none"/>
    </g>
  </g>
</svg>