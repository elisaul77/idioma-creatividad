<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b1f"/>
      <stop offset="0.6" stop-color="#12093a"/>
      <stop offset="1" stop-color="#1f0b45"/>
    </linearGradient>
    <linearGradient id="trunk" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#b388ff"/>
    </linearGradient>
    <linearGradient id="branch" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#40c4ff"/>
      <stop offset="1" stop-color="#69f0ae"/>
    </linearGradient>
    <radialGradient id="canopy" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e0fcff" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#40c4ff" stop-opacity="0.55"/>
      <stop offset="0.75" stop-color="#7c4dff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#7c4dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ground" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#b3e5fc" stop-opacity="0.2"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <polygon id="hex" points="0,-10 8.66,-5 8.66,5 0,10 -8.66,5 -8.66,-5"/>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="30" cy="40" r="1.2" opacity="0.8"/>
    <circle cx="90" cy="25" r="0.9" opacity="0.6"/>
    <circle cx="160" cy="15" r="1" opacity="0.7"/>
    <circle cx="370" cy="25" r="1.2" opacity="0.8"/>
    <circle cx="260" cy="30" r="0.8" opacity="0.5"/>
    <circle cx="20" cy="180" r="0.9" opacity="0.5"/>
    <circle cx="385" cy="190" r="1" opacity="0.6"/>
    <circle cx="380" cy="300" r="0.8" opacity="0.5"/>
    <circle cx="55" cy="290" r="0.7" opacity="0.4"/>
    <circle cx="210" cy="10" r="0.8" opacity="0.6"/>
  </g>

  <!-- Moon -->
  <circle cx="335" cy="70" r="34" fill="#00e5ff" opacity="0.15" filter="url(#blur)"/>
  <circle cx="335" cy="70" r="22" fill="url(#moon)"/>

  <!-- Ground glow and ring -->
  <ellipse cx="200" cy="352" rx="160" ry="26" fill="url(#ground)"/>
  <ellipse cx="200" cy="352" rx="110" ry="14" fill="none" stroke="#00e5ff" stroke-opacity="0.6" stroke-width="1.5" filter="url(#glow)"/>

  <!-- Canopy aura -->
  <g filter="url(#blur)">
    <circle cx="120" cy="150" r="60" fill="#40c4ff" opacity="0.35"/>
    <circle cx="285" cy="145" r="60" fill="#7c4dff" opacity="0.35"/>
    <circle cx="200" cy="90" r="70" fill="#00e5ff" opacity="0.35"/>
  </g>

  <!-- Canopy clusters -->
  <circle cx="120" cy="150" r="55" fill="url(#canopy)"/>
  <circle cx="285" cy="145" r="55" fill="url(#canopy)"/>
  <circle cx="200" cy="90" r="62" fill="url(#canopy)"/>
  <circle cx="150" cy="100" r="42" fill="url(#canopy)" opacity="0.8"/>
  <circle cx="260" cy="100" r="42" fill="url(#canopy)" opacity="0.8"/>

  <!-- Roots -->
  <g fill="none" stroke="#00e5ff" stroke-width="2" stroke-linecap="round" opacity="0.6" filter="url(#glow)">
    <path d="M200 350 C185 355 170 360 150 362"/>
    <path d="M200 350 C215 355 230 360 250 362"/>
  </g>

  <!-- Trunk -->
  <path d="M200 350 C198 310 204 280 200 240 C196 205 200 180 200 150"
        fill="none" stroke="url(#trunk)" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Branches -->
  <g fill="none" stroke="url(#branch)" stroke-linecap="round" filter="url(#glow)">
    <path d="M200 230 C180 210 150 200 120 170" stroke-width="7"/>
    <path d="M200 220 C225 200 255 190 285 160" stroke-width="7"/>
    <path d="M200 190 C185 170 170 150 150 120" stroke-width="5"/>
    <path d="M200 175 C215 150 235 135 260 115" stroke-width="5"/>
    <path d="M200 160 C195 140 200 120 200 90" stroke-width="5"/>
    <path d="M120 170 C105 160 95 152 90 150" stroke-width="3"/>
    <path d="M285 160 C300 150 308 144 315 140" stroke-width="3"/>
    <path d="M150 120 C138 110 130 102 125 100" stroke-width="3"/>
    <path d="M260 115 C275 105 283 98 290 95" stroke-width="3"/>
  </g>

  <!-- Network lines in canopy -->
  <g stroke="#69f0ae" stroke-opacity="0.4" stroke-width="0.8" fill="none">
    <path d="M90 150 L120 120 L150 95 L200 60 L250 80 L285 110 L315 140"/>
    <path d="M120 120 L170 140 L200 110 L230 130 L260 155 L285 110"/>
    <path d="M150 95 L200 110 L250 80"/>
    <path d="M140 170 L170 140 L260 155 L315 140"/>
    <path d="M125 190 L140 170 L120 120"/>
  </g>

  <!-- Hexagon nodes -->
  <g fill="none" stroke="#00e5ff" stroke-width="1" filter="url(#glow)">
    <use href="#hex" x="120" y="130" opacity="0.7"/>
    <use href="#hex" x="180" y="120" opacity="0.5"/>
    <use href="#hex" x="230" y="115" opacity="0.6"/>
    <use href="#hex" x="270" y="150" opacity="0.5"/>
    <use href="#hex" x="150" y="170" opacity="0.6"/>
    <use href="#hex" x="200" y="70" opacity="0.7"/>
    <use href="#hex" x="250" y="75" opacity="0.5"/>
    <use href="#hex" x="95" y="160" opacity="0.4"/>
  </g>

  <!-- Network nodes -->
  <g fill="#e0fcff" filter="url(#glow)">
    <circle cx="90" cy="150" r="2.5"/>
    <circle cx="120" cy="120" r="3"/>
    <circle cx="150" cy="95" r="3"/>
    <circle cx="200" cy="60" r="3.5"/>
    <circle cx="250" cy="80" r="3"/>
    <circle cx="285" cy="110" r="3"/>
    <circle cx="315" cy="140" r="2.5"/>
    <circle cx="170" cy="140" r="2"/>
    <circle cx="200" cy="110" r="2.5"/>
    <circle cx="230" cy="130" r="2"/>
    <circle cx="260" cy="155" r="2.5"/>
    <circle cx="140" cy="170" r="2"/>
    <circle cx="125" cy="190" r="2"/>
  </g>

  <!-- Floating light orbs -->
  <g fill="#7fffd4" filter="url(#glow)">
    <circle cx="60" cy="250" r="4" opacity="0.8"/>
    <circle cx="340" cy="260" r="5" opacity="0.8"/>
    <circle cx="70" cy="120" r="3" opacity="0.6"/>
    <circle cx="330" cy="60" r="3" opacity="0.6"/>
    <circle cx="40" cy="320" r="2" opacity="0.5"/>
    <circle cx="360" cy="330" r="3" opacity="0.6"/>
    <circle cx="250" cy="250" r="3" opacity="0.7"/>
    <circle cx="150" cy="300" r="2.5" opacity="0.6"/>
    <circle cx="300" cy="210" r="2" opacity="0.5"/>
  </g>
</svg>