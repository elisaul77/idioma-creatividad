  <path d="M 150 200 Q 120 160 130 120 M 150 200 Q 130 150 110 30"
        fill="none" stroke="#1b2a4a" stroke-width="1.5" opacity="0.5"/>

  <!-- Beine -->
  <g stroke="#e76f51" stroke-width="14" stroke-linecap="round">
    <line x1="140" y1="290" x2="135" y2="355"/>
    <line x1="165" y1="298" x2="165" y2="360"/>
    <line x1="215" y1="298" x2="220" y2="360"/>
    <line x1="245" y1="290" x2="252" y2="352"/>
  </g>
  <g fill="#8c3b2a">
    <ellipse cx="135" cy="358" rx="10" ry="5"/>
    <ellipse cx="165" cy="363" rx="10" ry="5"/>
    <ellipse cx="220" cy="363" rx="10" ry="5"/>
    <ellipse cx="252" cy="355" rx="10" ry="5"/>
  </g>

  <!-- Schwanz als Spirale mit Blatt -->
  <path d="M 285 250 Q 340 240 330 200 Q 322 180 345 175"
        fill="none" stroke="#e09150" stroke-width="12" stroke-linecap="round"/>
  <path d="M 345 175 Q 360 160 372 172 Q 358 186 345 175 Z" fill="#ffd166"/>

  <!-- Körper -->
  <ellipse cx="190" cy="245" rx="90" ry="60" fill="url(#koerper)"/>
  <ellipse cx="190" cy="268" rx="50" ry="14" fill="#ffd166" opacity="0.5"/>
  <g fill="#e76f51" opacity="0.6">
    <circle cx="160" cy="230" r="7"/>
    <circle cx="195" cy="215" r="5"/>
    <circle cx="215" cy="250" r="9"/>
    <circle cx="180" cy="265" r="6"/>
    <circle cx="240" cy="228" r="4"/>
  </g>

  <!-- Hals -->
  <path d="M 245 215 Q 275 190 262 140" fill="none" stroke="#e09150" stroke-width="34" stroke-linecap="round"/>

  <!-- Korallen-Geweih -->
  <path d="M 262 92 Q 258 70 272 56 M 268 74 L 282 68 M 264 82 L 252 74"
