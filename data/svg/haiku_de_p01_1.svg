<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="himmel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a4a"/>
      <stop offset="1" stop-color="#3d5a80"/>
    </linearGradient>
    <linearGradient id="koerper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7b977"/>
      <stop offset="1" stop-color="#e09150"/>
    </linearGradient>
  </defs>

  <!-- Hintergrund -->
  <rect width="400" height="400" fill="url(#himmel)"/>
  <g fill="#ffffff" opacity="0.8">
    <circle cx="48" cy="46" r="2"/>
    <circle cx="350" cy="60" r="2.5"/>
    <circle cx="320" cy="340" r="1.8"/>
    <circle cx="80" cy="170" r="1.5"/>
    <circle cx="370" cy="200" r="2"/>
    <circle cx="28" cy="300" r="1.6"/>
  </g>
  <circle cx="330" cy="90" r="26" fill="#ffd166" opacity="0.9"/>
  <circle cx="340" cy="82" r="22" fill="#3d5a80"/>

  <!-- Boden -->
