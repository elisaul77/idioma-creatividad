  <!-- Kopf -->
  <ellipse cx="262" cy="122" rx="42" ry="32" fill="#f7b977"/>
  <ellipse cx="296" cy="134" rx="18" ry="12" fill="#e76f51"/>
  <circle cx="300" cy="132" r="2.5" fill="#1b2a4a"/>

  <!-- Augen -->
  <circle cx="270" cy="112" r="10" fill="#ffffff"/>
  <circle cx="273" cy="112" r="5" fill="#1b2a4a"/>
  <circle cx="252" cy="100" r="5" fill="#ffd166"/>
  <circle cx="252" cy="100" r="2" fill="#1b2a4a"/>
</svg>