<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1d33"/>
      <stop offset="0.7" stop-color="#7a4a5a"/>
      <stop offset="1" stop-color="#e8875a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.6" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="earth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b4226"/>
      <stop offset="1" stop-color="#3b2314"/>
    </linearGradient>
    <pattern id="hex" width="17.32" height="30" patternUnits="userSpaceOnUse">
      <path d="M8.66 0 L17.32 5 L17.32 15 L8.66 20 L0 15 L0 5 Z" fill="none" stroke="#5c3a10" stroke-width="1.2" stroke-opacity="0.55"/>
      <path d="M0 15 L8.66 20 L8.66 30 M17.32 15 L8.66 20" fill="none" stroke="#5c3a10" stroke-width="1.2" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <!-- Небо -->
  <rect width="400" height="400" fill="url(#sky)"/>
  <g fill="#ffffff" opacity="0.7">
    <circle cx="40" cy="30" r="1.2"/>
    <circle cx="95" cy="55" r="1"/>
    <circle cx="150" cy="22" r="1.4"/>
    <circle cx="370" cy="150" r="1"/>
    <circle cx="20" cy="140" r="1"/>
    <circle cx="230" cy="18" r="1"/>
  </g>

  <!-- Солнце -->
  <circle cx="325" cy="95" r="60" fill="url(#sun)"/>
  <circle cx="325" cy="95" r="28" fill="#ffd166"/>

  <!-- Дальний силуэт -->
  <path d="M0 260 L30 240 L60 255 L90 225 L120 250 L160 215 L200 245 L240 210 L280 240 L320 205 L360 235 L400 220 L400 300 L0 300 Z" fill="#22304a" opacity="0.8"/>

  <!-- Башня-соты -->
  <path d="M40 170 Q80 150 120 170 L120 300 L40 300 Z" fill="#c98a2b"/>
  <path d="M40 170 Q80 150 120 170 L120 300 L40 300 Z" fill="url(#hex)"/>

  <!-- Термитник-шпиль -->
  <path d="M140 300 C145 240 150 170 170 120 C190 170 195 240 200 300 Z" fill="#a0622a"/>
  <path d="M158 300 C160 250 162 200 170 150" fill="none" stroke="#7a4518" stroke-width="2" stroke-opacity="0.6"/>
  <path d="M182 300 C180 250 178 200 170 150" fill="none" stroke="#7a4518" stroke-width="2" stroke-opacity="0.6"/>
  <circle cx="170" cy="118" r="4" fill="#ffd166"/>

  <!-- Башня с сотами -->
  <rect x="215" y="120" width="70" height="180" fill="#d9a441"/>
  <rect x="215" y="120" width="70" height="180" fill="url(#hex)"/>
  <path d="M215 120 Q250 95 285 120 Z" fill="#e8b65a"/>
  <line x1="250" y1="95" x2="250" y2="70" stroke="#e8b65a" stroke-width="2"/>

  <!-- Малая башня -->
  <rect x="300" y="200" width="60" height="100" fill="#b5762e"/>
  <rect x="300" y="200" width="60" height="100" fill="url(#hex)"/>
  <path d="M300 200 L330 178 L360 200 Z" fill="#c98a2b"/>

  <!-- Светящиеся окна-ячейки -->
  <g fill="#fff3b0">
    <circle cx="62" cy="200" r="4"/>
    <circle cx="98" cy="232" r="4"/>
    <circle cx="62" cy="266" r="4"/>
    <circle cx="232" cy="150" r="4"/>
    <circle cx="268" cy="182" r="4"/>
    <circle cx="232" cy="218" r="4"/>
    <circle cx="268" cy="254" r="4"/>
    <circle cx="318" cy="228" r="3.5"/>
    <circle cx="342" cy="262" r="3.5"/>
  </g>

  <!-- Пчёлы над городом -->
  <path d="M60 110 Q130 60 200 95 T340 80" fill="none" stroke="#fff3b0" stroke-width="1" stroke-dasharray="3 4" opacity="0.6"/>
  <g transform="translate(120 85)">
    <ellipse cx="0" cy="0" rx="7" ry="5" fill="#ffd166"/>
    <path d="M-2 -2 Q4 -12 10 -4 Z" fill="#ffffff" opacity="0.7"/>
    <path d="M-7 -1 H7 M-5 2 H5" stroke="#3b2314" stroke-width="1.5"/>
  </g>
  <g transform="translate(250 52) rotate(-12)">
    <ellipse cx="0" cy="0" rx="6" ry="4.5" fill="#ffd166"/>
    <path d="M-2 -2 Q3 -11 9 -3 Z" fill="#ffffff" opacity="0.7"/>
    <path d="M-6 -1 H6 M-4 2 H4" stroke="#3b2314" stroke-width="1.5"/>
  </g>
  <g transform="translate(360 40) rotate(8)">
    <ellipse cx="0" cy="0" rx="5" ry="3.8" fill="#ffd166"/>
    <path d="M-2 -2 Q2 -9 7 -3 Z" fill="#ffffff" opacity="0.7"/>
  </g>

  <!-- Земля -->
  <rect y="300" width="400" height="100" fill="url(#earth)"/>
  <path d="M0 300 Q50 292 100 300 T200 300 T300 298 T400 300" fill="none" stroke="#8fbf5a" stroke-width="5" stroke-linecap="round"/>

  <!-- Подземные ходы муравьёв -->
  <path d="M0 340 Q100 320 150 350 T300 345 T400 335" fill="none" stroke="#2b1a10" stroke-width="14" stroke-linecap="round"/>
  <path d="M150 350 Q160 375 130 388" fill="none" stroke="#2b1a10" stroke-width="10" stroke-linecap="round"/>
  <path d="M300 345 Q290 370 315 385" fill="none" stroke="#2b1a10" stroke-width="10" stroke-linecap="round"/>
  <circle cx="120" cy="365" r="12" fill="#2b1a10"/>
  <circle cx="280" cy="372" r="14" fill="#2b1a10"/>

  <!-- Муравьи -->
  <g fill="#120a05">
    <g transform="translate(80 340) rotate(-8)">
      <ellipse cx="0" cy="0" rx="4" ry="2.5"/>
      <circle cx="5" cy="0" r="2.2"/>
      <line x1="-3" y1="2" x2="-7" y2="5" stroke="#120a05" stroke-width="0.8"/>
    </g>
    <g transform="translate(200 345) rotate(4)">
      <ellipse cx="0" cy="0" rx="4" ry="2.5"/>
      <circle cx="5" cy="0" r="2.2"/>
    </g>
    <g transform="translate(330 338)">
      <ellipse cx="0" cy="0" rx="4" ry="2.5"/>
      <circle cx="-5" cy="0" r="2.2"/>
    </g>
  </g>
</svg>