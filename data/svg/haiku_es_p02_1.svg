<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b1446"/>
      <stop offset="55%" stop-color="#4b2c82"/>
      <stop offset="100%" stop-color="#e58fb0"/>
    </linearGradient>
    <radialGradient id="luz" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6d6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fff6d6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nube" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd6ec" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffd6ec" stop-opacity="0"/>
    </radialGradient>
    <filter id="suave" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Cielo -->
  <rect width="400" height="400" fill="url(#cielo)"/>

  <!-- Estrellas -->
  <g fill="#fffbe8">
    <circle cx="40" cy="48" r="1.8"/>
    <circle cx="96" cy="92" r="1.2"/>
    <circle cx="150" cy="38" r="1.5"/>
    <circle cx="318" cy="60" r="1.9"/>
    <circle cx="362" cy="128" r="1.3"/>
    <circle cx="282" cy="150" r="1.1"/>
    <circle cx="64" cy="172" r="1.4"/>
    <circle cx="210" cy="82" r="1"/>
    <circle cx="26" cy="250" r="1.2"/>
    <circle cx="378" cy="230" r="1.6"/>
  </g>

  <!-- Luna creciente -->
  <circle cx="300" cy="110" r="70" fill="url(#luz)"/>
  <path d="M300 60 A50 50 0 1 0 340 128 A40 40 0 1 1 300 60 Z" fill="#fff3c4"/>

  <!-- Nubes oníricas -->
  <g filter="url(#suave)">
    <ellipse cx="110" cy="250" rx="90" ry="34" fill="url(#nube)"/>
    <ellipse cx="290" cy="300" rx="110" ry="40" fill="url(#nube)"/>
    <ellipse cx="200" cy="350" rx="140" ry="36" fill="#f7b3d4" fill-opacity="0.55"/>
  </g>

  <!-- Figura flotante: sendero de luz -->
  <path d="M60 330 C120 260, 170 290, 210 210 S300 150, 350 190"
        fill="none" stroke="#fff3c4" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8"/>
  <path d="M60 330 C120 260, 170 290, 210 210 S300 150, 350 190"
        fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-opacity="0.12"/>

  <!-- Burbujas de sueño -->
  <g fill="none" stroke="#e9dcff" stroke-width="1.5" stroke-opacity="0.7">
    <circle cx="130" cy="150" r="22"/>
    <circle cx="150" cy="128" r="10"/>
    <circle cx="165" cy="108" r="5"/>
  </g>
  <g fill="#e9dcff" fill-opacity="0.15">
    <circle cx="130" cy="150" r="22"/>
  </g>

  <!-- Luciérnagas -->
  <g fill="#ffe27a">
    <circle cx="220" cy="260" r="2.5" opacity="0.9"/>
    <circle cx="176" cy="220" r="2" opacity="0.7"/>
    <circle cx="330" cy="240" r="2.2" opacity="0.8"/>
    <circle cx="78" cy="300" r="2" opacity="0.6"/>
  </g>
</svg>