<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#1b2140"/>
      <stop offset="1" stop-color="#05060f"/>
    </radialGradient>
    <radialGradient id="mantle" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d9733f"/>
      <stop offset="1" stop-color="#a9472a"/>
    </radialGradient>
    <radialGradient id="outer" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#e76f22"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6c2"/>
      <stop offset="0.6" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#f4a261"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fdbff" stop-opacity="0"/>
      <stop offset="1" stop-color="#7fdbff" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7fdbff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#7fdbff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Space background -->
  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="40" cy="50" r="1.5"/>
    <circle cx="360" cy="70" r="1.2"/>
    <circle cx="60" cy="340" r="1.5"/>
    <circle cx="350" cy="330" r="2"/>
    <circle cx="30" cy="200" r="1"/>
    <circle cx="372" cy="190" r="1.3"/>
    <circle cx="330" cy="40" r="1"/>
    <circle cx="90" cy="380" r="1.2"/>
    <circle cx="310" cy="375" r="1"/>
    <circle cx="20" cy="120" r="1.2"/>
    <circle cx="385" cy="290" r="1.5"/>
  </g>

  <!-- Earth cross-section layers -->
  <circle cx="200" cy="200" r="160" fill="#6d4c41"/>
  <circle cx="200" cy="200" r="128" fill="url(#mantle)"/>
  <circle cx="200" cy="200" r="84" fill="url(#outer)"/>
  <circle cx="200" cy="200" r="38" fill="url(#core)"/>
  <circle cx="200" cy="200" r="160" fill="none" stroke="#3e2723" stroke-width="3"/>
  <circle cx="200" cy="200" r="128" fill="none" stroke="#7f3b22" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.6"/>

  <!-- Shaft and exhaust trail -->
  <line x1="200" y1="140" x2="200" y2="196" stroke="#7fdbff" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <rect x="193" y="60" width="14" height="60" fill="url(#trail)"/>

  <!-- Vehicle -->
  <g transform="translate(200,120)">
    <circle cx="0" cy="0" r="26" fill="url(#glow)"/>
    <path d="M-11 4 L-18 14 L-11 12 Z" fill="#607d8b"/>
    <path d="M11 4 L18 14 L11 12 Z" fill="#607d8b"/>
    <ellipse cx="0" cy="0" rx="11" ry="18" fill="#e0e7ef" stroke="#607d8b" stroke-width="2"/>
    <circle cx="0" cy="-4" r="5" fill="#29b6f6"/>
    <path d="M-9 16 L9 16 L0 36 Z" fill="#78909c"/>
  </g>
</svg>