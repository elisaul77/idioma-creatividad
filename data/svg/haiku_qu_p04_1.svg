<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a67"/>
      <stop offset="1" stop-color="#f4b183"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <path id="h" d="M20 36 C20 36 2 24 2 12 C2 5 8 1 13 1 C17 1 19 4 20 7 C21 4 23 1 27 1 C32 1 38 5 38 12 C38 24 20 36 20 36Z"/>
  </defs>

  <!-- Cielo -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- Estrellas -->
  <g fill="#ffffff">
    <circle cx="40" cy="40" r="1.5"/>
    <circle cx="90" cy="25" r="1"/>
    <circle cx="150" cy="55" r="1.5"/>
    <circle cx="210" cy="30" r="1"/>
    <circle cx="60" cy="95" r="1"/>
    <circle cx="260" cy="90" r="1.5"/>
    <circle cx="370" cy="150" r="1"/>
    <circle cx="20" cy="150" r="1"/>
    <circle cx="180" cy="80" r="1"/>
  </g>

  <!-- Luna -->
  <circle cx="330" cy="70" r="22" fill="#fff3c4"/>
  <circle cx="338" cy="63" r="20" fill="#2b3a67" opacity="0.25"/>

  <!-- Colinas -->
  <path d="M0 300 Q90 265 180 295 T400 285 L400 400 L0 400 Z" fill="#3f6b4a"/>
  <path d="M0 330 Q120 300 240 325 T400 320 L400 400 L0 400 Z" fill="#2f5a3c"/>

  <!-- Chimenea y humo -->
  <rect x="250" y="125" width="18" height="40" fill="#5a3a32"/>
  <g fill="#ffffff" opacity="0.5">
    <circle cx="256" cy="115" r="6"/>
    <circle cx="263" cy="103" r="8"/>
    <circle cx="257" cy="90" r="5"/>
  </g>

  <!-- Resplandor de la ventana -->
  <circle cx="156" cy="231" r="40" fill="url(#glow)"/>
  <circle cx="244" cy="231" r="40" fill="url(#glow)"/>

  <!-- Casa -->
  <rect x="120" y="190" width="160" height="120" fill="#f7e3c6"/>
  <polygon points="100,195 200,110 300,195" fill="#8c4a3c"/>

  <!-- Corazón en el techo -->
  <use href="#h" transform="translate(182,132) scale(0.5)" fill="#e0445a"/>

  <!-- Ventanas -->
  <rect x="140" y="215" width="32" height="32" fill="#ffd778"/>
  <line x1="156" y1="215" x2="156" y2="247" stroke="#8c4a3c" stroke-width="2"/>
  <line x1="140" y1="231" x2="172" y2="231" stroke="#8c4a3c" stroke-width="2"/>
  <rect x="228" y="215" width="32" height="32" fill="#ffd778"/>
  <line x1="244" y1="215" x2="244" y2="247" stroke="#8c4a3c" stroke-width="2"/>
  <line x1="228" y1="231" x2="260" y2="231" stroke="#8c4a3c" stroke-width="2"/>

  <!-- Puerta -->
  <rect x="185" y="250" width="30" height="60" rx="4" fill="#6b3e2e"/>
  <circle cx="208" cy="282" r="2" fill="#ffd778"/>

  <!-- Persona manchachikuq (temblorosa) -->
  <circle cx="95" cy="292" r="9" fill="#f2c8a0"/>
  <rect x="86" y="302" width="18" height="40" rx="8" fill="#7fa7c9"/>
  <path d="M70 285 l-8 -4 M70 295 l-9 0 M70 305 l-8 4 M120 285 l8 -4 M120 295 l9 0 M120 305 l8 4" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- Corazón flotante -->
  <use href="#h" transform="translate(88,250) scale(0.35)" fill="#ff8fa3"/>

  <!-- Flores -->
  <g>
    <circle cx="90" cy="345" r="3" fill="#ffd1dc"/>
    <circle cx="310" cy="350" r="3" fill="#ffd1dc"/>
    <circle cx="330" cy="342" r="2.5" fill="#fff3c4"/>
    <circle cx="60" cy="360" r="2.5" fill="#fff3c4"/>
  </g>
</svg>