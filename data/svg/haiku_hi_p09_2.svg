  <circle cx="50" cy="343" r="2.5" fill="#2a1a0c"/>
  <circle cx="66" cy="347" r="2.5" fill="#2a1a0c"/>
  <ellipse cx="340" cy="360" rx="40" ry="14" fill="#7a4e28"/>
  <circle cx="325" cy="357" r="2.5" fill="#2a1a0c"/>
  <circle cx="345" cy="362" r="2.5" fill="#2a1a0c"/>
  <circle cx="362" cy="356" r="2.5" fill="#2a1a0c"/>
  <ellipse cx="200" cy="375" rx="22" ry="9" fill="#7a4e28"/>
