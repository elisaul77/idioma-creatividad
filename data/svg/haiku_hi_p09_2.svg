  <rect x="298" y="240" width="6" height="8" fill="#2a1a0c"/>
  <rect x="312" y="240" width="6" height="8" fill="#2a1a0c"/>
  <rect x="326" y="240" width="6" height="8" fill="#2a1a0c"/>
  <rect x="340" y="240" width="6" height="8" fill="#2a1a0c"/>
  <rect x="298" y="262" width="6" height="8" fill="#2a1a0c"/>
  <rect x="312" y="262" width="6" height="8" fill="#2a1a0c"/>
  <rect x="326" y="262" width="6" height="8" fill="#2a1a0c"/>
  <rect x="340" y="262" width="6" height="8" fill="#2a1a0c"/>
  <rect x="304" y="204" width="5" height="7" fill="#2a1a0c"/>
  <rect x="318" y="204" width="5" height="7" fill="#2a1a0c"/>

