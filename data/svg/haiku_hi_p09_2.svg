  <circle cx="230" cy="336" r="5" fill="#d62828"/>
  <line x1="230" y1="331" x2="230" y2="341" stroke="#1c1008" stroke-width="1"/>
  <circle cx="228" cy="334" r="1" fill="#1c1008"/>
  <circle cx="232" cy="338" r="1" fill="#1c1008"/>

  <!-- Bees -->
  <use href="#bee" x="150" y="120"/>
  <use href="#bee" x="265" y="120"/>
  <use href="#bee" x="250" y="160"/>
  <use href="#bee" x="370" y="190"/>
</svg>