  <use href="#ant" x="140" y="338"/>
  <use href="#ant" x="260" y="345"/>
  <use href="#ant" x="275" y="341"/>
  <use href="#ant" x="290" y="348"/>
  <use href="#ant" x="180" y="370"/>
