<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1d4a"/>
      <stop offset="0.6" stop-color="#e0793a"/>
      <stop offset="1" stop-color="#f2b35a"/>
    </linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b4226"/>
      <stop offset="1" stop-color="#3a2212"/>
    </linearGradient>
    <linearGradient id="mound" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b98a5a"/>
      <stop offset="0.5" stop-color="#d6a674"/>
      <stop offset="1" stop-color="#8f6236"/>
    </linearGradient>
    <g id="hex">
      <polygon points="0,-8 6.93,-4 6.93,4 0,8 -6.93,4 -6.93,-4" fill="#f5c542" stroke="#8a5a00" stroke-width="1"/>
    </g>
    <g id="bee">
      <ellipse rx="6" ry="4" fill="#ffd23f" stroke="#222" stroke-width="1"/>
      <path d="M-2 -4 V4 M2 -4 V4" stroke="#222" stroke-width="1.5"/>
      <ellipse cx="-1" cy="-6" rx="4" ry="2.5" fill="#ffffff" opacity="0.7"/>
      <circle cx="6" cy="-1" r="1" fill="#222"/>
    </g>
    <g id="ant">
      <circle cx="0" cy="0" r="2" fill="#1c1008"/>
      <circle cx="-4" cy="0" r="2.5" fill="#1c1008"/>
      <circle cx="4.5" cy="0" r="3" fill="#1c1008"/>
      <path d="M5 -1 L9 -4 M5 1 L9 4 M0 -1 L-3 -5 M-4 -1 L-7 -5 M-4 1 L-7 5" stroke="#1c1008" stroke-width="0.8"/>
    </g>
  </defs>

  <!-- Sky -->
  <rect width="400" height="400" fill="url(#sky)"/>
  <circle cx="30" cy="30" r="1.5" fill="#ffffff"/>
  <circle cx="90" cy="60" r="1" fill="#ffffff"/>
  <circle cx="150" cy="25" r="1.2" fill="#ffffff"/>
  <circle cx="370" cy="40" r="1.3" fill="#ffffff"/>
  <circle cx="200" cy="55" r="1" fill="#ffffff"/>
  <circle cx="320" cy="90" r="50" fill="#ffe9a8" opacity="0.15"/>
  <circle cx="320" cy="90" r="30" fill="#ffe9a8"/>

  <!-- Distant skyline -->
  <path d="M0 260 L30 230 L45 240 L60 200 L75 240 L100 215 L115 245 L140 205 L160 250 L190 220 L210 245 L240 195 L255 240 L280 210 L300 250 L330 225 L350 245 L370 215 L400 250 L400 310 L0 310 Z" fill="#4a2f5c" opacity="0.7"/>

  <!-- Termite tower (left) -->
  <path d="M30 302 Q32 260 50 230 Q48 210 55 190 Q60 178 68 170 Q76 178 81 190 Q88 210 86 230 Q104 260 106 302 Z" fill="url(#mound)"/>
  <circle cx="68" cy="178" r="2.5" fill="#2a1a0c"/>
