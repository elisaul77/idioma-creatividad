  <rect x="192" y="200" width="56" height="102" fill="#e8a317"/>
  <use href="#hex" x="199" y="212"/>
  <use href="#hex" x="213" y="212"/>
  <use href="#hex" x="227" y="212"/>
  <use href="#hex" x="241" y="212"/>
  <use href="#hex" x="206" y="224"/>
