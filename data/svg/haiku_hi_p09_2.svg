  <use href="#hex" x="241" y="236"/>
  <use href="#hex" x="206" y="248"/>
  <use href="#hex" x="220" y="248"/>
  <use href="#hex" x="234" y="248"/>
  <use href="#hex" x="199" y="260"/>
  <use href="#hex" x="213" y="260"/>
  <use href="#hex" x="227" y="260"/>
  <use href="#hex" x="241" y="260"/>
  <use href="#hex" x="206" y="272"/>
  <use href="#hex" x="220" y="272"/>
  <use href="#hex" x="234" y="272"/>
  <use href="#hex" x="199" y="284"/>
