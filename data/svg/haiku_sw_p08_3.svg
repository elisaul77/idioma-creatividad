<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1030"/>
      <stop offset="0.6" stop-color="#1d2a5e"/>
      <stop offset="1" stop-color="#3a3f7a"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7d6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff7d6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="floor" cx="0.5" cy="0" r="1">
      <stop offset="0" stop-color="#4b3b6b"/>
      <stop offset="1" stop-color="#1a1530"/>
    </radialGradient>
  </defs>

  <!-- Anga la usiku -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- Nyota -->
  <g fill="#ffffff">
    <circle cx="40" cy="45" r="1.5"/>
    <circle cx="90" cy="25" r="1"/>
    <circle cx="150" cy="60" r="1.8"/>
    <circle cx="210" cy="30" r="1.2"/>
    <circle cx="260" cy="70" r="1"/>
    <circle cx="320" cy="40" r="1.6"/>
    <circle cx="365" cy="95" r="1"/>
    <circle cx="60" cy="110" r="1"/>
    <circle cx="120" cy="130" r="1.3"/>
    <circle cx="340" cy="150" r="1.2"/>
    <circle cx="25" cy="170" r="1"/>
  </g>

  <!-- Mwezi -->
  <circle cx="320" cy="90" r="48" fill="url(#moonGlow)"/>
  <circle cx="320" cy="90" r="28" fill="#fff3c4"/>
  <circle cx="312" cy="84" r="5" fill="#f0e0a0" opacity="0.6"/>
  <circle cx="326" cy="98" r="3.5" fill="#f0e0a0" opacity="0.6"/>

  <!-- Sakafu ya chumba -->
  <path d="M0 290 Q200 262 400 290 L400 400 L0 400 Z" fill="url(#floor)"/>

  <!-- Njia ya mwanga wa mwezi -->
  <path d="M250 400 L300 290 L340 290 L300 400 Z" fill="#fff3c4" opacity="0.08"/>

  <!-- Dubu anayecheza -->
  <g transform="translate(130 250)">
    <circle cx="-22" cy="-48" r="10" fill="#b07a4a"/>
    <circle cx="22" cy="-48" r="10" fill="#b07a4a"/>
    <circle cx="0" cy="-30" r="26" fill="#c68b59"/>
    <circle cx="-9" cy="-34" r="3" fill="#2a1a10"/>
    <circle cx="9" cy="-34" r="3" fill="#2a1a10"/>
