    <path d="M-18 -4 Q-42 -20 -40 -44" stroke="#c68b59" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M18 -4 Q42 10 36 30" stroke="#c68b59" stroke-width="9" fill="none" stroke-linecap="round"/>
    <ellipse cx="-14" cy="24" rx="7" ry="5" fill="#a86f3f"/>
    <ellipse cx="14" cy="24" rx="7" ry="5" fill="#a86f3f"/>
  </g>

