    <circle cx="-16" cy="6" r="2.5" fill="#9aa0b8"/>
    <circle cx="18" cy="6" r="7" fill="#2b2b3d"/>
    <circle cx="18" cy="6" r="2.5" fill="#9aa0b8"/>
