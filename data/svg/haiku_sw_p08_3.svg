    <circle cx="0" cy="-26" r="2.5" fill="#2a1a10"/>
    <ellipse cx="0" cy="0" rx="20" ry="24" fill="#c68b59"/>
    <ellipse cx="0" cy="4" rx="10" ry="13" fill="#e9c49a"/>
