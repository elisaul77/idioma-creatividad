    <rect x="15" y="-28" width="7" height="20" rx="3" fill="#8fd3c7"/>
    <circle cx="-30" cy="-44" r="2" fill="#ffd166"/>
    <circle cx="30" cy="-44" r="2" fill="#ffd166"/>
