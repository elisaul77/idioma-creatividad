    <path d="M250 180 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 z"/>
    <path d="M90 200 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 z"/>
    <path d="M160 100 l2 4 4 2 -4 2 -2 4 -2 -4 -4 -2 4 -2 z"/>
  </g>

  <!-- Chupa ya nyota ya kuchezea -->
  <g transform="translate(330 230)">
    <path d="M0 -22 L5 -6 L22 -6 L8 4 L13 20 L0 10 L-13 20 L-8 4 L-22 -6 L-5 -6 Z" fill="#ffd166" opacity="0.9"/>
