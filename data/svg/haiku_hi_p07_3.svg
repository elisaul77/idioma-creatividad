<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0f2e"/>
      <stop offset="55%" stop-color="#2a1b5e"/>
      <stop offset="100%" stop-color="#e86f9a"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6c8"/>
      <stop offset="60%" stop-color="#ffb347" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff6f61" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d2b4f"/>
      <stop offset="50%" stop-color="#3b4f8a"/>
      <stop offset="100%" stop-color="#1d2b4f"/>
    </linearGradient>
    <radialGradient id="orb" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#7dffea"/>
      <stop offset="100%" stop-color="#00c2ff" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="ground" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#3be8c4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0b0f2e" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="40" cy="38" r="1.2" opacity="0.9"/>
    <circle cx="90" cy="70" r="0.8" opacity="0.6"/>
    <circle cx="150" cy="25" r="1" opacity="0.8"/>
    <circle cx="320" cy="48" r="1.4" opacity="0.9"/>
    <circle cx="365" cy="110" r="0.9" opacity="0.7"/>
    <circle cx="260" cy="90" r="0.7" opacity="0.6"/>
    <circle cx="55" cy="140" r="0.8" opacity="0.5"/>
    <circle cx="350" cy="190" r="0.9" opacity="0.6"/>
    <circle cx="210" cy="30" r="0.8" opacity="0.7"/>
  </g>

  <!-- Sun -->
  <circle cx="200" cy="170" r="110" fill="url(#sun)" opacity="0.7"/>
  <circle cx="200" cy="170" r="48" fill="#fff1b8" opacity="0.85" filter="url(#glow)"/>

  <!-- Ground -->
  <ellipse cx="200" cy="372" rx="210" ry="60" fill="url(#ground)"/>
  <path d="M0 350 Q100 330 200 345 T400 340 L400 400 L0 400 Z" fill="#0f1a3d"/>

  <!-- Trunk -->
  <path d="M190 350 Q185 300 192 262 Q196 240 188 220 L212 220 Q204 240 208 262 Q215 300 210 350 Z" fill="url(#trunk)" filter="url(#glow)"/>

  <!-- Main branches (circuit-like) -->
  <g fill="none" stroke="#6ef3ff" stroke-width="3" stroke-linecap="round" filter="url(#glow)">
    <path d="M200 222 L200 180"/>
    <path d="M200 200 L150 160 L120 160"/>
    <path d="M200 200 L250 160 L280 150"/>
    <path d="M200 180 L170 130 L160 90"/>
    <path d="M200 180 L232 128 L245 88"/>
    <path d="M150 160 L140 120 L110 105"/>
    <path d="M250 160 L262 118 L295 100"/>
    <path d="M170 130 L186 96 L178 62"/>
    <path d="M232 128 L214 92 L224 56"/>
  </g>

  <!-- Thin secondary circuits -->
  <g fill="none" stroke="#b28dff" stroke-width="1.2" opacity="0.8">
    <path d="M140 120 L120 120 L108 132"/>
    <path d="M262 118 L280 122 L292 112"/>
    <path d="M186 96 L200 84 L212 86"/>
    <path d="M160 90 L145 78 L140 62"/>
    <path d="M245 88 L258 74 L270 72"/>
    <path d="M120 160 L104 170 L96 186"/>
    <path d="M280 150 L300 162 L312 178"/>
  </g>

  <!-- Nodes at junctions -->
  <g fill="#ffffff" filter="url(#glow)">
    <circle cx="200" cy="200" r="3"/>
    <circle cx="150" cy="160" r="3"/>
    <circle cx="250" cy="160" r="3"/>
    <circle cx="170" cy="130" r="2.5"/>
    <circle cx="232" cy="128" r="2.5"/>
    <circle cx="140" cy="120" r="2"/>
    <circle cx="262" cy="118" r="2"/>
  </g>

  <!-- Glowing fruit / orbs -->
  <g filter="url(#glow)">
    <circle cx="120" cy="160" r="12" fill="url(#orb)"/>
    <circle cx="280" cy="150" r="13" fill="url(#orb)"/>
    <circle cx="160" cy="90" r="10" fill="url(#orb)"/>
    <circle cx="245" cy="88" r="11" fill="url(#orb)"/>
    <circle cx="178" cy="62" r="8" fill="url(#orb)"/>
    <circle cx="224" cy="56" r="9" fill="url(#orb)"/>
    <circle cx="110" cy="105" r="7" fill="url(#orb)"/>
    <circle cx="295" cy="100" r="8" fill="url(#orb)"/>
    <circle cx="96" cy="186" r="6" fill="url(#orb)"/>
    <circle cx="312" cy="178" r="6" fill="url(#orb)"/>
  </g>

  <!-- Soft halos behind orbs -->
  <g fill="#7dffea" opacity="0.35" filter="url(#softGlow)">
    <circle cx="120" cy="160" r="18"/>
    <circle cx="280" cy="150" r="20"/>
    <circle cx="160" cy="90" r="16"/>
    <circle cx="245" cy="88" r="17"/>
    <circle cx="224" cy="56" r="14"/>
  </g>

  <!-- Floating particles rising from the tree -->
  <g fill="#ffe27a" filter="url(#glow)">
    <circle cx="150" cy="300" r="2" opacity="0.8"/>
    <circle cx="240" cy="280" r="1.6" opacity="0.7"/>
    <circle cx="180" cy="250" r="1.4" opacity="0.8"/>
    <circle cx="265" cy="230" r="1.8" opacity="0.6"/>
    <circle cx="130" cy="230" r="1.5" opacity="0.7"/>
    <circle cx="300" cy="300" r="1.3" opacity="0.6"/>
  </g>
</svg>