<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#e8f7ff"/>
      <stop offset="100%" stop-color="#9fd8f5"/>
    </radialGradient>
    <linearGradient id="drop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5fb8ff"/>
      <stop offset="55%" stop-color="#1f6fd1"/>
      <stop offset="100%" stop-color="#0b2f7a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <circle cx="200" cy="215" r="150" fill="none" stroke="#2f7fd6" stroke-opacity="0.25" stroke-width="2"/>
  <circle cx="200" cy="215" r="120" fill="none" stroke="#2f7fd6" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="200" cy="215" r="90" fill="none" stroke="#2f7fd6" stroke-opacity="0.45" stroke-width="2"/>

  <ellipse cx="200" cy="360" rx="120" ry="14" fill="#0b2f7a" opacity="0.18" filter="url(#soft)"/>

  <path d="M200 60
           C260 140 300 190 300 250
           C300 305 255 345 200 345
           C145 345 100 305 100 250
           C100 190 140 140 200 60 Z"
        fill="url(#drop)"/>

  <ellipse cx="165" cy="240" rx="18" ry="34" fill="url(#glow)" transform="rotate(20 165 240)"/>
  <circle cx="240" cy="290" r="8" fill="#ffffff" opacity="0.5"/>
  <circle cx="225" cy="315" r="4" fill="#ffffff" opacity="0.6"/>

  <circle cx="72" cy="120" r="7" fill="#5fb8ff" opacity="0.7"/>
  <circle cx="335" cy="100" r="10" fill="#2f7fd6" opacity="0.5"/>
  <circle cx="330" cy="310" r="5" fill="#1f6fd1" opacity="0.6"/>
  <circle cx="60" cy="300" r="9" fill="#5fb8ff" opacity="0.5"/>
  <circle cx="290" cy="60" r="4" fill="#ffffff" opacity="0.9"/>

  <path d="M330 170 l5 12 l12 5 l-12 5 l-5 12 l-5 -12 l-12 -5 l12 -5 z" fill="#ffffff" opacity="0.8"/>
  <path d="M70 200 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 z" fill="#ffffff" opacity="0.7"/>
