<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a2a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#facc15"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4b5563"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
  </defs>

  <!-- Night sky -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#e0e7ff">
    <circle cx="40" cy="50" r="2"/>
    <circle cx="90" cy="30" r="1.5"/>
    <circle cx="150" cy="70" r="2"/>
    <circle cx="330" cy="40" r="2"/>
    <circle cx="360" cy="110" r="1.5"/>
    <circle cx="280" cy="80" r="1"/>
    <circle cx="60" cy="130" r="1.5"/>
    <circle cx="210" cy="30" r="1"/>
    <circle cx="370" cy="200" r="1.5"/>
    <circle cx="25" cy="220" r="1"/>
  </g>

  <!-- Moon -->
  <circle cx="320" cy="100" r="40" fill="url(#moon)"/>
  <circle cx="335" cy="88" r="32" fill="#1e1b4b" opacity="0.25"/>

  <!-- Distant hills -->
  <path d="M0 290 Q80 250 160 285 T320 280 T400 270 L400 400 L0 400 Z" fill="#0f172a"/>

  <!-- Glow behind controller -->
  <ellipse cx="200" cy="230" rx="150" ry="110" fill="url(#glow)"/>

  <!-- Game controller body -->
  <path d="M120 200 Q140 170 200 175 Q260 170 280 200 Q310 215 300 255 Q290 290 260 280 Q240 262 220 262 L180 262 Q160 262 140 280 Q110 290 100 255 Q90 215 120 200 Z"
        fill="url(#pad)" stroke="#6366f1" stroke-width="3"/>

  <!-- D-pad -->
  <rect x="136" y="212" width="12" height="36" rx="3" fill="#0f172a"/>
  <rect x="124" y="224" width="36" height="12" rx="3" fill="#0f172a"/>
  <circle cx="142" cy="230" r="3" fill="#22d3ee"/>

  <!-- Buttons -->
  <circle cx="262" cy="216" r="7" fill="#f472b6"/>
  <circle cx="278" cy="232" r="7" fill="#a78bfa"/>
  <circle cx="246" cy="232" r="7" fill="#34d399"/>
  <circle cx="262" cy="248" r="7" fill="#facc15"/>

  <!-- Center buttons -->
  <rect x="190" y="218" width="8" height="5" rx="2" fill="#94a3b8"/>
  <rect x="202" y="218" width="8" height="5" rx="2" fill="#94a3b8"/>

  <!-- Joysticks -->
  <circle cx="170" cy="250" r="9" fill="#111827" stroke="#22d3ee" stroke-width="2"/>
  <circle cx="230" cy="250" r="9" fill="#111827" stroke="#f472b6" stroke-width="2"/>

  <!-- Glowing pixel hearts / sparkles -->
  <g fill="#f472b6">
    <rect x="70" y="160" width="6" height="6"/>
    <rect x="80" y="150" width="6" height="6"/>
    <rect x="74" y="168" width="4" height="4"/>
  </g>
  <g fill="#22d3ee">
    <rect x="310" y="170" width="6" height="6"/>
    <rect x="322" y="180" width="6" height="6"/>
    <rect x="300" y="186" width="4" height="4"/>
  </g>

  <!-- Light rays from controller -->
  <g stroke="#22d3ee" stroke-width="1" opacity="0.3">
    <line x1="200" y1="175" x2="150" y2="110"/>
    <line x1="200" y1="175" x2="200" y2="105"/>
    <line x1="200" y1="175" x2="250" y2="110"/>
  </g>
</svg>