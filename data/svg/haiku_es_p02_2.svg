<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b1140"/>
      <stop offset="45%" stop-color="#3d2a7a"/>
      <stop offset="80%" stop-color="#8a5aa8"/>
      <stop offset="100%" stop-color="#f2a7c3"/>
    </linearGradient>
    <radialGradient id="orbe" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6e0" stop-opacity="1"/>
      <stop offset="40%" stop-color="#ffd1ec" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffd1ec" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9fe3ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#9fe3ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ola1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6fd6e8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c79bff" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="ola2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb3d9" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffe29a" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="suave" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="muySuave" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- Cielo onírico -->
  <rect width="400" height="400" fill="url(#cielo)"/>

  <!-- Halo y orbe central -->
  <circle cx="200" cy="170" r="130" fill="url(#halo)"/>
  <circle cx="200" cy="170" r="85" fill="url(#orbe)" filter="url(#suave)"/>

  <!-- Espirales flotantes -->
  <g fill="none" stroke="#ffe6f5" stroke-linecap="round" opacity="0.7">
    <path d="M120 120 C 90 110, 80 150, 110 160 C 135 168, 140 135, 118 128" stroke-width="2.5"/>
    <path d="M300 95 C 325 85, 340 115, 318 128 C 300 138, 290 112, 306 104" stroke-width="2"/>
    <path d="M280 230 C 255 240, 262 270, 290 265 C 312 260, 308 232, 288 236" stroke-width="2"/>
  </g>

  <!-- Formas flotantes difusas -->
  <ellipse cx="90" cy="250" rx="34" ry="18" fill="#7fe0d6" opacity="0.45" filter="url(#suave)"/>
  <ellipse cx="320" cy="200" rx="40" ry="22" fill="#ffb3d9" opacity="0.4" filter="url(#suave)"/>
  <ellipse cx="250" cy="300" rx="26" ry="14" fill="#ffe29a" opacity="0.4" filter="url(#suave)"/>
  <circle cx="70" cy="80" r="18" fill="#9fe3ff" opacity="0.35" filter="url(#suave)"/>
  <circle cx="345" cy="310" r="22" fill="#c79bff" opacity="0.35" filter="url(#suave)"/>

  <!-- Pompas que suben -->
  <g fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.5">
    <circle cx="150" cy="300" r="8"/>
    <circle cx="165" cy="265" r="5"/>
    <circle cx="140" cy="230" r="3.5"/>
    <circle cx="260" cy="150" r="6"/>
    <circle cx="275" cy="120" r="3"/>
  </g>

  <!-- Estrellas -->
  <g fill="#ffffff">
    <circle cx="40" cy="40" r="1.6" opacity="0.9"/>
    <circle cx="150" cy="30" r="1.2" opacity="0.8"/>
    <circle cx="210" cy="55" r="1.8" opacity="0.9"/>
    <circle cx="365" cy="45" r="1.4" opacity="0.8"/>
    <circle cx="60" cy="170" r="1.2" opacity="0.7"/>
    <circle cx="350" cy="150" r="1.6" opacity="0.9"/>
    <circle cx="25" cy="300" r="1.3" opacity="0.7"/>
    <circle cx="375" cy="260" r="1.5" opacity="0.8"/>
    <circle cx="190" cy="90" r="1" opacity="0.8"/>
    <circle cx="110" cy="200" r="1.1" opacity="0.6"/>
  </g>

  <!-- Estrella destacada -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.85">
    <line x1="100" y1="60" x2="100" y2="72"/>
    <line x1="94" y1="66" x2="106" y2="66"/>
  </g>

  <!-- Olas de sueño -->
  <path d="M0 300 C 60 280, 110 320, 170 300 S 280 280, 340 300 S 400 320, 400 310 L400 400 L0 400 Z"
        fill="url(#ola1)" filter="url(#suave)"/>
  <path d="M0 330 C 70 310, 130 350, 200 330 S 320 310, 400 335 L400 400 L0 400 Z"
        fill="url(#ola2)"/>
  <path d="M0 360 C 80 345, 150 375, 230 358 S 340 345, 400 365 L400 400 L0 400 Z"
        fill="#2a1b5e" opacity="0.6"/>

  <!-- Resplandor final -->
  <circle cx="200" cy="170" r="180" fill="none" stroke="#ffd1ec" stroke-width="1" opacity="0.15"/>
  <circle cx="200" cy="170" r="150" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.12"/>
</svg>