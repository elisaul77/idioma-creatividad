<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#2b1b5c"/>
      <stop offset="1" stop-color="#070b1f"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ee6c4"/>
      <stop offset="0.55" stop-color="#7a5cff"/>
      <stop offset="1" stop-color="#ff5fa2"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff5fa2" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6c2" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff6c2" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)"/>
  <g fill="#ffffff">
    <circle cx="40" cy="50" r="1.5" opacity="0.8"/>
    <circle cx="90" cy="28" r="1" opacity="0.6"/>
    <circle cx="165" cy="45" r="1.8" opacity="0.9"/>
    <circle cx="260" cy="30" r="1.2" opacity="0.7"/>
    <circle cx="345" cy="60" r="1.6" opacity="0.8"/>
    <circle cx="370" cy="150" r="1" opacity="0.6"/>
    <circle cx="25" cy="170" r="1.2" opacity="0.7"/>
    <circle cx="60" cy="300" r="1" opacity="0.5"/>
    <circle cx="350" cy="260" r="1.4" opacity="0.7"/>
    <circle cx="200" cy="110" r="1" opacity="0.5"/>
  </g>
  <circle cx="200" cy="200" r="150" fill="url(#glow)" opacity="0.3"/>

  <!-- Floating orbs -->
  <circle cx="330" cy="110" r="6" fill="#3ee6c4" opacity="0.8"/>
  <circle cx="330" cy="110" r="14" fill="#3ee6c4" opacity="0.2"/>
  <circle cx="70" cy="250" r="5" fill="#ff5fa2" opacity="0.8"/>
  <circle cx="70" cy="250" r="12" fill="#ff5fa2" opacity="0.2"/>
  <circle cx="300" cy="50" r="4" fill="#ffd166" opacity="0.9"/>

  <!-- Ground shadow -->
  <ellipse cx="200" cy="342" rx="115" ry="13" fill="#000000" opacity="0.45" filter="url(#soft)"/>

  <!-- Wings (behind body) -->
  <path d="M190 190 C150 90 60 60 40 110 C70 120 80 140 90 160 C60 150 50 170 60 190 C90 185 110 200 130 215 Z" fill="url(#wing)" opacity="0.9"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5">
    <path d="M180 190 C140 130 90 100 50 110"/>
    <path d="M170 195 C130 160 90 150 70 160"/>
    <path d="M160 200 C130 185 100 185 80 190"/>
  </g>
  <path d="M220 190 C260 100 340 70 370 120 C340 125 330 145 320 160 C350 150 355 170 345 190 C315 185 290 200 270 215 Z" fill="url(#wing)" opacity="0.7"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5">
    <path d="M230 190 C270 130 320 100 360 118"/>
    <path d="M240 196 C270 165 310 150 340 160"/>
    <path d="M250 202 C275 190 305 188 330 192"/>
  </g>

  <!-- Tail -->
  <path d="M270 240 C330 260 350 300 330 320 C310 340 290 310 310 298 C330 286 320 270 300 268" fill="none" stroke="url(#body)" stroke-width="12" stroke-linecap="round"/>
  <circle cx="300" cy="268" r="8" fill="#ffd166"/>
  <circle cx="300" cy="268" r="16" fill="#ffd166" opacity="0.3"/>

  <!-- Legs -->
  <g fill="none" stroke="#5b3fd6" stroke-width="10" stroke-linecap="round">
    <path d="M150 265 C140 290 146 315 138 338"/>
    <path d="M172 270 C166 295 172 318 166 340"/>
    <path d="M226 270 C232 295 226 318 234 340"/>
    <path d="M252 262 C260 290 256 315 264 338"/>
  </g>
  <g fill="#ffd166">
    <ellipse cx="136" cy="341" rx="9" ry="5"/>
    <ellipse cx="164" cy="343" rx="9" ry="5"/>
    <ellipse cx="236" cy="343" rx="9" ry="5"/>
    <ellipse cx="266" cy="341" rx="9" ry="5"/>
  </g>

  <!-- Body -->
  <ellipse cx="200" cy="230" rx="88" ry="58" fill="url(#body)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" stroke-linecap="round">
    <path d="M160 220 q10 10 20 0 q10 10 20 0 q10 10 20 0"/>
    <path d="M190 240 q10 10 20 0 q10 10 20 0 q10 10 20 0"/>
    <path d="M160 252 q10 10 20 0 q10 10 20 0 q10 10 20 0"/>
    <path d="M220 218 q10 10 20 0 q10 10 20 0"/>
    <path d="M230 250 q10 10 20 0 q10 10 20 0"/>
  </g>

  <!-- Neck and head -->
  <path d="M130 200 C125 215 130 225 150 225 L150 200 Z" fill="url(#body)"/>
  <ellipse cx="115" cy="190" rx="45" ry="38" fill="url(#body)"/>

  <!-- Ears -->
  <path d="M90 165 L80 118 L112 150 Z" fill="#7a5cff"/>
  <path d="M120 158 L125 110 L140 152 Z" fill="#ff5fa2"/>

  <!-- Crescent horn -->
  <path d="M108 152 C104 130 118 112 142 100 C128 122 124 136 124 152 Z" fill="#ffd166"/>

  <!-- Eyes -->
  <circle cx="100" cy="184" r="6" fill="#ffffff"/>
  <circle cx="101" cy="184" r="3" fill="#0b0b2b"/>
  <circle cx="118" cy="176" r="4" fill="#ffffff"/>
  <circle cx="118" cy="176" r="2" fill="#0b0b2b"/>
  <circle cx="132" cy="192" r="3.5" fill="#ffffff"/>
  <circle cx="132" cy="192" r="1.5" fill="#0b0b2b"/>

  <!-- Smile -->
  <path d="M92 205 Q108 214 122 204" fill="none" stroke="#0b0b2b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Cheek glow -->
  <circle cx="96" cy="202" r="6" fill="#ff5fa2" opacity="0.5"/>
</svg>