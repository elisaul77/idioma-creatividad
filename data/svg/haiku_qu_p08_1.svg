  <rect x="284" y="200" width="10" height="80" fill="#2a1d12"/>
  <ellipse cx="289" cy="195" rx="26" ry="22" fill="#1f4a3a"/>
  <ellipse cx="277" cy="210" rx="16" ry="14" fill="#1f4a3a"/>
  <circle cx="312" cy="262" r="9" fill="#ffd9b3"/>
  <path d="M304 258 Q312 250 320 258 Q312 254 304 258 Z" fill="#3a2a1a"/>
  <rect x="304" y="271" width="16" height="22" rx="5" fill="#f2c14e"/>
  <line x1="306" y1="291" x2="302" y2="306" stroke="#ffd9b3" stroke-width="4" stroke-linecap="round"/>
  <line x1="318" y1="291" x2="322" y2="306" stroke="#ffd9b3" stroke-width="4" stroke-linecap="round"/>

  <!-- Pelota -->
  <circle cx="190" cy="318" r="7" fill="#f5efe0"/>
  <path d="M185 314 Q190 318 185 322 M195 314 Q190 318 195 322" stroke="#e0573c" stroke-width="1" fill="none"/>
</svg>