<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1d3a"/>
      <stop offset="1" stop-color="#2d4f7c"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="farol" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf5a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffcf5a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Cielo -->
  <rect width="400" height="400" fill="url(#cielo)"/>

  <!-- Estrellas -->
  <g fill="#ffffff">
    <circle cx="30" cy="40" r="1.5"/>
    <circle cx="90" cy="25" r="1"/>
    <circle cx="160" cy="55" r="1.8"/>
    <circle cx="210" cy="20" r="1.2"/>
    <circle cx="260" cy="90" r="1"/>
    <circle cx="370" cy="150" r="1.4"/>
    <circle cx="55" cy="120" r="1"/>
    <circle cx="140" cy="110" r="1.2"/>
    <circle cx="200" cy="140" r="0.9"/>
    <circle cx="385" cy="30" r="1.3"/>
    <circle cx="20" cy="190" r="1"/>
    <circle cx="300" cy="200" r="1"/>
  </g>

  <!-- Luna -->
  <circle cx="330" cy="70" r="70" fill="url(#halo)"/>
  <circle cx="330" cy="70" r="26" fill="#fff6d5"/>
  <circle cx="322" cy="63" r="5" fill="#ecdca8" opacity="0.6"/>
  <circle cx="338" cy="78" r="3.5" fill="#ecdca8" opacity="0.6"/>

  <!-- Cerros -->
  <path d="M0 275 Q60 200 130 262 Q190 210 260 270 Q320 225 400 268 L400 400 L0 400 Z" fill="#1c3550"/>
  <path d="M0 300 Q90 265 170 296 Q250 262 330 298 Q370 286 400 294 L400 400 L0 400 Z" fill="#14283f"/>

  <!-- Farol -->
  <circle cx="72" cy="230" r="34" fill="url(#farol)"/>
  <line x1="72" y1="262" x2="72" y2="300" stroke="#3a2a1a" stroke-width="3"/>
  <rect x="64" y="238" width="16" height="22" rx="3" fill="#ffcf5a"/>
  <path d="M62 238 L72 226 L82 238 Z" fill="#3a2a1a"/>

  <!-- Niño 1: corriendo -->
  <g stroke="#ffd9b3" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="150" y1="262" x2="150" y2="292"/>
    <line x1="150" y1="292" x2="140" y2="312"/>
    <line x1="150" y1="292" x2="162" y2="308"/>
    <line x1="150" y1="272" x2="136" y2="262"/>
    <line x1="150" y1="272" x2="164" y2="282"/>
  </g>
  <circle cx="150" cy="252" r="10" fill="#ffd9b3"/>
  <path d="M141 248 Q150 238 159 248 Q150 242 141 248 Z" fill="#3a2a1a"/>
  <rect x="140" y="262" width="20" height="28" rx="6" fill="#e0573c"/>

  <!-- Niño 2: saltando -->
  <g stroke="#ffd9b3" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="220" y1="250" x2="220" y2="282"/>
    <line x1="220" y1="282" x2="208" y2="298"/>
    <line x1="220" y1="282" x2="232" y2="298"/>
    <line x1="220" y1="258" x2="204" y2="246"/>
    <line x1="220" y1="258" x2="236" y2="246"/>
