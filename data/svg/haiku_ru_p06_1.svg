<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="sky" cx="50%" cy="60%" r="75%">
      <stop offset="0%" stop-color="#FFF6C8"/>
      <stop offset="55%" stop-color="#FFD98A"/>
      <stop offset="100%" stop-color="#FF9E6B"/>
    </radialGradient>
    <radialGradient id="sun" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFBEA"/>
      <stop offset="60%" stop-color="#FFD23F"/>
      <stop offset="100%" stop-color="#FFA726"/>
    </radialGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7BD389"/>
      <stop offset="100%" stop-color="#3FA66B"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- Rays -->
  <g stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.55">
    <line x1="200" y1="120" x2="200" y2="60"/>
    <line x1="200" y1="280" x2="200" y2="340"/>
    <line x1="120" y1="200" x2="60" y2="200"/>
    <line x1="280" y1="200" x2="340" y2="200"/>
    <line x1="143" y1="143" x2="101" y2="101"/>
    <line x1="257" y1="257" x2="299" y2="299"/>
    <line x1="257" y1="143" x2="299" y2="101"/>
    <line x1="143" y1="257" x2="101" y2="299"/>
  </g>

  <!-- Sun -->
  <circle cx="200" cy="200" r="88" fill="url(#sun)" filter="url(#glow)"/>

  <!-- Cheeks -->
  <circle cx="160" cy="222" r="11" fill="#FF8A80" opacity="0.6"/>
  <circle cx="240" cy="222" r="11" fill="#FF8A80" opacity="0.6"/>

  <!-- Eyes (happy arcs) -->
  <path d="M236 183 Q 250 166 264 183" fill="none" stroke="#5D3A1A" stroke-width="7" stroke-linecap="round"/>
  <path d="M136 183 Q 150 166 164 183" fill="none" stroke="#5D3A1A" stroke-width="7" stroke-linecap="round"/>

  <!-- Smile -->
  <path d="M152 218 Q 200 268 248 218" fill="#FFFFFF" stroke="#5D3A1A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M166 226 Q 200 252 234 226 Q 200 240 166 226 Z" fill="#FF6F61"/>

  <!-- Hill -->
  <path d="M0 330 Q 100 290 200 318 T 400 310 L 400 400 L 0 400 Z" fill="url(#hill)"/>

  <!-- Confetti -->
  <g>
    <circle cx="70" cy="90" r="6" fill="#FF5C8A"/>
    <circle cx="330" cy="70" r="5" fill="#4FC3F7"/>
    <circle cx="350" cy="150" r="6" fill="#AB47BC"/>
    <circle cx="45" cy="160" r="5" fill="#26C6DA"/>
    <rect x="310" y="235" width="11" height="11" rx="2" fill="#FF7043" transform="rotate(20 315 240)"/>
    <rect x="62" y="250" width="10" height="10" rx="2" fill="#66BB6A" transform="rotate(-15 67 255)"/>
    <path d="M90 60 l5 10 l10 2 l-8 7 l2 11 l-9 -6 l-9 6 l2 -11 l-8 -7 l10 -2 Z" fill="#FFEB3B"/>
    <path d="M320 320 l4 8 l9 2 l-7 6 l2 9 l-8 -5 l-8 5 l2 -9 l-7 -6 l9 -2 Z" fill="#FF4081"/>
  </g>

  <!-- Flowers on hill -->
  <g>
    <circle cx="90" cy="335" r="7" fill="#FF7597"/>
    <circle cx="90" cy="335" r="3" fill="#FFF176"/>
    <circle cx="300" cy="342" r="7" fill="#FFFFFF"/>
    <circle cx="300" cy="342" r="3" fill="#FFB300"/>
    <circle cx="200" cy="350" r="6" fill="#B388FF"/>
    <circle cx="200" cy="350" r="2.5" fill="#FFF176"/>
  </g>
</svg>