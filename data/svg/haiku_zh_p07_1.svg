<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0a2a"/>
      <stop offset="0.6" stop-color="#1b1f5a"/>
      <stop offset="1" stop-color="#2a7f8f"/>
    </linearGradient>
    <radialGradient id="planet" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffd6f5"/>
      <stop offset="0.6" stop-color="#c77dff"/>
      <stop offset="1" stop-color="#4b2a8a"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7ef0ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7ef0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d3b4f"/>
      <stop offset="0.5" stop-color="#4fd1e0"/>
      <stop offset="1" stop-color="#1d3b4f"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b6ffea"/>
      <stop offset="1" stop-color="#c77dff"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14365a"/>
      <stop offset="1" stop-color="#06142a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="30" cy="40" r="1.2"/>
    <circle cx="90" cy="20" r="0.9"/>
    <circle cx="160" cy="45" r="1.1"/>
    <circle cx="250" cy="25" r="1"/>
    <circle cx="370" cy="30" r="1.3"/>
    <circle cx="345" cy="150" r="0.9"/>
    <circle cx="25" cy="160" r="1"/>
    <circle cx="60" cy="210" r="0.8"/>
    <circle cx="385" cy="210" r="1"/>
    <circle cx="200" cy="10" r="0.9"/>
  </g>

  <!-- Ringed planet -->
  <g transform="translate(70 85) rotate(-18)">
    <circle r="26" fill="url(#planet)"/>
    <ellipse rx="50" ry="10" fill="none" stroke="#ffd6f5" stroke-width="3" opacity="0.6"/>
  </g>

  <!-- Tree glow halo -->
  <circle cx="200" cy="170" r="130" fill="url(#halo)"/>

  <!-- Ground -->
  <path d="M0 340 Q200 300 400 340 L400 400 L0 400 Z" fill="url(#ground)"/>
  <path d="M0 340 Q200 300 400 340" fill="none" stroke="#4fd1e0" stroke-width="1.5" opacity="0.8" filter="url(#glow)"/>
  <ellipse cx="200" cy="335" rx="130" ry="16" fill="none" stroke="#7ef0ff" stroke-width="1" stroke-dasharray="4 6" opacity="0.5"/>

  <!-- Crystal shoots at base -->
  <g fill="#c77dff" opacity="0.7" filter="url(#glow)">
    <polygon points="118,352 122,330 126,352"/>
    <polygon points="276,356 280,334 284,356"/>
    <polygon points="140,362 143,346 146,362"/>
  </g>

  <!-- Trunk -->
  <path d="M184 340 C190 280 194 220 196 170 L204 170 C206 220 210 280 216 340 Z" fill="url(#trunk)"/>

  <!-- Branches -->
  <g fill="none" stroke="#7ef0ff" stroke-linecap="round" filter="url(#glow)">
    <path d="M198 200 Q160 180 130 130" stroke-width="3"/>
    <path d="M202 170 Q240 150 270 110" stroke-width="3"/>
    <path d="M199 150 Q170 120 150 80" stroke-width="2.5"/>
    <path d="M201 135 Q230 110 255 70" stroke-width="2.5"/>
    <path d="M200 130 Q200 100 205 60" stroke-width="2"/>
    <path d="M197 225 Q150 230 110 200" stroke-width="2.5"/>
    <path d="M203 230 Q250 222 295 185" stroke-width="2.5"/>
    <path d="M198 200 Q175 205 150 230" stroke-width="1.5"/>
    <path d="M202 200 Q225 200 245 230" stroke-width="1.5"/>
  </g>

  <!-- Leaves -->
  <g fill="url(#leaf)" opacity="0.9" filter="url(#glow)">
    <ellipse cx="130" cy="130" rx="11" ry="5" transform="rotate(-35 130 130)"/>
    <ellipse cx="118" cy="142" rx="9" ry="4" transform="rotate(20 118 142)"/>
    <ellipse cx="270" cy="110" rx="11" ry="5" transform="rotate(30 270 110)"/>
    <ellipse cx="282" cy="98" rx="9" ry="4" transform="rotate(-15 282 98)"/>
    <ellipse cx="150" cy="80" rx="11" ry="5" transform="rotate(-40 150 80)"/>
    <ellipse cx="140" cy="65" rx="8" ry="4" transform="rotate(10 140 65)"/>
    <ellipse cx="255" cy="70" rx="11" ry="5" transform="rotate(35 255 70)"/>
    <ellipse cx="205" cy="60" rx="10" ry="4.5" transform="rotate(-80 205 60)"/>
    <ellipse cx="110" cy="200" rx="11" ry="5" transform="rotate(-25 110 200)"/>
    <ellipse cx="295" cy="185" rx="11" ry="5" transform="rotate(25 295 185)"/>
    <ellipse cx="150" cy="230" rx="9" ry="4" transform="rotate(40 150 230)"/>
    <ellipse cx="245" cy="230" rx="9" ry="4" transform="rotate(-40 245 230)"/>
  </g>

  <!-- Floating orbs -->
  <g filter="url(#glow)">
    <circle cx="60" cy="300" r="3.5" fill="#ffd6f5"/>
    <circle cx="340" cy="250" r="4.5" fill="#7ef0ff"/>
    <circle cx="320" cy="60" r="2.5" fill="#b6ffea"/>
    <circle cx="90" cy="265" r="2" fill="#c77dff"/>
    <circle cx="170" cy="20" r="2" fill="#7ef0ff"/>
    <circle cx="36" cy="110" r="2.5" fill="#ffd6f5"/>
  </g>

  <!-- Soft light bloom at canopy -->
  <circle cx="200" cy="110" r="40" fill="#b6ffea" opacity="0.15" filter="url(#soft)"/>
</svg>