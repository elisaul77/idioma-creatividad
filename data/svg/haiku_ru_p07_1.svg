<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0a24"/>
      <stop offset="0.6" stop-color="#1b1450"/>
      <stop offset="1" stop-color="#0f3b4f"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd9f5" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ff6fd8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff6fd8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3c2a6e"/>
      <stop offset="0.5" stop-color="#6d5cc4"/>
      <stop offset="1" stop-color="#2a1d52"/>
    </linearGradient>
    <linearGradient id="branch" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#4fd8e8"/>
      <stop offset="1" stop-color="#b8f7ff"/>
    </linearGradient>
    <radialGradient id="leaf" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#7ff5e0"/>
      <stop offset="1" stop-color="#1fb7c9"/>
    </radialGradient>
    <radialGradient id="leafPink" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#ff9ae6"/>
      <stop offset="1" stop-color="#b03ad0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="40" cy="50" r="1.2" opacity="0.8"/>
    <circle cx="92" cy="28" r="0.9" opacity="0.6"/>
    <circle cx="150" cy="70" r="1.1" opacity="0.7"/>
    <circle cx="310" cy="40" r="1.3" opacity="0.9"/>
    <circle cx="355" cy="95" r="1" opacity="0.6"/>
    <circle cx="60" cy="150" r="0.9" opacity="0.5"/>
    <circle cx="370" cy="170" r="1.2" opacity="0.7"/>
    <circle cx="25" cy="230" r="1" opacity="0.6"/>
    <circle cx="340" cy="250" r="0.8" opacity="0.5"/>
  </g>

  <!-- Sun / glow -->
  <circle cx="200" cy="170" r="150" fill="url(#sun)"/>
  <circle cx="200" cy="170" r="70" fill="none" stroke="#ff9ae6" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="3 6"/>
  <circle cx="200" cy="170" r="92" fill="none" stroke="#7ff5e0" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="2 8"/>

  <!-- Ground -->
  <ellipse cx="200" cy="330" rx="170" ry="28" fill="#0a2a3a" opacity="0.9"/>
  <ellipse cx="200" cy="330" rx="130" ry="18" fill="none" stroke="#4fd8e8" stroke-opacity="0.5" stroke-width="1"/>
  <ellipse cx="200" cy="330" rx="90" ry="11" fill="none" stroke="#ff9ae6" stroke-opacity="0.4" stroke-width="1"/>

  <!-- Trunk -->
  <path d="M188 330 C186 290 192 250 196 215 C198 200 196 186 200 170 C204 186 202 200 204 215 C208 250 214 290 212 330 Z" fill="url(#trunk)"/>
  <path d="M200 170 C204 186 202 200 204 215 C208 250 214 290 212 330 L206 330 C208 290 202 250 199 215 C197 200 199 186 200 170 Z" fill="#ffffff" opacity="0.08"/>

  <!-- Roots -->
  <path d="M192 326 C172 332 160 336 145 342" stroke="#3c2a6e" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M208 326 C228 332 240 336 255 342" stroke="#3c2a6e" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Main branches -->
  <g fill="none" stroke="url(#branch)" stroke-linecap="round" filter="url(#glow)">
    <path d="M200 200 C190 180 170 170 140 150" stroke-width="5"/>
    <path d="M200 200 C210 180 230 170 260 150" stroke-width="5"/>
    <path d="M200 170 C195 140 190 120 175 95" stroke-width="4.5"/>
    <path d="M200 170 C205 140 212 118 232 92" stroke-width="4.5"/>
    <path d="M200 170 C200 130 200 100 200 62" stroke-width="5"/>
    <path d="M140 150 C125 138 110 135 90 120" stroke-width="3"/>
    <path d="M260 150 C275 138 290 135 312 118" stroke-width="3"/>
    <path d="M175 95 C160 85 150 80 132 72" stroke-width="2.5"/>
    <path d="M232 92 C246 82 258 78 272 70" stroke-width="2.5"/>
    <path d="M200 62 C188 48 180 44 168 36" stroke-width="2"/>
    <path d="M200 62 C212 48 220 44 232 36" stroke-width="2"/>
  </g>

  <!-- Circuit traces -->
  <g fill="none" stroke="#7ff5e0" stroke-opacity="0.6" stroke-width="1">
    <path d="M90 120 L90 105 L76 105"/>
    <path d="M312 118 L312 100 L326 100"/>
    <path d="M132 72 L132 60 L118 60"/>
    <path d="M272 70 L272 56 L286 56"/>
    <path d="M200 62 L200 40"/>
  </g>

  <!-- Circuit nodes -->
  <g fill="#0b0a24" stroke="#7ff5e0" stroke-width="1.5" filter="url(#glow)">
    <circle cx="76" cy="105" r="3"/>
    <circle cx="326" cy="100" r="3"/>
    <circle cx="118" cy="60" r="3"/>
    <circle cx="286" cy="56" r="3"/>
    <circle cx="200" cy="40" r="3.5"/>
    <circle cx="140" cy="150" r="2.5"/>
    <circle cx="260" cy="150" r="2.5"/>
  </g>

  <!-- Leaves / crystal foliage -->
  <g filter="url(#glow)">
    <path d="M90 120 l-12 -8 l12 -14 l12 14 z" fill="url(#leaf)"/>
    <path d="M90 120 l-12 -8 l12 -14 l12 14 z" fill="url(#leaf)" transform="translate(-20 6) scale(0.8)" opacity="0.8"/>
    <path d="M312 118 l-12 -8 l12 -14 l12 14 z" fill="url(#leafPink)"/>
    <path d="M132 72 l-10 -7 l10 -12 l10 12 z" fill="url(#leaf)"/>
    <path d="M272 70 l-10 -7 l10 -12 l10 12 z" fill="url(#leafPink)"/>
    <path d="M168 36 l-9 -6 l9 -11 l9 11 z" fill="url(#leaf)"/>
    <path d="M232 36 l-9 -6 l9 -11 l9 11 z" fill="url(#leafPink)"/>
    <path d="M200 40 l-11 -8 l11 -15 l11 15 z" fill="url(#leaf)"/>
    <path d="M120 130 l-10 -6 l10 -11 l10 11 z" fill="url(#leafPink)" opacity="0.9"/>
    <path d="M285 128 l-10 -6 l10 -11 l10 11 z" fill="url(#leaf)" opacity="0.9"/>
  </g>

  <!-- Canopy orbs -->
  <g>
    <circle cx="200" cy="30" r="22" fill="#7ff5e0" opacity="0.12" filter="url(#soft)"/>
    <circle cx="150" cy="60" r="18" fill="#ff9ae6" opacity="0.12" filter="url(#soft)"/>
    <circle cx="255" cy="60" r="18" fill="#7ff5e0" opacity="0.12" filter="url(#soft)"/>
  </g>

  <!-- Floating particles -->
  <g fill="#ffffff" filter="url(#glow)">
    <circle cx="60" cy="210" r="2" opacity="0.9"/>
    <circle cx="345" cy="205" r="2.2" opacity="0.8"/>
    <circle cx="110" cy="260" r="1.5" opacity="0.7"/>
    <circle cx="300" cy="280" r="1.8" opacity="0.8"/>
    <circle cx="170" cy="250" r="1.4" opacity="0.6"/>
    <circle cx="235" cy="235" r="1.6" opacity="0.7"/>
  </g>
</svg>