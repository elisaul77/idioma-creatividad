<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1026"/>
      <stop offset="60%" stop-color="#1b2f5e"/>
      <stop offset="100%" stop-color="#2a8c8c"/>
    </linearGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3ee8d0"/>
      <stop offset="50%" stop-color="#7af0ff"/>
      <stop offset="100%" stop-color="#3ee8d0"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#7af0ff"/>
      <stop offset="100%" stop-color="#7af0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="100%" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- Estrellas -->
  <g fill="#ffffff">
    <circle cx="40" cy="50" r="1.5" opacity="0.8"/>
    <circle cx="90" cy="28" r="1" opacity="0.6"/>
    <circle cx="330" cy="40" r="1.8" opacity="0.9"/>
    <circle cx="360" cy="110" r="1.2" opacity="0.7"/>
    <circle cx="60" cy="130" r="1" opacity="0.5"/>
    <circle cx="300" cy="150" r="1.4" opacity="0.7"/>
    <circle cx="180" cy="30" r="1.1" opacity="0.6"/>
    <circle cx="20" cy="200" r="1" opacity="0.5"/>
  </g>

  <!-- Sol / luna futurista -->
  <circle cx="320" cy="300" r="70" fill="url(#sun)"/>
  <circle cx="320" cy="300" r="38" fill="#ffd27a" opacity="0.85"/>

  <!-- Anillos orbitales -->
  <ellipse cx="200" cy="230" rx="165" ry="36" fill="none" stroke="#7af0ff" stroke-width="1.5" opacity="0.5" transform="rotate(-8 200 230)"/>
  <ellipse cx="200" cy="230" rx="140" ry="26" fill="none" stroke="#c49bff" stroke-width="1" opacity="0.4" transform="rotate(-8 200 230)"/>

  <!-- Suelo luminoso -->
  <ellipse cx="200" cy="350" rx="150" ry="22" fill="#3ee8d0" opacity="0.15"/>
  <path d="M60 350 Q200 330 340 350" fill="none" stroke="#3ee8d0" stroke-width="2" opacity="0.6" filter="url(#glow)"/>

  <!-- Tronco -->
  <path d="M188 350 L196 170 L204 170 L212 350 Z" fill="url(#trunk)" filter="url(#glow)"/>

  <!-- Ramas principales (circuitos) -->
  <g fill="none" stroke="#7af0ff" stroke-width="3" stroke-linecap="round" filter="url(#glow)">
    <path d="M200 190 Q170 160 130 150 L95 120"/>
    <path d="M200 190 Q230 160 270 150 L305 120"/>
    <path d="M200 170 Q190 120 200 80 L205 55"/>
    <path d="M130 150 L110 180"/>
    <path d="M270 150 L290 180"/>
    <path d="M200 110 Q175 100 160 70"/>
    <path d="M200 110 Q225 100 240 70"/>
  </g>

  <!-- Nodos de circuito -->
  <g fill="#ffffff" filter="url(#glow)">
    <circle cx="95" cy="120" r="3"/>
    <circle cx="305" cy="120" r="3"/>
    <circle cx="205" cy="55" r="3"/>
    <circle cx="130" cy="150" r="2.5"/>
    <circle cx="270" cy="150" r="2.5"/>
    <circle cx="160" cy="70" r="2.5"/>
    <circle cx="240" cy="70" r="2.5"/>
  </g>

  <!-- Copa: esferas de luz (hojas de energía) -->
  <g filter="url(#glow)">
    <circle cx="95" cy="120" r="22" fill="url(#orb)"/>
    <circle cx="305" cy="120" r="22" fill="url(#orb)"/>
    <circle cx="205" cy="55" r="26" fill="url(#orb)"/>
    <circle cx="160" cy="70" r="20" fill="url(#orb)"/>
    <circle cx="240" cy="70" r="20" fill="url(#orb)"/>
    <circle cx="130" cy="150" r="18" fill="url(#orb)"/>
    <circle cx="270" cy="150" r="18" fill="url(#orb)"/>
    <circle cx="110" cy="180" r="14" fill="url(#orb)"/>
    <circle cx="290" cy="180" r="14" fill="url(#orb)"/>
  </g>

  <!-- Núcleos brillantes de las hojas -->
  <g fill="#ffffff">
    <circle cx="95" cy="120" r="5"/>
    <circle cx="305" cy="120" r="5"/>
    <circle cx="205" cy="55" r="6"/>
    <circle cx="160" cy="70" r="4.5"/>
    <circle cx="240" cy="70" r="4.5"/>
    <circle cx="130" cy="150" r="4"/>
    <circle cx="270" cy="150" r="4"/>
    <circle cx="110" cy="180" r="3"/>
    <circle cx="290" cy="180" r="3"/>
  </g>

  <!-- Partículas flotantes -->
  <g fill="#c49bff" filter="url(#glow)">
    <circle cx="70" cy="240" r="2"/>
    <circle cx="335" cy="220" r="2.5"/>
    <circle cx="150" cy="260" r="1.8"/>
    <circle cx="260" cy="270" r="2"/>
    <circle cx="60" cy="90" r="1.5"/>
    <circle cx="345" cy="60" r="1.5"/>
  </g>
</svg>