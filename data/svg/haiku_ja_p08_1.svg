<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1030"/>
      <stop offset="1" stop-color="#2a1b4d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe98a" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffe98a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Night sky -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="150" cy="40" r="1.5"/>
    <circle cx="190" cy="22" r="1"/>
    <circle cx="260" cy="48" r="1.8"/>
    <circle cx="330" cy="30" r="1.2"/>
    <circle cx="370" cy="110" r="1.5"/>
    <circle cx="200" cy="70" r="1"/>
    <circle cx="240" cy="150" r="1.2"/>
    <circle cx="150" cy="170" r="1"/>
    <circle cx="385" cy="200" r="1.3"/>
    <circle cx="20" cy="210" r="1.2"/>
    <circle cx="370" cy="245" r="1"/>
    <circle cx="130" cy="110" r="1"/>
  </g>

  <!-- Window with crescent moon -->
  <rect x="20" y="30" width="110" height="120" fill="#1a2250" stroke="#7a5a3a" stroke-width="8"/>
  <line x1="75" y1="30" x2="75" y2="150" stroke="#7a5a3a" stroke-width="5"/>
  <circle cx="95" cy="75" r="18" fill="#fff3c4"/>
  <circle cx="103" cy="68" r="16" fill="#1a2250"/>

  <!-- Wall and floor -->
  <rect x="0" y="300" width="400" height="100" fill="#4a2f3f"/>
  <rect x="0" y="298" width="400" height="6" fill="#6b4550"/>

  <!-- Rug -->
  <ellipse cx="200" cy="345" rx="150" ry="30" fill="#b04a5a"/>
  <ellipse cx="200" cy="345" rx="128" ry="22" fill="none" stroke="#e08a7a" stroke-width="3" stroke-dasharray="8 6"/>

  <!-- Music notes floating up -->
  <g fill="#ffd86b" stroke="#ffd86b" stroke-width="2">
    <ellipse cx="200" cy="130" rx="5" ry="4" transform="rotate(-20 200 130)"/>
    <line x1="204" y1="130" x2="204" y2="108"/>
    <ellipse cx="228" cy="110" rx="4" ry="3.5" transform="rotate(-20 228 110)"/>
    <line x1="232" y1="110" x2="232" y2="90"/>
  </g>

  <!-- Teddy bear, dancing with arms up -->
  <g>
    <ellipse cx="100" cy="302" rx="12" ry="16" fill="#9a6a3c"/>
    <ellipse cx="140" cy="302" rx="12" ry="16" fill="#9a6a3c"/>
    <line x1="88" y1="255" x2="60" y2="215" stroke="#b07a4a" stroke-width="14" stroke-linecap="round"/>
    <line x1="152" y1="255" x2="180" y2="215" stroke="#b07a4a" stroke-width="14" stroke-linecap="round"/>
    <ellipse cx="120" cy="260" rx="38" ry="45" fill="#b07a4a"/>
    <circle cx="92" cy="170" r="12" fill="#b07a4a"/>
    <circle cx="148" cy="170" r="12" fill="#b07a4a"/>
    <circle cx="92" cy="170" r="6" fill="#e0a878"/>
    <circle cx="148" cy="170" r="6" fill="#e0a878"/>
    <circle cx="120" cy="195" r="32" fill="#b07a4a"/>
    <ellipse cx="120" cy="208" rx="14" ry="11" fill="#e8c39a"/>
    <ellipse cx="120" cy="202" rx="5" ry="4" fill="#3a2418"/>
    <circle cx="107" cy="188" r="4" fill="#1a1010"/>
    <circle cx="133" cy="188" r="4" fill="#1a1010"/>
    <circle cx="108" cy="186" r="1.2" fill="#ffffff"/>
    <circle cx="134" cy="186" r="1.2" fill="#ffffff"/>
    <ellipse cx="120" cy="260" rx="18" ry="20" fill="#e0a878"/>
  </g>

  <!-- Robot toy -->
  <g>
    <line x1="290" y1="168" x2="290" y2="140" stroke="#aaaaaa" stroke-width="3"/>
    <circle cx="290" cy="136" r="5" fill="#ff6b6b"/>
    <rect x="262" y="168" width="56" height="44" rx="6" fill="#8fb7d9"/>
    <rect x="272" y="180" width="10" height="8" fill="#ffe066"/>
    <rect x="298" y="180" width="10" height="8" fill="#ffe066"/>
    <rect x="278" y="196" width="24" height="4" rx="2" fill="#3d5a7a"/>
    <rect x="244" y="222" width="18" height="10" rx="5" fill="#4d6f94" transform="rotate(-30 253 227)"/>
    <rect x="318" y="222" width="18" height="10" rx="5" fill="#4d6f94" transform="rotate(30 327 227)"/>
    <rect x="260" y="214" width="60" height="60" rx="6" fill="#6f9cc8"/>
    <circle cx="275" cy="236" r="4" fill="#ffe066"/>
    <circle cx="290" cy="236" r="4" fill="#ff6b6b"/>
    <circle cx="305" cy="236" r="4" fill="#7fd6a0"/>
    <rect x="268" y="274" width="18" height="26" rx="3" fill="#4d6f94"/>
    <rect x="294" y="274" width="18" height="26" rx="3" fill="#4d6f94"/>
  </g>

  <!-- Building blocks stack (no lettering) -->
  <g>
    <rect x="330" y="322" width="40" height="40" fill="#f2c14e"/>
    <rect x="334" y="284" width="32" height="38" fill="#5bb5a2"/>
    <rect x="336" y="256" width="26" height="28" fill="#e0524a"/>
    <rect x="340" y="236" width="18" height="20" fill="#9b7fd6" />
  </g>

  <!-- Toy car driving with headlights -->
  <g>
    <polygon points="104,344 170,326 170,362 104,356" fill="#ffe98a" opacity="0.35"/>
    <circle cx="104" cy="350" r="22" fill="url(#glow)"/>
    <rect x="35" y="340" width="70" height="22" rx="6" fill="#e0524a"/>
    <path d="M52 340 L64 324 L88 324 L96 340 Z" fill="#c23b34"/>
    <rect x="68" y="327" width="16" height="11" fill="#bfe3ff"/>
    <rect x="88" y="327" width="10" height="11" fill="#bfe3ff"/>
    <circle cx="104" cy="350" r="3" fill="#fff7b0"/>
    <circle cx="50" cy="366" r="8" fill="#222"/>
    <circle cx="92" cy="366" r="8" fill="#222"/>
    <circle cx="50" cy="366" r="3" fill="#aaa"/>
    <circle cx="92" cy="366" r="3" fill="#aaa"/>
  </g>

  <!-- Sleepy moon glow in window -->
  <circle cx="95" cy="75" r="30" fill="url(#glow)" opacity="0.4"/>
</svg>