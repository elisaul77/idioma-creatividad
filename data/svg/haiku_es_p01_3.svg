<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b0f3b"/>
      <stop offset="0.6" stop-color="#4a1d6b"/>
      <stop offset="1" stop-color="#e0597a"/>
    </linearGradient>
    <linearGradient id="cuerpo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ff2d0"/>
      <stop offset="0.5" stop-color="#3aa7e0"/>
      <stop offset="1" stop-color="#7b5cf0"/>
    </linearGradient>
    <linearGradient id="ala" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ff7aa2"/>
    </linearGradient>
    <radialGradient id="luz" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6c2" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff6c2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ojo" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#ffe066"/>
      <stop offset="1" stop-color="#d1495b"/>
    </radialGradient>
  </defs>

  <!-- Fondo -->
  <rect width="400" height="400" fill="url(#cielo)"/>
  <circle cx="200" cy="170" r="130" fill="url(#luz)"/>

  <!-- Estrellas -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="45" cy="40" r="1.5"/>
