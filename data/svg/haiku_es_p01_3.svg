  <circle cx="262" cy="154" r="5" fill="url(#ojo)"/>
  <circle cx="252" cy="172" r="3.5" fill="url(#ojo)"/>
  <circle cx="246" cy="157" r="2" fill="#1b0f3b"/>
  <circle cx="263" cy="153" r="1.5" fill="#1b0f3b"/>
  <circle cx="252" cy="171" r="1.2" fill="#1b0f3b"/>

  <!-- Cola plumosa -->
  <path d="M120 240 C100 215 80 200 60 205 C75 220 80 235 85 255 C70 250 55 252 45 262 C65 270 85 268 105 262 Z" fill="url(#ala)" opacity="0.9"/>

  <!-- Brillo -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="200" cy="30" r="0"/>
  </g>
  <ellipse cx="200" cy="385" rx="110" ry="8" fill="#000000" opacity="0.25"/>
</svg>