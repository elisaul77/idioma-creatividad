    <circle cx="330" cy="50" r="1.8"/>
    <circle cx="370" cy="110" r="1.2"/>
    <circle cx="28" cy="150" r="1"/>
    <circle cx="360" cy="200" r="1.4"/>
    <circle cx="260" cy="30" r="1"/>
    <circle cx="80" cy="260" r="1.2"/>
  </g>

  <!-- Alas de hojas -->
  <g fill="url(#ala)" opacity="0.92">
    <path d="M190 190 C140 120 70 110 40 140 C75 150 90 170 110 200 C80 200 60 215 50 240 C90 235 120 225 150 220 Z"/>
    <path d="M210 190 C260 120 330 110 360 140 C325 150 310 170 290 200 C320 200 340 215 350 240 C310 235 280 225 250 220 Z"/>
  </g>
  <g fill="none" stroke="#7a2e4f" stroke-width="2" opacity="0.6">
    <path d="M190 190 C150 150 100 135 55 145"/>
    <path d="M190 190 C140 185 95 200 60 235"/>
    <path d="M210 190 C250 150 300 135 345 145"/>
    <path d="M210 190 C260 185 305 200 340 235"/>
  </g>

  <!-- Patas de raíz -->
  <g stroke="#2a1a3d" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M170 280 C160 310 150 330 135 350"/>
    <path d="M182 282 C180 315 175 335 170 355"/>
    <path d="M220 282 C225 315 230 335 235 355"/>
    <path d="M232 280 C245 310 255 330 268 350"/>
  </g>

  <!-- Cola de pez -->
  <path d="M265 250 C300 220 320 200 345 190 C335 220 340 245 355 270 C330 260 305 265 280 280 Z" fill="url(#cuerpo)" opacity="0.95"/>
  <path d="M290 245 L330 232 M295 258 L335 255" stroke="#1b0f3b" stroke-width="2" opacity="0.4"/>

  <!-- Cuerpo -->
  <ellipse cx="200" cy="250" rx="85" ry="50" fill="url(#cuerpo)"/>
  <g fill="#ffffff" opacity="0.35">
    <circle cx="160" cy="235" r="5"/>
    <circle cx="185" cy="225" r="4"/>
    <circle cx="210" cy="232" r="5"/>
    <circle cx="175" cy="255" r="4"/>
    <circle cx="200" cy="262" r="5"/>
    <circle cx="228" cy="252" r="4"/>
  </g>

  <!-- Cuello -->
  <path d="M215 215 C225 185 230 170 240 160 L265 175 C255 190 250 215 245 240 Z" fill="url(#cuerpo)"/>

  <!-- Cabeza -->
  <ellipse cx="252" cy="165" rx="32" ry="26" fill="url(#cuerpo)"/>
  <!-- Pico -->
  <path d="M278 160 C295 158 305 165 310 172 C298 174 288 176 280 176 Z" fill="#ffd166"/>

  <!-- Cuernos de cristal -->
  <g fill="#ffb3e6" stroke="#ffffff" stroke-width="1" opacity="0.95">
    <path d="M235 140 L222 102 L242 128 Z"/>
    <path d="M250 137 L248 92 L258 130 Z"/>
    <path d="M262 142 L278 108 L268 136 Z"/>
  </g>

  <!-- Ojos -->
