<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFE6FF"/>
      <stop offset="1" stop-color="#FFF3D1"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A583F5"/>
      <stop offset="1" stop-color="#7656D6"/>
    </linearGradient>
  </defs>

  <!-- Himmel -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- Sonne -->
  <circle cx="330" cy="70" r="90" fill="#FFE27A" opacity="0.5"/>
  <circle cx="330" cy="70" r="46" fill="#FFD23F"/>

  <!-- Wolken -->
  <g fill="#FFFFFF" opacity="0.9">
    <ellipse cx="90" cy="70" rx="40" ry="16"/>
    <ellipse cx="115" cy="60" rx="28" ry="20"/>
    <ellipse cx="62" cy="62" rx="22" ry="14"/>
    <ellipse cx="200" cy="105" rx="34" ry="13"/>
    <ellipse cx="220" cy="96" rx="22" ry="16"/>
  </g>

  <!-- Hügel und Gras -->
  <ellipse cx="60" cy="350" rx="130" ry="40" fill="#A8DC7A"/>
  <ellipse cx="330" cy="365" rx="160" ry="48" fill="#8ECB64"/>
  <rect x="0" y="366" width="400" height="34" fill="#8ECB64"/>

  <!-- Weg zur Tür -->
  <path d="M170 388 Q200 360 230 388 Z" fill="#F3D9A4"/>

  <!-- Schwanz (eingerollt) -->
  <path d="M292 318 Q360 330 350 285 Q342 258 320 272" fill="none" stroke="#7656D6" stroke-width="16" stroke-linecap="round"/>
  <circle cx="320" cy="272" r="9" fill="#FFD23F"/>

  <!-- Arm mit winkender Hand -->
  <path d="M86 262 Q58 250 52 228" fill="none" stroke="#7656D6" stroke-width="18" stroke-linecap="round"/>
  <circle cx="48" cy="216" r="16" fill="#7656D6"/>
  <circle cx="40" cy="206" r="5" fill="#7656D6"/>
  <circle cx="50" cy="201" r="5" fill="#7656D6"/>
  <circle cx="58" cy="208" r="5" fill="#7656D6"/>

  <!-- Hörner -->
  <path d="M128 168 L146 118 L168 170 Z" fill="#FFD23F" stroke="#E0A800" stroke-width="4" stroke-linejoin="round"/>
  <path d="M232 170 L254 118 L272 168 Z" fill="#FFD23F" stroke="#E0A800" stroke-width="4" stroke-linejoin="round"/>

  <!-- Körper / Haus -->
  <path d="M86 320 L86 200 Q86 140 146 140 L254 140 Q314 140 314 200 L314 320 Q314 344 290 344 L110 344 Q86 344 86 320 Z" fill="url(#body)" stroke="#5A3BB0" stroke-width="4" stroke-linejoin="round"/>

  <!-- Dach-Wellen (Fell) -->
  <g fill="none" stroke="#5A3BB0" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <path d="M150 150 Q160 160 170 150"/>
    <path d="M176 146 Q186 156 196 146"/>
    <path d="M202 146 Q212 156 222 146"/>
    <path d="M228 150 Q238 160 248 150"/>
  </g>

  <!-- Flecken -->
  <circle cx="108" cy="252" r="9" fill="#9B7CF0"/>
  <circle cx="294" cy="242" r="11" fill="#9B7CF0"/>
  <circle cx="302" cy="296" r="6" fill="#9B7CF0"/>
  <circle cx="104" cy="300" r="6" fill="#9B7CF0"/>

  <!-- Augen (Fenster) -->
  <circle cx="160" cy="200" r="34" fill="#FFFFFF" stroke="#2B2140" stroke-width="4"/>
  <circle cx="240" cy="200" r="34" fill="#FFFFFF" stroke="#2B2140" stroke-width="4"/>
  <circle cx="168" cy="206" r="15" fill="#2B2140"/>
  <circle cx="248" cy="206" r="15" fill="#2B2140"/>
  <circle cx="173" cy="200" r="5" fill="#FFFFFF"/>
  <circle cx="253" cy="200" r="5" fill="#FFFFFF"/>

  <!-- Wangen -->
  <ellipse cx="128" cy="254" rx="12" ry="7" fill="#FF9EC4" opacity="0.7"/>
  <ellipse cx="272" cy="254" rx="12" ry="7" fill="#FF9EC4" opacity="0.7"/>

  <!-- Lächeln / Eingang -->
  <path d="M140 272 Q200 350 260 272 Z" fill="#3B1F4F" stroke="#2B2140" stroke-width="4" stroke-linejoin="round"/>
  <path d="M152 274 L162 292 L172 274 Z" fill="#FFFFFF"/>
  <path d="M176 272 L188 296 L200 272 Z" fill="#FFFFFF"/>
  <path d="M204 272 L216 296 L228 272 Z" fill="#FFFFFF"/>
  <path d="M232 274 L240 290 L248 274 Z" fill="#FFFFFF"/>

  <!-- Füße -->
  <rect x="112" y="330" width="52" height="34" rx="16" fill="#5A3BB0"/>
  <rect x="236" y="330" width="52" height="34" rx="16" fill="#5A3BB0"/>
  <path d="M124 350 l6 6 l6 -6" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <path d="M248 350 l6 6 l6 -6" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>

  <!-- Blumen -->
  <g>
    <circle cx="60" cy="372" r="5" fill="#FF7BA5"/>
    <circle cx="66" cy="366" r="5" fill="#FF7BA5"/>
    <circle cx="54" cy="366" r="5" fill="#FF7BA5"/>
    <circle cx="60" cy="360" r="5" fill="#FF7BA5"/>
    <circle cx="60" cy="366" r="4" fill="#FFD23F"/>
    <circle cx="350" cy="380" r="5" fill="#FFB347"/>
    <circle cx="356" cy="374" r="5" fill="#FFB347"/>
    <circle cx="344" cy="374" r="5" fill="#FFB347"/>
    <circle cx="350" cy="368" r="5" fill="#FFB347"/>
    <circle cx="350" cy="374" r="4" fill="#FFFFFF"/>
  </g>
</svg>