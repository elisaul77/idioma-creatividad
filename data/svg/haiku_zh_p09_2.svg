<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe9b7"/>
      <stop offset="0.6" stop-color="#f7c59f"/>
      <stop offset="1" stop-color="#e88f6a"/>
    </linearGradient>
    <linearGradient id="earth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a3c"/>
      <stop offset="1" stop-color="#4e2f1f"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d6"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sky -->
  <rect width="400" height="400" fill="url(#sky)"/>
  <circle cx="320" cy="90" r="70" fill="url(#sun)"/>
  <circle cx="320" cy="90" r="28" fill="#ffe9a8"/>

  <!-- distant termite mounds -->
  <path d="M0 250 Q30 205 60 250 L60 270 L0 270 Z" fill="#b57a4f" opacity="0.7"/>
  <path d="M330 255 Q365 200 400 255 L400 270 L330 270 Z" fill="#b57a4f" opacity="0.7"/>

  <!-- ground -->
  <path d="M0 270 Q200 250 400 272 L400 400 L0 400 Z" fill="url(#earth)"/>

  <!-- central termite-style tower -->
  <path d="M170 270 L172 190 Q172 160 200 130 Q228 160 228 190 L230 270 Z" fill="#c98b57"/>
  <path d="M182 270 L183 200 Q183 180 200 160 Q217 180 217 200 L218 270 Z" fill="#8c5a36"/>
  <path d="M170 200 L160 185 L172 190 Z M230 200 L240 185 L228 190 Z" fill="#c98b57"/>
  <circle cx="200" cy="118" r="6" fill="#6b3f22"/>
  <line x1="200" y1="112" x2="200" y2="84" stroke="#6b3f22" stroke-width="3"/>
  <circle cx="200" cy="80" r="4" fill="#ffd27a"/>

  <!-- left towers -->
  <path d="M90 270 L92 215 Q92 198 108 182 Q124 198 124 215 L126 270 Z" fill="#d69a66"/>
  <path d="M100 270 L101 222 Q101 210 108 200 Q115 210 115 222 L116 270 Z" fill="#7a4d2c"/>
  <path d="M300 270 L302 225 Q302 208 316 194 Q330 208 330 225 L332 270 Z" fill="#d69a66"/>
  <path d="M310 270 L311 230 Q311 220 316 212 Q321 220 321 230 L322 270 Z" fill="#7a4d2c"/>

  <!-- bridges between towers -->
  <path d="M126 240 Q145 228 170 236" stroke="#6b3f22" stroke-width="3" fill="none"/>
  <path d="M230 236 Q255 228 300 240" stroke="#6b3f22" stroke-width="3" fill="none"/>

  <!-- windows -->
  <g fill="#ffd27a">
    <circle cx="200" cy="200" r="3"/>
    <circle cx="200" cy="230" r="3"/>
    <circle cx="188" cy="245" r="2.5"/>
    <circle cx="212" cy="245" r="2.5"/>
    <circle cx="108" cy="232" r="2.5"/>
    <circle cx="316" cy="240" r="2.5"/>
  </g>

  <!-- flying insects (bees & dragonflies) -->
  <g fill="#3b2a1a">
    <ellipse cx="150" cy="150" rx="7" ry="4"/>
    <ellipse cx="260" cy="165" rx="6" ry="3.5"/>
    <ellipse cx="60" cy="150" rx="5" ry="3"/>
  </g>
  <g stroke="#3b2a1a" stroke-width="1" fill="none">
    <path d="M143 148 Q140 138 134 140"/>
    <path d="M157 148 Q160 138 166 140"/>
    <path d="M253 163 Q250 153 244 155"/>
    <path d="M267 163 Q270 153 276 155"/>
  </g>
  <g fill="#ffffff" opacity="0.6">
    <ellipse cx="150" cy="144" rx="6" ry="3" transform="rotate(-20 150 144)"/>
    <ellipse cx="260" cy="159" rx="5" ry="2.5" transform="rotate(-20 260 159)"/>
  </g>

  <!-- ant trails -->
  <path d="M20 330 Q80 310 140 330 T260 330 T390 325" stroke="#3b2a1a" stroke-width="2" stroke-dasharray="6 6" fill="none"/>
  <g fill="#3b2a1a">
    <circle cx="60" cy="318" r="3"/>
    <circle cx="66" cy="315" r="2"/>
    <circle cx="200" cy="332" r="3"/>
    <circle cx="206" cy="329" r="2"/>
    <circle cx="340" cy="324" r="3"/>
  </g>

  <!-- foreground leaves -->
  <path d="M0 360 Q40 330 90 355 Q50 375 0 380 Z" fill="#4f7a32"/>
  <path d="M400 350 Q360 320 310 350 Q350 375 400 380 Z" fill="#5d8a3a"/>
  <path d="M0 380 L400 380 L400 400 L0 400 Z" fill="#3a2316"/>
</svg>