<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0a2a"/>
      <stop offset="0.6" stop-color="#2a1653"/>
      <stop offset="1" stop-color="#5a2d7a"/>
    </linearGradient>
    <radialGradient id="dream" cx="0.42" cy="0.38" r="0.65">
      <stop offset="0" stop-color="#ffd6f5" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#9fd8ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#6b5bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <mask id="moonMask">
      <rect width="400" height="400" fill="#000"/>
      <circle cx="195" cy="200" r="36" fill="#fff"/>
      <circle cx="212" cy="188" r="30" fill="#000"/>
    </mask>
  </defs>

  <!-- background -->
  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#ffffff" filter="url(#glow)">
    <circle cx="48" cy="58" r="1.6" opacity="0.9"/>
    <circle cx="92" cy="30" r="1.1" opacity="0.7"/>
    <circle cx="330" cy="46" r="1.8" opacity="0.95"/>
    <circle cx="368" cy="110" r="1.2" opacity="0.7"/>
    <circle cx="30" cy="150" r="1.0" opacity="0.6"/>
    <circle cx="358" cy="250" r="1.4" opacity="0.8"/>
    <circle cx="60" cy="300" r="1.3" opacity="0.7"/>
    <circle cx="345" cy="350" r="1.7" opacity="0.9"/>
    <circle cx="150" cy="22" r="1.0" opacity="0.6"/>
    <circle cx="20" cy="380" r="1.2" opacity="0.6"/>
  </g>

  <!-- outer halo -->
  <circle cx="200" cy="200" r="165" fill="url(#halo)"/>

  <!-- dream body: soft, shifting form -->
  <path d="M200,90 C260,80 320,130 315,200 C310,270 330,300 270,325 C210,350 150,335 115,305 C75,270 85,215 95,175 C105,130 140,95 200,90 Z"
        fill="url(#dream)" filter="url(#soft)"/>
  <path d="M200,108 C250,100 298,140 294,200 C290,260 306,284 262,304 C214,324 166,314 136,290 C104,262 110,220 118,186 C126,146 156,116 200,108 Z"
        fill="#ffffff" fill-opacity="0.12"/>

  <!-- inner crescent moon (dreamed object) -->
  <circle cx="200" cy="200" r="36" fill="#fff4c7" mask="url(#moonMask)" filter="url(#glow)"/>

  <!-- wisps curling around -->
  <path d="M140,250 C170,230 185,275 220,255 C250,238 262,205 292,215"
        fill="none" stroke="#ffd6f5" stroke-width="2" stroke-linecap="round" opacity="0.6" filter="url(#glow)"/>
  <path d="M120,195 C140,175 160,200 170,180 C180,160 205,170 215,150"
        fill="none" stroke="#9fd8ff" stroke-width="1.5" stroke-linecap="round" opacity="0.5" filter="url(#glow)"/>

  <!-- dissolving particles drifting upward -->
  <g fill="#ffffff" filter="url(#glow)">
    <circle cx="282" cy="130" r="4" opacity="0.5"/>
    <circle cx="300" cy="104" r="3" opacity="0.4"/>
    <circle cx="318" cy="82" r="2.2" opacity="0.35"/>
    <circle cx="336" cy="62" r="1.5" opacity="0.3"/>
    <circle cx="96" cy="120" r="3.5" opacity="0.45"/>
    <circle cx="78" cy="96" r="2.4" opacity="0.35"/>
    <circle cx="62" cy="72" r="1.6" opacity="0.3"/>
    <circle cx="262" cy="350" r="3" opacity="0.4"/>
    <circle cx="282" cy="372" r="2" opacity="0.3"/>
    <circle cx="130" cy="362" r="2.6" opacity="0.35"/>
  </g>
  <g fill="#ffd6f5" opacity="0.7">
    <circle cx="250" cy="150" r="2"/>
    <circle cx="150" cy="130" r="1.6"/>
    <circle cx="230" cy="290" r="1.8"/>
  </g>
</svg>