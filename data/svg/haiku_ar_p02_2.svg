<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="sky" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#2b1b5a"/>
      <stop offset="55%" stop-color="#14123a"/>
      <stop offset="100%" stop-color="#070819"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6d6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fff6d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7f5af0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2cb1bc" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff8fab" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff8fab" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f9c74f" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7f5af0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#b8a4ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#b8a4ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <clipPath id="frame">
      <rect x="0" y="0" width="400" height="400" rx="0"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Background dream sky -->
    <rect width="400" height="400" fill="url(#sky)"/>

    <!-- Drifting nebula clouds -->
    <ellipse cx="120" cy="120" rx="130" ry="70" fill="#7f5af0" opacity="0.18" filter="url(#blur)"/>
    <ellipse cx="300" cy="280" rx="120" ry="80" fill="#2cb1bc" opacity="0.16" filter="url(#blur)"/>
    <ellipse cx="200" cy="330" rx="150" ry="50" fill="#ff8fab" opacity="0.12" filter="url(#blur)"/>

    <!-- Stars -->
    <g fill="#ffffff">
      <circle cx="40" cy="60" r="1.6" opacity="0.9"/>
      <circle cx="95" cy="30" r="1.1" opacity="0.7"/>
      <circle cx="165" cy="48" r="1.4" opacity="0.8"/>
      <circle cx="350" cy="55" r="1.8" opacity="0.9"/>
      <circle cx="372" cy="150" r="1.2" opacity="0.6"/>
      <circle cx="30" cy="210" r="1.3" opacity="0.7"/>
      <circle cx="60" cy="350" r="1.5" opacity="0.8"/>
      <circle cx="250" cy="25" r="1" opacity="0.6"/>
      <circle cx="330" cy="370" r="1.4" opacity="0.7"/>
      <circle cx="140" cy="380" r="1.1" opacity="0.5"/>
    </g>

    <!-- Crescent moon -->
    <circle cx="200" cy="170" r="95" fill="url(#moonGlow)"/>
    <path d="M 200 100 A 70 70 0 1 0 270 180 A 55 55 0 1 1 200 100 Z" fill="#fff3c4" opacity="0.95"/>

    <!-- Flowing dream waves -->
    <path d="M -20 250 C 60 200, 130 300, 210 250 S 340 200, 420 240 L 420 420 L -20 420 Z" fill="url(#wave1)"/>
    <path d="M -20 300 C 70 260, 150 340, 230 295 S 350 260, 420 300 L 420 420 L -20 420 Z" fill="url(#wave2)"/>

    <!-- Spiraling thoughts -->
    <g fill="none" stroke="#ffffff" stroke-linecap="round" opacity="0.45">
      <path d="M 90 230 C 60 200, 110 175, 130 205 C 150 235, 110 255, 95 235" stroke-width="1.5"/>
      <path d="M 300 110 C 330 90, 355 120, 335 140 C 315 160, 290 135, 310 120" stroke-width="1.4"/>
    </g>

    <!-- Floating orbs -->
    <circle cx="85" cy="300" r="18" fill="url(#orb)"/>
    <circle cx="320" cy="210" r="12" fill="url(#orb)"/>
    <circle cx="150" cy="80" r="9" fill="url(#orb)"/>
    <circle cx="255" cy="335" r="22" fill="url(#orb)" opacity="0.8"/>
    <circle cx="60" cy="140" r="7" fill="url(#orb)"/>

    <!-- Soft foreground sparkles -->
    <g fill="#ffe8a3" filter="url(#softBlur)">
      <circle cx="210" cy="265" r="2.5"/>
      <circle cx="115" cy="150" r="2"/>
      <circle cx="350" cy="320" r="2.2"/>
      <circle cx="40" cy="260" r="1.8"/>
    </g>

    <!-- Subtle vignette -->
    <rect width="400" height="400" fill="none" stroke="#070819" stroke-width="40" opacity="0.35" filter="url(#blur)"/>
  </g>
</svg>