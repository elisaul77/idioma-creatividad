<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1026"/>
      <stop offset="1" stop-color="#1B1035"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFF7B0"/>
      <stop offset="0.6" stop-color="#FFD54A"/>
      <stop offset="1" stop-color="#FF8C00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="outer" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFB347"/>
      <stop offset="1" stop-color="#D2461E"/>
    </radialGradient>
    <radialGradient id="mantle" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#C8743A"/>
      <stop offset="1" stop-color="#8E4A22"/>
    </radialGradient>
    <linearGradient id="crust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6B8E4E"/>
      <stop offset="1" stop-color="#3E5A2E"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8E9AA8"/>
      <stop offset="0.5" stop-color="#EEF2F6"/>
      <stop offset="1" stop-color="#7A8594"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF4C2"/>
      <stop offset="0.5" stop-color="#FF9A2E"/>
      <stop offset="1" stop-color="#FF3D00" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)"/>
  <g fill="#FFFFFF">
    <circle cx="38" cy="46" r="1.5"/>
    <circle cx="356" cy="58" r="1.2"/>
    <circle cx="330" cy="352" r="1.5"/>
    <circle cx="60" cy="350" r="1.2"/>
    <circle cx="372" cy="210" r="1"/>
    <circle cx="24" cy="200" r="1.2"/>
    <circle cx="300" cy="24" r="1"/>
    <circle cx="110" cy="18" r="1.2"/>
  </g>

  <!-- Earth cross-section layers -->
  <circle cx="200" cy="200" r="170" fill="url(#crust)"/>
  <circle cx="200" cy="200" r="142" fill="url(#mantle)"/>
  <circle cx="200" cy="200" r="98" fill="url(#outer)"/>
  <circle cx="200" cy="200" r="58" fill="#FFB020"/>
  <circle cx="200" cy="200" r="34" fill="url(#core)"/>
  <circle cx="200" cy="200" r="170" fill="none" stroke="#A8D08D" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Tunnel -->
  <rect x="190" y="30" width="20" height="170" fill="#120A06"/>
  <rect x="190" y="30" width="20" height="170" fill="none" stroke="#FFB27A" stroke-opacity="0.5" stroke-width="1"/>

  <!-- Guide line to center -->
  <line x1="200" y1="150" x2="200" y2="196" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Vehicle exhaust -->
  <polygon points="193,92 207,92 200,66" fill="url(#flame)"/>
  <polygon points="196,92 204,92 200,78" fill="#FFFFFF" fill-opacity="0.8"/>

  <!-- Vehicle body -->
  <rect x="191" y="92" width="18" height="34" rx="8" fill="url(#hull)"/>
  <polygon points="191,124 209,124 200,144" fill="#B9C3CF"/>
  <circle cx="200" cy="106" r="3.5" fill="#3FA9F5"/>
  <rect x="188" y="118" width="24" height="3" rx="1.5" fill="#5C6876"/>

  <!-- Heat particles -->
  <g fill="#FFD27A">
    <circle cx="184" cy="140" r="1.8" fill-opacity="0.8"/>
    <circle cx="216" cy="134" r="1.5" fill-opacity="0.7"/>
    <circle cx="182" cy="160" r="1.2" fill-opacity="0.6"/>
    <circle cx="219" cy="166" r="1.6" fill-opacity="0.7"/>
  </g>
</svg>