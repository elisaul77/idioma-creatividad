<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1433"/>
      <stop offset="1" stop-color="#2d1f52"/>
    </linearGradient>
    <radialGradient id="luna" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8d6"/>
      <stop offset="0.7" stop-color="#ffe98a"/>
      <stop offset="1" stop-color="#ffe98a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="suelo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b4226"/>
      <stop offset="1" stop-color="#3e2415"/>
    </linearGradient>
    <radialGradient id="ojo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e0ffff"/>
      <stop offset="1" stop-color="#3ee6ff"/>
    </radialGradient>
  </defs>

  <!-- Cielo -->
  <rect width="400" height="400" fill="url(#cielo)"/>

  <!-- Estrellas -->
  <g fill="#ffffff">
    <circle cx="40" cy="45" r="1.8"/>
    <circle cx="95" cy="25" r="1.2"/>
    <circle cx="160" cy="60" r="1.6"/>
    <circle cx="210" cy="30" r="1.1"/>
    <circle cx="60" cy="130" r="1.3"/>
    <circle cx="150" cy="120" r="1"/>
    <circle cx="260" cy="130" r="1.5"/>
    <circle cx="375" cy="170" r="1.2"/>
    <circle cx="20" cy="200" r="1"/>
    <circle cx="190" cy="180" r="1.1"/>
  </g>

  <!-- Luna -->
  <circle cx="320" cy="70" r="70" fill="url(#luna)" opacity="0.5"/>
  <circle cx="320" cy="70" r="36" fill="#fff3b0"/>
  <circle cx="334" cy="60" r="30" fill="#2d1f52" opacity="0.35"/>

  <!-- Estrella fugaz -->
  <path d="M 230 70 L 290 105" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Suelo -->
  <rect x="0" y="320" width="400" height="80" fill="url(#suelo)"/>
  <rect x="0" y="320" width="400" height="4" fill="#8a5a36"/>

  <!-- Peluche de oso (bailando, brazos arriba) -->
  <g>
    <ellipse cx="110" cy="290" rx="34" ry="40" fill="#b07a4a"/>
    <path d="M 84 275 Q 62 240 70 215" stroke="#b07a4a" stroke-width="13" fill="none" stroke-linecap="round"/>
    <path d="M 136 275 Q 158 240 150 215" stroke="#b07a4a" stroke-width="13" fill="none" stroke-linecap="round"/>
    <ellipse cx="110" cy="320" rx="16" ry="8" fill="#8a5a36"/>
    <circle cx="110" cy="235" r="28" fill="#b07a4a"/>
    <circle cx="88" cy="215" r="10" fill="#b07a4a"/>
    <circle cx="132" cy="215" r="10" fill="#b07a4a"/>
    <circle cx="88" cy="215" r="5" fill="#e8b98c"/>
    <circle cx="132" cy="215" r="5" fill="#e8b98c"/>
    <circle cx="101" cy="232" r="3" fill="#2b1a0e"/>
    <circle cx="119" cy="232" r="3" fill="#2b1a0e"/>
    <ellipse cx="110" cy="243" rx="8" ry="6" fill="#e8b98c"/>
    <circle cx="110" cy="241" r="2.5" fill="#2b1a0e"/>
    <path d="M 104 248 Q 110 252 116 248" stroke="#2b1a0e" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Robot de juguete -->
  <g>
    <line x1="265" y1="200" x2="265" y2="180" stroke="#9aa7b8" stroke-width="3"/>
    <circle cx="265" cy="176" r="6" fill="#ff6b6b"/>
    <rect x="235" y="200" width="60" height="62" rx="8" fill="#9aa7b8"/>
    <rect x="245" y="214" width="40" height="22" rx="5" fill="#2b3550"/>
    <circle cx="256" cy="225" r="5" fill="url(#ojo)"/>
    <circle cx="274" cy="225" r="5" fill="url(#ojo)"/>
    <rect x="248" y="262" width="34" height="8" rx="3" fill="#5f6b7d"/>
    <rect x="225" y="262" width="80" height="58" rx="8" fill="#7d8ba0"/>
    <circle cx="265" cy="290" r="9" fill="#ffd166"/>
    <rect x="212" y="270" width="12" height="36" rx="6" fill="#5f6b7d"/>
    <rect x="306" y="270" width="12" height="36" rx="6" fill="#5f6b7d"/>
    <rect x="240" y="320" width="20" height="8" rx="3" fill="#2b3550"/>
    <rect x="270" y="320" width="20" height="8" rx="3" fill="#2b3550"/>
  </g>

  <!-- Pelota rebotando -->
  <g>
    <ellipse cx="365" cy="330" rx="16" ry="4" fill="#000000" opacity="0.35"/>
    <circle cx="365" cy="280" r="20" fill="#ef476f"/>
    <path d="M 348 280 Q 365 268 382 280" stroke="#ffd166" stroke-width="4" fill="none"/>
    <path d="M 348 280 Q 365 292 382 280" stroke="#06d6a0" stroke-width="4" fill="none"/>
  </g>

  <!-- Trompo girando -->
  <g>
    <ellipse cx="50" cy="346" rx="14" ry="3" fill="#000000" opacity="0.35"/>
    <path d="M 50 300 L 62 326 L 50 346 L 38 326 Z" fill="#06d6a0"/>
    <ellipse cx="50" cy="326" rx="12" ry="4" fill="#ffd166"/>
    <path d="M 26 300 Q 50 286 74 300" stroke="#ffffff" stroke-width="1.2" fill="none" stroke-dasharray="3 4" opacity="0.6"/>
  </g>

  <!-- Destellos de magia -->
  <g fill="#ffe98a">
    <path d="M 150 190 l 3 -8 l 3 8 l 8 3 l -8 3 l -3 8 l -3 -8 l -8 -3 Z" opacity="0.9"/>
    <path d="M 200 260 l 2 -6 l 2 6 l 6 2 l -6 2 l -2 6 l -2 -6 l -6 -2 Z" opacity="0.8"/>
    <path d="M 30 240 l 2 -6 l 2 6 l 6 2 l -6 2 l -2 6 l -2 -6 l -6 -2 Z" opacity="0.7"/>
  </g>
</svg>