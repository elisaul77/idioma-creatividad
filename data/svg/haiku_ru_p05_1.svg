<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e1f"/>
      <stop offset="1" stop-color="#1a0c08"/>
    </linearGradient>
    <radialGradient id="crust" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.85" stop-color="#5a4128"/>
      <stop offset="1" stop-color="#3b2a1a"/>
    </radialGradient>
    <radialGradient id="mantle" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b5532a"/>
      <stop offset="1" stop-color="#7a2e17"/>
    </radialGradient>
    <radialGradient id="outerCore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#e0401e"/>
    </radialGradient>
    <radialGradient id="innerCore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="0.6" stop-color="#ffe066"/>
      <stop offset="1" stop-color="#ffb000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7d8794"/>
      <stop offset="0.5" stop-color="#e6ecf2"/>
      <stop offset="1" stop-color="#6b7480"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="0.6" stop-color="#ff7a1a" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ff3d00" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="earthClip">
      <circle cx="200" cy="200" r="170"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- Distant sparks -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="36" cy="58" r="1.2"/>
    <circle cx="352" cy="46" r="1"/>
    <circle cx="74" cy="330" r="1.4"/>
    <circle cx="326" cy="346" r="1"/>
    <circle cx="48" cy="200" r="0.9"/>
    <circle cx="362" cy="214" r="1.2"/>
    <circle cx="130" cy="28" r="0.8"/>
    <circle cx="282" cy="372" r="0.9"/>
  </g>

  <!-- Planet cutaway -->
  <g clip-path="url(#earthClip)">
    <circle cx="200" cy="200" r="170" fill="url(#crust)"/>
    <circle cx="200" cy="200" r="120" fill="url(#mantle)"/>
    <circle cx="200" cy="200" r="70" fill="url(#outerCore)"/>
    <!-- Layer strata -->
    <g fill="none" stroke="#2a1a10" stroke-width="1" opacity="0.5">
      <circle cx="200" cy="200" r="150"/>
      <circle cx="200" cy="200" r="135"/>
      <circle cx="200" cy="200" r="100"/>
    </g>
  </g>
  <circle cx="200" cy="200" r="170" fill="none" stroke="#8a6a3c" stroke-width="2"/>

  <!-- Tunnel from surface to the core -->
  <rect x="192" y="30" width="16" height="160" fill="#080604" opacity="0.85"/>
  <rect x="192" y="30" width="16" height="160" fill="none" stroke="#ffb347" stroke-width="0.8" opacity="0.5"/>

  <!-- Inner core glow -->
  <circle cx="200" cy="200" r="34" fill="url(#innerCore)" filter="url(#glow)"/>
  <circle cx="200" cy="200" r="16" fill="#fff8d0" filter="url(#glow)"/>

  <!-- Vehicle descending toward the center -->
  <g transform="translate(200,150)">
    <!-- Exhaust flame -->
    <path d="M-7,-18 Q0,-52 7,-18 Z" fill="url(#flame)" filter="url(#glow)"/>
    <!-- Fins -->
    <path d="M-11,-8 L-22,6 L-11,8 Z" fill="#9aa5b1"/>
    <path d="M11,-8 L22,6 L11,8 Z" fill="#9aa5b1"/>
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="12" ry="20" fill="url(#metal)"/>
    <!-- Drill nose -->
    <path d="M-12,8 L0,32 L12,8 Z" fill="#c9d1da"/>
    <path d="M-6,14 L0,30 L6,14" fill="none" stroke="#6b7480" stroke-width="1"/>
    <!-- Window -->
    <circle cx="0" cy="-4" r="4.5" fill="#5fd4ff" stroke="#1d3b4d" stroke-width="1"/>
    <circle cx="-1.5" cy="-5.5" r="1.2" fill="#ffffff" opacity="0.8"/>
    <!-- Hull band -->
    <rect x="-12" y="-12" width="24" height="2" fill="#4a5361"/>
  </g>

  <!-- Trajectory dashes -->
  <line x1="200" y1="30" x2="200" y2="130" stroke="#ffb347" stroke-width="1" stroke-dasharray="3 5" opacity="0.5"/>
</svg>