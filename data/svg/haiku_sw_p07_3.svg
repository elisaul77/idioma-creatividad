<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0a2a"/>
      <stop offset="0.6" stop-color="#2a1458"/>
      <stop offset="1" stop-color="#0e4a5c"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd1f5" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff5fd2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="leaf" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#e0fff9"/>
      <stop offset="0.5" stop-color="#3ff2d0"/>
      <stop offset="1" stop-color="#1a7cff" stop-opacity="0.6"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#sky)"/>

