<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="anga" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1b2a4a"/>
      <stop offset="100%" stop-color="#050812"/>
    </radialGradient>
    <radialGradient id="ukoko" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#9a6a3a"/>
      <stop offset="100%" stop-color="#4a2e16"/>
    </radialGradient>
    <radialGradient id="vazi" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#e0784a"/>
      <stop offset="100%" stop-color="#8a2e12"/>
    </radialGradient>
    <radialGradient id="msingi-nje" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ffd27a"/>
      <stop offset="100%" stop-color="#d9782a"/>
    </radialGradient>
    <radialGradient id="msingi-ndani" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#fff7d6"/>
      <stop offset="60%" stop-color="#ffe08a"/>
      <stop offset="100%" stop-color="#f5b842"/>
    </radialGradient>
    <radialGradient id="mwanga" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7fe7ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7fe7ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chombo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8eef7"/>
      <stop offset="100%" stop-color="#7d8ba3"/>
    </linearGradient>
  </defs>

  <!-- Anga -->
  <rect width="400" height="400" fill="url(#anga)"/>
  <g fill="#ffffff">
    <circle cx="40" cy="50" r="1.2" opacity="0.8"/>
    <circle cx="90" cy="280" r="1" opacity="0.6"/>
    <circle cx="350" cy="60" r="1.4" opacity="0.9"/>
    <circle cx="320" cy="330" r="1" opacity="0.6"/>
    <circle cx="60" cy="360" r="1.2" opacity="0.7"/>
    <circle cx="370" cy="200" r="1" opacity="0.5"/>
    <circle cx="25" cy="170" r="1" opacity="0.5"/>
    <circle cx="260" cy="25" r="1" opacity="0.6"/>
  </g>

  <!-- Tabaka za Dunia -->
  <circle cx="200" cy="200" r="170" fill="url(#ukoko)"/>
  <circle cx="200" cy="200" r="140" fill="url(#vazi)"/>
  <circle cx="200" cy="200" r="100" fill="url(#msingi-nje)"/>
  <circle cx="200" cy="200" r="55" fill="url(#msingi-ndani)"/>

  <!-- Mwanga wa kiini -->
  <circle cx="200" cy="200" r="70" fill="url(#mwanga)" opacity="0.5"/>

  <!-- Njia ya safari -->
  <line x1="200" y1="18" x2="200" y2="170" stroke="#7fe7ff" stroke-width="2" stroke-dasharray="6 6" opacity="0.8"/>

  <!-- Mwangaza wa chombo -->
  <ellipse cx="200" cy="180" rx="22" ry="34" fill="#7fe7ff" opacity="0.25"/>

  <!-- Chombo -->
  <g transform="translate(200,185)">
    <path d="M0,-22 C12,-22 16,-8 16,6 L16,14 L-16,14 L-16,6 C-16,-8 -12,-22 0,-22 Z" fill="url(#chombo)" stroke="#2c3a52" stroke-width="1.5"/>
    <circle cx="0" cy="-6" r="5" fill="#1b3c5c" stroke="#7fe7ff" stroke-width="1.5"/>
    <path d="M-16,4 L-26,16 L-16,14 Z" fill="#5c6b84"/>
    <path d="M16,4 L26,16 L16,14 Z" fill="#5c6b84"/>
    <path d="M-8,14 L-6,24 L0,20 L6,24 L8,14 Z" fill="#ff8a3d" opacity="0.9"/>
  </g>

  <!-- Mng'ao wa mwisho -->
  <circle cx="200" cy="200" r="6" fill="#fff7d6" opacity="0.9"/>
</svg>