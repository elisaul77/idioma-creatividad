<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="space" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1a2446"/>
      <stop offset="100%" stop-color="#03040a"/>
    </radialGradient>
    <radialGradient id="crust" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#8a6a45"/>
      <stop offset="100%" stop-color="#3e2a1a"/>
    </radialGradient>
    <radialGradient id="mantle" cx="45%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#c2703a"/>
      <stop offset="100%" stop-color="#7a3416"/>
    </radialGradient>
    <radialGradient id="outerCore" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#c8501a"/>
    </radialGradient>
    <radialGradient id="innerCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbe6"/>
      <stop offset="60%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#ff8c00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6d8197"/>
      <stop offset="50%" stop-color="#e9f0f7"/>
      <stop offset="100%" stop-color="#55667a"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fdbff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#7fdbff" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glassGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bff3ff"/>
      <stop offset="100%" stop-color="#1e6f8c"/>
    </radialGradient>
  </defs>

  <!-- Space background -->
  <rect width="400" height="400" fill="url(#space)"/>
  <circle cx="40" cy="50" r="1.2" fill="#ffffff"/>
  <circle cx="90" cy="330" r="1" fill="#cfe3ff"/>
  <circle cx="330" cy="60" r="1.4" fill="#ffffff"/>
  <circle cx="360" cy="250" r="1" fill="#ffffff"/>
  <circle cx="55" cy="200" r="1" fill="#cfe3ff"/>
  <circle cx="345" cy="340" r="1.2" fill="#ffffff"/>
  <circle cx="20" cy="380" r="1" fill="#ffffff"/>

  <!-- Earth cross-section layers -->
  <circle cx="200" cy="200" r="150" fill="url(#crust)"/>
  <circle cx="200" cy="200" r="115" fill="url(#mantle)"/>
  <circle cx="200" cy="200" r="72" fill="url(#outerCore)"/>
  <circle cx="200" cy="200" r="34" fill="url(#innerCore)"/>
  <circle cx="200" cy="200" r="150" fill="none" stroke="#2a1c10" stroke-width="2" opacity="0.6"/>

  <!-- Core glow -->
  <circle cx="200" cy="200" r="48" fill="url(#innerCore)" opacity="0.5"/>

  <!-- Descent shaft -->
  <rect x="195" y="50" width="10" height="150" fill="#05060d" opacity="0.85"/>
  <line x1="200" y1="50" x2="200" y2="122" stroke="url(#trail)" stroke-width="4"/>

  <!-- Vehicle: capsule body -->
  <ellipse cx="200" cy="148" rx="12" ry="26" fill="url(#hull)"/>
  <rect x="188" y="120" width="24" height="6" fill="#3b4b5e"/>

  <!-- Cockpit -->
  <circle cx="200" cy="136" r="5" fill="url(#glassGlow)"/>

  <!-- Side fins -->
  <polygon points="188,150 176,172 188,168" fill="#7d91a8"/>
  <polygon points="212,150 224,172 212,168" fill="#7d91a8"/>

  <!-- Drill nose -->
  <polygon points="188,170 212,170 200,198" fill="#4a5a6e"/>
  <polygon points="192,172 208,172 200,192" fill="#9fb3c8"/>

  <!-- Thruster glow -->
  <ellipse cx="200" cy="120" rx="6" ry="4" fill="#ffb347" opacity="0.8"/>
  <ellipse cx="200" cy="118" rx="3" ry="6" fill="#fff4b0" opacity="0.7"/>

  <!-- Drill spin rings -->
  <ellipse cx="200" cy="184" rx="12" ry="3" fill="none" stroke="#e9f0f7" stroke-width="1" opacity="0.6"/>
  <ellipse cx="200" cy="192" rx="7" ry="2" fill="none" stroke="#e9f0f7" stroke-width="1" opacity="0.4"/>
</svg>