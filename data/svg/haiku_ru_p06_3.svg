<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="55%" stop-color="#FFD6A5"/>
      <stop offset="100%" stop-color="#FFADC6"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="60%" stop-color="#FFD23F"/>
      <stop offset="100%" stop-color="#FFB703"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- Soft glow behind sun -->
  <circle cx="200" cy="200" r="150" fill="url(#glow)"/>

  <!-- Rays -->
  <g fill="#FF8FAB" opacity="0.85">
    <path d="M200 20 L212 70 L188 70 Z"/>
    <path d="M200 380 L212 330 L188 330 Z"/>
    <path d="M20 200 L70 188 L70 212 Z"/>
    <path d="M380 200 L330 188 L330 212 Z"/>
    <path d="M70 70 L108 100 L100 108 Z"/>
    <path d="M330 330 L292 300 L300 292 Z"/>
    <path d="M330 70 L300 100 L292 108 Z"/>
    <path d="M70 330 L100 300 L108 292 Z"/>
  </g>

  <!-- Sun body -->
  <circle cx="200" cy="200" r="95" fill="url(#sun)"/>
  <circle cx="200" cy="200" r="95" fill="none" stroke="#FF9F1C" stroke-width="4" opacity="0.5"/>

  <!-- Rosy cheeks -->
  <ellipse cx="160" cy="225" rx="13" ry="8" fill="#FF7EB3" opacity="0.7"/>
  <ellipse cx="240" cy="225" rx="13" ry="8" fill="#FF7EB3" opacity="0.7"/>

  <!-- Happy closed eyes -->
  <path d="M258 180 Q172 160 170 180" fill="none" stroke="#5A3E36" stroke-width="7" stroke-linecap="round" transform="translate(0,0)" opacity="0"/>
  <path d="M245 185 Q170 150 170 185" fill="none" stroke="#5A3E36" stroke-width="0"/>
  <path d="M158 188 Q170 170 182 188" fill="none" stroke="#5A3E36" stroke-width="7" stroke-linecap="round"/>
  <path d="M218 188 Q230 170 242 188" fill="none" stroke="#5A3E36" stroke-width="7" stroke-linecap="round"/>

  <!-- Big smile -->
  <path d="M155 220 Q200 275 245 220 Z" fill="#8B2E4B" stroke="#8B2E4B" stroke-width="5" stroke-linejoin="round"/>
  <path d="M170 228 Q200 252 230 228 Q200 240 170 228 Z" fill="#FF8FAB"/>

  <!-- Joyful bouncing circles -->
  <circle cx="60" cy="110" r="14" fill="#3DDC97"/>
  <circle cx="345" cy="115" r="11" fill="#4CC9F0"/>
  <circle cx="70" cy="300" r="9" fill="#B388FF"/>
  <circle cx="335" cy="290" r="16" fill="#3DDC97"/>
  <circle cx="110" cy="365" r="8" fill="#FF6B6B"/>
  <circle cx="290" cy="368" r="10" fill="#4CC9F0"/>

  <!-- Confetti -->
  <rect x="120" y="60" width="12" height="6" rx="2" fill="#B388FF" transform="rotate(25 126 63)"/>
  <rect x="275" y="55" width="12" height="6" rx="2" fill="#FF6B6B" transform="rotate(-30 281 58)"/>
  <rect x="40" y="200" width="6" height="12" rx="2" fill="#4CC9F0" transform="rotate(15 43 206)"/>
  <rect x="350" y="200" width="6" height="12" rx="2" fill="#FF6B6B" transform="rotate(-20 353 206)"/>
  <rect x="150" y="345" width="12" height="6" rx="2" fill="#FFD23F" transform="rotate(40 156 348)"/>
  <rect x="240" y="350" width="12" height="6" rx="2" fill="#3DDC97" transform="rotate(-35 246 353)"/>
  <path d="M95 150 l6 -10 l6 10 z" fill="#FF6B6B"/>
  <path d="M300 240 l6 -10 l6 10 z" fill="#B388FF"/>
  <path d="M320 150 l5 8 l5 -8 z" fill="#FFD23F"/>
  <path d="M85 250 l5 8 l5 -8 z" fill="#3DDC97"/>
</svg>