<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1433"/>
      <stop offset="1" stop-color="#2a2f6e"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3b0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff3b0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd23f" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffd23f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Night sky -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="30" cy="40" r="1.5"/>
    <circle cx="70" cy="90" r="1"/>
    <circle cx="150" cy="30" r="1.8"/>
    <circle cx="200" cy="70" r="1"/>
    <circle cx="240" cy="25" r="1.4"/>
    <circle cx="370" cy="150" r="1.6"/>
    <circle cx="20" cy="160" r="1.2"/>
    <circle cx="180" cy="130" r="1"/>
    <circle cx="260" cy="200" r="1.2"/>
    <circle cx="50" cy="210" r="1"/>
    <circle cx="385" cy="260" r="1"/>
  </g>

  <!-- Moon window -->
  <rect x="290" y="30" width="90" height="110" rx="4" fill="#1b2a5e" stroke="#6b5b95" stroke-width="6"/>
  <line x1="335" y1="30" x2="335" y2="140" stroke="#6b5b95" stroke-width="4"/>
  <line x1="290" y1="85" x2="380" y2="85" stroke="#6b5b95" stroke-width="4"/>
  <circle cx="312" cy="60" r="18" fill="#fff3b0"/>
  <circle cx="320" cy="55" r="15" fill="#1b2a5e"/>
  <circle cx="356" cy="112" r="2" fill="#ffffff"/>
  <circle cx="310" cy="118" r="1.5" fill="#ffffff"/>

  <!-- Moonlight beam on floor -->
  <polygon points="290,140 380,140 420,350 250,350" fill="url(#beam)"/>

  <!-- Floor -->
  <rect x="0" y="350" width="400" height="50" fill="#4a3360"/>
  <line x1="0" y1="372" x2="400" y2="372" stroke="#3a2750" stroke-width="2"/>
  <line x1="0" y1="392" x2="400" y2="392" stroke="#3a2750" stroke-width="2"/>

  <!-- Toy airplane flying -->
  <g transform="rotate(-12 120 110)">
    <ellipse cx="120" cy="110" rx="24" ry="7" fill="#e74c3c"/>
    <polygon points="112,110 130,110 124,96 118,96" fill="#f5b041"/>
    <polygon points="112,110 124,110 118,124 108,124" fill="#f5b041"/>
    <circle cx="142" cy="110" r="3" fill="#ffffff"/>
  </g>
  <path d="M40 130 Q70 118 92 112" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" fill="none" stroke-dasharray="4 5"/>

  <!-- Bouncing ball with trail -->
  <circle cx="318" cy="250" r="6" fill="#ff7f50" opacity="0.2"/>
  <circle cx="330" cy="232" r="8" fill="#ff7f50" opacity="0.3"/>
  <circle cx="350" cy="212" r="18" fill="#ff7f50"/>
  <path d="M332 212 Q350 196 368 212" stroke="#ffe0b2" stroke-width="4" fill="none"/>
  <path d="M350 194 Q366 212 350 230" stroke="#ffe0b2" stroke-width="4" fill="none"/>

  <!-- Teddy bear dancing -->
  <ellipse cx="100" cy="290" rx="40" ry="46" fill="#b5773f"/>
  <ellipse cx="80" cy="338" rx="14" ry="9" fill="#9a5f30"/>
  <ellipse cx="120" cy="338" rx="14" ry="9" fill="#9a5f30"/>
  <ellipse cx="62" cy="290" rx="12" ry="26" fill="#b5773f" transform="rotate(20 62 290)"/>
  <ellipse cx="142" cy="262" rx="11" ry="26" fill="#b5773f" transform="rotate(-35 142 262)"/>
  <circle cx="100" cy="225" r="34" fill="#b5773f"/>
  <circle cx="72" cy="195" r="12" fill="#b5773f"/>
  <circle cx="128" cy="195" r="12" fill="#b5773f"/>
  <circle cx="72" cy="195" r="6" fill="#e0a878"/>
  <circle cx="128" cy="195" r="6" fill="#e0a878"/>
  <ellipse cx="100" cy="237" rx="16" ry="12" fill="#e8c39a"/>
  <ellipse cx="100" cy="229" rx="5" ry="4" fill="#3b2314"/>
  <circle cx="88" cy="216" r="4" fill="#2a1a10"/>
  <circle cx="112" cy="216" r="4" fill="#2a1a10"/>
  <circle cx="89" cy="215" r="1.2" fill="#ffffff"/>
  <circle cx="113" cy="215" r="1.2" fill="#ffffff"/>
  <path d="M94 242 Q100 248 106 242" stroke="#3b2314" stroke-width="2" fill="none"/>
  <!-- Music notes -->
  <g fill="#ffd23f">
    <circle cx="165" cy="200" r="4"/>
    <rect x="168.5" y="180" width="2" height="20"/>
    <circle cx="180" cy="186" r="3"/>
    <rect x="183" y="170" width="2" height="16"/>
  </g>

  <!-- Robot glowing -->
  <circle cx="230" cy="270" r="60" fill="url(#glow)"/>
  <rect x="227" y="192" width="6" height="0" fill="#9aa7c7"/>
  <line x1="230" y1="190" x2="230" y2="172" stroke="#9aa7c7" stroke-width="3"/>
  <circle cx="230" cy="168" r="5" fill="#ffd23f"/>
  <rect x="200" y="190" width="60" height="50" rx="8" fill="#9aa7c7"/>
  <rect x="210" y="205" width="12" height="10" rx="2" fill="#ffd23f"/>
  <rect x="238" y="205" width="12" height="10" rx="2" fill="#ffd23f"/>
  <rect x="218" y="226" width="24" height="5" rx="2" fill="#3d4a6b"/>
  <rect x="217" y="240" width="26" height="8" fill="#6b7694"/>
  <rect x="200" y="248" width="60" height="52" rx="6" fill="#e85d75"/>
  <circle cx="230" cy="270" r="8" fill="#ffd23f"/>
  <rect x="180" y="252" width="16" height="38" rx="6" fill="#6b7694" transform="rotate(-30 188 252)"/>
  <rect x="264" y="252" width="16" height="38" rx="6" fill="#6b7694" transform="rotate(30 272 252)"/>
  <rect x="208" y="300" width="18" height="36" rx="4" fill="#6b7694"/>
  <rect x="236" y="300" width="18" height="36" rx="4" fill="#6b7694"/>

  <!-- Toy train on the floor -->
  <rect x="268" y="318" width="60" height="30" rx="4" fill="#2e86de"/>
  <rect x="298" y="302" width="30" height="20" rx="3" fill="#1f6fbf"/>
  <rect x="276" y="306" width="8" height="14" fill="#333d55"/>
  <rect x="288" y="326" width="40" height="4" fill="#ffd23f"/>
  <circle cx="284" cy="352" r="8" fill="#222"/>
  <circle cx="310" cy="352" r="8" fill="#222"/>
  <circle cx="334" cy="352" r="8" fill="#222"/>
  <circle cx="284" cy="352" r="3" fill="#888"/>
  <circle cx="310" cy="352" r="3" fill="#888"/>
  <circle cx="334" cy="352" r="3" fill="#888"/>

  <!-- Sparkles -->
  <g fill="#ffffff">
    <path d="M160 310 L162 316 L168 318 L162 320 L160 326 L158 320 L152 318 L158 316 Z"/>
    <path d="M30 330 L31.5 334 L36 335.5 L31.5 337 L30 341 L28.5 337 L24 335.5 L28.5 334 Z"/>
    <path d="M385 370 L386.5 374 L391 375.5 L386.5 377 L385 381 L383.5 377 L379 375.5 L383.5 374 Z"/>
  </g>
</svg>