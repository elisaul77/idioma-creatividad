<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="sky" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#fff8c9"/>
      <stop offset="60%" stop-color="#ffd6e7"/>
      <stop offset="100%" stop-color="#c9b8ff"/>
    </radialGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbe6"/>
      <stop offset="70%" stop-color="#ffd23f"/>
      <stop offset="100%" stop-color="#ffb347"/>
    </radialGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8ee3a0"/>
      <stop offset="100%" stop-color="#3fb97a"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- Sun rays -->
  <g stroke="#ffb703" stroke-width="7" stroke-linecap="round" opacity="0.8">
    <line x1="200" y1="62" x2="200" y2="30"/>
    <line x1="200" y1="0" x2="200" y2="0"/>
    <line x1="252" y1="78" x2="272" y2="58"/>
    <line x1="290" y1="116" x2="310" y2="96"/>
    <line x1="148" y1="78" x2="128" y2="58"/>
    <line x1="110" y1="116" x2="90" y2="96"/>
    <line x1="268" y1="170" x2="292" y2="162"/>
    <line x1="132" y1="170" x2="108" y2="162"/>
  </g>

  <!-- Sun -->
  <circle cx="200" cy="140" r="58" fill="url(#sun)"/>
  <!-- Sun face -->
  <path d="M176 130 q6 -8 12 0" stroke="#7a4a00" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M212 130 q6 -8 12 0" stroke="#7a4a00" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M178 150 q22 22 44 0" stroke="#7a4a00" stroke-width="5" fill="none" stroke-linecap="round"/>
  <circle cx="172" cy="158" r="7" fill="#ff8fab" opacity="0.7"/>
  <circle cx="228" cy="158" r="7" fill="#ff8fab" opacity="0.7"/>

  <!-- Floating hearts -->
  <path d="M90 230 c-8 -12 -26 -4 -20 10 c3 7 12 13 20 20 c8 -7 17 -13 20 -20 c6 -14 -12 -22 -20 -10z" fill="#ff6b9a"/>
  <path d="M322 214 c-6 -9 -19 -3 -15 7 c2 5 9 10 15 15 c6 -5 13 -10 15 -15 c4 -10 -9 -16 -15 -7z" fill="#ff8fc7"/>

  <!-- Hills -->
  <path d="M0 290 Q100 230 200 275 T400 260 L400 400 L0 400 Z" fill="url(#hill)"/>
  <path d="M0 340 Q120 300 240 335 T400 330 L400 400 L0 400 Z" fill="#2fa36b"/>

  <!-- Flowers -->
  <g>
    <line x1="70" y1="300" x2="70" y2="370" stroke="#2d7a4f" stroke-width="5" stroke-linecap="round"/>
    <g fill="#ff7eb6">
      <circle cx="70" cy="290" r="11"/>
      <circle cx="82" cy="298" r="11"/>
      <circle cx="78" cy="312" r="11"/>
      <circle cx="62" cy="312" r="11"/>
      <circle cx="58" cy="298" r="11"/>
    </g>
    <circle cx="70" cy="301" r="8" fill="#ffd23f"/>
  </g>

  <g>
    <line x1="330" y1="310" x2="330" y2="375" stroke="#2d7a4f" stroke-width="5" stroke-linecap="round"/>
    <g fill="#b388ff">
      <circle cx="330" cy="300" r="10"/>
      <circle cx="340" cy="307" r="10"/>
      <circle cx="337" cy="319" r="10"/>
      <circle cx="323" cy="319" r="10"/>
      <circle cx="320" cy="307" r="10"/>
    </g>
    <circle cx="330" cy="310" r="7" fill="#fff3a3"/>
  </g>

  <!-- Dancing birds -->
  <path d="M140 95 q10 -10 20 0 q10 -10 20 0" stroke="#4a3f7a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M290 60 q8 -8 16 0 q8 -8 16 0" stroke="#4a3f7a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
</svg>