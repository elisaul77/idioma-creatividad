<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#2a1b5e"/>
      <stop offset="55%" stop-color="#140d33"/>
      <stop offset="100%" stop-color="#05040f"/>
    </radialGradient>
    <radialGradient id="bubble" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#8fd3ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#6a5cff" stop-opacity="0.25"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd9f5" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffd9f5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="swirl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8ad8"/>
      <stop offset="50%" stop-color="#8ef5ff"/>
      <stop offset="100%" stop-color="#fff3a0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="haze" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="orb">
      <circle cx="200" cy="200" r="140"/>
    </clipPath>
  </defs>

  <!-- background -->
  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- distant nebula haze -->
  <ellipse cx="90" cy="90" rx="90" ry="60" fill="#5b3cc4" opacity="0.35" filter="url(#haze)"/>
  <ellipse cx="330" cy="320" rx="110" ry="70" fill="#ff6fb1" opacity="0.2" filter="url(#haze)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="40" cy="60" r="1.5"/>
    <circle cx="368" cy="48" r="2"/>
    <circle cx="60" cy="350" r="1.6"/>
    <circle cx="350" cy="200" r="1.2"/>
    <circle cx="28" cy="210" r="1.3"/>
    <circle cx="190" cy="28" r="1.4"/>
    <circle cx="305" cy="365" r="1.5"/>
    <circle cx="120" cy="25" r="1"/>
  </g>

  <!-- dream orb -->
  <circle cx="200" cy="200" r="140" fill="url(#bubble)"/>

  <!-- inside the dream: swirling light -->
  <g clip-path="url(#orb)">
    <path d="M 60 260 C 120 180, 150 300, 210 230 S 310 150, 350 210" fill="none" stroke="url(#swirl)" stroke-width="10" stroke-linecap="round" opacity="0.7" filter="url(#soft)"/>
    <path d="M 70 150 C 140 110, 200 170, 250 120 S 330 100, 360 140" fill="none" stroke="#fff3a0" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
    <path d="M 80 300 C 150 270, 180 340, 240 300 S 320 280, 340 320" fill="none" stroke="#8ef5ff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <circle cx="150" cy="170" r="30" fill="url(#glow)"/>
    <circle cx="265" cy="250" r="24" fill="url(#glow)"/>
  </g>

  <!-- floating dream fragments -->
  <g opacity="0.85">
    <path d="M 120 140 L 132 128 L 144 140 L 132 152 Z" fill="#ffd9f5"/>
    <path d="M 270 150 L 278 142 L 286 150 L 278 158 Z" fill="#8ef5ff"/>
    <circle cx="240" cy="290" r="5" fill="#fff3a0"/>
    <circle cx="165" cy="275" r="3.5" fill="#ff8ad8"/>
    <circle cx="300" cy="200" r="4" fill="#ffffff"/>
  </g>

  <!-- a small light-butterfly shape: the dream's messenger -->
  <g transform="translate(200 205)" opacity="0.9">
    <path d="M 0 0 C -20 -30, -55 -28, -50 -6 C -46 12, -18 8, 0 0 Z" fill="#ff8ad8" opacity="0.8"/>
    <path d="M 0 0 C 20 -30, 55 -28, 50 -6 C 46 12, 18 8, 0 0 Z" fill="#ff8ad8" opacity="0.8"/>
    <path d="M 0 0 C -16 18, -40 30, -32 46 C -22 56, -6 30, 0 0 Z" fill="#8ef5ff" opacity="0.7"/>
    <path d="M 0 0 C 16 18, 40 30, 32 46 C 22 56, 6 30, 0 0 Z" fill="#8ef5ff" opacity="0.7"/>
    <ellipse cx="0" cy="0" rx="3" ry="14" fill="#ffffff"/>
  </g>

  <!-- crescent moon, the sleeper's light -->
  <g>
    <circle cx="330" cy="62" r="26" fill="#fff3a0" opacity="0.25" filter="url(#soft)"/>
    <path d="M 335 40 A 26 26 0 1 0 352 78 A 20 20 0 1 1 335 40 Z" fill="#fff3a0"/>
  </g>
</svg>