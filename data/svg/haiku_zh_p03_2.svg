<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1640"/>
      <stop offset="1" stop-color="#3a1c4f"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a59"/>
      <stop offset="0.5" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#4cc9f0"/>
    </linearGradient>
    <radialGradient id="glowSpot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <circle cx="200" cy="200" r="150" fill="url(#glowSpot)"/>

  <g fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5">
    <path d="M20 150 Q200 128 380 150"/>
    <path d="M20 166 Q200 144 380 166"/>
    <path d="M20 182 Q200 160 380 182"/>
    <path d="M20 198 Q200 176 380 198"/>
    <path d="M20 214 Q200 192 380 214"/>
  </g>

  <g fill="none" stroke="url(#wave)" stroke-linecap="round" filter="url(#glow)">
    <path d="M10 250 C70 170, 120 330, 200 250 S330 170, 395 240" stroke-width="5" opacity="0.9"/>
    <path d="M10 270 C80 200, 130 340, 205 268 S330 196, 395 262" stroke-width="3" opacity="0.7"/>
    <path d="M10 290 C90 230, 140 350, 210 288 S335 225, 395 285" stroke-width="2" opacity="0.5"/>
    <path d="M30 60 C90 20, 150 100, 210 60 S330 20, 380 70" stroke-width="2.5" opacity="0.6"/>
    <path d="M40 80 C100 45, 160 115, 215 80 S330 45, 370 92" stroke-width="1.5" opacity="0.4"/>
  </g>

  <g filter="url(#glow)">
    <ellipse cx="118" cy="300" rx="16" ry="12" transform="rotate(-20 118 300)" fill="#ffd166"/>
    <line x1="132" y1="296" x2="132" y2="232" stroke="#ffd166" stroke-width="3"/>
    <path d="M132 232 C150 240, 158 256, 150 270" fill="none" stroke="#ffd166" stroke-width="3" stroke-linecap="round"/>

    <ellipse cx="282" cy="128" rx="14" ry="10.5" transform="rotate(-20 282 128)" fill="#ff7a59"/>
    <line x1="296" y1="124" x2="296" y2="64" stroke="#ff7a59" stroke-width="3"/>
    <path d="M296 64 C314 74, 320 90, 310 104" fill="none" stroke="#ff7a59" stroke-width="3" stroke-linecap="round"/>

    <ellipse cx="330" cy="310" rx="11" ry="8.5" transform="rotate(-20 330 310)" fill="#4cc9f0"/>
    <line x1="341" y1="306" x2="341" y2="262" stroke="#4cc9f0" stroke-width="2.5"/>
  </g>

  <g fill="#ff7a59" opacity="0.35">
    <circle cx="60" cy="110" r="6"/>
    <circle cx="350" cy="190" r="4"/>
    <circle cx="180" cy="370" r="5"/>
    <circle cx="90" cy="360" r="3"/>
  </g>
  <g fill="#4cc9f0" opacity="0.3">
    <circle cx="240" cy="40" r="4"/>
    <circle cx="372" cy="360" r="6"/>
    <circle cx="25" cy="200" r="3"/>
  </g>
  <g fill="#ffd166" opacity="0.4">
    <circle cx="200" cy="350" r="2.5"/>
    <circle cx="260" cy="30" r="3"/>
    <circle cx="140" cy="40" r="2"/>
    <circle cx="60" cy="300" r="2"/>
