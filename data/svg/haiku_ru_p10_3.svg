<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#eef8ff"/>
      <stop offset="100%" stop-color="#b9dcf5"/>
    </radialGradient>
    <linearGradient id="drop" x1="0%" y1="0%" x2="30%" y2="100%">
      <stop offset="0%" stop-color="#7fd8ff"/>
      <stop offset="50%" stop-color="#2a7bd8"/>
      <stop offset="100%" stop-color="#14306e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- ripples on the surface -->
  <g fill="none" stroke="#2a7bd8" stroke-width="2">
    <ellipse cx="200" cy="318" rx="150" ry="26" stroke-opacity="0.35"/>
    <ellipse cx="200" cy="318" rx="115" ry="19" stroke-opacity="0.5"/>
    <ellipse cx="200" cy="318" rx="80" ry="13" stroke-opacity="0.7"/>
  </g>

  <!-- soft shadow under the drop -->
  <ellipse cx="200" cy="322" rx="70" ry="10" fill="#14306e" opacity="0.25" filter="url(#soft)"/>

  <!-- main drop -->
  <path d="M200 60 C200 60 292 170 292 236 C292 290 250 326 200 326 C150 326 108 290 108 236 C108 170 200 60 200 60 Z"
        fill="url(#drop)"/>

  <!-- inner wave of color -->
  <path d="M140 250 C165 230 185 270 205 252 C225 234 240 262 262 246 C250 285 226 300 200 300 C172 300 150 282 140 250 Z"
        fill="#9be4ff" opacity="0.35"/>

  <!-- highlight -->
  <ellipse cx="165" cy="200" rx="14" ry="30" transform="rotate(-20 165 200)" fill="url(#glow)"/>

  <!-- rising droplets -->
  <circle cx="80" cy="140" r="9" fill="#2a7bd8" opacity="0.7"/>
  <circle cx="320" cy="120" r="6" fill="#2a7bd8" opacity="0.6"/>
  <circle cx="312" cy="180" r="4" fill="#14306e" opacity="0.5"/>
  <circle cx="95" cy="205" r="5" fill="#7fd8ff" opacity="0.9"/>
  <circle cx="340" cy="270" r="7" fill="#7fd8ff" opacity="0.8"/>

  <!-- sparkles -->
  <g fill="#ffffff" opacity="0.9">
    <path d="M70 80 L73 88 L81 91 L73 94 L70 102 L67 94 L59 91 L67 88 Z"/>
    <path d="M330 70 L332 75 L337 77 L332 79 L330 84 L328 79 L323 77 L328 75 Z"/>
  </g>
</svg>