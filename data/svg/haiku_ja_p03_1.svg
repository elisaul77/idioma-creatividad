<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf4e3"/>
      <stop offset="1" stop-color="#f3dcc0"/>
    </linearGradient>
    <linearGradient id="melody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e76f51"/>
      <stop offset="0.35" stop-color="#f4a261"/>
      <stop offset="0.7" stop-color="#2a9d8f"/>
      <stop offset="1" stop-color="#6a4c93"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a5230"/>
      <stop offset="1" stop-color="#4a3019"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
  </defs>

  <!-- Frame -->
  <rect width="400" height="400" fill="url(#wood)"/>
  <rect x="18" y="18" width="364" height="364" fill="url(#canvas)"/>

  <!-- Staff lines as flowing brushstrokes -->
  <g fill="none" stroke="url(#melody)" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <path d="M32 128 C 100 106, 160 150, 230 128 S 340 104, 368 124"/>
    <path d="M32 147 C 100 125, 160 169, 230 147 S 340 123, 368 143"/>
    <path d="M32 166 C 100 144, 160 188, 230 166 S 340 142, 368 162"/>
    <path d="M32 185 C 100 163, 160 207, 230 185 S 340 161, 368 181"/>
    <path d="M32 204 C 100 182, 160 226, 230 204 S 340 180, 368 200"/>
  </g>

  <!-- Painted notes -->
  <g>
    <path d="M120 200 L120 140" stroke="#2a9d8f" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="112" cy="200" rx="13" ry="9" transform="rotate(-20 112 200)" fill="#2a9d8f"/>

    <path d="M200 166 L200 104" stroke="#e76f51" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="192" cy="166" rx="13" ry="9" transform="rotate(-20 192 166)" fill="#e76f51"/>

    <path d="M286 240 L286 180" stroke="#6a4c93" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="278" cy="240" rx="13" ry="9" transform="rotate(-20 278 240)" fill="#6a4c93"/>
    <path d="M286 180 Q 300 190 314 204" stroke="#6a4c93" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Splashes of paint -->
  <g filter="url(#soft)">
    <circle cx="60" cy="300" r="10" fill="#f4a261" opacity="0.85"/>
    <circle cx="78" cy="318" r="5" fill="#f4a261" opacity="0.85"/>
    <circle cx="150" cy="290" r="7" fill="#2a9d8f" opacity="0.8"/>
    <circle cx="232" cy="270" r="12" fill="#e9c46a" opacity="0.85"/>
    <circle cx="256" cy="296" r="4" fill="#e9c46a" opacity="0.85"/>
    <circle cx="352" cy="90" r="8" fill="#6a4c93" opacity="0.7"/>
    <circle cx="60" cy="70" r="6" fill="#e76f51" opacity="0.7"/>
  </g>

  <!-- Sound rings rising from the notes -->
  <g fill="none" stroke-linecap="round" stroke-width="2.5">
    <path d="M140 150 A 22 22 0 0 1 140 186" stroke="#e76f51" opacity="0.6"/>
    <path d="M132 142 A 36 36 0 0 1 132 194" stroke="#e76f51" opacity="0.4"/>
    <path d="M226 118 A 22 22 0 0 1 226 154" stroke="#2a9d8f" opacity="0.6"/>
    <path d="M318 196 A 22 22 0 0 1 318 232" stroke="#6a4c93" opacity="0.6"/>
  </g>

  <!-- Brush -->
  <path d="M236 352 L330 262" stroke="#6d4c41" stroke-width="11" stroke-linecap="round"/>
  <path d="M330 262 Q 338 250 348 244 Q 352 258 340 270 Z" fill="#e9c46a"/>
  <path d="M326 266 Q 318 282 300 300 Q 282 316 262 318" fill="none" stroke="#f4a261" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
</svg>