<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ec6f0"/>
      <stop offset="1" stop-color="#fdeec4"/>
    </linearGradient>
    <radialGradient id="sol">
      <stop offset="0" stop-color="#fff6c2"/>
      <stop offset="1" stop-color="#ffd35c" stop-opacity="0"/>
    </radialGradient>
    <g id="casa">
      <rect x="-22" y="-30" width="44" height="30" fill="#f6e7c8" stroke="#8a6a4a" stroke-width="1.5"/>
      <polygon points="-28,-30 0,-56 28,-30" fill="#c0583a"/>
      <rect x="-6" y="-16" width="12" height="16" fill="#6b4a2e"/>
      <rect x="10" y="-22" width="7" height="7" fill="#7fb8d9"/>
      <rect x="-17" y="-22" width="7" height="7" fill="#7fb8d9"/>
    </g>
    <g id="palma">
      <path d="M0 0 Q7 -45 0 -92" fill="none" stroke="#7a4e2d" stroke-width="7" stroke-linecap="round"/>
      <g fill="#2e8b57" transform="translate(0,-92)">
        <ellipse cx="0" cy="-22" rx="7" ry="26" transform="rotate(-150)"/>
        <ellipse cx="0" cy="-22" rx="7" ry="26" transform="rotate(-100)"/>
        <ellipse cx="0" cy="-22" rx="7" ry="26" transform="rotate(-50)"/>
        <ellipse cx="0" cy="-22" rx="7" ry="26" transform="rotate(-5)"/>
        <ellipse cx="0" cy="-22" rx="7" ry="26" transform="rotate(40)"/>
        <ellipse cx="0" cy="-22" rx="7" ry="26" transform="rotate(85)"/>
        <ellipse cx="0" cy="-22" rx="7" ry="26" transform="rotate(130)"/>
        <ellipse cx="0" cy="-22" rx="7" ry="26" transform="rotate(175)"/>
      </g>
      <circle cx="0" cy="-92" r="4" fill="#5a3a20"/>
    </g>
  </defs>

  <!-- Cielo -->
  <rect width="400" height="400" fill="url(#cielo)"/>
  <circle cx="320" cy="80" r="70" fill="url(#sol)"/>
  <circle cx="320" cy="80" r="28" fill="#ffe066"/>

  <!-- Nubes -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="90" cy="70" rx="34" ry="12"/>
    <ellipse cx="110" cy="62" rx="22" ry="12"/>
    <ellipse cx="200" cy="110" rx="28" ry="10"/>
    <ellipse cx="216" cy="104" rx="18" ry="10"/>
  </g>

  <!-- Cerros lejanos -->
  <path d="M0 220 Q80 160 160 210 T320 200 T400 190 L400 300 L0 300Z" fill="#8cc57a"/>
  <path d="M0 250 Q120 200 240 245 T400 235 L400 320 L0 320Z" fill="#5fa85c"/>

  <!-- Suelo -->
  <path d="M0 290 Q200 275 400 292 L400 400 L0 400Z" fill="#4f9448"/>

  <!-- Camino -->
  <path d="M200 400 Q190 350 205 300" fill="none" stroke="#e6c48a" stroke-width="14" stroke-linecap="round"/>

  <!-- Casas -->
  <use href="#casa" transform="translate(150,288) scale(0.65)"/>
  <use href="#casa" transform="translate(250,292) scale(0.7)"/>
  <use href="#casa" transform="translate(50,305) scale(0.9)"/>
  <use href="#casa" transform="translate(105,300) scale(0.8)"/>
  <use href="#casa" transform="translate(300,305) scale(1)"/>
  <use href="#casa" transform="translate(345,298) scale(0.85)"/>

  <!-- Río -->
  <path d="M0 362 Q120 332 220 362 T400 352" fill="none" stroke="#5bb5e6" stroke-width="12" stroke-linecap="round"/>

  <!-- Palmas delante -->
  <use href="#palma" transform="translate(130,335) scale(0.9)"/>
  <use href="#palma" transform="translate(280,338) scale(0.8)"/>
  <use href="#palma" transform="translate(200,340) scale(0.85)"/>
  <use href="#palma" transform="translate(25,325) scale(1.1)"/>
  <use href="#palma" transform="translate(375,330) scale(1.2)"/>
</svg>