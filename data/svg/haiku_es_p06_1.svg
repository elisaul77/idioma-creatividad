<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE9A8"/>
      <stop offset="100%" stop-color="#FFB88C"/>
    </linearGradient>
    <radialGradient id="sol" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF6B0"/>
      <stop offset="70%" stop-color="#FFD23F"/>
      <stop offset="100%" stop-color="#FFB703"/>
    </radialGradient>
    <radialGradient id="colina" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#9EE493"/>
      <stop offset="100%" stop-color="#3FA34D"/>
    </radialGradient>
  </defs>

  <!-- Fondo -->
  <rect width="400" height="400" fill="url(#cielo)"/>

  <!-- Rayos del sol -->
  <g stroke="#FFD23F" stroke-width="10" stroke-linecap="round" opacity="0.85">
    <line x1="200" y1="40" x2="200" y2="8"/>
    <line x1="200" y1="360" x2="200" y2="392" opacity="0"/>
    <line x1="292" y1="66" x2="312" y2="46"/>
    <line x1="108" y1="66" x2="88" y2="46"/>
    <line x1="318" y1="150" x2="350" y2="140"/>
    <line x1="82" y1="150" x2="50" y2="140"/>
  </g>

  <!-- Sol -->
  <circle cx="200" cy="150" r="70" fill="url(#sol)"/>

  <!-- Mejillas -->
  <circle cx="176" cy="168" r="8" fill="#FF8FA3" opacity="0.7"/>
  <circle cx="224" cy="168" r="8" fill="#FF8FA3" opacity="0.7"/>

  <!-- Ojos felices (arcos) -->
  <path d="M176 142 Q184 130 192 142" fill="none" stroke="#7A4A00" stroke-width="5" stroke-linecap="round"/>
  <path d="M208 142 Q216 130 224 142" fill="none" stroke="#7A4A00" stroke-width="5" stroke-linecap="round"/>

  <!-- Sonrisa -->
  <path d="M174 158 Q200 186 226 158" fill="none" stroke="#7A4A00" stroke-width="5" stroke-linecap="round"/>

  <!-- Colina -->
  <ellipse cx="200" cy="420" rx="260" ry="120" fill="url(#colina)"/>

  <!-- Flores -->
  <g>
    <circle cx="90" cy="290" r="9" fill="#FF6B9A"/>
    <circle cx="80" cy="282" r="9" fill="#FF6B9A"/>
    <circle cx="100" cy="282" r="9" fill="#FF6B9A"/>
    <circle cx="80" cy="298" r="9" fill="#FF6B9A"/>
    <circle cx="100" cy="298" r="9" fill="#FF6B9A"/>
    <circle cx="90" cy="290" r="6" fill="#FFD23F"/>
    <line x1="90" y1="300" x2="90" y2="345" stroke="#2E7D32" stroke-width="4"/>
  </g>
  <g>
    <circle cx="315" cy="300" r="8" fill="#B388FF"/>
    <circle cx="306" cy="293" r="8" fill="#B388FF"/>
    <circle cx="324" cy="293" r="8" fill="#B388FF"/>
    <circle cx="306" cy="307" r="8" fill="#B388FF"/>
    <circle cx="324" cy="307" r="8" fill="#B388FF"/>
    <circle cx="315" cy="300" r="5" fill="#FFF176"/>
    <line x1="315" y1="308" x2="315" y2="345" stroke="#2E7D32" stroke-width="4"/>
  </g>

  <!-- Pájaros -->
  <path d="M120 100 Q130 90 140 100 Q150 90 160 100" fill="none" stroke="#5D4037" stroke-width="3" stroke-linecap="round"/>
  <path d="M265 80 Q274 72 283 80 Q292 72 301 80" fill="none" stroke="#5D4037" stroke-width="3" stroke-linecap="round"/>

  <!-- Mariposa -->
  <g transform="translate(300 220) rotate(-15)">
    <ellipse cx="-9" cy="0" rx="10" ry="14" fill="#FF8FA3" opacity="0.9"/>
    <ellipse cx="9" cy="0" rx="10" ry="14" fill="#FF8FA3" opacity="0.9"/>
    <ellipse cx="0" cy="0" rx="3" ry="12" fill="#5D4037"/>
  </g>
</svg>