<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#140c33"/>
      <stop offset="0.55" stop-color="#3b1f6e"/>
      <stop offset="1" stop-color="#a04e8f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd7f5" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd7f5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8fd3ff" stop-opacity="0.05"/>
    </radialGradient>
    <linearGradient id="isle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7b6d9"/>
      <stop offset="1" stop-color="#6c3fa0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- фон -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- свечение луны -->
  <circle cx="290" cy="110" r="90" fill="url(#glow)"/>

  <!-- луна-полумесяц -->
  <circle cx="290" cy="110" r="38" fill="#fff3d6"/>
  <circle cx="306" cy="98" r="34" fill="#2a1657"/>

  <!-- звёзды -->
  <g fill="#ffffff">
    <circle cx="60" cy="50" r="1.6"/>
    <circle cx="120" cy="30" r="1.2"/>
    <circle cx="180" cy="72" r="1.8"/>
    <circle cx="36" cy="150" r="1.3"/>
    <circle cx="210" cy="28" r="1.1"/>
    <circle cx="350" cy="200" r="1.5"/>
    <circle cx="25" cy="260" r="1.2"/>
    <circle cx="370" cy="40" r="1.4"/>
    <circle cx="140" cy="170" r="1"/>
    <circle cx="240" cy="180" r="1.3"/>
  </g>

  <!-- парящие полупрозрачные сферы -->
  <circle cx="90" cy="200" r="34" fill="url(#orb)" opacity="0.7"/>
  <circle cx="320" cy="250" r="22" fill="url(#orb)" opacity="0.6"/>
  <circle cx="200" cy="130" r="14" fill="url(#orb)" opacity="0.8"/>

  <!-- спиральная «вихревая» дорожка сна -->
  <path d="M200 330 C 120 300, 280 280, 200 240 C 140 210, 260 190, 210 160 C 180 140, 230 120, 200 100"
        fill="none" stroke="#ffd7f5" stroke-width="2.5" stroke-linecap="round" opacity="0.6" filter="url(#soft)"/>
  <path d="M200 330 C 120 300, 280 280, 200 240 C 140 210, 260 190, 210 160 C 180 140, 230 120, 200 100"
        fill="none" stroke="#8fd3ff" stroke-width="8" stroke-linecap="round" opacity="0.18" filter="url(#blur)"/>

  <!-- плавающие острова -->
  <g>
    <path d="M60 300 Q90 288 120 300 Q105 318 80 318 Q62 316 60 300 Z" fill="url(#isle)"/>
    <path d="M70 296 q10 -20 26 -8 q8 -12 22 -2 q6 -4 8 2 Z" fill="#ffe3f1" opacity="0.8"/>
  </g>
  <g>
    <path d="M250 320 Q280 306 312 318 Q296 340 270 338 Q252 336 250 320 Z" fill="url(#isle)"/>
    <path d="M250 320 l10 -8 M290 316 l8 -10" stroke="#ffe3f1" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- лестница, уходящая в облака -->
  <g fill="#ffe3f1" opacity="0.75">
    <rect x="150" y="318" width="22" height="4" rx="1"/>
    <rect x="164" y="306" width="22" height="4" rx="1"/>
    <rect x="178" y="294" width="22" height="4" rx="1"/>
  </g>

  <!-- облака-туман внизу -->
  <g fill="#f7c6e6" opacity="0.25" filter="url(#blur)">
    <ellipse cx="120" cy="370" rx="120" ry="28"/>
    <ellipse cx="300" cy="380" rx="130" ry="30"/>
  </g>

  <!-- мягкая рамка-виньетка -->
  <rect width="400" height="400" fill="none" stroke="#140c33" stroke-width="30" opacity="0.25"/>
</svg>