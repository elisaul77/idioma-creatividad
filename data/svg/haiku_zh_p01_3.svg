<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#2a1b4d"/>
      <stop offset="100%" stop-color="#070616"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7ef0d0"/>
      <stop offset="50%" stop-color="#3fa7d6"/>
      <stop offset="100%" stop-color="#8a5cf6"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd1f0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ff8fb1" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbe0"/>
      <stop offset="60%" stop-color="#ffd166" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- 星点 -->
  <g fill="#ffffff">
    <circle cx="40" cy="40" r="1.5" opacity="0.8"/>
    <circle cx="110" cy="25" r="1" opacity="0.6"/>
    <circle cx="330" cy="45" r="1.8" opacity="0.9"/>
    <circle cx="370" cy="130" r="1.2" opacity="0.7"/>
    <circle cx="25" cy="250" r="1.2" opacity="0.6"/>
    <circle cx="360" cy="300" r="1.5" opacity="0.8"/>
    <circle cx="300" cy="20" r="1" opacity="0.5"/>
    <circle cx="70" cy="330" r="1" opacity="0.6"/>
  </g>

  <!-- 漂浮光点 -->
  <g fill="#9ff7ff" opacity="0.6" filter="url(#glow)">
    <circle cx="90" cy="290" r="2.5"/>
    <circle cx="320" cy="250" r="2"/>
    <circle cx="345" cy="190" r="1.5"/>
    <circle cx="55" cy="180" r="1.8"/>
  </g>

  <!-- 翅膀（左右对称） -->
  <g opacity="0.9">
    <path d="M180 170 C120 90 40 80 30 150 C50 160 60 175 70 190 C50 200 60 230 90 230 C120 230 150 210 180 200 Z" fill="url(#wing)" stroke="#ffe6f5" stroke-width="1.5" stroke-opacity="0.6"/>
    <path d="M220 170 C280 90 360 80 370 150 C350 160 340 175 330 190 C350 200 340 230 310 230 C280 230 250 210 220 200 Z" fill="url(#wing)" stroke="#ffe6f5" stroke-width="1.5" stroke-opacity="0.6"/>
  </g>

  <!-- 触角与发光球 -->
  <g fill="none" stroke="#b9f5ff" stroke-width="2" stroke-linecap="round">
    <path d="M186 134 C170 110 160 95 150 80"/>
    <path d="M214 134 C230 110 240 95 250 80"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="150" cy="80" r="8" fill="url(#orb)"/>
    <circle cx="150" cy="80" r="3.5" fill="#fffbe0"/>
    <circle cx="250" cy="80" r="8" fill="url(#orb)"/>
    <circle cx="250" cy="80" r="3.5" fill="#fffbe0"/>
  </g>

  <!-- 螺旋尾 -->
  <path d="M200 255 C245 290 150 325 190 350 C222 368 265 330 232 312 C214 302 200 320 212 332" fill="none" stroke="url(#body)" stroke-width="14" stroke-linecap="round"/>
  <path d="M200 255 C245 290 150 325 190 350 C222 368 265 330 232 312 C214 302 200 320 212 332" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.25" stroke-linecap="round"/>

  <!-- 侧鳍 -->
  <path d="M142 205 C118 190 110 225 130 240 C136 230 142 225 146 220 Z" fill="#ff9ecf" opacity="0.8"/>
  <path d="M258 205 C282 190 290 225 270 240 C264 230 258 225 254 220 Z" fill="#ff9ecf" opacity="0.8"/>

  <!-- 身体 -->
  <ellipse cx="200" cy="212" rx="64" ry="48" fill="url(#body)"/>
  <ellipse cx="200" cy="200" rx="48" ry="22" fill="#ffffff" opacity="0.15"/>

  <!-- 身体斑点 -->
  <g fill="#ffd166" opacity="0.7">
    <circle cx="178" cy="215" r="5"/>
    <circle cx="200" cy="232" r="4"/>
    <circle cx="224" cy="215" r="5"/>
    <circle cx="190" cy="196" r="2.5"/>
    <circle cx="214" cy="196" r="2.5"/>
  </g>

  <!-- 头部 -->
  <ellipse cx="200" cy="158" rx="36" ry="32" fill="url(#body)"/>

  <!-- 三只眼睛 -->
  <g>
    <circle cx="186" cy="154" r="7" fill="#ffffff"/>
    <circle cx="188" cy="155" r="3.5" fill="#1a0f33"/>
    <circle cx="214" cy="154" r="7" fill="#ffffff"/>
    <circle cx="216" cy="155" r="3.5" fill="#1a0f33"/>
    <circle cx="200" cy="140" r="4.5" fill="#ff7b54" filter="url(#glow)"/>
  </g>

  <!-- 嘴部微笑 -->
  <path d="M190 178 Q200 186 210 178" fill="none" stroke="#1a0f33" stroke-width="2" stroke-linecap="round"/>

  <!-- 底部涟漪 -->
  <ellipse cx="200" cy="372" rx="120" ry="9" fill="none" stroke="#7ef0d0" stroke-width="1.2" opacity="0.25"/>
  <ellipse cx="200" cy="378" rx="80" ry="5" fill="none" stroke="#7ef0d0" stroke-width="1" opacity="0.18"/>
</svg>