<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e27"/>
      <stop offset="0.6" stop-color="#1b2a4a"/>
      <stop offset="1" stop-color="#2b5f6e"/>
    </linearGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c2b3a"/>
      <stop offset="0.5" stop-color="#3b5566"/>
      <stop offset="1" stop-color="#1c2b3a"/>
    </linearGradient>
    <radialGradient id="canopy" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#9dffe4" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#22c3a6" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#0d6e7a" stop-opacity="0.15"/>
    </radialGradient>
    <radialGradient id="moon" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#fff6d6"/>
      <stop offset="1" stop-color="#ffd98a"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigblur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#e6fbff">
    <circle cx="30" cy="40" r="1.4"/>
    <circle cx="90" cy="25" r="1"/>
    <circle cx="150" cy="60" r="1.2"/>
    <circle cx="210" cy="30" r="1"/>
    <circle cx="260" cy="95" r="1.3"/>
    <circle cx="370" cy="150" r="1"/>
    <circle cx="50" cy="150" r="1"/>
    <circle cx="170" cy="110" r="0.9"/>
    <circle cx="385" cy="30" r="1.2"/>
    <circle cx="20" cy="210" r="1"/>
    <circle cx="375" cy="210" r="0.9"/>
  </g>

  <!-- Moon -->
  <circle cx="320" cy="70" r="40" fill="#ffd98a" opacity="0.35" filter="url(#bigblur)"/>
  <circle cx="320" cy="70" r="26" fill="url(#moon)"/>

  <!-- Distant hills -->
  <path d="M0 300 Q80 265 160 295 T320 290 T400 285 L400 400 L0 400 Z" fill="#14384a" opacity="0.8"/>

  <!-- Ground -->
  <path d="M0 330 Q200 290 400 330 L400 400 L0 400 Z" fill="#0f2a33"/>
  <ellipse cx="200" cy="334" rx="90" ry="8" fill="#7dffd4" opacity="0.3" filter="url(#bigblur)"/>

  <!-- Orbit rings around canopy -->
  <g fill="none" stroke="#7dffd4" stroke-width="1" opacity="0.35">
    <ellipse cx="200" cy="150" rx="160" ry="38" transform="rotate(-12 200 150)" stroke-dasharray="4 6"/>
    <ellipse cx="200" cy="165" rx="130" ry="30" transform="rotate(8 200 165)" stroke-dasharray="2 5"/>
  </g>

  <!-- Trunk -->
  <path d="M188 332 C192 280 194 240 190 200 L210 200 C206 240 208 280 212 332 Z" fill="url(#trunk)"/>

  <!-- Branches (structural) -->
  <g fill="none" stroke="#2c4658" stroke-linecap="round">
    <path d="M191 260 Q160 240 130 210 Q110 190 95 170" stroke-width="7"/>
    <path d="M209 250 Q240 230 265 200 Q285 180 300 160" stroke-width="7"/>
    <path d="M195 215 Q175 195 160 160" stroke-width="5"/>
    <path d="M205 205 Q225 185 240 150" stroke-width="5"/>
    <path d="M192 240 Q170 250 140 260" stroke-width="4"/>
    <path d="M208 235 Q235 245 260 255" stroke-width="4"/>
  </g>

  <!-- Circuit traces on branches -->
  <g fill="none" stroke="#7dffd4" stroke-width="1.5" filter="url(#glow)" opacity="0.9">
    <path d="M191 260 Q160 240 130 210 Q110 190 95 170"/>
    <path d="M209 250 Q240 230 265 200 Q285 180 300 160"/>
    <path d="M195 215 Q175 195 160 160"/>
    <path d="M205 205 Q225 185 240 150"/>
    <path d="M192 240 Q170 250 140 260"/>
    <path d="M208 235 Q235 245 260 255"/>
  </g>

  <!-- Canopy: layered translucent crowns -->
  <g fill="url(#canopy)" stroke="#7dffd4" stroke-width="1" stroke-opacity="0.5">
    <circle cx="200" cy="130" r="58"/>
    <circle cx="130" cy="170" r="50"/>
    <circle cx="270" cy="165" r="52"/>
    <circle cx="200" cy="95" r="42"/>
    <circle cx="105" cy="205" r="40"/>
    <circle cx="298" cy="200" r="42"/>
    <circle cx="160" cy="215" r="36"/>
    <circle cx="245" cy="215" r="36"/>
  </g>

  <!-- Hexagonal leaf-cells inside canopy -->
  <g fill="none" stroke="#e6fff8" stroke-width="0.8" opacity="0.45">
    <polygon points="200,80 212,87 212,101 200,108 188,101 188,87"/>
    <polygon points="180,112 192,119 192,133 180,140 168,133 168,119"/>
    <polygon points="222,112 234,119 234,133 222,140 210,133 210,119"/>
    <polygon points="140,160 152,167 152,181 140,188 128,181 128,167"/>
    <polygon points="262,155 274,162 274,176 262,183 250,176 250,162"/>
    <polygon points="200,150 212,157 212,171 200,178 188,171 188,157"/>
    <polygon points="110,200 122,207 122,221 110,228 98,221 98,207"/>
    <polygon points="290,198 302,205 302,219 290,226 278,219 278,205"/>
  </g>

  <!-- Glowing circuit nodes at branch tips -->
  <g fill="#ffffff" filter="url(#glow)">
    <circle cx="95" cy="170" r="3"/>
    <circle cx="300" cy="160" r="3"/>
    <circle cx="160" cy="160" r="2.5"/>
    <circle cx="240" cy="150" r="2.5"/>
    <circle cx="140" cy="260" r="2.5"/>
    <circle cx="260" cy="255" r="2.5"/>
    <circle cx="200" cy="130" r="4" fill="#ff7ad9"/>
  </g>

  <!-- Floating orbs -->
  <g filter="url(#glow)">
    <circle cx="60" cy="110" r="4" fill="#7dffd4"/>
    <circle cx="345" cy="250" r="3.5" fill="#ff7ad9"/>
    <circle cx="80" cy="262" r="2.5" fill="#9dffe4"/>
    <circle cx="335" cy="318" r="5" fill="#7dffd4" opacity="0.8"/>
    <circle cx="48" cy="300" r="3" fill="#ffd98a"/>
    <circle cx="370" cy="110" r="2.5" fill="#ff7ad9"/>
  </g>

  <!-- Falling light particles -->
  <g fill="#7dffd4" opacity="0.7">
    <circle cx="120" cy="290" r="1.5"/>
    <circle cx="275" cy="300" r="1.5"/>
    <circle cx="210" cy="260" r="1.2"/>
    <circle cx="155" cy="240" r="1"/>
  </g>
</svg>