    <circle cx="184" cy="256" r="4" fill="#FF8FAB" opacity="0.6"/>
    <circle cx="216" cy="256" r="4" fill="#FF8FAB" opacity="0.6"/>
    <path d="M191 256 Q200 266 209 256" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 花朵 -->
  <g transform="translate(60 350)">
