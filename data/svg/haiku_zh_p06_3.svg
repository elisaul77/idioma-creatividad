    <circle cx="9.5" cy="-3" r="7" fill="#B388FF"/>
    <circle cx="5.9" cy="8.1" r="7" fill="#B388FF"/>
    <circle cx="-5.9" cy="8.1" r="7" fill="#B388FF"/>
    <circle cx="-9.5" cy="-3" r="7" fill="#B388FF"/>
    <circle r="5" fill="#FFE066"/>
  </g>
  <g transform="translate(345 338)">
    <circle cx="0" cy="-8" r="6" fill="#FF8FAB"/>
    <circle cx="7.6" cy="-2.5" r="6" fill="#FF8FAB"/>
    <circle cx="4.7" cy="6.5" r="6" fill="#FF8FAB"/>
    <circle cx="-4.7" cy="6.5" r="6" fill="#FF8FAB"/>
    <circle cx="-7.6" cy="-2.5" r="6" fill="#FF8FAB"/>
    <circle r="4" fill="#FFE066"/>
  </g>

  <!-- 飘落的彩色纸屑 -->
  <g>
    <rect x="40" y="60" width="8" height="8" rx="2" fill="#FF6B6B" transform="rotate(20 44 64)"/>
    <rect x="95" y="40" width="7" height="7" rx="2" fill="#FFE066" transform="rotate(-15 98 43)"/>
    <circle cx="150" cy="70" r="4" fill="#4DABF7"/>
    <rect x="200" y="30" width="7" height="7" rx="2" fill="#69DB7C" transform="rotate(35 203 33)"/>
    <circle cx="240" cy="60" r="4" fill="#FF8FAB"/>
    <rect x="70" y="180" width="7" height="7" rx="2" fill="#B388FF" transform="rotate(10 73 183)"/>
    <circle cx="130" cy="200" r="4" fill="#FFA94D"/>
    <rect x="290" y="200" width="8" height="8" rx="2" fill="#4DABF7" transform="rotate(-25 294 204)"/>
    <circle cx="360" cy="220" r="4" fill="#FF6B6B"/>
    <rect x="25" y="230" width="7" height="7" rx="2" fill="#69DB7C" transform="rotate(30 28 233)"/>
