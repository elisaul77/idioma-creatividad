    <circle cx="9.5" cy="-3" r="7" fill="#FF8FAB"/>
    <circle cx="5.9" cy="8.1" r="7" fill="#FF8FAB"/>
    <circle cx="-5.9" cy="8.1" r="7" fill="#FF8FAB"/>
    <circle cx="-9.5" cy="-3" r="7" fill="#FF8FAB"/>
    <circle r="5" fill="#FFE066"/>
  </g>
  <g transform="translate(110 368)">
    <circle cx="0" cy="-10" r="7" fill="#FFFFFF"/>
    <circle cx="9.5" cy="-3" r="7" fill="#FFFFFF"/>
    <circle cx="5.9" cy="8.1" r="7" fill="#FFFFFF"/>
    <circle cx="-5.9" cy="8.1" r="7" fill="#FFFFFF"/>
    <circle cx="-9.5" cy="-3" r="7" fill="#FFFFFF"/>
