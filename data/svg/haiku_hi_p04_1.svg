<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb8e6"/>
      <stop offset="0.7" stop-color="#cfe9f5"/>
      <stop offset="1" stop-color="#fbeed8"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd18a"/>
      <stop offset="1" stop-color="#5fb36a"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8a4f0"/>
      <stop offset="1" stop-color="#8c76d6"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e98a6d"/>
      <stop offset="1" stop-color="#c96a52"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="330" cy="70" r="90" fill="#ffe27a" opacity="0.35"/>
  <circle cx="330" cy="70" r="40" fill="#ffd44d"/>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="80" cy="70" rx="38" ry="16"/>
    <ellipse cx="105" cy="62" rx="26" ry="18"/>
    <ellipse cx="60" cy="62" rx="22" ry="14"/>
    <ellipse cx="230" cy="110" rx="30" ry="12"/>
    <ellipse cx="250" cy="103" rx="20" ry="14"/>
  </g>

  <!-- Hills -->
  <path d="M0 270 Q100 215 200 262 T400 255 L400 400 L0 400 Z" fill="url(#hill)"/>
  <path d="M0 330 Q120 295 230 330 T400 320 L400 400 L0 400 Z" fill="#4fa35e"/>

  <!-- Path to the door -->
  <path d="M170 400 Q185 355 200 330 Q215 355 230 400 Z" fill="#f2d7a6"/>

  <!-- House body -->
  <rect x="115" y="190" width="170" height="145" rx="14" fill="url(#body)"/>
  <rect x="115" y="190" width="170" height="145" rx="14" fill="none" stroke="#6f5bbf" stroke-width="3"/>

  <!-- Roof -->
  <path d="M95 200 Q200 90 305 200 Z" fill="url(#roof)" stroke="#a84f3a" stroke-width="3" stroke-linejoin="round"/>
  <!-- Roof bumps (friendly horns-like chimneys) -->
  <circle cx="200" cy="130" r="9" fill="#ffd44d" stroke="#c99a1c" stroke-width="2"/>
  <rect x="250" y="120" width="20" height="45" rx="4" fill="#a84f3a"/>
  <rect x="250" y="114" width="26" height="10" rx="3" fill="#7d3a2b"/>
  <!-- Smoke puffs -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="262" cy="100" r="8"/>
    <circle cx="272" cy="86" r="6"/>
    <circle cx="282" cy="72" r="5"/>
  </g>

  <!-- Round friendly windows -->
  <circle cx="155" cy="240" r="22" fill="#ffe9a8" stroke="#6f5bbf" stroke-width="4"/>
  <circle cx="245" cy="240" r="22" fill="#ffe9a8" stroke="#6f5bbf" stroke-width="4"/>
  <!-- Monster eyes peeking from windows -->
  <circle cx="155" cy="240" r="9" fill="#ffffff"/>
  <circle cx="245" cy="240" r="9" fill="#ffffff"/>
  <circle cx="157" cy="241" r="5" fill="#3d2f7a"/>
  <circle cx="247" cy="241" r="5" fill="#3d2f7a"/>
  <circle cx="158" cy="239" r="1.8" fill="#ffffff"/>
  <circle cx="248" cy="239" r="1.8" fill="#ffffff"/>
  <!-- Rosy cheeks -->
  <circle cx="142" cy="252" r="4" fill="#ff9fb2" opacity="0.7"/>
  <circle cx="168" cy="252" r="4" fill="#ff9fb2" opacity="0.7"/>
  <circle cx="232" cy="252" r="4" fill="#ff9fb2" opacity="0.7"/>
  <circle cx="258" cy="252" r="4" fill="#ff9fb2" opacity="0.7"/>

  <!-- Door with arch -->
  <path d="M175 335 L175 290 Q200 262 225 290 L225 335 Z" fill="#7a5a9e" stroke="#4b3775" stroke-width="3"/>
  <circle cx="218" cy="318" r="3" fill="#ffd44d"/>

  <!-- Smiling curve on the door -->
  <path d="M188 300 Q200 312 212 300" fill="none" stroke="#ffd44d" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Little monster tail poking out of the side -->
  <path d="M285 300 Q315 290 310 265 Q300 255 292 268" fill="none" stroke="#8c76d6" stroke-width="10" stroke-linecap="round"/>
  <circle cx="292" cy="268" r="5" fill="#ffd44d"/>

  <!-- Flowers -->
  <g>
    <circle cx="70" cy="350" r="6" fill="#ff7aa2"/>
    <circle cx="60" cy="345" r="5" fill="#ff9dbb"/>
    <circle cx="80" cy="345" r="5" fill="#ff9dbb"/>
    <circle cx="70" cy="340" r="5" fill="#ff9dbb"/>
    <circle cx="70" cy="350" r="3" fill="#ffd44d"/>

    <circle cx="335" cy="360" r="6" fill="#ffb347"/>
    <circle cx="325" cy="355" r="5" fill="#ffc678"/>
    <circle cx="345" cy="355" r="5" fill="#ffc678"/>
    <circle cx="335" cy="350" r="5" fill="#ffc678"/>
    <circle cx="335" cy="360" r="3" fill="#ffffff"/>
  </g>

  <!-- Grass tufts -->
  <g stroke="#3f8f4e" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M30 385 Q33 372 36 385"/>
    <path d="M40 388 Q44 376 48 388"/>
    <path d="M365 388 Q368 376 372 388"/>
    <path d="M380 385 Q383 373 386 385"/>
  </g>
</svg>