<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="space" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1b1035"/>
      <stop offset="100%" stop-color="#05040d"/>
    </radialGradient>
    <radialGradient id="crust" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="#5a3a22"/>
      <stop offset="100%" stop-color="#2e5b3a"/>
    </radialGradient>
    <radialGradient id="mantle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7a2e"/>
      <stop offset="100%" stop-color="#b8352a"/>
    </radialGradient>
    <radialGradient id="outerCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd27a"/>
      <stop offset="100%" stop-color="#ff9a3c"/>
    </radialGradient>
    <radialGradient id="innerCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e6"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fdbff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffe066" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9aa7b8"/>
      <stop offset="50%" stop-color="#e6edf5"/>
      <stop offset="100%" stop-color="#7d8a9c"/>
    </linearGradient>
    <linearGradient id="drill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5c6573"/>
      <stop offset="50%" stop-color="#cfd8e3"/>
      <stop offset="100%" stop-color="#4a5260"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="earthClip">
      <circle cx="200" cy="200" r="170"/>
    </clipPath>
  </defs>

  <!-- Space background -->
  <rect width="400" height="400" fill="url(#space)"/>
  <g fill="#ffffff">
    <circle cx="40" cy="60" r="1.2" opacity="0.8"/>
    <circle cx="90" cy="350" r="1" opacity="0.6"/>
    <circle cx="330" cy="50" r="1.4" opacity="0.9"/>
    <circle cx="360" cy="300" r="1" opacity="0.7"/>
    <circle cx="25" cy="220" r="1" opacity="0.5"/>
    <circle cx="370" cy="150" r="1.2" opacity="0.8"/>
    <circle cx="300" cy="380" r="1" opacity="0.6"/>
    <circle cx="120" cy="25" r="1" opacity="0.7"/>
  </g>

  <!-- Earth cross-section -->
  <g clip-path="url(#earthClip)">
    <circle cx="200" cy="200" r="170" fill="url(#crust)"/>
    <circle cx="200" cy="200" r="130" fill="url(#mantle)" opacity="0.95"/>
    <circle cx="200" cy="200" r="80" fill="url(#outerCore)"/>
    <circle cx="200" cy="200" r="35" fill="url(#innerCore)"/>
    <!-- Layer textures -->
    <g fill="none" stroke="#3d2716" stroke-width="2" opacity="0.5">
      <path d="M40 150 Q90 130 130 160"/>
      <path d="M270 120 Q320 150 355 210"/>
      <path d="M60 260 Q110 240 150 275"/>
    </g>
    <g fill="#ffb347" opacity="0.5">
      <circle cx="160" cy="180" r="4"/>
      <circle cx="240" cy="230" r="3"/>
      <circle cx="210" cy="140" r="2.5"/>
      <circle cx="150" cy="240" r="3"/>
    </g>
  </g>
  <circle cx="200" cy="200" r="170" fill="none" stroke="#8fd3a8" stroke-width="2" opacity="0.6"/>

  <!-- Heat glow around the vehicle -->
  <circle cx="200" cy="215" r="34" fill="url(#glow)"/>

  <!-- Descent trail -->
  <path d="M192 20 L192 160 L208 160 L208 20 Z" fill="url(#trail)" opacity="0.7"/>
  <path d="M200 20 L200 160" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6"/>

  <!-- Vehicle -->
  <g>
    <!-- Main capsule body -->
    <path d="M178 160 Q200 140 222 160 L224 200 Q224 212 212 212 L188 212 Q176 212 176 200 Z" fill="url(#hull)" stroke="#3b4656" stroke-width="2"/>
    <!-- Cockpit window -->
    <ellipse cx="200" cy="170" rx="9" ry="7" fill="#2fd3ff" stroke="#0b3a52" stroke-width="1.5"/>
    <ellipse cx="197" cy="167" rx="3" ry="2" fill="#ffffff" opacity="0.8"/>
    <!-- Hull bands -->
    <path d="M178 185 L222 185" stroke="#5b6778" stroke-width="2"/>
    <path d="M178 196 L222 196" stroke="#5b6778" stroke-width="2"/>
    <!-- Thruster ring -->
    <rect x="182" y="210" width="36" height="8" rx="3" fill="#3f4856"/>
    <!-- Drill head -->
    <path d="M186 218 L214 218 L200 262 Z" fill="url(#drill)" stroke="#2c323c" stroke-width="1.5"/>
    <path d="M192 226 L208 226 M194 236 L206 236 M196 246 L204 246" stroke="#2c323c" stroke-width="1.5" opacity="0.7"/>
    <!-- Exhaust flame -->
    <path d="M190 210 Q200 232 210 210 Z" fill="#ffd166" opacity="0.9"/>
    <path d="M195 210 Q200 222 205 210 Z" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Sparks -->
  <g fill="#ffe066">
    <circle cx="170" cy="250" r="2"/>
    <circle cx="232" cy="262" r="2.5"/>
    <circle cx="186" cy="280" r="1.5"/>
    <circle cx="216" cy="292" r="2"/>
    <circle cx="200" cy="300" r="1.5"/>
  </g>
</svg>