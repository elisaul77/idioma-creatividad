<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b3a4b"/>
      <stop offset="60%" stop-color="#e9a86a"/>
      <stop offset="100%" stop-color="#f6d28b"/>
    </linearGradient>
    <linearGradient id="earth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a4a22"/>
      <stop offset="100%" stop-color="#3e2310"/>
    </linearGradient>
    <linearGradient id="mound" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b87a3d"/>
      <stop offset="50%" stop-color="#d9995a"/>
      <stop offset="100%" stop-color="#9a5f2b"/>
    </linearGradient>
    <pattern id="hex" width="16" height="14" patternUnits="userSpaceOnUse">
      <path d="M8 0 L16 4.6 L16 9.4 L8 14 L0 9.4 L0 4.6 Z" fill="none" stroke="#f4c542" stroke-width="0.8" opacity="0.7"/>
    </pattern>
  </defs>

  <!-- Sky -->
  <rect width="400" height="400" fill="url(#sky)"/>
  <circle cx="310" cy="90" r="34" fill="#fff1c1" opacity="0.9"/>
  <circle cx="310" cy="90" r="50" fill="#fff1c1" opacity="0.15"/>

  <!-- Distant mounds -->
  <path d="M0 250 Q60 190 120 245 T240 240 T400 235 L400 400 L0 400 Z" fill="#8a5528" opacity="0.6"/>

  <!-- Central tower -->
  <path d="M150 300 L158 150 Q200 90 242 150 L250 300 Z" fill="url(#mound)"/>
  <path d="M150 300 L158 150 Q200 90 242 150 L250 300 Z" fill="url(#hex)"/>
  <ellipse cx="200" cy="96" rx="14" ry="8" fill="#5a3418"/>
  <path d="M160 260 Q200 230 240 260" fill="none" stroke="#5a3418" stroke-width="3"/>
  <path d="M162 220 Q200 196 238 220" fill="none" stroke="#5a3418" stroke-width="3"/>

  <!-- Left tower -->
  <path d="M60 300 L66 200 Q90 150 114 200 L120 300 Z" fill="url(#mound)"/>
  <path d="M60 300 L66 200 Q90 150 114 200 L120 300 Z" fill="url(#hex)"/>
  <path d="M68 260 Q90 240 112 260" fill="none" stroke="#5a3418" stroke-width="2.5"/>

  <!-- Right tower -->
  <path d="M280 300 L286 210 Q310 165 334 210 L340 300 Z" fill="url(#mound)"/>
  <path d="M280 300 L286 210 Q310 165 334 210 L340 300 Z" fill="url(#hex)"/>
  <path d="M288 265 Q310 248 332 265" fill="none" stroke="#5a3418" stroke-width="2.5"/>

  <!-- Bridges between towers -->
  <path d="M120 240 Q135 228 150 240" fill="none" stroke="#c98a48" stroke-width="5" stroke-linecap="round"/>
  <path d="M250 240 Q265 228 280 240" fill="none" stroke="#c98a48" stroke-width="5" stroke-linecap="round"/>

  <!-- Ground -->
  <path d="M0 300 Q200 288 400 300 L400 400 L0 400 Z" fill="url(#earth)"/>

  <!-- Ant trails -->
  <path d="M30 340 Q120 320 200 345 T370 335" fill="none" stroke="#2a1608" stroke-width="2" stroke-dasharray="4 6"/>
  <g fill="#1a0e05">
    <ellipse cx="90" cy="331" rx="4" ry="2.5"/>
    <circle cx="82" cy="329" r="1.8"/>
    <ellipse cx="170" cy="342" rx="4" ry="2.5"/>
    <circle cx="162" cy="340" r="1.8"/>
    <ellipse cx="260" cy="340" rx="4" ry="2.5"/>
    <circle cx="252" cy="338" r="1.8"/>
  </g>

  <!-- Flying bees -->
  <g>
    <ellipse cx="120" cy="120" rx="9" ry="6" fill="#f4c542" stroke="#2a1608" stroke-width="1.5"/>
    <path d="M114 116 L126 124 M120 114 L120 126" stroke="#2a1608" stroke-width="1.5"/>
    <ellipse cx="116" cy="108" rx="6" ry="3.5" fill="#ffffff" opacity="0.7"/>
    <ellipse cx="300" cy="150" rx="7" ry="5" fill="#f4c542" stroke="#2a1608" stroke-width="1.5"/>
    <path d="M295 147 L305 153 M300 145 L300 155" stroke="#2a1608" stroke-width="1.2"/>
    <ellipse cx="296" cy="140" rx="5" ry="3" fill="#ffffff" opacity="0.7"/>
    <ellipse cx="70" cy="170" rx="6" ry="4" fill="#f4c542" stroke="#2a1608" stroke-width="1.2"/>
  </g>
</svg>