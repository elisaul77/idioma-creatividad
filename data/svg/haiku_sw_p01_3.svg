<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#2b1d4a"/>
      <stop offset="1" stop-color="#0b0a1a"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fd0c9"/>
      <stop offset="1" stop-color="#7b4bd6"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff5e78"/>
    </linearGradient>
    <g id="wingL">
      <path d="M170 200 C90 120 30 150 40 230 C60 215 90 220 120 240 C85 250 70 270 60 300 C100 285 140 265 170 250 Z" fill="url(#wing)" opacity="0.9"/>
      <path d="M150 215 C110 190 80 200 70 230" fill="none" stroke="#fff3c4" stroke-width="2" opacity="0.6"/>
      <path d="M140 240 C105 235 90 255 85 275" fill="none" stroke="#fff3c4" stroke-width="2" opacity="0.6"/>
    </g>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)"/>
  <circle cx="60" cy="50" r="2" fill="#fff"/>
  <circle cx="330" cy="60" r="1.5" fill="#fff"/>
  <circle cx="350" cy="170" r="2" fill="#fff"/>
  <circle cx="40" cy="170" r="1.5" fill="#fff"/>
  <circle cx="300" cy="30" r="1" fill="#fff"/>
  <circle cx="110" cy="25" r="1.5" fill="#fff"/>
  <circle cx="200" cy="370" r="1.5" fill="#fff"/>

  <!-- Wings -->
  <use href="#wingL"/>
  <use href="#wingL" transform="matrix(-1 0 0 1 400 0)"/>

  <!-- Tail -->
  <path d="M270 255 C330 250 350 300 320 320 C295 338 280 310 302 298" fill="none" stroke="url(#body)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="302" cy="298" r="5" fill="#ffd166"/>

  <!-- Legs -->
  <path d="M160 280 Q150 330 130 350" fill="none" stroke="#3fd0c9" stroke-width="9" stroke-linecap="round"/>
  <path d="M180 290 Q175 340 165 365" fill="none" stroke="#3fd0c9" stroke-width="9" stroke-linecap="round"/>
  <path d="M220 290 Q225 340 235 365" fill="none" stroke="#3fd0c9" stroke-width="9" stroke-linecap="round"/>
  <path d="M240 280 Q250 330 270 350" fill="none" stroke="#3fd0c9" stroke-width="9" stroke-linecap="round"/>
  <path d="M130 350 q-12 4 -8 14" fill="none" stroke="#ffd166" stroke-width="3" stroke-linecap="round"/>
  <path d="M165 365 q-12 4 -8 14" fill="none" stroke="#ffd166" stroke-width="3" stroke-linecap="round"/>
  <path d="M235 365 q12 4 8 14" fill="none" stroke="#ffd166" stroke-width="3" stroke-linecap="round"/>
  <path d="M270 350 q12 4 8 14" fill="none" stroke="#ffd166" stroke-width="3" stroke-linecap="round"/>

  <!-- Body -->
  <ellipse cx="200" cy="240" rx="75" ry="60" fill="url(#body)"/>
  <path d="M150 200 l8 -14 l8 14 M170 188 l8 -14 l8 14 M192 184 l8 -14 l8 14 M214 186 l8 -14 l8 14 M236 194 l8 -14 l8 14" fill="#ff5e78" opacity="0.85"/>
  <path d="M160 250 Q200 285 240 250" fill="none" stroke="#ffd166" stroke-width="3" opacity="0.7"/>
  <path d="M175 265 Q200 290 225 265" fill="none" stroke="#ffd166" stroke-width="2" opacity="0.5"/>

  <!-- Head -->
  <circle cx="200" cy="150" r="42" fill="url(#body)"/>

  <!-- Horns / branching antlers -->
  <path d="M175 115 Q150 80 130 85 M150 95 Q140 75 120 70 M160 105 Q165 70 150 50" fill="none" stroke="#ffd166" stroke-width="4" stroke-linecap="round"/>
  <path d="M225 115 Q250 80 270 85 M250 95 Q260 75 280 70 M240 105 Q235 70 250 50" fill="none" stroke="#ffd166" stroke-width="4" stroke-linecap="round"/>
  <circle cx="130" cy="85" r="6" fill="#ff5e78"/>
  <circle cx="120" cy="70" r="5" fill="#7bdff2"/>
  <circle cx="150" cy="50" r="6" fill="#ff5e78"/>
  <circle cx="270" cy="85" r="6" fill="#ff5e78"/>
  <circle cx="280" cy="70" r="5" fill="#7bdff2"/>
  <circle cx="250" cy="50" r="6" fill="#ff5e78"/>

  <!-- Three eyes -->
  <circle cx="185" cy="145" r="8" fill="#fff"/>
  <circle cx="200" cy="132" r="9" fill="#fff"/>
  <circle cx="215" cy="145" r="8" fill="#fff"/>
  <circle cx="186" cy="146" r="3.5" fill="#111"/>
  <circle cx="201" cy="133" r="4" fill="#111"/>
  <circle cx="216" cy="146" r="3.5" fill="#111"/>

  <!-- Smile -->
  <path d="M182 170 Q200 182 218 170" fill="none" stroke="#2b1d4a" stroke-width="3" stroke-linecap="round"/>
</svg>