<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#1b1f4a"/>
      <stop offset="60%" stop-color="#0a0c20"/>
      <stop offset="100%" stop-color="#000005"/>
    </radialGradient>
    <radialGradient id="crust" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#6b5140"/>
      <stop offset="100%" stop-color="#2e2019"/>
    </radialGradient>
    <radialGradient id="mantle" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#c25e36"/>
      <stop offset="100%" stop-color="#6e2a18"/>
    </radialGradient>
    <radialGradient id="outercore" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#b8560f"/>
    </radialGradient>
    <radialGradient id="innercore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6c8"/>
      <stop offset="60%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#ff9f1c" stop-opacity="0.8"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9a0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffe9a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5a6b7d"/>
      <stop offset="50%" stop-color="#e6eef7"/>
      <stop offset="100%" stop-color="#5a6b7d"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fdcff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#7fdcff" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="exhaust" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ffb84d"/>
      <stop offset="100%" stop-color="#ff4d00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)"/>
  <g fill="#ffffff">
    <circle cx="40" cy="45" r="1.2" opacity="0.8"/>
    <circle cx="95" cy="22" r="0.9" opacity="0.6"/>
    <circle cx="330" cy="36" r="1.4" opacity="0.9"/>
    <circle cx="368" cy="110" r="1" opacity="0.7"/>
    <circle cx="28" cy="170" r="1" opacity="0.6"/>
    <circle cx="372" cy="250" r="1.2" opacity="0.8"/>
    <circle cx="60" cy="330" r="1.3" opacity="0.7"/>
    <circle cx="345" cy="360" r="1" opacity="0.6"/>
    <circle cx="150" cy="378" r="0.9" opacity="0.5"/>
    <circle cx="270" cy="20" r="0.8" opacity="0.6"/>
  </g>

  <!-- Earth cross-section -->
  <g transform="translate(200 210)">
    <circle r="150" fill="url(#crust)"/>
    <circle r="150" fill="none" stroke="#8a6a52" stroke-width="2" opacity="0.6"/>
    <path d="M-120,-40 Q-60,-70 0,-60 T120,-30" fill="none" stroke="#8a6a52" stroke-width="1.5" opacity="0.35"/>
    <path d="M-110,30 Q-50,10 10,25 T110,50" fill="none" stroke="#8a6a52" stroke-width="1.5" opacity="0.35"/>

    <circle r="122" fill="url(#mantle)"/>
    <path d="M-100,-20 Q-40,-50 20,-35 T100,0" fill="none" stroke="#f08a5d" stroke-width="2" opacity="0.3"/>
    <path d="M-95,40 Q-30,20 30,45 T95,60" fill="none" stroke="#f08a5d" stroke-width="2" opacity="0.3"/>

    <circle r="88" fill="url(#outercore)"/>
    <path d="M-70,-30 Q-20,-10 30,-40 T70,-10" fill="none" stroke="#ffe0a3" stroke-width="2" opacity="0.35"/>
    <path d="M-60,40 Q0,20 60,40" fill="none" stroke="#ffe0a3" stroke-width="2" opacity="0.3"/>

    <circle r="52" fill="url(#halo)"/>
    <circle r="48" fill="url(#innercore)"/>
  </g>

  <!-- Tunnel trail -->
  <line x1="200" y1="62" x2="200" y2="160" stroke="url(#trail)" stroke-width="3" stroke-dasharray="6 5" stroke-linecap="round"/>
  <g fill="#bfeeff">
    <circle cx="200" cy="80" r="1.5" opacity="0.7"/>
    <circle cx="196" cy="100" r="1.2" opacity="0.6"/>
    <circle cx="204" cy="118" r="1.5" opacity="0.8"/>
    <circle cx="198" cy="136" r="1.2" opacity="0.7"/>
  </g>

  <!-- Vehicle exhaust (upward) -->
  <path d="M192,150 Q200,122 208,150 Z" fill="url(#exhaust)" opacity="0.95"/>

  <!-- Vehicle -->
  <g>
    <!-- Fins -->
    <path d="M186,172 L170,192 L186,190 Z" fill="#8fa3b8"/>
    <path d="M214,172 L230,192 L214,190 Z" fill="#8fa3b8"/>
    <!-- Hull -->
    <path d="M200,150 C212,150 216,164 216,178 L216,192 L184,192 L184,178 C184,164 188,150 200,150 Z" fill="url(#hull)" stroke="#3c4a5c" stroke-width="1"/>
    <!-- Drill nose -->
    <path d="M184,192 L216,192 L200,222 Z" fill="#a9b8c8" stroke="#3c4a5c" stroke-width="1"/>
    <path d="M192,200 L208,200 L200,216 Z" fill="#6f8196"/>
    <!-- Window -->
    <circle cx="200" cy="170" r="6" fill="#1e3a5f" stroke="#bfe9ff" stroke-width="1.5"/>
    <circle cx="198" cy="168" r="1.8" fill="#ffffff" opacity="0.8"/>
    <!-- Hull band -->
    <rect x="184" y="184" width="32" height="3" fill="#ff8c42" opacity="0.9"/>
  </g>

  <!-- Drill sparks -->
  <g fill="#ffd166">
    <circle cx="194" cy="226" r="1.6" opacity="0.9"/>
    <circle cx="207" cy="230" r="1.2" opacity="0.8"/>
    <circle cx="200" cy="234" r="1.4" opacity="0.7"/>
    <circle cx="188" cy="232" r="1" opacity="0.6"/>
  </g>
</svg>