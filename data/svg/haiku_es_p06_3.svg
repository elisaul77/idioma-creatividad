<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE9A8"/>
      <stop offset="60%" stop-color="#FFC6D9"/>
      <stop offset="100%" stop-color="#FF9E7A"/>
    </linearGradient>
    <radialGradient id="sol" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFF7B0"/>
      <stop offset="70%" stop-color="#FFD23F"/>
      <stop offset="100%" stop-color="#FFB020"/>
    </radialGradient>
    <radialGradient id="brillo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fondo -->
  <rect width="400" height="400" fill="url(#cielo)"/>

  <!-- Resplandor -->
  <circle cx="200" cy="190" r="170" fill="url(#brillo)"/>

  <!-- Rayos -->
  <g stroke="#FFB020" stroke-width="12" stroke-linecap="round" opacity="0.85">
    <line x1="200" y1="40" x2="200" y2="8"/>
    <line x1="200" y1="340" x2="200" y2="372"/>
    <line x1="50" y1="190" x2="18" y2="190"/>
    <line x1="350" y1="190" x2="382" y2="190"/>
    <line x1="94" y1="84" x2="72" y2="62"/>
    <line x1="306" y1="84" x2="328" y2="62"/>
    <line x1="94" y1="296" x2="72" y2="318"/>
    <line x1="306" y1="296" x2="328" y2="318"/>
  </g>

  <!-- Sol -->
  <circle cx="200" cy="190" r="110" fill="url(#sol)"/>

  <!-- Mejillas -->
  <ellipse cx="160" cy="215" rx="16" ry="10" fill="#FF7A9A" opacity="0.6"/>
  <ellipse cx="240" cy="215" rx="16" ry="10" fill="#FF7A9A" opacity="0.6"/>

  <!-- Ojos felices -->
  <path d="M155 170 Q167 152 179 170" fill="none" stroke="#7A3E00" stroke-width="7" stroke-linecap="round"/>
  <path d="M221 170 Q233 152 245 170" fill="none" stroke="#7A3E00" stroke-width="7" stroke-linecap="round"/>

  <!-- Sonrisa -->
  <path d="M150 208 Q200 260 250 208 Q200 240 150 208 Z" fill="#B3430F" stroke="#7A2E08" stroke-width="5" stroke-linejoin="round"/>
  <path d="M168 220 Q200 236 232 220 Q200 250 168 220 Z" fill="#FF7A9A"/>

  <!-- Confeti -->
  <g>
    <rect x="60" y="110" width="14" height="14" rx="3" fill="#4FC3F7" transform="rotate(20 67 117)"/>
    <rect x="320" y="120" width="14" height="14" rx="3" fill="#7E57C2" transform="rotate(-15 327 127)"/>
    <circle cx="90" cy="280" r="8" fill="#66BB6A"/>
    <circle cx="315" cy="280" r="9" fill="#FF7043"/>
    <rect x="300" y="330" width="12" height="12" rx="2" fill="#4FC3F7" transform="rotate(35 306 336)"/>
    <rect x="80" y="335" width="12" height="12" rx="2" fill="#FFD23F" transform="rotate(-25 86 341)"/>
    <circle cx="140" cy="70" r="6" fill="#E040FB"/>
    <circle cx="265" cy="60" r="7" fill="#66BB6A"/>
  </g>

  <!-- Pájaros volando -->
  <g fill="none" stroke="#5D4037" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M45 220 Q55 210 65 220 Q75 210 85 220"/>
    <path d="M330 240 Q338 232 346 240 Q354 232 362 240"/>
  </g>
</svg>