<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="sky" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#2b1b5a"/>
      <stop offset="55%" stop-color="#1a1046"/>
      <stop offset="100%" stop-color="#070a24"/>
    </radialGradient>
    <radialGradient id="orbA" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffe8a3" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#ff9ec7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff9ec7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#b8f2ff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#6fa8ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#6fa8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbC" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#e3c6ff" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#9b6bff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#9b6bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="swirl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7ef0e0" stop-opacity="0.0"/>
      <stop offset="50%" stop-color="#7ef0e0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffb3e6" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <clipPath id="frame">
      <rect width="400" height="400" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="400" height="400" fill="url(#sky)"/>

    <!-- stars -->
    <g fill="#ffffff">
      <circle cx="48" cy="62" r="1.6" opacity="0.9"/>
      <circle cx="92" cy="28" r="1.1" opacity="0.7"/>
      <circle cx="318" cy="46" r="1.8" opacity="0.9"/>
      <circle cx="366" cy="110" r="1.2" opacity="0.6"/>
      <circle cx="30" cy="190" r="1.1" opacity="0.6"/>
      <circle cx="360" cy="262" r="1.5" opacity="0.8"/>
      <circle cx="210" cy="26" r="1.0" opacity="0.7"/>
      <circle cx="58" cy="330" r="1.4" opacity="0.7"/>
      <circle cx="342" cy="360" r="1.1" opacity="0.6"/>
      <circle cx="150" cy="370" r="1.3" opacity="0.5"/>
    </g>

    <!-- drifting luminous swirl -->
    <path d="M -20 300 C 80 220, 150 360, 230 280 S 360 200, 420 250"
          fill="none" stroke="url(#swirl)" stroke-width="18" stroke-linecap="round" filter="url(#blur)"/>
    <path d="M -20 130 C 70 70, 140 170, 220 110 S 330 60, 420 120"
          fill="none" stroke="url(#swirl)" stroke-width="10" stroke-linecap="round" opacity="0.6" filter="url(#blur)"/>

    <!-- floating dream orbs -->
    <circle cx="130" cy="170" r="70" fill="url(#orbA)"/>
    <circle cx="275" cy="235" r="88" fill="url(#orbB)"/>
    <circle cx="200" cy="300" r="52" fill="url(#orbC)"/>

    <!-- crescent moon -->
    <g filter="url(#soft)">
      <circle cx="300" cy="95" r="26" fill="#fff4cc"/>
      <circle cx="312" cy="86" r="24" fill="#1a1046"/>
    </g>

    <!-- soft spiral of memory -->
    <path d="M 200 200 m 0 0 a 18 18 0 1 1 18 18 a 32 32 0 1 1 -32 -32 a 46 46 0 1 1 46 46"
          fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round" filter="url(#soft)"/>

    <!-- floating particles -->
    <g fill="#ffe8a3">
      <circle cx="170" cy="120" r="2.4" opacity="0.85"/>
      <circle cx="240" cy="155" r="1.8" opacity="0.7"/>
      <circle cx="105" cy="250" r="2.0" opacity="0.75"/>
      <circle cx="330" cy="310" r="2.6" opacity="0.8"/>
      <circle cx="75" cy="345" r="1.6" opacity="0.6"/>
    </g>

    <!-- faint veil at the edges -->
    <rect width="400" height="400" fill="none" stroke="#c9b8ff" stroke-opacity="0.25" stroke-width="2" rx="28"/>
  </g>
</svg>