<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="sky" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#fff6c8"/>
      <stop offset="100%" stop-color="#8fd3f4"/>
    </radialGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="70%" stop-color="#ffca28"/>
      <stop offset="100%" stop-color="#ffa000"/>
    </radialGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8bc34a"/>
      <stop offset="100%" stop-color="#4caf50"/>
    </linearGradient>
  </defs>

  <!-- Cielo -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- Rayos del sol -->
  <g stroke="#ffb300" stroke-width="8" stroke-linecap="round" opacity="0.8">
    <line x1="200" y1="40" x2="200" y2="10"/>
    <line x1="200" y1="160" x2="200" y2="190" opacity="0"/>
    <line x1="120" y1="80" x2="100" y2="60"/>
    <line x1="280" y1="80" x2="300" y2="60"/>
    <line x1="80" y1="140" x2="55" y2="130"/>
    <line x1="320" y1="140" x2="345" y2="130"/>
    <line x1="60" y1="200" x2="30" y2="200"/>
    <line x1="340" y1="200" x2="370" y2="200"/>
  </g>

  <!-- Sol -->
  <circle cx="200" cy="160" r="90" fill="url(#sun)"/>

  <!-- Mejillas -->
  <circle cx="160" cy="185" r="14" fill="#ff8a80" opacity="0.6"/>
  <circle cx="240" cy="185" r="14" fill="#ff8a80" opacity="0.6"/>

  <!-- Ojos felices (arcos) -->
  <path d="M158 140 Q170 122 182 140" fill="none" stroke="#5d4037" stroke-width="7" stroke-linecap="round"/>
  <path d="M218 140 Q230 122 242 140" fill="none" stroke="#5d4037" stroke-width="7" stroke-linecap="round"/>

  <!-- Sonrisa -->
  <path d="M250 0 Z" fill="none"/>
  <path d="M265 170 Q200 130 135 170 Q200 235 265 170 Z" fill="#5d4037"/>
  <path d="M150 172 Q200 215 250 172 Q200 200 150 172 Z" fill="#ff5252"/>

  <!-- Colinas -->
  <path d="M0 290 Q100 240 200 280 T400 270 L400 400 L0 400 Z" fill="url(#hill)"/>

  <!-- Flores -->
  <g>
    <circle cx="70" cy="330" r="10" fill="#ff4081"/>
    <circle cx="60" cy="322" r="8" fill="#f48fb1"/>
    <circle cx="80" cy="322" r="8" fill="#f48fb1"/>
    <circle cx="70" cy="330" r="5" fill="#fff176"/>
    <line x1="70" y1="340" x2="70" y2="400" stroke="#2e7d32" stroke-width="4"/>

    <circle cx="330" cy="315" r="11" fill="#ba68c8"/>
    <circle cx="319" cy="306" r="9" fill="#ce93d8"/>
    <circle cx="341" cy="306" r="9" fill="#ce93d8"/>
    <circle cx="330" cy="315" r="5" fill="#fff176"/>
    <line x1="330" y1="326" x2="330" y2="400" stroke="#2e7d32" stroke-width="4"/>
  </g>

  <!-- Pájaros -->
  <path d="M300 80 Q308 72 316 80 Q324 72 332 80" fill="none" stroke="#37474f" stroke-width="3" stroke-linecap="round"/>
  <path d="M60 60 Q66 54 72 60 Q78 54 84 60" fill="none" stroke="#37474f" stroke-width="3" stroke-linecap="round"/>
</svg>