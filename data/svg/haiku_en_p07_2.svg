<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050818"/>
      <stop offset="60%" stop-color="#1a0f3d"/>
      <stop offset="100%" stop-color="#3b1a5c"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffd6f5" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#ff5fc8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff5fc8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d2a3a"/>
      <stop offset="50%" stop-color="#1f6f8b"/>
      <stop offset="100%" stop-color="#0d2a3a"/>
    </linearGradient>
    <radialGradient id="leaf" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7dfcf0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#2de2e6" stop-opacity="0.1"/>
    </radialGradient>
    <radialGradient id="orb" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#b48cff"/>
      <stop offset="100%" stop-color="#b48cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="30" cy="40" r="1.2" opacity="0.9"/>
    <circle cx="90" cy="25" r="0.9" opacity="0.7"/>
    <circle cx="160" cy="55" r="1.1" opacity="0.8"/>
    <circle cx="260" cy="30" r="1.3" opacity="0.9"/>
    <circle cx="340" cy="70" r="1" opacity="0.7"/>
    <circle cx="370" cy="25" r="1.2" opacity="0.9"/>
    <circle cx="55" cy="120" r="0.8" opacity="0.6"/>
    <circle cx="210" cy="95" r="0.9" opacity="0.6"/>
    <circle cx="320" cy="140" r="1" opacity="0.7"/>
    <circle cx="15" cy="200" r="0.9" opacity="0.5"/>
    <circle cx="385" cy="210" r="0.8" opacity="0.6"/>
  </g>

  <!-- Sun / moon halo -->
  <circle cx="200" cy="150" r="130" fill="url(#sun)"/>
  <circle cx="200" cy="150" r="70" fill="none" stroke="#ff9ee0" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="4 6"/>
  <circle cx="200" cy="150" r="52" fill="#ffd6f5" opacity="0.25"/>

  <!-- Floating orbs -->
  <circle cx="90" cy="110" r="10" fill="url(#orb)" filter="url(#glow)"/>
  <circle cx="318" cy="200" r="7" fill="url(#orb)" filter="url(#glow)"/>
  <circle cx="60" cy="250" r="5" fill="url(#orb)"/>
  <circle cx="340" cy="90" r="6" fill="url(#orb)"/>

  <!-- Trunk -->
  <path d="M188 330 C190 290 186 260 192 230 C196 210 194 190 200 170 C206 190 204 210 208 230 C214 260 210 290 212 330 Z" fill="url(#trunk)" filter="url(#glow)"/>

  <!-- Branches -->
  <g stroke="#2de2e6" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#glow)">
    <path d="M200 185 C180 165 160 160 140 130"/>
    <path d="M200 185 C220 165 240 160 262 128"/>
    <path d="M195 220 C170 215 150 205 118 185"/>
    <path d="M205 215 C230 210 252 200 284 180"/>
    <path d="M200 170 C198 150 200 130 196 100"/>
    <path d="M140 130 C130 115 122 108 112 100"/>
    <path d="M262 128 C272 114 280 106 292 98"/>
    <path d="M196 100 C188 88 180 82 170 74"/>
    <path d="M196 100 C206 88 214 82 226 76"/>
  </g>

  <!-- Thin inner branches -->
  <g stroke="#ff5fc8" stroke-width="1.2" fill="none" stroke-opacity="0.7">
    <path d="M140 130 C146 120 150 112 158 104"/>
    <path d="M262 128 C256 118 250 110 244 102"/>
    <path d="M118 185 C112 178 108 172 100 168"/>
    <path d="M284 180 C290 172 296 168 304 164"/>
  </g>

  <!-- Canopy: translucent luminous foliage -->
  <g filter="url(#softGlow)" opacity="0.8">
    <circle cx="200" cy="90" r="60" fill="#2de2e6" opacity="0.35"/>
    <circle cx="130" cy="130" r="45" fill="#ff5fc8" opacity="0.3"/>
    <circle cx="270" cy="130" r="45" fill="#7dfcf0" opacity="0.3"/>
    <circle cx="110" cy="190" r="36" fill="#b48cff" opacity="0.3"/>
    <circle cx="295" cy="185" r="36" fill="#2de2e6" opacity="0.3"/>
  </g>
  <g>
    <circle cx="200" cy="90" r="40" fill="url(#leaf)"/>
    <circle cx="140" cy="125" r="28" fill="url(#leaf)"/>
    <circle cx="262" cy="122" r="28" fill="url(#leaf)"/>
    <circle cx="118" cy="182" r="22" fill="url(#leaf)"/>
    <circle cx="286" cy="178" r="22" fill="url(#leaf)"/>
    <circle cx="170" cy="70" r="18" fill="url(#leaf)"/>
    <circle cx="228" cy="68" r="18" fill="url(#leaf)"/>
  </g>

  <!-- Circuit nodes on branches -->
  <g fill="#ffffff" filter="url(#glow)">
    <circle cx="200" cy="170" r="2.5"/>
    <circle cx="140" cy="130" r="2.5"/>
    <circle cx="262" cy="128" r="2.5"/>
    <circle cx="196" cy="100" r="2.5"/>
    <circle cx="118" cy="185" r="2"/>
    <circle cx="284" cy="180" r="2"/>
  </g>

  <!-- Ground -->
  <path d="M0 330 Q200 310 400 330 L400 400 L0 400 Z" fill="#0b0920"/>
  <path d="M0 330 Q200 310 400 330" fill="none" stroke="#2de2e6" stroke-width="1.5" opacity="0.8" filter="url(#glow)"/>

  <!-- Ground grid lines -->
  <g stroke="#2de2e6" stroke-width="0.6" opacity="0.35">
    <path d="M0 350 L400 350"/>
    <path d="M0 370 L400 370"/>
    <path d="M0 390 L400 390"/>
    <path d="M100 330 L40 400"/>
    <path d="M200 330 L200 400"/>
    <path d="M300 330 L360 400"/>
  </g>

  <!-- Roots glow -->
  <ellipse cx="200" cy="332" rx="30" ry="5" fill="#ff5fc8" opacity="0.6" filter="url(#glow)"/>
</svg>