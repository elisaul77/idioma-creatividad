<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14183a"/>
      <stop offset="1" stop-color="#3b1d5e"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Фон: ночное небо -->
  <rect width="400" height="400" fill="url(#sky)"/>
  <g fill="#e0e7ff">
    <circle cx="30" cy="30" r="1.5"/>
    <circle cx="110" cy="45" r="1"/>
    <circle cx="180" cy="22" r="1.5"/>
    <circle cx="260" cy="38" r="1"/>
    <circle cx="370" cy="25" r="1.5"/>
    <circle cx="360" cy="120" r="1"/>
    <circle cx="20" cy="150" r="1"/>
    <circle cx="90" cy="110" r="1.5"/>
    <circle cx="200" cy="80" r="1"/>
    <circle cx="385" cy="200" r="1.2"/>
    <circle cx="15" cy="260" r="1"/>
  </g>
  <circle cx="70" cy="70" r="24" fill="#fef3c7"/>
  <circle cx="78" cy="62" r="20" fill="#14183a" opacity="0.85"/>

  <!-- Земля и свечение под существом -->
  <ellipse cx="200" cy="335" rx="150" ry="18" fill="#0f766e" opacity="0.45"/>

  <!-- Хвост с листоподобным веером -->
  <path d="M122 220 C 72 240, 50 195, 45 152" fill="none" stroke="#4fd1c5" stroke-width="18" stroke-linecap="round"/>
  <g fill="#f6ad55" stroke="#c2410c" stroke-width="1">
    <path d="M45 152 q-20 -8 -26 -32 q22 4 26 32z"/>
    <path d="M45 152 q-4 -26 8 -44 q10 22 -8 44z"/>
    <path d="M45 152 q14 -18 34 -22 q-8 20 -34 22z"/>
  </g>

  <!-- Ноги с плавниковыми ступнями -->
  <g stroke="#2b6cb0" stroke-width="12" stroke-linecap="round">
    <line x1="150" y1="250" x2="140" y2="318"/>
    <line x1="176" y1="260" x2="172" y2="324"/>
    <line x1="226" y1="260" x2="232" y2="324"/>
    <line x1="252" y1="250" x2="262" y2="316"/>
  </g>
  <g fill="#f6ad55">
    <ellipse cx="134" cy="324" rx="14" ry="6"/>
    <ellipse cx="166" cy="330" rx="14" ry="6"/>
    <ellipse cx="238" cy="330" rx="14" ry="6"/>
    <ellipse cx="268" cy="322" rx="14" ry="6"/>
  </g>

  <!-- Тело -->
  <ellipse cx="200" cy="225" rx="88" ry="52" fill="url(#body)"/>

  <!-- Чешуя -->
  <g fill="none" stroke="#a7f3d0" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round">
    <path d="M150 220 q8 -8 16 0 q8 -8 16 0"/>
    <path d="M190 212 q8 -8 16 0 q8 -8 16 0"/>
    <path d="M230 220 q8 -8 16 0 q8 -8 16 0"/>
    <path d="M168 242 q8 -8 16 0 q8 -8 16 0"/>
    <path d="M208 240 q8 -8 16 0 q8 -8 16 0"/>
    <path d="M160 262 q8 -8 16 0 q8 -8 16 0"/>
    <path d="M200 260 q8 -8 16 0 q8 -8 16 0"/>
  </g>

  <!-- Гребень из перьев-листьев на спине -->
  <g fill="#fbbf24" stroke="#b45309" stroke-width="1">
    <path d="M145 182 L152 152 L159 182 Z"/>
    <path d="M165 178 L173 146 L181 178 Z"/>
    <path d="M186 176 L194 142 L202 176 Z"/>
    <path d="M208 176 L216 146 L223 176 Z"/>
    <path d="M229 180 L237 152 L244 180 Z"/>
  </g>

  <!-- Шея -->
  <path d="M250 205 Q270 190 282 180 L300 200 Q280 225 255 240 Z" fill="url(#body)"/>

  <!-- Уши -->
  <path d="M280 158 L270 122 L298 150 Z" fill="#5eead4" stroke="#0e7490" stroke-width="1"/>
  <path d="M300 150 L310 118 L318 154 Z" fill="#5eead4" stroke="#0e7490" stroke-width="1"/>

  <!-- Голова -->
  <ellipse cx="300" cy="178" rx="36" ry="30" fill="url(#body)"/>
  <path d="M326 186 Q352 188 352 202 Q340 210 324 200 Z" fill="#3b82f6"/>
  <circle cx="344" cy="197" r="2" fill="#1e3a8a"/>

  <!-- Спиральный рог -->
  <path d="M300 152 C 294 132, 306 118, 318 104" fill="none" stroke="#fde68a" stroke-width="7" stroke-linecap="round"/>
  <path d="M312 112 q6 -2 8 4 M306 124 q6 -2 8 4" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>

  <!-- Светящийся глаз -->
  <circle cx="312" cy="172" r="16" fill="#fde68a" opacity="0.4" filter="url(#blur)"/>
  <circle cx="312" cy="172" r="8" fill="#fef08a"/>
  <ellipse cx="314" cy="172" rx="3" ry="6" fill="#111827"/>

  <!-- Светящиеся частицы -->
  <g fill="#fef08a">
    <circle cx="90" cy="180" r="2" opacity="0.8"/>
    <circle cx="120" cy="120" r="1.5" opacity="0.7"/>
    <circle cx="340" cy="90" r="2" opacity="0.8"/>
    <circle cx="380" cy="150" r="1.5" opacity="0.6"/>
    <circle cx="60" cy="300" r="2" opacity="0.7"/>
    <circle cx="350" cy="300" r="1.5" opacity="0.6"/>
  </g>
</svg>