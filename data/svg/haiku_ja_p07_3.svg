<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="0.6" stop-color="#2a1b5e"/>
      <stop offset="1" stop-color="#0f4c5c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7ef9ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7ef9ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="0.35" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ff8a5c"/>
    </radialGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d2b4f"/>
      <stop offset="0.5" stop-color="#3a4f8a"/>
      <stop offset="1" stop-color="#1d2b4f"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="40" cy="45" r="1.2" opacity="0.8"/>
    <circle cx="95" cy="22" r="1" opacity="0.6"/>
    <circle cx="150" cy="60" r="1.4" opacity="0.9"/>
    <circle cx="350" cy="30" r="1.2" opacity="0.7"/>
    <circle cx="370" cy="95" r="1" opacity="0.5"/>
    <circle cx="30" cy="120" r="1" opacity="0.6"/>
    <circle cx="60" cy="200" r="1.3" opacity="0.7"/>
    <circle cx="345" cy="210" r="1.1" opacity="0.6"/>
    <circle cx="210" cy="18" r="1" opacity="0.8"/>
  </g>

  <!-- Ground glow -->
  <ellipse cx="200" cy="345" rx="160" ry="14" fill="#7ef9ff" opacity="0.15" filter="url(#blur)"/>

  <!-- Roots -->
  <g stroke="#7ef9ff" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M200 340 Q180 360 150 372"/>
    <path d="M200 340 Q220 360 250 374"/>
    <path d="M200 345 L200 382"/>
  </g>

  <!-- Trunk -->
  <path d="M186 342 Q193 260 200 200 Q207 260 214 342 Z" fill="url(#trunk)"/>

  <!-- Branches -->
  <g stroke="#7ef9ff" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M200 220 Q170 180 130 170"/>
    <path d="M200 220 Q230 180 270 165"/>
    <path d="M200 200 Q185 150 160 110"/>
    <path d="M200 200 Q215 150 245 105"/>
    <path d="M200 150 Q190 120 200 70"/>
    <path d="M130 170 Q110 150 90 150"/>
    <path d="M270 165 Q295 140 320 145"/>
    <path d="M160 110 Q140 95 120 80"/>
    <path d="M245 105 Q265 90 285 75"/>
    <path d="M200 70 Q175 55 165 35"/>
    <path d="M200 70 Q225 55 240 30"/>
  </g>

  <!-- Node glows -->
  <g fill="url(#glow)">
    <circle cx="130" cy="170" r="12"/>
    <circle cx="270" cy="165" r="12"/>
    <circle cx="160" cy="110" r="12"/>
    <circle cx="245" cy="105" r="12"/>
    <circle cx="200" cy="70" r="12"/>
    <circle cx="90" cy="150" r="12"/>
    <circle cx="120" cy="80" r="12"/>
    <circle cx="165" cy="35" r="12"/>
  </g>

  <!-- Circuit nodes -->
  <g fill="#bff8ff">
    <circle cx="130" cy="170" r="3"/>
    <circle cx="270" cy="165" r="3"/>
    <circle cx="160" cy="110" r="3"/>
    <circle cx="245" cy="105" r="3"/>
    <circle cx="200" cy="70" r="3"/>
    <circle cx="90" cy="150" r="3"/>
    <circle cx="165" cy="35" r="3"/>
  </g>

  <!-- Fruit orbs -->
  <g>
    <circle cx="320" cy="145" r="14" fill="#ffd166" opacity="0.4" filter="url(#blur)"/>
    <circle cx="320" cy="145" r="7" fill="url(#orb)"/>
    <circle cx="120" cy="80" r="14" fill="#ffd166" opacity="0.4" filter="url(#blur)"/>
    <circle cx="120" cy="80" r="7" fill="url(#orb)"/>
    <circle cx="240" cy="30" r="14" fill="#ff6fd8" opacity="0.4" filter="url(#blur)"/>
    <circle cx="240" cy="30" r="7" fill="url(#orb)"/>
    <circle cx="285" cy="75" r="12" fill="#ff6fd8" opacity="0.35" filter="url(#blur)"/>
    <circle cx="285" cy="75" r="6" fill="#ff6fd8"/>
  </g>

  <!-- Light particles rising -->
  <g fill="#7ef9ff">
    <circle cx="180" cy="300" r="1.5" opacity="0.8"/>
    <circle cx="215" cy="280" r="1.2" opacity="0.6"/>
    <circle cx="195" cy="250" r="1.5" opacity="0.7"/>
    <circle cx="225" cy="215" r="1" opacity="0.5"/>
    <circle cx="150" cy="240" r="1.2" opacity="0.6"/>
  </g>
</svg>