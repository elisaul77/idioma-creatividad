<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="anga" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#1a0b3d"/>
      <stop offset="45%" stop-color="#4b1d6e"/>
      <stop offset="75%" stop-color="#b0437a"/>
      <stop offset="100%" stop-color="#f29e6b"/>
    </linearGradient>
    <radialGradient id="mwezi" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#fff8e1"/>
      <stop offset="100%" stop-color="#f7d58a"/>
    </radialGradient>
    <radialGradient id="kivuli" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7fe3ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7fe3ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="ukungu" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="mng'ao" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#anga)"/>

  <!-- Nyota -->
  <g fill="#ffffff" filter="url(#mng'ao)">
    <circle cx="50" cy="60" r="1.6" opacity="0.9"/>
    <circle cx="120" cy="35" r="1.2" opacity="0.7"/>
    <circle cx="330" cy="50" r="1.8" opacity="0.9"/>
    <circle cx="360" cy="140" r="1.1" opacity="0.6"/>
    <circle cx="90" cy="150" r="1.4" opacity="0.8"/>
    <circle cx="280" cy="110" r="1" opacity="0.7"/>
    <circle cx="200" cy="70" r="1.3" opacity="0.8"/>
    <circle cx="30" cy="250" r="1.2" opacity="0.6"/>
    <circle cx="370" cy="290" r="1.5" opacity="0.7"/>
  </g>

  <!-- Mwezi -->
  <circle cx="290" cy="110" r="52" fill="#ffe9a8" opacity="0.25" filter="url(#ukungu)"/>
  <circle cx="290" cy="110" r="34" fill="url(#mwezi)" filter="url(#mng'ao)"/>
  <circle cx="302" cy="100" r="30" fill="#4b1d6e" opacity="0.35"/>

  <!-- Mawimbi ya ndoto -->
  <g fill="none" stroke="#ffd6f0" stroke-linecap="round" filter="url(#mng'ao)">
    <path d="M0 260 C 60 230, 110 290, 180 255 S 300 225, 400 265" stroke-width="2" opacity="0.6"/>
    <path d="M0 290 C 70 260, 130 320, 200 285 S 320 255, 400 295" stroke-width="1.5" opacity="0.45"/>
    <path d="M0 320 C 80 295, 150 345, 230 315 S 340 290, 400 325" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Duara inayozunguka -->
  <path d="M120 200 C 150 150, 220 160, 220 210 C 220 250, 170 260, 150 230 C 135 210, 165 185, 190 200"
        fill="none" stroke="#7fe3ff" stroke-width="2.5" stroke-linecap="round" opacity="0.8" filter="url(#mng'ao)"/>

  <!-- Maumbo yanayoelea -->
  <circle cx="110" cy="200" r="22" fill="url(#kivuli)"/>
  <circle cx="230" cy="215" r="14" fill="url(#kivuli)"/>
  <circle cx="160" cy="300" r="10" fill="#ffb3d9" opacity="0.5" filter="url(#ukungu)"/>
  <circle cx="310" cy="210" r="28" fill="#9be7ff" opacity="0.18" filter="url(#ukungu)"/>

  <!-- Jicho la ndoto -->
  <g transform="translate(200 200)">
    <path d="M-42 0 Q0 -30 42 0 Q0 30 -42 0 Z" fill="#fff4fb" opacity="0.15" stroke="#ffd6f0" stroke-width="1.5"/>
    <circle r="11" fill="#7fe3ff" opacity="0.8" filter="url(#mng'ao)"/>
    <circle r="4" fill="#1a0b3d"/>
  </g>

  <!-- Mistari ya ukungu -->
  <g fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.25">
    <ellipse cx="200" cy="200" rx="150" ry="70" transform="rotate(-18 200 200)"/>
    <ellipse cx="200" cy="200" rx="120" ry="110" transform="rotate(25 200 200)"/>
  </g>
</svg>