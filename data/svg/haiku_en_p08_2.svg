<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1538"/>
      <stop offset="1" stop-color="#2A2466"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE9A0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFE9A0" stop-opacity="0"/>
    </radialGradient>
    <mask id="crescent">
      <rect width="400" height="400" fill="white"/>
      <circle cx="346" cy="58" r="34" fill="black"/>
    </mask>
  </defs>

  <!-- Night sky -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#FFFFFF">
    <circle cx="40" cy="40" r="2"/>
    <circle cx="95" cy="70" r="1.5"/>
    <circle cx="160" cy="34" r="2"/>
    <circle cx="210" cy="82" r="1.5"/>
    <circle cx="260" cy="30" r="2"/>
    <circle cx="70" cy="130" r="1.5"/>
    <circle cx="185" cy="140" r="1.2"/>
    <circle cx="28" cy="190" r="1.5"/>
    <circle cx="372" cy="150" r="1.8"/>
    <circle cx="240" cy="180" r="1.2"/>
    <circle cx="375" cy="20" r="1.5"/>
  </g>

  <!-- Moon -->
  <circle cx="330" cy="70" r="70" fill="url(#glow)"/>
  <circle cx="330" cy="70" r="38" fill="#FFF3B0" mask="url(#crescent)"/>

  <!-- Floor -->
  <rect x="0" y="320" width="400" height="80" fill="#8B5E3C"/>
  <rect x="0" y="320" width="400" height="6" fill="#6E4A2E"/>

  <!-- Teddy bear -->
  <g>
    <circle cx="95" cy="192" r="14" fill="#B07A4A"/>
    <circle cx="145" cy="192" r="14" fill="#B07A4A"/>
    <circle cx="95" cy="192" r="7" fill="#D9A877"/>
    <circle cx="145" cy="192" r="7" fill="#D9A877"/>
    <ellipse cx="120" cy="275" rx="36" ry="42" fill="#B07A4A"/>
    <ellipse cx="120" cy="288" rx="20" ry="26" fill="#D9A877"/>
    <circle cx="120" cy="216" r="28" fill="#B07A4A"/>
    <ellipse cx="120" cy="226" rx="12" ry="9" fill="#D9A877"/>
    <circle cx="110" cy="210" r="3" fill="#1A1A1A"/>
    <circle cx="130" cy="210" r="3" fill="#1A1A1A"/>
    <circle cx="120" cy="222" r="3.5" fill="#1A1A1A"/>
    <ellipse cx="100" cy="312" rx="15" ry="9" fill="#B07A4A"/>
    <ellipse cx="140" cy="312" rx="15" ry="9" fill="#B07A4A"/>
    <ellipse cx="82" cy="282" rx="9" ry="16" fill="#9A6A3E" transform="rotate(15 82 282)"/>
    <ellipse cx="158" cy="282" rx="9" ry="16" fill="#9A6A3E" transform="rotate(-15 158 282)"/>
  </g>

  <!-- Toy robot -->
  <g>
    <line x1="290" y1="186" x2="290" y2="164" stroke="#AEB8C6" stroke-width="3"/>
    <circle cx="290" cy="160" r="5" fill="#FF6B6B"/>
    <rect x="265" y="186" width="50" height="40" rx="6" fill="#9AA8B8"/>
    <rect x="273" y="198" width="11" height="8" rx="2" fill="#FFE066"/>
    <rect x="296" y="198" width="11" height="8" rx="2" fill="#FFE066"/>
    <rect x="262" y="230" width="56" height="58" rx="6" fill="#6F7F92"/>
    <circle cx="290" cy="256" r="6" fill="#4FD1C5"/>
    <rect x="248" y="234" width="12" height="40" rx="6" fill="#9AA8B8"/>
    <rect x="320" y="234" width="12" height="40" rx="6" fill="#9AA8B8"/>
    <rect x="272" y="288" width="13" height="30" rx="4" fill="#4E5B6B"/>
    <rect x="295" y="288" width="13" height="30" rx="4" fill="#4E5B6B"/>
    <rect x="266" y="314" width="22" height="7" rx="3" fill="#2F3847"/>
    <rect x="292" y="314" width="22" height="7" rx="3" fill="#2F3847"/>
  </g>

  <!-- Stacked blocks -->
  <g>
    <rect x="30" y="284" width="42" height="36" rx="3" fill="#E94F4F"/>
    <rect x="36" y="250" width="32" height="34" rx="3" fill="#4FA3E9"/>
    <rect x="34" y="296" width="6" height="24" fill="#C93B3B" opacity="0.5"/>
    <polygon points="52,262 56,270 65,270 58,275 61,284 52,279 43,284 46,275 39,270 48,270" fill="#FFD84D"/>
  </g>

  <!-- Bouncing ball and shadow -->
  <ellipse cx="200" cy="324" rx="18" ry="4" fill="#000000" opacity="0.35"/>
  <circle cx="200" cy="290" r="16" fill="#F2B705"/>
  <path d="M190 282 Q200 276 210 282" stroke="#FFF2A8" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Toy car -->
  <g>
    <rect x="236" y="338" width="54" height="16" rx="5" fill="#2EC4B6"/>
    <path d="M246 338 L256 324 L276 324 L282 338 Z" fill="#26A89C"/>
    <rect x="252" y="327" width="8" height="8" fill="#BFF3EE"/>
    <rect x="264" y="327" width="8" height="8" fill="#BFF3EE"/>
    <circle cx="249" cy="356" r="7" fill="#222222"/>
    <circle cx="277" cy="356" r="7" fill="#222222"/>
    <circle cx="249" cy="356" r="2.5" fill="#BBBBBB"/>
    <circle cx="277" cy="356" r="2.5" fill="#BBBBBB"/>
  </g>

  <!-- Twinkle sparkles around toys -->
  <g fill="#FFE9A0">
    <path d="M70 230 L72 236 L78 238 L72 240 L70 246 L68 240 L62 238 L68 236 Z"/>
    <path d="M330 200 L331.5 204 L335.5 205.5 L331.5 207 L330 211 L328.5 207 L324.5 205.5 L328.5 204 Z"/>
    <path d="M180 240 L181 243 L184 244 L181 245 L180 248 L179 245 L176 244 L179 243 Z"/>
  </g>
</svg>