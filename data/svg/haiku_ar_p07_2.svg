<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1026"/>
      <stop offset="60%" stop-color="#1d2b64"/>
      <stop offset="100%" stop-color="#2e1a47"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7c2"/>
      <stop offset="60%" stop-color="#ffb347" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff6f91" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ff9ff"/>
      <stop offset="100%" stop-color="#2a5d8f"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8effc1"/>
      <stop offset="100%" stop-color="#3ddc97"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="40" cy="50" r="1.5"/>
    <circle cx="90" cy="25" r="1"/>
    <circle cx="150" cy="70" r="1.2"/>
    <circle cx="330" cy="40" r="1.5"/>
    <circle cx="360" cy="110" r="1"/>
    <circle cx="60" cy="130" r="1"/>
    <circle cx="300" cy="150" r="1.2"/>
    <circle cx="20" cy="200" r="1"/>
    <circle cx="385" cy="220" r="1.3"/>
  </g>

  <!-- Sun -->
  <circle cx="200" cy="130" r="95" fill="url(#sun)"/>
  <circle cx="200" cy="130" r="38" fill="#fff3b0" filter="url(#glow)"/>

  <!-- Orbit rings -->
  <ellipse cx="200" cy="300" rx="170" ry="28" fill="none" stroke="#7ff9ff" stroke-opacity="0.35" stroke-width="1.5"/>
  <ellipse cx="200" cy="300" rx="120" ry="18" fill="none" stroke="#c39bff" stroke-opacity="0.35" stroke-width="1"/>

  <!-- Ground -->
  <path d="M0 320 Q200 290 400 320 L400 400 L0 400 Z" fill="#0f1c3a"/>

  <!-- Glowing trunk -->
  <path d="M192 330 Q196 260 200 200 Q204 260 208 330 Z" fill="url(#trunk)" filter="url(#glow)"/>

  <!-- Branches -->
  <g fill="none" stroke="#7ff9ff" stroke-width="3" stroke-linecap="round" filter="url(#glow)">
    <path d="M200 220 Q170 200 140 180"/>
    <path d="M200 220 Q230 200 260 180"/>
    <path d="M200 200 Q185 170 170 140"/>
    <path d="M200 200 Q215 170 230 140"/>
    <path d="M200 240 Q160 240 120 225"/>
    <path d="M200 240 Q240 240 280 225"/>
    <path d="M170 140 Q160 120 150 110"/>
    <path d="M230 140 Q240 120 250 110"/>
  </g>

  <!-- Circuit-like connections -->
  <g fill="none" stroke="#c39bff" stroke-width="1.5" stroke-opacity="0.8">
    <path d="M140 180 L120 180 L120 160"/>
    <path d="M260 180 L280 180 L280 160"/>
    <path d="M120 225 L100 225 L100 245"/>
    <path d="M280 225 L300 225 L300 245"/>
    <path d="M150 110 L150 90 L170 90"/>
    <path d="M250 110 L250 90 L230 90"/>
  </g>

  <!-- Foliage nodes -->
  <g filter="url(#glow)">
    <circle cx="140" cy="180" r="14" fill="url(#leaf)"/>
    <circle cx="260" cy="180" r="14" fill="url(#leaf)"/>
    <circle cx="170" cy="140" r="16" fill="url(#leaf)"/>
    <circle cx="230" cy="140" r="16" fill="url(#leaf)"/>
    <circle cx="120" cy="225" r="11" fill="url(#leaf)"/>
    <circle cx="280" cy="225" r="11" fill="url(#leaf)"/>
    <circle cx="150" cy="110" r="10" fill="url(#leaf)"/>
    <circle cx="250" cy="110" r="10" fill="url(#leaf)"/>
    <circle cx="200" cy="170" r="18" fill="url(#leaf)"/>
  </g>

  <!-- Bright nodes at connection points -->
  <g fill="#ffffff" filter="url(#glow)">
    <circle cx="120" cy="160" r="3"/>
    <circle cx="280" cy="160" r="3"/>
    <circle cx="170" cy="90" r="3"/>
    <circle cx="230" cy="90" r="3"/>
    <circle cx="100" cy="245" r="2.5"/>
    <circle cx="300" cy="245" r="2.5"/>
  </g>

  <!-- Floating light particles -->
  <g fill="#ffd6ff" filter="url(#glow)">
    <circle cx="90" cy="290" r="2"/>
    <circle cx="310" cy="280" r="2"/>
    <circle cx="150" cy="60" r="1.8"/>
    <circle cx="265" cy="60" r="1.8"/>
    <circle cx="60" cy="330" r="1.5"/>
    <circle cx="345" cy="335" r="1.5"/>
  </g>
</svg>