<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#EAF6FF"/>
      <stop offset="60%" stop-color="#C4E4FA"/>
      <stop offset="100%" stop-color="#7DB8E8"/>
    </radialGradient>
    <linearGradient id="drop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7FD0FF"/>
      <stop offset="50%" stop-color="#1E6FD9"/>
      <stop offset="100%" stop-color="#0B2E7A"/>
    </linearGradient>
    <radialGradient id="bubble" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#8ED6FF" stop-opacity="0.35"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- taste waves radiating from the color -->
  <g fill="none" stroke="#1E6FD9" stroke-linecap="round">
    <circle cx="200" cy="215" r="70"  stroke-width="5" stroke-opacity="0.35"/>
    <circle cx="200" cy="215" r="105" stroke-width="4" stroke-opacity="0.25"/>
    <circle cx="200" cy="215" r="140" stroke-width="3" stroke-opacity="0.18"/>
    <circle cx="200" cy="215" r="175" stroke-width="2" stroke-opacity="0.12"/>
  </g>

  <!-- soft glow behind the drop -->
  <ellipse cx="200" cy="235" rx="90" ry="100" fill="#3C9BFF" fill-opacity="0.35" filter="url(#soft)"/>

  <!-- central blue drop -->
  <path d="M200 90
           C200 90 128 176 128 242
           C128 287 160 318 200 318
           C240 318 272 287 272 242
           C272 176 200 90 200 90 Z"
        fill="url(#drop)"/>

  <!-- glossy highlights -->
  <ellipse cx="172" cy="200" rx="10" ry="22" fill="#FFFFFF" fill-opacity="0.7" transform="rotate(-18 172 200)"/>
  <circle cx="232" cy="262" r="5" fill="#FFFFFF" fill-opacity="0.5"/>

  <!-- rising bubbles, like flavor sparkling -->
  <g>
    <circle cx="90"  cy="140" r="14" fill="url(#bubble)"/>
    <circle cx="112" cy="92"  r="9"  fill="url(#bubble)"/>
    <circle cx="308" cy="128" r="16" fill="url(#bubble)"/>
    <circle cx="332" cy="190" r="8"  fill="url(#bubble)"/>
    <circle cx="70"  cy="250" r="7"  fill="url(#bubble)"/>
    <circle cx="318" cy="290" r="12" fill="url(#bubble)"/>
    <circle cx="150" cy="60"  r="6"  fill="url(#bubble)"/>
    <circle cx="265" cy="60"  r="10" fill="url(#bubble)"/>
  </g>

  <!-- liquid pool at the base -->
  <path d="M0 340 Q50 322 100 340 T200 340 T300 340 T400 340 L400 400 L0 400 Z"
        fill="#1E6FD9" fill-opacity="0.45"/>
  <path d="M0 362 Q55 346 110 362 T220 362 T330 362 T400 362 L400 400 L0 400 Z"
        fill="#0B2E7A" fill-opacity="0.35"/>
</svg>