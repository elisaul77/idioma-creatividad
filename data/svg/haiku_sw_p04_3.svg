<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="anga" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd8e8"/>
      <stop offset="1" stop-color="#fdf0c8"/>
    </linearGradient>
    <linearGradient id="kilima" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ccf7a"/>
      <stop offset="1" stop-color="#5aa653"/>
