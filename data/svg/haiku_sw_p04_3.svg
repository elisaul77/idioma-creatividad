  <circle cx="250" cy="235" r="20" fill="#fff3b0" stroke="#7a4a2a" stroke-width="5"/>
  <line x1="250" y1="215" x2="250" y2="255" stroke="#7a4a2a" stroke-width="3"/>
  <line x1="230" y1="235" x2="270" y2="235" stroke="#7a4a2a" stroke-width="3"/>

