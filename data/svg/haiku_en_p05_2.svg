<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050a1f"/>
      <stop offset="1" stop-color="#1d2f5c"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6b0"/>
      <stop offset="0.6" stop-color="#ffd65a"/>
      <stop offset="1" stop-color="#f29a2e"/>
    </radialGradient>
    <radialGradient id="mantle" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.5" stop-color="#d9622e"/>
      <stop offset="1" stop-color="#9e3418"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d99ae"/>
      <stop offset="0.5" stop-color="#edf2f4"/>
      <stop offset="1" stop-color="#8d99ae"/>
    </linearGradient>
    <clipPath id="earth">
      <circle cx="200" cy="470" r="380"/>
    </clipPath>
  </defs>

  <!-- Sky and stars -->
  <rect width="400" height="400" fill="url(#sky)"/>
  <circle cx="40" cy="30" r="1.5" fill="#ffffff"/>
  <circle cx="90" cy="60" r="1" fill="#ffffff"/>
  <circle cx="150" cy="25" r="1.2" fill="#ffffff"/>
  <circle cx="260" cy="40" r="1.5" fill="#ffffff"/>
  <circle cx="330" cy="20" r="1" fill="#ffffff"/>
  <circle cx="370" cy="70" r="1.5" fill="#ffffff"/>
  <circle cx="310" cy="95" r="1" fill="#ffffff"/>
  <circle cx="60" cy="110" r="1" fill="#ffffff"/>

  <!-- Earth cross-section -->
  <g clip-path="url(#earth)">
    <circle cx="200" cy="470" r="380" fill="#5a4032"/>
    <circle cx="200" cy="470" r="330" fill="#7a5a43" opacity="0.6"/>
    <circle cx="200" cy="470" r="300" fill="url(#mantle)"/>
    <circle cx="200" cy="470" r="170" fill="#f29a2e"/>
    <circle cx="200" cy="470" r="110" fill="url(#glow)"/>
    <circle cx="200" cy="470" r="75" fill="url(#core)"/>
  </g>
  <circle cx="200" cy="470" r="380" fill="none" stroke="#9bd770" stroke-width="4"/>

  <!-- Descent path -->
  <line x1="200" y1="254" x2="200" y2="395" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 6" opacity="0.8"/>

  <!-- Vehicle -->
  <g transform="translate(200,190)">
    <circle r="48" fill="url(#glow)" opacity="0.5"/>
    <path d="M-16 10 L-30 30 M16 10 L30 30" stroke="#8d99ae" stroke-width="4" stroke-linecap="round"/>
    <ellipse rx="22" ry="34" fill="url(#hull)"/>
    <ellipse cy="-10" rx="10" ry="9" fill="#38bdf8"/>
    <ellipse cx="-3" cy="-13" rx="3" ry="2" fill="#ffffff" opacity="0.8"/>
    <rect x="-20" y="8" width="40" height="4" fill="#e63946"/>
    <path d="M-12 30 L12 30 L0 64 Z" fill="#6c757d"/>
    <path d="M-8 40 L8 44 M-6 50 L6 54" stroke="#495057" stroke-width="2"/>
    <circle cy="66" r="8" fill="url(#glow)"/>
  </g>
</svg>