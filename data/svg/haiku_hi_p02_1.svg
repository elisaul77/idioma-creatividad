<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="sky" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#3b2a6e"/>
      <stop offset="50%" stop-color="#1d1648"/>
      <stop offset="100%" stop-color="#0a0820"/>
    </radialGradient>
    <radialGradient id="moon" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff8e1"/>
      <stop offset="60%" stop-color="#ffd98a"/>
      <stop offset="100%" stop-color="#ffb36b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb1" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffb8e6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9b5de5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#9ff0ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3a86ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb3" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffe3a3" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ff7eb6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="swirl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9ad5"/>
      <stop offset="100%" stop-color="#7ae7ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- Nebula clouds -->
  <ellipse cx="90" cy="310" rx="120" ry="45" fill="#7b2cbf" opacity="0.25" filter="url(#soft)"/>
  <ellipse cx="320" cy="250" rx="110" ry="50" fill="#ff5fa2" opacity="0.2" filter="url(#soft)"/>
  <ellipse cx="200" cy="120" rx="150" ry="40" fill="#4cc9f0" opacity="0.12" filter="url(#soft)"/>

  <!-- Moon -->
  <circle cx="290" cy="95" r="58" fill="url(#moon)" opacity="0.9"/>
  <circle cx="290" cy="95" r="34" fill="#fff4cc" filter="url(#glow)"/>
  <circle cx="302" cy="85" r="30" fill="#2a1f5c" opacity="0.35"/>

  <!-- Stars -->
  <g fill="#ffffff" filter="url(#glow)">
    <circle cx="48" cy="60" r="1.6"/>
    <circle cx="112" cy="36" r="1.2"/>
    <circle cx="170" cy="70" r="1.8"/>
    <circle cx="210" cy="30" r="1.1"/>
    <circle cx="28" cy="150" r="1.3"/>
    <circle cx="150" cy="150" r="1"/>
    <circle cx="370" cy="170" r="1.5"/>
    <circle cx="60" cy="230" r="1.2"/>
    <circle cx="375" cy="30" r="1.4"/>
    <circle cx="240" cy="200" r="1"/>
    <circle cx="20" cy="370" r="1.3"/>
    <circle cx="355" cy="370" r="1.6"/>
  </g>
  <g fill="#ffe9ff" opacity="0.8">
    <path d="M 130 210 l 2 -6 l 2 6 l 6 2 l -6 2 l -2 6 l -2 -6 l -6 -2 z"/>
    <path d="M 340 320 l 1.5 -4.5 l 1.5 4.5 l 4.5 1.5 l -4.5 1.5 l -1.5 4.5 l -1.5 -4.5 l -4.5 -1.5 z"/>
  </g>

  <!-- Floating dream orbs -->
  <circle cx="110" cy="200" r="46" fill="url(#orb1)" filter="url(#glow)"/>
  <circle cx="250" cy="290" r="38" fill="url(#orb2)" filter="url(#glow)"/>
  <circle cx="330" cy="190" r="22" fill="url(#orb3)" filter="url(#glow)"/>
  <circle cx="70" cy="330" r="16" fill="url(#orb3)" opacity="0.8"/>

  <!-- Spiraling dream path -->
  <path d="M 200 400 C 150 340, 260 300, 210 250 C 170 210, 230 180, 200 140 C 180 110, 220 90, 200 60"
        fill="none" stroke="url(#swirl)" stroke-width="2.5" stroke-linecap="round" opacity="0.75" filter="url(#glow)"/>
  <path d="M 200 400 C 240 350, 150 320, 190 270 C 220 230, 160 200, 185 165"
        fill="none" stroke="#c77dff" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Drifting wisps -->
  <path d="M 0 280 Q 60 255 120 280 T 240 275 T 400 265" fill="none" stroke="#ffd6f0" stroke-width="2" opacity="0.35" filter="url(#glow)"/>
  <path d="M 0 320 Q 80 300 150 322 T 300 318 T 400 308" fill="none" stroke="#a8e6ff" stroke-width="1.5" opacity="0.3" filter="url(#glow)"/>

  <!-- Dream reflection ripples -->
  <g fill="none" stroke="#e0b3ff" stroke-width="1" opacity="0.25">
    <ellipse cx="200" cy="385" rx="70" ry="8"/>
    <ellipse cx="200" cy="385" rx="120" ry="14"/>
    <ellipse cx="200" cy="385" rx="170" ry="20"/>
  </g>
</svg>