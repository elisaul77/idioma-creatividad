<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="space" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1b2445"/>
      <stop offset="100%" stop-color="#050812"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbe0"/>
      <stop offset="60%" stop-color="#ffd76a"/>
      <stop offset="100%" stop-color="#f29a2e"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe27a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffe27a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pod" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9fb4d6"/>
      <stop offset="50%" stop-color="#e9f0ff"/>
      <stop offset="100%" stop-color="#7d93b8"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="400" height="400" fill="url(#space)"/>
  <circle cx="40" cy="40" r="1.6" fill="#ffffff"/>
  <circle cx="362" cy="52" r="1.2" fill="#ffffff"/>
  <circle cx="28" cy="330" r="1.4" fill="#ffffff"/>
  <circle cx="372" cy="342" r="1.8" fill="#ffffff"/>
  <circle cx="346" cy="170" r="1.1" fill="#ffffff"/>
  <circle cx="22" cy="190" r="1.3" fill="#ffffff"/>
  <circle cx="90" cy="18" r="1" fill="#ffffff"/>
  <circle cx="312" cy="384" r="1" fill="#ffffff"/>

  <!-- Capas de la Tierra -->
  <circle cx="200" cy="200" r="170" fill="#7a4a24"/>
  <circle cx="200" cy="200" r="132" fill="#c0692c"/>
  <circle cx="200" cy="200" r="94" fill="#e8913a"/>
  <circle cx="200" cy="200" r="56" fill="#ffc35a"/>
  <circle cx="200" cy="200" r="26" fill="url(#core)"/>

  <!-- Textura sutil de capas -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="#5a3418" stroke-width="2" stroke-dasharray="6 10" opacity="0.5"/>
  <circle cx="200" cy="200" r="112" fill="none" stroke="#a04f1e" stroke-width="2" stroke-dasharray="4 12" opacity="0.5"/>

  <!-- Túnel excavado desde la superficie hasta el núcleo -->
  <rect x="192" y="30" width="16" height="170" rx="8" fill="#2a1710" opacity="0.85"/>
  <rect x="195" y="30" width="2" height="170" fill="#ffffff" opacity="0.15"/>

  <!-- Brillo del núcleo -->
  <circle cx="200" cy="200" r="48" fill="url(#glow)"/>

  <!-- Vehículo -->
  <g transform="translate(200 118)">
    <!-- Estela -->
    <path d="M-7 -40 L-14 -70 L0 -58 L14 -70 L7 -40 Z" fill="#ffd27a" opacity="0.6"/>
    <!-- Aletas -->
    <path d="M-16 -18 L-30 -4 L-16 2 Z" fill="#c7d3ea"/>
    <path d="M16 -18 L30 -4 L16 2 Z" fill="#c7d3ea"/>
    <!-- Cuerpo cápsula -->
    <rect x="-17" y="-34" width="34" height="56" rx="17" fill="url(#pod)" stroke="#4a5d80" stroke-width="1.5"/>
    <!-- Ventanilla -->
    <circle cx="0" cy="-12" r="7" fill="#3fd0ff" stroke="#1d4f73" stroke-width="1.5"/>
    <circle cx="-2" cy="-14" r="2" fill="#ffffff" opacity="0.8"/>
    <!-- Franja -->
    <rect x="-17" y="4" width="34" height="3" fill="#ff7a59"/>
    <!-- Taladro -->
    <path d="M-16 20 L16 20 L0 52 Z" fill="#8c98ac" stroke="#4a5468" stroke-width="1.5"/>
    <path d="M-10 28 L10 28 M-6 36 L6 36 M-3 44 L3 44" stroke="#4a5468" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>