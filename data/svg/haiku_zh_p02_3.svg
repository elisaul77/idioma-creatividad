<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1040"/>
      <stop offset="45%" stop-color="#5b3a8c"/>
      <stop offset="75%" stop-color="#e88bb0"/>
      <stop offset="100%" stop-color="#ffd1a6"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#fffbe6"/>
      <stop offset="100%" stop-color="#f7d58a"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bubble" cx="0.35" cy="0.35" r="0.65">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#b8f0ff" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#f5b8ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6"/>
    </radialGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffd6e8" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- sky -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- distant stars -->
  <g fill="#ffffff">
    <circle cx="40" cy="50" r="1.5" opacity="0.9"/>
    <circle cx="90" cy="120" r="1" opacity="0.7"/>
    <circle cx="330" cy="60" r="1.8" opacity="0.9"/>
    <circle cx="360" cy="150" r="1.2" opacity="0.6"/>
    <circle cx="200" cy="30" r="1" opacity="0.8"/>
    <circle cx="150" cy="80" r="1.3" opacity="0.7"/>
    <circle cx="20" cy="200" r="1" opacity="0.5"/>
    <circle cx="380" cy="250" r="1.4" opacity="0.6"/>
  </g>

  <!-- moon with halo -->
  <circle cx="290" cy="110" r="70" fill="url(#glow)"/>
  <circle cx="290" cy="110" r="42" fill="url(#moon)"/>
  <circle cx="306" cy="98" r="7" fill="#eccb7a" opacity="0.35"/>
  <circle cx="278" cy="126" r="4" fill="#eccb7a" opacity="0.3"/>

  <!-- drifting dream clouds -->
  <g filter="url(#soft)">
    <ellipse cx="90" cy="250" rx="70" ry="22" fill="url(#cloud)"/>
    <ellipse cx="130" cy="236" rx="40" ry="20" fill="url(#cloud)"/>
    <ellipse cx="320" cy="290" rx="80" ry="24" fill="url(#cloud)"/>
    <ellipse cx="270" cy="278" rx="42" ry="18" fill="url(#cloud)"/>
    <ellipse cx="170" cy="330" rx="110" ry="26" fill="url(#cloud)" opacity="0.8"/>
  </g>

  <!-- floating spiral staircase -->
  <g fill="none" stroke="#fff3fb" stroke-width="2" opacity="0.6">
    <path d="M60 180 C 90 160, 110 200, 140 178 S 180 160, 200 190"/>
    <path d="M200 190 C 220 210, 240 200, 250 220 S 280 240, 300 226" stroke-dasharray="4 6"/>
  </g>

  <!-- small floating figure on a crescent -->
  <g transform="translate(200 200)">
    <path d="M-18 14 Q0 -2 18 14 Q0 22 -18 14 Z" fill="#2d1b4e" opacity="0.8"/>
    <circle cx="0" cy="-8" r="6" fill="#2d1b4e" opacity="0.8"/>
    <path d="M-6 16 L-14 34 M6 16 L14 30" stroke="#2d1b4e" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- spiral motif -->
  <g fill="none" stroke="#c9a7ff" stroke-width="1.6" opacity="0.7">
    <path d="M70 320 m0 0 a10 10 0 1 1 10 10 a18 18 0 1 1 -30 -10 a28 28 0 1 1 40 28"/>
    <path d="M340 340 m0 0 a8 8 0 1 1 8 8 a14 14 0 1 1 -24 -8 a22 22 0 1 1 32 22"/>
  </g>

  <!-- iridescent floating bubbles -->
  <g>
    <circle cx="120" cy="150" r="22" fill="url(#bubble)" stroke="#ffffff" stroke-opacity="0.4"/>
    <circle cx="350" cy="200" r="16" fill="url(#bubble)" stroke="#ffffff" stroke-opacity="0.4"/>
    <circle cx="60" cy="300" r="12" fill="url(#bubble)" stroke="#ffffff" stroke-opacity="0.4"/>
    <circle cx="250" cy="340" r="9" fill="url(#bubble)" stroke="#ffffff" stroke-opacity="0.4"/>
    <circle cx="180" cy="120" r="6" fill="url(#bubble)" stroke="#ffffff" stroke-opacity="0.4"/>
    <circle cx="320" cy="340" r="5" fill="url(#bubble)" stroke="#ffffff" stroke-opacity="0.4"/>
  </g>

  <!-- soft sparkles -->
  <g fill="#ffffff">
    <path d="M160 260 l2 -8 l2 8 l8 2 l-8 2 l-2 8 l-2 -8 l-8 -2 z" opacity="0.9"/>
    <path d="M240 150 l1.5 -6 l1.5 6 l6 1.5 l-6 1.5 l-1.5 6 l-1.5 -6 l-6 -1.5 z" opacity="0.8"/>
    <path d="M30 370 l1 -4 l1 4 l4 1 l-4 1 l-1 4 l-1 -4 l-4 -1 z" opacity="0.7"/>
  </g>
</svg>