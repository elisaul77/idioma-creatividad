<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1f4b"/>
      <stop offset="1" stop-color="#4a3c7a"/>
    </linearGradient>
    <radialGradient id="luna" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#fff9d6"/>
      <stop offset="1" stop-color="#f2d675"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Cielo -->
  <rect width="400" height="400" fill="url(#cielo)"/>

  <!-- Estrellas -->
  <g fill="#fff8e1">
    <circle cx="40" cy="40" r="2"/>
    <circle cx="90" cy="25" r="1.5"/>
    <circle cx="160" cy="50" r="2"/>
    <circle cx="330" cy="35" r="2.5"/>
    <circle cx="370" cy="90" r="1.5"/>
    <circle cx="260" cy="70" r="1.5"/>
    <circle cx="25" cy="120" r="1.5"/>
    <circle cx="345" cy="150" r="1.8"/>
  </g>

  <!-- Luna -->
  <circle cx="320" cy="90" r="46" fill="url(#halo)"/>
  <circle cx="320" cy="90" r="30" fill="url(#luna)"/>
  <circle cx="310" cy="82" r="5" fill="#e8c865" opacity="0.5"/>
  <circle cx="330" cy="100" r="4" fill="#e8c865" opacity="0.5"/>

  <!-- Suelo -->
  <rect x="0" y="310" width="400" height="90" fill="#2b2350"/>
  <path d="M0 310 Q200 300 400 310 L400 318 Q200 308 0 318 Z" fill="#3a2f66"/>

  <!-- Ventana con marco -->
  <rect x="20" y="130" width="90" height="100" rx="4" fill="#0f1233"/>
  <rect x="24" y="134" width="82" height="92" fill="#263070"/>
  <line x1="65" y1="134" x2="65" y2="226" stroke="#3a4590" stroke-width="3"/>
  <line x1="24" y1="180" x2="106" y2="180" stroke="#3a4590" stroke-width="3"/>

  <!-- Osito de peluche (sale por la ventana) -->
  <g transform="translate(150,250)">
    <circle cx="-22" cy="-70" r="12" fill="#c98b5a"/>
    <circle cx="22" cy="-70" r="12" fill="#c98b5a"/>
    <circle cx="-22" cy="-70" r="6" fill="#e9b88a"/>
    <circle cx="22" cy="-70" r="6" fill="#e9b88a"/>
    <circle cx="0" cy="-45" r="28" fill="#d99a66"/>
    <ellipse cx="0" cy="-36" rx="12" ry="9" fill="#e9b88a"/>
    <circle cx="-9" cy="-50" r="3" fill="#2a1a10"/>
    <circle cx="9" cy="-50" r="3" fill="#2a1a10"/>
    <ellipse cx="0" cy="-40" rx="4" ry="3" fill="#2a1a10"/>
    <path d="M-5 -34 Q0 -30 5 -34" stroke="#2a1a10" stroke-width="2" fill="none"/>
    <rect x="-22" y="-16" width="44" height="44" rx="18" fill="#d99a66"/>
    <ellipse cx="0" cy="8" rx="12" ry="14" fill="#e9b88a"/>
    <path d="M-20 -6 Q-36 6 -30 20" stroke="#d99a66" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M20 -6 Q36 6 30 20" stroke="#d99a66" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M-14 26 L-16 44" stroke="#d99a66" stroke-width="12" stroke-linecap="round"/>
    <path d="M14 26 L16 44" stroke="#d99a66" stroke-width="12" stroke-linecap="round"/>
    <ellipse cx="-17" cy="46" rx="8" ry="5" fill="#b87444"/>
    <ellipse cx="17" cy="46" rx="8" ry="5" fill="#b87444"/>
  </g>

  <!-- Robot de juguete -->
  <g transform="translate(290,262)">
    <rect x="-24" y="-60" width="48" height="50" rx="6" fill="#8fb8d9"/>
    <rect x="-16" y="-48" width="32" height="14" rx="3" fill="#1b2a4a"/>
    <circle cx="-8" cy="-41" r="3" fill="#7dfcf0"/>
    <circle cx="8" cy="-41" r="3" fill="#7dfcf0"/>
    <rect x="-3" y="-72" width="6" height="12" fill="#5a7a9a"/>
    <circle cx="0" cy="-74" r="4" fill="#ff7b7b"/>
    <rect x="-34" y="-54" width="10" height="34" rx="5" fill="#6a93b8"/>
    <rect x="24" y="-54" width="10" height="34" rx="5" fill="#6a93b8"/>
    <rect x="-22" y="-10" width="18" height="36" rx="5" fill="#5a7a9a"/>
    <rect x="4" y="-10" width="18" height="36" rx="5" fill="#5a7a9a"/>
    <rect x="-28" y="26" width="26" height="8" rx="4" fill="#2c3e5a"/>
    <rect x="2" y="26" width="26" height="8" rx="4" fill="#2c3e5a"/>
  </g>

  <!-- Caballito de balancín -->
  <g transform="translate(60,300)" fill="#e0565b">
    <path d="M-40 10 Q-40 0 -20 0 L40 0 Q55 0 55 10 Q55 18 40 18 L-20 18 Q-40 18 -40 10 Z" fill="#c7444a"/>
    <path d="M-10 0 Q0 -40 20 -55 L30 -50 Q22 -20 28 0 Z" fill="#e0565b"/>
    <path d="M14 -52 L10 -70 L22 -62 Z" fill="#c7444a"/>
    <circle cx="26" cy="-46" r="2" fill="#2a1a10"/>
    <path d="M-44 -4 Q-60 10 -48 26" stroke="#2a1a10" stroke-width="3" fill="none"/>
  </g>

  <!-- Pelota de colores rodando -->
  <g transform="translate(220,330)">
    <circle r="14" fill="#ffd166"/>
    <path d="M-14 0 Q0 -8 14 0" stroke="#ef476f" stroke-width="4" fill="none"/>
    <path d="M-10 -10 Q0 0 -10 10" stroke="#06d6a0" stroke-width="3" fill="none"/>
  </g>

  <!-- Lámpara de noche con luz cálida -->
  <g transform="translate(360,340)">
    <rect x="-3" y="-30" width="6" height="30" fill="#8a6d3b"/>
    <path d="M-16 -30 L16 -30 L10 -48 L-10 -48 Z" fill="#ffd98a"/>
    <ellipse cx="0" cy="-30" rx="16" ry="3" fill="#fff3c4"/>
    <ellipse cx="0" cy="-20" rx="60" ry="60" fill="#ffe9a8" opacity="0.08"/>
  </g>

  <!-- Destellos de movimiento -->
  <g stroke="#ffe9a8" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <line x1="120" y1="200" x2="112" y2="194"/>
    <line x1="126" y1="214" x2="116" y2="214"/>
    <line x1="260" y1="210" x2="268" y2="202"/>
    <line x1="255" y1="230" x2="265" y2="230"/>
  </g>
</svg>