    <line x1="0" y1="320" x2="400" y2="320"/>
    <line x1="0" y1="340" x2="400" y2="340"/>
    <line x1="0" y1="360" x2="400" y2="360"/>
    <line x1="0" y1="380" x2="400" y2="380"/>
    <line x1="60" y1="290" x2="0" y2="400"/>
    <line x1="140" y1="290" x2="100" y2="400"/>
    <line x1="260" y1="290" x2="300" y2="400"/>
    <line x1="340" y1="290" x2="400" y2="400"/>
  </g>
  <path d="M0 300 Q200 280 400 300 L400 400 L0 400 Z" fill="#0a0820" opacity="0.8"/>

  <g filter="url(#glow)" fill="none" stroke-linecap="round">
    <path d="M200 350 L200 230" stroke="url(#trunk)" stroke-width="16"/>
    <path d="M200 260 Q170 230 140 200" stroke="url(#trunk)" stroke-width="9"/>
    <path d="M200 260 Q230 230 262 196" stroke="url(#trunk)" stroke-width="9"/>
    <path d="M200 240 Q190 200 200 150" stroke="url(#trunk)" stroke-width="7"/>
    <path d="M140 200 Q120 180 98 176" stroke="#2de2e6" stroke-width="5"/>
    <path d="M262 196 Q282 176 304 170" stroke="#2de2e6" stroke-width="5"/>
    <path d="M200 150 Q180 125 168 100" stroke="#8f5bff" stroke-width="4"/>
    <path d="M200 150 Q222 125 236 96" stroke="#8f5bff" stroke-width="4"/>
    <path d="M98 176 Q84 160 80 144" stroke="#2de2e6" stroke-width="2.5"/>
    <path d="M304 170 Q318 154 324 138" stroke="#2de2e6" stroke-width="2.5"/>
  </g>

  <g filter="url(#glow)">
    <path d="M200 230 L196 240 L204 240 Z" fill="#2de2e6" opacity="0.6"/>
    <rect x="193" y="290" width="14" height="4" fill="#2de2e6" opacity="0.7"/>
    <rect x="195" y="318" width="10" height="3" fill="#8f5bff" opacity="0.7"/>
  </g>

  <g filter="url(#glow)" opacity="0.9">
    <polygon points="80,144 70,130 88,128" fill="url(#leaf)"/>
    <polygon points="80,144 92,132 96,150" fill="url(#leaf)"/>
    <polygon points="304,170 316,156 322,172" fill="url(#leaf)"/>
    <polygon points="304,170 294,156 310,150" fill="url(#leaf)"/>
    <polygon points="98,176 84,172 90,188" fill="url(#leaf)"/>
    <polygon points="168,100 156,88 172,82" fill="url(#leaf)"/>
    <polygon points="168,100 178,84 182,104" fill="url(#leaf)"/>
    <polygon points="236,96 226,80 244,78" fill="url(#leaf)"/>
    <polygon points="236,96 248,86 252,104" fill="url(#leaf)"/>
    <polygon points="262,196 252,184 268,180" fill="url(#leaf)"/>
    <polygon points="140,200 128,190 136,208" fill="url(#leaf)"/>
    <polygon points="200,150 190,130 210,130" fill="url(#leaf)"/>
    <polygon points="200,150 196,120 208,120" fill="url(#leaf)"/>
