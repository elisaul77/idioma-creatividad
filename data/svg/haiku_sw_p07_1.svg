    <circle cx="120" cy="50" r="1.2" opacity="0.6"/>
    <circle cx="330" cy="60" r="1.6" opacity="0.8"/>
    <circle cx="370" cy="120" r="1.2" opacity="0.6"/>
    <circle cx="40" cy="230" r="1.4" opacity="0.7"/>
    <circle cx="350" cy="250" r="1.8" opacity="0.8"/>
    <circle cx="150" cy="330" r="1.2" opacity="0.6"/>
    <circle cx="270" cy="350" r="1.5" opacity="0.7"/>
    <circle cx="300" cy="30" r="1" opacity="0.5"/>
    <circle cx="90" cy="20" r="1" opacity="0.5"/>
  </g>
</svg>