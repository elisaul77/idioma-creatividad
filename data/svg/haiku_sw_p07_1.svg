<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05041a"/>
      <stop offset="55%" stop-color="#1b0b3a"/>
      <stop offset="100%" stop-color="#0b3d4f"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff3b0" stop-opacity="1"/>
      <stop offset="50%" stop-color="#ff7ab6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ff7ab6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2de2e6"/>
      <stop offset="50%" stop-color="#8f5bff"/>
      <stop offset="100%" stop-color="#2de2e6"/>
    </linearGradient>
    <radialGradient id="leaf" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#c9fff5"/>
      <stop offset="60%" stop-color="#35f2b5"/>
      <stop offset="100%" stop-color="#0f8f7a"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#sky)"/>

  <circle cx="200" cy="170" r="120" fill="url(#sun)"/>
  <circle cx="200" cy="170" r="62" fill="#ffd1e8" opacity="0.85"/>

  <g stroke="#2de2e6" stroke-width="0.6" opacity="0.25">
