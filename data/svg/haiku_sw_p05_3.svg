<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050b1f"/>
      <stop offset="100%" stop-color="#16315e"/>
    </linearGradient>
    <radialGradient id="innerCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8d6"/>
      <stop offset="45%" stop-color="#ffc857"/>
      <stop offset="100%" stop-color="#ff7a1a"/>
    </radialGradient>
    <radialGradient id="outerCore" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#f25c1f"/>
      <stop offset="100%" stop-color="#b8330e"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="capsule" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#90a4ae"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ff5722" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Ciel la anga -->
  <rect width="400" height="400" fill="url(#sky)"/>
  <g fill="#ffffff">
    <circle cx="40" cy="30" r="1.5"/>
    <circle cx="90" cy="18" r="1"/>
    <circle cx="150" cy="40" r="1.2"/>
    <circle cx="320" cy="25" r="1.6"/>
    <circle cx="370" cy="70" r="1"/>
    <circle cx="350" cy="150" r="1.3"/>
    <circle cx="25" cy="160" r="1"/>
    <circle cx="30" cy="300" r="1.4"/>
    <circle cx="380" cy="320" r="1.2"/>
    <circle cx="260" cy="375" r="1"/>
    <circle cx="110" cy="380" r="1.5"/>
  </g>

  <!-- Mduara wa Dunia: ukoko, vazi, kiini cha nje, kiini cha ndani -->
  <circle cx="200" cy="200" r="170" fill="#6d4c41"/>
  <circle cx="200" cy="200" r="150" fill="#8d6e63"/>
  <circle cx="200" cy="200" r="120" fill="#c0653a"/>
  <circle cx="200" cy="200" r="90" fill="url(#outerCore)"/>
  <circle cx="200" cy="200" r="50" fill="url(#innerCore)"/>

  <!-- Mwanga wa kiini -->
  <circle cx="200" cy="200" r="70" fill="url(#glow)">
    <animate attributeName="r" values="60;78;60" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Njia ya safari -->
  <path d="M 75 75 Q 170 110 200 200" fill="none" stroke="#7fdbff" stroke-width="2" stroke-dasharray="6 6" stroke-linecap="round" opacity="0.9"/>

  <!-- Chombo cha kusafiri -->
  <g transform="translate(75 75) rotate(45)">
    <!-- Moto -->
    <path d="M -15 -4 L -34 0 L -15 4 Z" fill="url(#flame)"/>
    <!-- Mwili -->
    <ellipse cx="0" cy="0" rx="18" ry="9" fill="url(#capsule)" stroke="#37474f" stroke-width="1.5"/>
    <!-- Dirisha -->
    <circle cx="6" cy="0" r="3.5" fill="#4fc3f7" stroke="#263238" stroke-width="0.8"/>
    <!-- Mapezi -->
    <path d="M -10 -8 L -16 -14 L -6 -7 Z" fill="#78909c"/>
    <path d="M -10 8 L -16 14 L -6 7 Z" fill="#78909c"/>
  </g>
</svg>