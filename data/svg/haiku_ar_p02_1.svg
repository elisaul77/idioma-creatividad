<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#2b1b5a"/>
      <stop offset="55%" stop-color="#15124a"/>
      <stop offset="100%" stop-color="#070a24"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f7c8ff" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#9f7aea" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#9f7aea" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="swirl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c4b5fd" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f0abfc" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="haze" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#e9e3ff">
    <circle cx="48" cy="60" r="1.6" opacity="0.8"/>
    <circle cx="335" cy="48" r="1.2" opacity="0.6"/>
    <circle cx="370" cy="170" r="1.5" opacity="0.7"/>
    <circle cx="28" cy="230" r="1.1" opacity="0.5"/>
    <circle cx="90" cy="370" r="1.3" opacity="0.6"/>
    <circle cx="310" cy="350" r="1.7" opacity="0.8"/>
    <circle cx="200" cy="30" r="1" opacity="0.5"/>
  </g>

  <!-- dreamy halo -->
  <circle cx="200" cy="200" r="170" fill="url(#glow)" filter="url(#soft)"/>

  <!-- flowing swirls -->
  <g fill="none" stroke="url(#swirl)" stroke-linecap="round">
    <path d="M40 300 C 120 220, 180 330, 270 250 S 360 150, 380 210" stroke-width="3" opacity="0.7" filter="url(#haze)"/>
    <path d="M20 160 C 90 110, 150 190, 220 130 S 330 80, 390 120" stroke-width="2" opacity="0.5" filter="url(#haze)"/>
    <path d="M60 80 C 130 50, 200 120, 260 60" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- floating fragments drifting into a central form -->
  <g opacity="0.85">
    <circle cx="120" cy="120" r="14" fill="#f5d0fe" opacity="0.35" filter="url(#haze)"/>
    <circle cx="290" cy="140" r="10" fill="#a5f3fc" opacity="0.35" filter="url(#haze)"/>
    <circle cx="95" cy="265" r="9" fill="#fde68a" opacity="0.3" filter="url(#haze)"/>
    <circle cx="310" cy="280" r="16" fill="#c4b5fd" opacity="0.3" filter="url(#haze)"/>
    <rect x="250" y="200" width="18" height="18" rx="4" fill="#f0abfc" opacity="0.35" transform="rotate(25 259 209)" filter="url(#haze)"/>
    <polygon points="140,320 152,342 128,342" fill="#7dd3fc" opacity="0.3" filter="url(#haze)"/>
  </g>

  <!-- central dream form: soft layered orb -->
  <circle cx="200" cy="200" r="88" fill="#c4b5fd" opacity="0.12" filter="url(#soft)"/>
  <circle cx="200" cy="200" r="62" fill="#e9d5ff" opacity="0.18" filter="url(#haze)"/>
  <circle cx="200" cy="200" r="38" fill="#f5d0fe" opacity="0.35" filter="url(#haze)"/>
  <circle cx="200" cy="200" r="18" fill="#ffffff" opacity="0.7" filter="url(#haze)"/>

  <!-- ripples of memory -->
  <g fill="none" stroke="#e9d5ff" stroke-width="1">
    <ellipse cx="200" cy="200" rx="110" ry="60" opacity="0.18" transform="rotate(-18 200 200)"/>
    <ellipse cx="200" cy="200" rx="140" ry="82" opacity="0.1" transform="rotate(-18 200 200)"/>
  </g>
</svg>