<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#FFF4C2"/>
      <stop offset="55%" stop-color="#FFD59E"/>
      <stop offset="100%" stop-color="#FF9E8A"/>
    </radialGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFBEA"/>
      <stop offset="60%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#FF9F43"/>
    </radialGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF7B9C"/>
      <stop offset="100%" stop-color="#FFB86B"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C77DFF"/>
      <stop offset="100%" stop-color="#FF7B9C"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <g transform="translate(200 175)" filter="url(#glow)" opacity="0.85">
    <g stroke="#FFF1B8" stroke-width="7" stroke-linecap="round">
      <line x1="0" y1="-78" x2="0" y2="-118"/>
      <line x1="0" y1="78" x2="0" y2="118"/>
      <line x1="-78" y1="0" x2="-118" y2="0"/>
      <line x1="78" y1="0" x2="118" y2="0"/>
      <line x1="55" y1="-55" x2="83" y2="-83"/>
      <line x1="-55" y1="-55" x2="-83" y2="-83"/>
      <line x1="55" y1="55" x2="83" y2="83"/>
      <line x1="-55" y1="55" x2="-83" y2="83"/>
    </g>
  </g>

  <circle cx="200" cy="175" r="72" fill="url(#sun)" filter="url(#glow)"/>

  <g fill="#FFFFFF" opacity="0.9">
    <circle cx="180" cy="158" r="7"/>
    <circle cx="220" cy="158" r="7"/>
  </g>
  <path d="M176 186 Q200 206 224 186" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.9"/>

  <path d="M0 270 Q100 230 200 268 T400 262 L400 400 L0 400 Z" fill="url(#wave1)" opacity="0.9"/>
  <path d="M0 312 Q120 280 220 312 T400 306 L400 400 L0 400 Z" fill="url(#wave2)" opacity="0.85"/>
  <path d="M0 352 Q140 330 260 352 T400 348 L400 400 L0 400 Z" fill="#FF7B9C" opacity="0.8"/>

  <g fill="#FFFFFF" opacity="0.8">
    <circle cx="60" cy="60" r="4"/>
    <circle cx="340" cy="70" r="5"/>
    <circle cx="88" cy="128" r="3"/>
    <circle cx="318" cy="136" r="3.5"/>
    <circle cx="350" cy="200" r="3"/>
    <circle cx="48" cy="210" r="4"/>
