<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#2b1b5c"/>
      <stop offset="60%" stop-color="#120a2e"/>
      <stop offset="100%" stop-color="#05030f"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7ef0d8"/>
      <stop offset="50%" stop-color="#4fa3e0"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd1f5" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#6ee7ff" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7b0" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff7b0" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="48" cy="60" r="1.5"/>
    <circle cx="90" cy="34" r="1"/>
    <circle cx="330" cy="48" r="1.8"/>
    <circle cx="364" cy="110" r="1.2"/>
    <circle cx="28" cy="170" r="1"/>
    <circle cx="356" cy="250" r="1.4"/>
    <circle cx="60" cy="300" r="1.6"/>
    <circle cx="210" cy="30" r="1.1"/>
    <circle cx="150" cy="370" r="1.3"/>
    <circle cx="300" cy="372" r="1"/>
  </g>

  <!-- wings -->
  <path d="M170 190 C120 90, 40 80, 20 130 C50 125, 70 140, 90 160 C60 165, 45 185, 40 210 C75 200, 100 205, 130 225 Z" fill="url(#wing)" stroke="#ffd1f5" stroke-width="1.5" stroke-opacity="0.7"/>
  <path d="M230 190 C280 90, 360 80, 380 130 C350 125, 330 140, 310 160 C340 165, 355 185, 360 210 C325 200, 300 205, 270 225 Z" fill="url(#wing)" stroke="#ffd1f5" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- tail spiral -->
  <path d="M265 265 C320 250, 345 300, 315 320 C290 336, 268 310, 290 298 C305 290, 312 306, 304 312" fill="none" stroke="url(#body)" stroke-width="10" stroke-linecap="round"/>
  <path d="M318 318 C335 340, 360 338, 368 318 C350 322, 335 312, 318 318 Z" fill="#f0abfc" opacity="0.9"/>

  <!-- legs -->
  <g stroke="#4fa3e0" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M150 265 L138 340 M138 340 L126 352 M138 340 L146 354"/>
    <path d="M172 268 L168 344 M168 344 L158 356 M168 344 L178 356"/>
    <path d="M226 268 L230 344 M230 344 L220 356 M230 344 L240 356"/>
    <path d="M250 262 L262 338 M262 338 L252 352 M262 338 L272 350"/>
  </g>

  <!-- body -->
  <path d="M120 200 C130 160, 200 150, 240 180 C270 200, 275 250, 250 268 C215 288, 150 282, 130 255 C118 240, 114 218, 120 200 Z" fill="url(#body)"/>
  <path d="M150 215 Q190 200 225 220" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3" stroke-linecap="round"/>

  <!-- dorsal crystals -->
  <g fill="#fff7b0" opacity="0.9">
    <path d="M160 170 L166 148 L172 170 Z"/>
    <path d="M186 162 L193 136 L199 162 Z"/>
    <path d="M212 168 L219 146 L225 168 Z"/>
  </g>

  <!-- neck and head -->
  <path d="M120 200 C100 185, 90 170, 80 160 L72 172 C82 186, 95 200, 118 214 Z" fill="#4fa3e0"/>
  <ellipse cx="78" cy="160" rx="24" ry="19" fill="url(#body)" transform="rotate(-20 78 160)"/>
  <path d="M56 164 Q44 170 50 178 Q60 176 66 170 Z" fill="#8b5cf6"/>
  <circle cx="82" cy="154" r="4.5" fill="#fff7b0"/>
  <circle cx="82" cy="154" r="10" fill="url(#glow)"/>
  <circle cx="83" cy="154" r="2" fill="#120a2e"/>

  <!-- antlers -->
  <g fill="none" stroke="#f0abfc" stroke-width="3" stroke-linecap="round">
    <path d="M86 140 C92 124, 104 118, 112 100"/>
    <path d="M100 124 C106 118, 114 116, 120 120"/>
    <path d="M92 130 C86 116, 76 110, 66 112"/>
    <path d="M78 120 C74 108, 66 100, 56 98"/>
  </g>
  <g fill="#fff7b0">
    <circle cx="112" cy="100" r="3"/>
    <circle cx="120" cy="120" r="2.5"/>
    <circle cx="66" cy="112" r="2.5"/>
    <circle cx="56" cy="98" r="3"/>
  </g>

  <!-- floating orbs -->
  <g>
    <circle cx="320" cy="150" r="14" fill="url(#glow)" filter="url(#blur)"/>
    <circle cx="320" cy="150" r="4" fill="#fff7b0"/>
    <circle cx="60" cy="240" r="10" fill="url(#glow)" filter="url(#blur)"/>
    <circle cx="60" cy="240" r="3" fill="#fff7b0"/>
    <circle cx="350" cy="70" r="8" fill="url(#glow)" filter="url(#blur)"/>
    <circle cx="350" cy="70" r="2.5" fill="#fff7b0"/>
  </g>
</svg>