<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#fdf6e3"/>

  <!-- Pentagrama dibujado a mano -->
  <g stroke="#3b3a5c" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M30 120 Q200 116 370 122"/>
    <path d="M30 150 Q200 146 370 152"/>
    <path d="M30 180 Q200 176 370 182"/>
    <path d="M30 210 Q200 206 370 212"/>
    <path d="M30 240 Q200 236 370 242"/>
  </g>

  <!-- Trazo de lápiz ondulado que conecta las notas -->
  <path d="M30 300 C90 260 130 330 190 290 S300 250 370 300" fill="none" stroke="#3b3a5c" stroke-width="2" stroke-dasharray="6 5" stroke-linecap="round"/>

  <!-- Notas: cabezas, plicas y barra -->
  <g fill="#e0523f">
    <ellipse cx="110" cy="200" rx="13" ry="10" transform="rotate(-20 110 200)"/>
    <ellipse cx="170" cy="180" rx="13" ry="10" transform="rotate(-20 170 180)"/>
    <ellipse cx="230" cy="165" rx="13" ry="10" transform="rotate(-20 230 165)"/>
    <ellipse cx="290" cy="150" rx="13" ry="10" transform="rotate(-20 290 150)"/>
  </g>
  <g stroke="#3b3a5c" stroke-width="3" stroke-linecap="round">
    <line x1="122" y1="199" x2="122" y2="130"/>
    <line x1="182" y1="179" x2="182" y2="112"/>
    <line x1="242" y1="164" x2="242" y2="94"/>
    <line x1="302" y1="149" x2="302" y2="76"/>
  </g>
  <line x1="122" y1="130" x2="302" y2="76" stroke="#3b3a5c" stroke-width="7" stroke-linecap="round"/>

  <!-- Corchea suelta dibujada -->
  <ellipse cx="80" cy="330" rx="12" ry="9" transform="rotate(-20 80 330)" fill="#2a9d8f"/>
  <path d="M91 328 L96 262 C112 275 116 290 110 305" fill="none" stroke="#2a9d8f" stroke-width="3" stroke-linecap="round"/>

  <!-- Sol garabateado con ondas sonoras -->
  <circle cx="330" cy="320" r="18" fill="#f4a261"/>
  <g fill="none" stroke="#f4a261" stroke-width="3" stroke-linecap="round">
    <path d="M360 300 Q370 320 360 340"/>
    <path d="M372 290 Q388 320 372 350"/>
  </g>

  <!-- Pequeñas marcas de sombreado a lápiz -->
  <g stroke="#3b3a5c" stroke-width="1.2" stroke-linecap="round" opacity="0.5">
    <line x1="45" y1="370" x2="60" y2="358"/>
    <line x1="52" y1="378" x2="70" y2="364"/>
    <line x1="340" y1="60" x2="352" y2="48"/>
    <line x1="350" y1="68" x2="364" y2="56"/>
  </g>
</svg>