<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#1b0f3b"/>
      <stop offset="1" stop-color="#05040f"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7eb6"/>
      <stop offset="0.5" stop-color="#7b5cff"/>
      <stop offset="1" stop-color="#20e3c2"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ef476f" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="eye" cx="40%" cy="40%" r="60%">
      <stop offset="0" stop-color="#fffbe6"/>
      <stop offset="1" stop-color="#ffb703"/>
    </radialGradient>
    <pattern id="sc" width="22" height="16" patternUnits="userSpaceOnUse">
      <path d="M0 8 Q11 0 22 8 M-11 16 Q0 8 11 16 M11 16 Q22 8 33 16" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <g fill="#ffffff">
    <circle cx="40" cy="50" r="1.5" opacity="0.8"/>
    <circle cx="90" cy="25" r="1" opacity="0.6"/>
    <circle cx="150" cy="60" r="1.2" opacity="0.7"/>
    <circle cx="330" cy="40" r="1.5" opacity="0.9"/>
    <circle cx="370" cy="90" r="1" opacity="0.6"/>
    <circle cx="300" cy="20" r="1" opacity="0.5"/>
    <circle cx="20" cy="160" r="1" opacity="0.5"/>
    <circle cx="385" cy="200" r="1.3" opacity="0.7"/>
    <circle cx="60" cy="370" r="1" opacity="0.5"/>
    <circle cx="345" cy="370" r="1.4" opacity="0.8"/>
  </g>

  <g filter="url(#glow)">
    <path d="M150 200 Q40 110 30 230 Q80 210 110 250 Z" fill="url(#wing)" opacity="0.85"/>
    <path d="M250 200 Q360 110 370 230 Q320 210 290 250 Z" fill="url(#wing)" opacity="0.85"/>
  </g>

  <path d="M286 250 C340 260 350 310 320 320 C300 326 300 300 318 298"
        fill="none" stroke="url(#body)" stroke-width="12" stroke-linecap="round"/>
  <circle cx="322" cy="318" r="9" fill="#ffd166" filter="url(#glow)"/>

  <g stroke="url(#body)" stroke-width="14" stroke-linecap="round" fill="none">
    <path d="M160 290 L150 350"/>
    <path d="M180 298 L178 355"/>
    <path d="M220 298 L222 355"/>
    <path d="M240 290 L250 350"/>
  </g>

  <ellipse cx="200" cy="240" rx="90" ry="62" fill="url(#body)"/>
  <ellipse cx="200" cy="240" rx="90" ry="62" fill="url(#sc)"/>

  <path d="M170 130 L148 92 L186 120 Z" fill="url(#body)"/>
  <path d="M230 130 L252 92 L214 120 Z" fill="url(#body)"/>

  <circle cx="200" cy="160" r="46" fill="url(#body)"/>
  <circle cx="200" cy="160" r="46" fill="url(#sc)"/>

  <path d="M200 114 C200 80 240 70 240 90 C240 108 220 105 224 92"
        fill="none" stroke="#ffd166" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>

  <circle cx="185" cy="155" r="9" fill="url(#eye)"/>
  <circle cx="215" cy="155" r="9" fill="url(#eye)"/>
  <circle cx="200" cy="132" r="6" fill="url(#eye)"/>
  <circle cx="186" cy="156" r="4" fill="#0b0320"/>
  <circle cx="216" cy="156" r="4" fill="#0b0320"/>
  <circle cx="200" cy="133" r="2.5" fill="#0b0320"/>
  <circle cx="187" cy="154" r="1.2" fill="#ffffff"/>
  <circle cx="217" cy="154" r="1.2" fill="#ffffff"/>
</svg>