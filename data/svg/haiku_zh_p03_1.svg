<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#2b1d4f"/>
      <stop offset="60%" stop-color="#140f2e"/>
      <stop offset="100%" stop-color="#07061a"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7a59"/>
      <stop offset="50%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#4ecdc4"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c77dff"/>
      <stop offset="100%" stop-color="#48cae4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- soft glow behind the sun-like core -->
  <circle cx="200" cy="200" r="120" fill="url(#glow)" opacity="0.5"/>

  <!-- ripples of sound -->
  <g fill="none" stroke="#ffd166" stroke-width="1" opacity="0.35">
    <circle cx="200" cy="200" r="60"/>
    <circle cx="200" cy="200" r="90" opacity="0.25"/>
    <circle cx="200" cy="200" r="125" opacity="0.18"/>
    <circle cx="200" cy="200" r="165" opacity="0.1"/>
  </g>

  <!-- staff lines bending like flowing melody -->
  <g fill="none" stroke-linecap="round">
    <path d="M10 130 C90 90, 130 170, 200 140 S310 90, 390 130" stroke="url(#wave)" stroke-width="3" filter="url(#blur)" opacity="0.6"/>
    <path d="M10 150 C90 110, 130 190, 200 160 S310 110, 390 150" stroke="url(#wave)" stroke-width="2.5" opacity="0.85"/>
    <path d="M10 170 C90 130, 130 210, 200 180 S310 130, 390 170" stroke="url(#wave)" stroke-width="2.5" opacity="0.85"/>
    <path d="M10 190 C90 150, 130 230, 200 200 S310 150, 390 190" stroke="url(#wave)" stroke-width="2.5" opacity="0.85"/>
    <path d="M10 210 C90 170, 130 250, 200 220 S310 170, 390 210" stroke="url(#wave)" stroke-width="2.5" opacity="0.85"/>
  </g>

  <!-- lower counter-melody -->
  <g fill="none" stroke-linecap="round">
    <path d="M20 280 C100 240, 150 320, 220 285 S330 240, 385 275" stroke="url(#wave2)" stroke-width="4" filter="url(#blur)" opacity="0.5"/>
    <path d="M20 280 C100 240, 150 320, 220 285 S330 240, 385 275" stroke="url(#wave2)" stroke-width="2"/>
    <path d="M20 300 C100 260, 150 340, 220 305 S330 260, 385 295" stroke="url(#wave2)" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- floating notes -->
  <g>
    <ellipse cx="95" cy="125" rx="9" ry="7" transform="rotate(-20 95 125)" fill="#ff7a59"/>
    <line x1="103" y1="124" x2="103" y2="90" stroke="#ff7a59" stroke-width="2"/>
    <ellipse cx="150" cy="105" rx="8" ry="6" transform="rotate(-20 150 105)" fill="#ffd166"/>
    <line x1="157" y1="104" x2="157" y2="72" stroke="#ffd166" stroke-width="2"/>
    <path d="M157 72 Q168 80 162 96" fill="none" stroke="#ffd166" stroke-width="2"/>

    <ellipse cx="260" cy="250" rx="9" ry="7" transform="rotate(-20 260 250)" fill="#c77dff"/>
    <line x1="268" y1="249" x2="268" y2="215" stroke="#c77dff" stroke-width="2"/>
    <ellipse cx="310" cy="235" rx="8" ry="6" transform="rotate(-20 310 235)" fill="#48cae4"/>
    <line x1="317" y1="234" x2="317" y2="202" stroke="#48cae4" stroke-width="2"/>
    <line x1="268" y1="215" x2="317" y2="202" stroke="#48cae4" stroke-width="3"/>

    <ellipse cx="120" cy="330" rx="8" ry="6" transform="rotate(-20 120 330)" fill="#4ecdc4"/>
    <line x1="127" y1="329" x2="127" y2="300" stroke="#4ecdc4" stroke-width="2"/>
  </g>

  <!-- central pulse of color -->
  <circle cx="200" cy="200" r="22" fill="#ffd166" opacity="0.9"/>
  <circle cx="200" cy="200" r="12" fill="#fff4d6"/>

  <!-- scattered sparks -->
  <g fill="#ffffff">
    <circle cx="60" cy="60" r="1.5" opacity="0.8"/>
    <circle cx="340" cy="70" r="1.2" opacity="0.7"/>
    <circle cx="330" cy="340" r="1.8" opacity="0.6"/>
    <circle cx="50" cy="360" r="1.2" opacity="0.7"/>
    <circle cx="200" cy="40" r="1" opacity="0.6"/>
    <circle cx="375" cy="195" r="1.4" opacity="0.6"/>
    <circle cx="25" cy="210" r="1.2" opacity="0.5"/>
  </g>
</svg>