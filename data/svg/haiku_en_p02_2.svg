<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0b3d"/>
      <stop offset="55%" stop-color="#5b2a86"/>
      <stop offset="100%" stop-color="#f08ab0"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff9e6"/>
      <stop offset="70%" stop-color="#ffe9a8"/>
      <stop offset="100%" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="island" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fd6c2"/>
      <stop offset="100%" stop-color="#2e6e7e"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#d9c2f0" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Dreamy sky -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="40" cy="50" r="1.6"/>
    <circle cx="90" cy="25" r="1.1"/>
    <circle cx="150" cy="60" r="1.4"/>
    <circle cx="210" cy="30" r="1.8"/>
    <circle cx="330" cy="48" r="1.3"/>
    <circle cx="365" cy="100" r="1.0"/>
    <circle cx="25" cy="150" r="1.0"/>
    <circle cx="300" cy="150" r="1.2"/>
    <circle cx="260" cy="95" r="0.9"/>
    <circle cx="120" cy="130" r="1.1"/>
  </g>

  <!-- Moon with halo -->
  <circle cx="310" cy="95" r="58" fill="url(#moon)" opacity="0.7"/>
  <circle cx="310" cy="95" r="30" fill="url(#moon)"/>
  <circle cx="322" cy="86" r="26" fill="#2a1450" opacity="0.18"/>

  <!-- Swirling spiral light trails -->
  <g fill="none" stroke="#ffd6f0" stroke-linecap="round" opacity="0.6">
    <path d="M60 200 C 110 150, 170 230, 230 180 S 330 150, 350 200" stroke-width="2.5"/>
    <path d="M50 230 C 120 190, 180 260, 250 215 S 340 230, 370 260" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Floating dream clouds -->
  <g fill="url(#cloud)">
    <ellipse cx="110" cy="235" rx="50" ry="16"/>
    <ellipse cx="135" cy="225" rx="30" ry="18"/>
    <ellipse cx="290" cy="265" rx="60" ry="14"/>
    <ellipse cx="305" cy="255" rx="26" ry="16"/>
  </g>

  <!-- Floating island with tree -->
  <ellipse cx="200" cy="225" rx="95" ry="12" fill="#1f4f5e" opacity="0.4" filter="url(#blur)"/>
  <path d="M120 215 Q200 205 280 215 Q262 258 200 268 Q138 258 120 215 Z" fill="url(#island)"/>
  <path d="M190 210 L190 180" stroke="#5a3d2b" stroke-width="4" stroke-linecap="round"/>
  <circle cx="190" cy="168" r="22" fill="#9ff0d0" opacity="0.85"/>
  <circle cx="176" cy="176" r="14" fill="#7fe0c0" opacity="0.85"/>
  <circle cx="205" cy="174" r="15" fill="#b6f5dc" opacity="0.85"/>

  <!-- Glowing stairway to the moon -->
  <g fill="#fff3c4" opacity="0.8">
    <rect x="58" y="330" width="22" height="5" rx="2"/>
    <rect x="78" y="322" width="22" height="5" rx="2"/>
    <rect x="98" y="314" width="22" height="5" rx="2"/>
    <rect x="118" y="306" width="22" height="5" rx="2"/>
  </g>

  <!-- Drifting orbs of light -->
  <g>
    <circle cx="80" cy="120" r="10" fill="url(#glow)"/>
    <circle cx="200" cy="110" r="7" fill="url(#glow)"/>
    <circle cx="350" cy="200" r="9" fill="url(#glow)"/>
    <circle cx="170" cy="290" r="12" fill="url(#glow)"/>
  </g>

  <!-- Butterflies -->
  <g fill="#ffb3e6" opacity="0.9">
    <path d="M250 320 C 240 305, 225 310, 232 322 C 225 334, 242 338, 250 326 C 258 338, 275 334, 268 322 C 275 310, 260 305, 250 320 Z"/>
    <path d="M300 340 C 292 330, 282 333, 287 341 C 282 349, 294 352, 300 344 C 306 352, 318 349, 313 341 C 318 333, 308 330, 300 340 Z" fill="#c9b8ff"/>
  </g>

  <!-- Dreamy ground mist -->
  <path d="M0 360 Q50 345 100 360 T200 360 T300 360 T400 355 L400 400 L0 400 Z" fill="#2a1450" opacity="0.7"/>
  <path d="M0 375 Q60 362 120 375 T240 375 T360 370 L400 372 L400 400 L0 400 Z" fill="#150829" opacity="0.85"/>
</svg>