<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="sky" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#FFF4C2"/>
      <stop offset="60%" stop-color="#FFD59E"/>
      <stop offset="100%" stop-color="#FF9E7A"/>
    </radialGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFBE6"/>
      <stop offset="55%" stop-color="#FFD84D"/>
      <stop offset="100%" stop-color="#FFA726"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF8FA3"/>
      <stop offset="100%" stop-color="#E95C7A"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#sky)"/>

  <g transform="translate(200 200)" opacity="0.5">
    <g id="rays" fill="#FFE08A">
      <polygon points="-8,-190 8,-190 0,-120"/>
      <polygon points="-8,-190 8,-190 0,-120" transform="rotate(30)"/>
      <polygon points="-8,-190 8,-190 0,-120" transform="rotate(60)"/>
      <polygon points="-8,-190 8,-190 0,-120" transform="rotate(90)"/>
      <polygon points="-8,-190 8,-190 0,-120" transform="rotate(120)"/>
      <polygon points="-8,-190 8,-190 0,-120" transform="rotate(150)"/>
      <polygon points="-8,-190 8,-190 0,-120" transform="rotate(180)"/>
      <polygon points="-8,-190 8,-190 0,-120" transform="rotate(210)"/>
      <polygon points="-8,-190 8,-190 0,-120" transform="rotate(240)"/>
      <polygon points="-8,-190 8,-190 0,-120" transform="rotate(270)"/>
      <polygon points="-8,-190 8,-190 0,-120" transform="rotate(300)"/>
      <polygon points="-8,-190 8,-190 0,-120" transform="rotate(330)"/>
    </g>
  </g>

  <circle cx="200" cy="200" r="130" fill="url(#glow)"/>

  <g transform="translate(200 200)">
    <g fill="url(#petal)" opacity="0.85">
      <ellipse cx="0" cy="-95" rx="26" ry="42"/>
      <ellipse cx="0" cy="-95" rx="26" ry="42" transform="rotate(45)"/>
      <ellipse cx="0" cy="-95" rx="26" ry="42" transform="rotate(90)"/>
      <ellipse cx="0" cy="-95" rx="26" ry="42" transform="rotate(135)"/>
      <ellipse cx="0" cy="-95" rx="26" ry="42" transform="rotate(180)"/>
      <ellipse cx="0" cy="-95" rx="26" ry="42" transform="rotate(225)"/>
      <ellipse cx="0" cy="-95" rx="26" ry="42" transform="rotate(270)"/>
      <ellipse cx="0" cy="-95" rx="26" ry="42" transform="rotate(315)"/>
    </g>
    <circle cx="0" cy="0" r="78" fill="url(#sun)"/>
    <circle cx="-26" cy="-14" r="8" fill="#5D4037"/>
    <circle cx="26" cy="-14" r="8" fill="#5D4037"/>
    <path d="M -34 12 Q 0 50 34 12" fill="none" stroke="#5D4037" stroke-width="6" stroke-linecap="round"/>
    <circle cx="-48" cy="14" r="8" fill="#FF7A8A" opacity="0.6"/>
    <circle cx="48" cy="14" r="8" fill="#FF7A8A" opacity="0.6"/>
  </g>

  <g fill="#FFFFFF" opacity="0.8">
    <circle cx="60" cy="330" r="6"/>
    <circle cx="90" cy="350" r="4"/>
    <circle cx="330" cy="70" r="5"/>
    <circle cx="350" cy="110" r="3"/>
    <circle cx="70" cy="80" r="4"/>
    <circle cx="335" cy="320" r="6"/>
  </g>
</svg>