<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="space" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="crust" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="60%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#14532d"/>
    </radialGradient>
    <radialGradient id="mantle" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </radialGradient>
    <radialGradient id="outerCore" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </radialGradient>
    <radialGradient id="innerCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fde047" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <clipPath id="earthClip">
      <circle cx="200" cy="200" r="150"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#space)"/>

  <!-- Stars -->
  <g fill="#e2e8f0">
    <circle cx="30" cy="40" r="1.2"/>
    <circle cx="365" cy="30" r="1.5"/>
    <circle cx="350" cy="120" r="1"/>
    <circle cx="20" cy="200" r="1.2"/>
    <circle cx="380" cy="250" r="1"/>
    <circle cx="45" cy="330" r="1.4"/>
    <circle cx="330" cy="370" r="1.2"/>
    <circle cx="150" cy="25" r="1"/>
    <circle cx="260" cy="380" r="1.3"/>
    <circle cx="60" cy="370" r="1"/>
  </g>

  <!-- Earth layers -->
  <circle cx="200" cy="200" r="150" fill="url(#crust)"/>
  <g clip-path="url(#earthClip)">
    <path d="M60 150 Q120 140 150 170 T230 150 T340 170" stroke="#22c55e" stroke-width="3" fill="none" opacity="0.35"/>
    <path d="M50 260 Q110 240 170 265 T280 250 T360 262" stroke="#22c55e" stroke-width="3" fill="none" opacity="0.3"/>
  </g>
  <circle cx="200" cy="200" r="105" fill="url(#mantle)"/>
  <circle cx="200" cy="200" r="65" fill="url(#outerCore)"/>
  <circle cx="200" cy="200" r="30" fill="url(#innerCore)"/>
  <circle cx="200" cy="200" r="46" fill="url(#glow)"/>

  <!-- Outline of Earth -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="#86efac" stroke-width="1.5" opacity="0.6"/>

  <!-- Trajectory -->
  <path d="M70 80 Q110 150 200 190" stroke="#facc15" stroke-width="2" stroke-dasharray="5 5" fill="none" opacity="0.9"/>

  <!-- Vehicle -->
  <g transform="translate(200 188)">
    <!-- Thrust flame at top (exhaust) -->
    <path d="M-5 -14 Q0 -32 5 -14 Z" fill="#fb923c"/>
    <path d="M-2.5 -14 Q0 -24 2.5 -14 Z" fill="#fef08a"/>
    <!-- Fins -->
    <path d="M-9 -6 L-19 6 L-9 4 Z" fill="#64748b"/>
    <path d="M9 -6 L19 6 L9 4 Z" fill="#64748b"/>
    <!-- Hull -->
    <path d="M-9 -14 L9 -14 L9 4 L0 22 L-9 4 Z" fill="url(#hull)" stroke="#334155" stroke-width="1.5"/>
    <!-- Window -->
    <circle cx="0" cy="-4" r="3.5" fill="#38bdf8" stroke="#0c4a6e" stroke-width="1"/>
    <!-- Drill tip -->
    <path d="M-3 16 L0 24 L3 16 Z" fill="#475569"/>
  </g>

  <!-- Trail particles -->
  <g fill="#fde68a">
    <circle cx="90" cy="92" r="1.5" opacity="0.8"/>
    <circle cx="112" cy="122" r="1.8" opacity="0.7"/>
    <circle cx="140" cy="150" r="2" opacity="0.6"/>
    <circle cx="165" cy="168" r="1.5" opacity="0.5"/>
  </g>
</svg>