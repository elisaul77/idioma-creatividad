<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#fff6d6"/>
      <stop offset="1" stop-color="#ffd1a8"/>
    </radialGradient>
    <radialGradient id="sun" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#fff9c4"/>
      <stop offset="0.6" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#ff9f1c"/>
    </radialGradient>
    <linearGradient id="rayGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe066"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd5a6"/>
      <stop offset="1" stop-color="#4fb286"/>
    </linearGradient>
    <path id="ray" d="M200 62 L214 118 L186 118 Z" fill="url(#rayGrad)"/>
    <path id="spark" d="M0 -12 Q2 -2 12 0 Q2 2 0 12 Q-2 2 -12 0 Q-2 -2 0 -12Z"/>
  </defs>

  <!-- background -->
  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- radiating rays -->
  <g>
    <use xlink:href="#ray" transform="rotate(0 200 200)"/>
    <use xlink:href="#ray" transform="rotate(30 200 200)"/>
    <use xlink:href="#ray" transform="rotate(60 200 200)"/>
    <use xlink:href="#ray" transform="rotate(90 200 200)"/>
    <use xlink:href="#ray" transform="rotate(120 200 200)"/>
    <use xlink:href="#ray" transform="rotate(150 200 200)"/>
    <use xlink:href="#ray" transform="rotate(180 200 200)"/>
    <use xlink:href="#ray" transform="rotate(210 200 200)"/>
    <use xlink:href="#ray" transform="rotate(240 200 200)"/>
    <use xlink:href="#ray" transform="rotate(270 200 200)"/>
    <use xlink:href="#ray" transform="rotate(300 200 200)"/>
    <use xlink:href="#ray" transform="rotate(330 200 200)"/>
  </g>

  <!-- sun glow and body -->
  <circle cx="200" cy="200" r="102" fill="#ffe27a" opacity="0.35"/>
  <circle cx="200" cy="200" r="88" fill="url(#sun)"/>

  <!-- sparkles -->
  <use xlink:href="#spark" transform="translate(70 90) scale(1.2)" fill="#ffffff"/>
  <use xlink:href="#spark" transform="translate(335 80) scale(0.9)" fill="#fff3a0"/>
  <use xlink:href="#spark" transform="translate(52 300) scale(0.8)" fill="#ffffff"/>
  <use xlink:href="#spark" transform="translate(350 330) scale(1.1)" fill="#ffffff"/>

  <!-- floating confetti -->
  <circle cx="60" cy="200" r="7" fill="#ff7aa2"/>
  <circle cx="340" cy="170" r="9" fill="#7ad7f0"/>
  <circle cx="318" cy="245" r="5" fill="#b388ff"/>
  <circle cx="92" cy="140" r="5" fill="#ff7aa2"/>
  <circle cx="300" cy="115" r="6" fill="#ffffff"/>
  <circle cx="140" cy="58" r="4" fill="#7ad7f0"/>
  <circle cx="260" cy="40" r="5" fill="#ff7aa2"/>
  <circle cx="30" cy="250" r="4" fill="#b388ff"/>

  <!-- rolling hills -->
  <path d="M0 300 Q100 250 200 285 T400 275 L400 400 L0 400 Z" fill="url(#hill)"/>
  <path d="M0 340 Q120 310 220 340 T400 330 L400 400 L0 400 Z" fill="#6cc497" opacity="0.8"/>
</svg>