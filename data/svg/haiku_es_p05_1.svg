<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#05060f"/>
    </radialGradient>
    <radialGradient id="crust" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#a77744"/>
      <stop offset="100%" stop-color="#6b4422"/>
    </radialGradient>
    <radialGradient id="mantle" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#e0854a"/>
      <stop offset="100%" stop-color="#a94b1f"/>
    </radialGradient>
    <radialGradient id="outerCore" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffd27a"/>
      <stop offset="100%" stop-color="#d9822b"/>
    </radialGradient>
    <radialGradient id="innerCore" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffe98a"/>
    </radialGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8fa3b8"/>
      <stop offset="50%" stop-color="#e6eef7"/>
      <stop offset="100%" stop-color="#6d7f94"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ff6a00" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff6a00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fondo espacial -->
  <rect width="400" height="400" fill="url(#bg)"/>
  <g fill="#ffffff" opacity="0.7">
    <circle cx="48" cy="60" r="1.5"/>
    <circle cx="350" cy="52" r="1.2"/>
    <circle cx="372" cy="170" r="1.6"/>
    <circle cx="30" cy="250" r="1.3"/>
    <circle cx="90" cy="365" r="1.4"/>
    <circle cx="320" cy="350" r="1.5"/>
    <circle cx="370" cy="300" r="1"/>
    <circle cx="20" cy="150" r="1"/>
  </g>

  <!-- Capas de la Tierra (sección transversal) -->
  <circle cx="200" cy="200" r="160" fill="url(#crust)"/>
  <circle cx="200" cy="200" r="130" fill="url(#mantle)"/>
  <circle cx="200" cy="200" r="85" fill="url(#outerCore)"/>
  <circle cx="200" cy="200" r="40" fill="url(#innerCore)"/>
  <circle cx="200" cy="200" r="160" fill="none" stroke="#3b2513" stroke-width="3"/>

  <!-- Túnel perforado -->
  <rect x="190" y="40" width="20" height="160" fill="#1b1020"/>
  <rect x="190" y="40" width="20" height="160" fill="none" stroke="#5a3a20" stroke-width="2"/>

  <!-- Resplandor del taladro -->
  <circle cx="200" cy="160" r="36" fill="url(#glow)"/>

  <!-- Vehículo -->
  <g transform="translate(200,120)">
    <!-- Aletas -->
    <path d="M-16,-10 L-30,8 L-16,8 Z" fill="#4f6175"/>
    <path d="M16,-10 L30,8 L16,8 Z" fill="#4f6175"/>
    <!-- Cuerpo -->
    <ellipse cx="0" cy="0" rx="16" ry="28" fill="url(#hull)" stroke="#2c3a4a" stroke-width="1.5"/>
    <!-- Ventana -->
    <circle cx="0" cy="-8" r="6" fill="#58d6ff" stroke="#1d4f66" stroke-width="1.5"/>
    <circle cx="-2" cy="-10" r="1.8" fill="#ffffff" opacity="0.8"/>
    <!-- Banda -->
    <rect x="-16" y="8" width="32" height="3" fill="#3f4f61"/>
    <!-- Taladro -->
    <path d="M-14,22 L14,22 L0,50 Z" fill="#9aa8b8" stroke="#2c3a4a" stroke-width="1.5"/>
    <path d="M-8,28 L8,28 L0,46 Z" fill="#c9d3de"/>
    <!-- Llama de propulsión -->
    <path d="M-5,26 Q0,62 5,26 Z" fill="#ffb347" opacity="0.9"/>
  </g>

  <!-- Chispas -->
  <g fill="#ffd27a">
    <circle cx="186" cy="170" r="2"/>
    <circle cx="214" cy="176" r="1.6"/>
    <circle cx="190" cy="186" r="1.4"/>
    <circle cx="212" cy="162" r="1.2"/>
  </g>
</svg>