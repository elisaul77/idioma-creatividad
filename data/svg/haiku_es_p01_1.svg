<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#2b1b4d"/>
      <stop offset="60%" stop-color="#12233f"/>
      <stop offset="100%" stop-color="#070d1a"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9a76"/>
      <stop offset="50%" stop-color="#e96fa0"/>
      <stop offset="100%" stop-color="#8e5cd9"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fe7d6"/>
      <stop offset="100%" stop-color="#2a9d8f"/>
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff7c2"/>
      <stop offset="100%" stop-color="#f4c542"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd6f0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffd6f0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fondo -->
  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- Estrellas -->
  <g fill="#ffffff">
    <circle cx="40" cy="50" r="1.5" opacity="0.8"/>
    <circle cx="95" cy="30" r="1" opacity="0.6"/>
    <circle cx="360" cy="45" r="1.8" opacity="0.9"/>
    <circle cx="330" cy="95" r="1" opacity="0.5"/>
    <circle cx="60" cy="120" r="1.2" opacity="0.7"/>
    <circle cx="20" cy="220" r="1" opacity="0.6"/>
    <circle cx="375" cy="240" r="1.4" opacity="0.8"/>
    <circle cx="150" cy="25" r="1.2" opacity="0.7"/>
  </g>

  <!-- Resplandor -->
  <circle cx="200" cy="230" r="170" fill="url(#glow)"/>

  <!-- Alas de hojas -->
  <path d="M160 190 Q80 90 30 150 Q60 160 50 190 Q80 185 90 215 Q120 210 150 235 Z" fill="url(#wing)" opacity="0.9"/>
  <path d="M240 190 Q320 90 370 150 Q340 160 350 190 Q320 185 310 215 Q280 210 250 235 Z" fill="url(#wing)" opacity="0.9"/>
  <g stroke="#1d6f66" stroke-width="2" fill="none" opacity="0.6">
    <path d="M160 190 Q110 150 45 150"/>
    <path d="M240 190 Q290 150 355 150"/>
  </g>

  <!-- Cola en espiral -->
  <path d="M265 305 C335 320 350 370 300 360 C262 352 288 322 318 336" fill="none" stroke="#e96fa0" stroke-width="10" stroke-linecap="round"/>

  <!-- Patas -->
  <g fill="#8e5cd9">
    <rect x="150" y="290" width="16" height="48" rx="8"/>
    <rect x="176" y="292" width="16" height="46" rx="8"/>
    <rect x="212" y="292" width="16" height="46" rx="8"/>
    <rect x="238" y="290" width="16" height="48" rx="8"/>
  </g>

  <!-- Cuerpo -->
  <ellipse cx="200" cy="260" rx="80" ry="52" fill="url(#body)"/>

  <!-- Manchas luminosas -->
  <g fill="#fff3a0" opacity="0.6">
    <circle cx="170" cy="245" r="7"/>
    <circle cx="200" cy="270" r="5"/>
    <circle cx="225" cy="250" r="6"/>
    <circle cx="185" cy="285" r="3.5"/>
  </g>

  <!-- Cuello y cabeza -->
  <path d="M235 235 Q245 205 255 190 L290 190 Q300 215 270 240 Z" fill="url(#body)"/>
  <circle cx="265" cy="185" r="40" fill="url(#body)"/>

  <!-- Hocico -->
  <ellipse cx="298" cy="198" rx="22" ry="15" fill="#ffb3a0"/>
  <circle cx="306" cy="194" r="2.5" fill="#5a2d6e"/>

  <!-- Cuernos de cristal -->
  <polygon points="240,155 230,112 254,146" fill="url(#horn)"/>
  <polygon points="276,148 284,106 294,150" fill="url(#horn)"/>
  <g stroke="#fff7c2" stroke-width="1.5" opacity="0.8">
    <line x1="236" y1="140" x2="238" y2="125"/>
    <line x1="284" y1="135" x2="286" y2="120"/>
  </g>

  <!-- Orejas -->
  <ellipse cx="245" cy="160" rx="8" ry="14" fill="#e96fa0" transform="rotate(-20 245 160)"/>

  <!-- Ojo -->
  <circle cx="257" cy="178" r="8" fill="#1b1b2f"/>
  <circle cx="260" cy="175" r="3" fill="#ffffff"/>

  <!-- Partículas flotantes -->
  <g fill="#ffd6f0">
    <circle cx="90" cy="150" r="3" opacity="0.8"/>
    <circle cx="120" cy="110" r="2" opacity="0.6"/>
    <circle cx="320" cy="280" r="2.5" opacity="0.7"/>
    <circle cx="75" cy="300" r="2" opacity="0.5"/>
    <circle cx="340" cy="60" r="2" opacity="0.6"/>
  </g>
</svg>