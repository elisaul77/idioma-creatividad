<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.4  0 0 0 0 0.3  0 0 0 -1.2 0.7"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- Papier -->
  <rect width="400" height="400" fill="#f6f0e1"/>
  <rect width="400" height="400" fill="#f6f0e1" filter="url(#grain)" opacity="0.5"/>

  <!-- Notenlinien, von Hand gezogen -->
  <g stroke="#3a3836" stroke-width="1.5" fill="none" stroke-linecap="round" filter="url(#rough)">
    <path d="M55 150 Q200 147 345 151"/>
    <path d="M55 170 Q200 173 345 169"/>
    <path d="M55 190 Q200 188 345 191"/>
    <path d="M55 210 Q200 213 345 209"/>
    <path d="M55 230 Q200 227 345 231"/>
  </g>

  <!-- Gezeichnete Melodielinie, die zwischen den Noten schwingt -->
  <path d="M110 210 C135 140, 150 250, 165 190 S205 120, 225 170 S270 240, 285 150 S320 100, 340 120"
        fill="none" stroke="#5a5550" stroke-width="1.2" stroke-dasharray="2 4" stroke-linecap="round" filter="url(#rough)"/>

  <!-- Notenköpfe mit Schraffur -->
  <g stroke="#2b2a28" stroke-width="1.6" fill="none" filter="url(#rough)">
    <ellipse cx="110" cy="210" rx="8" ry="5.5" transform="rotate(-20 110 210)"/>
    <ellipse cx="165" cy="190" rx="8" ry="5.5" transform="rotate(-20 165 190)"/>
    <ellipse cx="225" cy="170" rx="8" ry="5.5" transform="rotate(-20 225 170)"/>
    <path d="M104 208 l6 -4 M106 213 l8 -5 M111 216 l6 -4"/>
    <path d="M159 188 l6 -4 M161 193 l8 -5 M166 196 l6 -4"/>
    <path d="M219 168 l6 -4 M221 173 l8 -5 M226 176 l6 -4"/>
    <!-- Hälse -->
    <line x1="117" y1="208" x2="117" y2="160"/>
    <line x1="172" y1="188" x2="172" y2="140"/>
    <line x1="217" y1="172" x2="217" y2="222"/>
  </g>

  <!-- Vierte Note in rotem Buntstift -->
  <g stroke="#c0392b" stroke-width="2" fill="none" stroke-linecap="round" filter="url(#rough)">
    <ellipse cx="285" cy="150" rx="8" ry="5.5" transform="rotate(-20 285 150)"/>
    <path d="M279 148 l6 -4 M281 153 l8 -5"/>
    <line x1="292" y1="148" x2="292" y2="100"/>
  </g>

  <!-- Klangwellen als gezeichnete Kreisbögen -->
  <g fill="none" stroke="#3a3836" stroke-width="1.2" stroke-linecap="round" filter="url(#rough)">
    <circle cx="330" cy="70" r="16" stroke-dasharray="40 12" stroke-dashoffset="5"/>
    <circle cx="330" cy="70" r="30" stroke-dasharray="60 20" stroke-dashoffset="-10" opacity="0.8"/>
    <circle cx="330" cy="70" r="44" stroke-dasharray="70 30" stroke-dashoffset="15" opacity="0.55"/>
  </g>

  <!-- Kleiner Bleistiftstrich als Schlusspunkt -->
  <path d="M60 300 Q120 292 180 302 T300 298" fill="none" stroke="#7a756e" stroke-width="1" stroke-linecap="round" filter="url(#rough)" opacity="0.7"/>
</svg>