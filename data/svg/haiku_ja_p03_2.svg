<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a4a"/>
      <stop offset="0.55" stop-color="#2d1f4e"/>
      <stop offset="1" stop-color="#4a1f3f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd47a" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#ff9fb2" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff9fb2" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <g id="note">
      <ellipse cx="0" cy="0" rx="9" ry="7" transform="rotate(-20)"/>
      <line x1="8" y1="-2" x2="8" y2="-42" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M8,-42 C18,-36 22,-26 16,-12 C20,-22 16,-32 8,-34 Z" />
    </g>
  </defs>

  <!-- Canvas background -->
  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- Light bloom where the music is born -->
  <circle cx="200" cy="200" r="150" fill="url(#glow)"/>

  <!-- Painted staff lines flowing across the canvas -->
  <g fill="none" stroke="#f5e6c8" stroke-width="1.6" stroke-linecap="round" opacity="0.35">
    <path d="M10,120 C90,100 140,140 210,118 S330,96 395,120"/>
    <path d="M10,138 C90,118 140,158 210,136 S330,114 395,138"/>
    <path d="M10,156 C90,136 140,176 210,154 S330,132 395,156"/>
    <path d="M10,174 C90,154 140,194 210,172 S330,150 395,174"/>
    <path d="M10,192 C90,172 140,212 210,190 S330,168 395,192"/>
  </g>

  <!-- Thick brush strokes (soft underlayer) -->
  <g fill="none" stroke-linecap="round" filter="url(#blur)">
    <path d="M20,300 C90,250 140,330 210,280 S330,240 390,300" stroke="#ff8fab" stroke-width="34" opacity="0.45"/>
    <path d="M30,60 C100,20 160,90 220,50 S330,30 380,70" stroke="#6ee7d8" stroke-width="28" opacity="0.35"/>
    <path d="M60,370 C120,330 180,380 250,345 S350,350 380,320" stroke="#ffd47a" stroke-width="22" opacity="0.4"/>
  </g>

  <!-- Brush strokes (crisp layer) -->
  <g fill="none" stroke-linecap="round" filter="url(#soft)">
    <path d="M20,300 C90,250 140,330 210,280 S330,240 390,300" stroke="#ffb3c6" stroke-width="10" opacity="0.7"/>
    <path d="M30,60 C100,20 160,90 220,50 S330,30 380,70" stroke="#a8f3e8" stroke-width="8" opacity="0.6"/>
    <path d="M60,370 C120,330 180,380 250,345 S350,350 380,320" stroke="#fff0b3" stroke-width="7" opacity="0.7"/>
  </g>

  <!-- Swirling paint ribbons -->
  <g fill="none" stroke-linecap="round">
    <path d="M70,220 C110,180 150,250 190,210 S260,170 300,215" stroke="#ffd47a" stroke-width="5" opacity="0.8"/>
    <path d="M110,260 C150,230 190,290 230,255 S300,235 340,265" stroke="#ff8fab" stroke-width="4" opacity="0.8"/>
    <path d="M40,160 C80,140 100,190 130,170" stroke="#6ee7d8" stroke-width="4" opacity="0.7"/>
  </g>

  <!-- Musical notes rising from the paint -->
  <g fill="#fff6dc" stroke="#fff6dc">
    <use href="#note" x="0" y="0" transform="translate(120,150) scale(1.3) rotate(-10)" color="#fff6dc" style="fill:#fff6dc;stroke:#fff6dc"/>
    <use href="#note" transform="translate(205,110) scale(1.0) rotate(8)" color="#ffd47a" style="fill:#ffd47a;stroke:#ffd47a"/>
    <use href="#note" transform="translate(285,190) scale(1.2) rotate(-6)" color="#6ee7d8" style="fill:#6ee7d8;stroke:#6ee7d8"/>
    <use href="#note" transform="translate(160,280) scale(0.9) rotate(12)" color="#ff8fab" style="fill:#ff8fab;stroke:#ff8fab"/>
    <use href="#note" transform="translate(320,300) scale(1.1) rotate(-14)" color="#fff6dc" style="fill:#fff6dc;stroke:#fff6dc"/>
  </g>

  <!-- Tiny sparkles of sound -->
  <g fill="#fff6dc">
    <circle cx="90" cy="110" r="2.5" opacity="0.9"/>
    <circle cx="260" cy="70" r="2" opacity="0.8"/>
    <circle cx="340" cy="140" r="3" opacity="0.9"/>
    <circle cx="60" cy="200" r="2" opacity="0.7"/>
    <circle cx="230" cy="230" r="2.5" opacity="0.8"/>
    <circle cx="370" cy="230" r="2" opacity="0.7"/>
    <circle cx="140" cy="350" r="2.5" opacity="0.8"/>
    <circle cx="210" cy="365" r="2" opacity="0.6"/>
  </g>

  <!-- Dripping paint accents -->
  <g fill="#ffd47a" opacity="0.6">
    <path d="M186,26 q4,0 4,8 q0,4 -4,4 q-4,0 -4,-4 q0,-8 4,-8 Z" />
    <path d="M52,95 q3,0 3,6 q0,3 -3,3 q-3,0 -3,-3 q0,-6 3,-6 Z" />
  </g>
</svg>