<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e1f"/>
      <stop offset="1" stop-color="#22345c"/>
    </linearGradient>
    <radialGradient id="crust" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#b98a62"/>
      <stop offset="1" stop-color="#6b4029"/>
    </radialGradient>
    <radialGradient id="mantle" cx="0.45" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#e0804a"/>
      <stop offset="1" stop-color="#9c3f1f"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9a3"/>
      <stop offset="0.6" stop-color="#ffab3d"/>
      <stop offset="1" stop-color="#e2561c"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd166" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7d8ca3"/>
      <stop offset="0.5" stop-color="#e6edf7"/>
      <stop offset="1" stop-color="#5a6780"/>
    </linearGradient>
    <linearGradient id="drill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a4f5c"/>
      <stop offset="0.5" stop-color="#c9ced8"/>
      <stop offset="1" stop-color="#4a4f5c"/>
    </linearGradient>
  </defs>

  <!-- Himmel und Sterne -->
  <rect width="400" height="400" fill="url(#sky)"/>
  <circle cx="45" cy="40" r="1.5" fill="#ffffff"/>
  <circle cx="110" cy="75" r="1" fill="#ffffff"/>
  <circle cx="330" cy="35" r="1.8" fill="#ffffff"/>
  <circle cx="365" cy="90" r="1" fill="#ffffff"/>
  <circle cx="270" cy="80" r="1.2" fill="#ffffff"/>
  <circle cx="60" cy="120" r="1" fill="#ffffff"/>
  <circle cx="345" cy="130" r="1.3" fill="#ffffff"/>
  <circle cx="20" cy="170" r="1" fill="#ffffff"/>

  <!-- Erdquerschnitt: Kruste, Mantel, äußerer Kern, innerer Kern -->
  <circle cx="200" cy="270" r="130" fill="url(#crust)"/>
  <circle cx="200" cy="270" r="105" fill="url(#mantle)"/>
  <circle cx="200" cy="270" r="70" fill="url(#core)"/>
  <circle cx="200" cy="270" r="60" fill="url(#glow)" opacity="0.6"/>
  <circle cx="200" cy="270" r="26" fill="#fff3c4"/>
  <circle cx="200" cy="270" r="45" fill="none" stroke="#ffd166" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4"/>

  <!-- Bohrschacht -->
  <rect x="193" y="140" width="14" height="128" fill="#120a08" opacity="0.85"/>

  <!-- Verbindungskabel nach oben -->
  <line x1="200" y1="0" x2="200" y2="62" stroke="#8fa3c7" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Fahrzeug: Kapsel -->
  <path d="M176 128 L158 150 L176 146 Z" fill="#3d4a63"/>
  <path d="M224 128 L242 150 L224 146 Z" fill="#3d4a63"/>
  <ellipse cx="200" cy="112" rx="26" ry="34" fill="url(#hull)"/>
  <rect x="174" y="118" width="52" height="6" fill="#3d4a63"/>
  <circle cx="200" cy="98" r="10" fill="#7fe7ff" stroke="#1b2a40" stroke-width="3"/>
  <circle cx="197" cy="95" r="2.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="182" cy="128" r="2.5" fill="#ff5d5d"/>
  <circle cx="218" cy="128" r="2.5" fill="#5dff8a"/>

  <!-- Bohrkopf -->
  <path d="M188 144 L212 144 L200 186 Z" fill="url(#drill)"/>
  <path d="M190 152 L210 156 M192 162 L208 166 M195 172 L205 176" stroke="#7a8496" stroke-width="2" fill="none"/>

  <!-- Hitze und Funken am Bohrkopf -->
  <circle cx="200" cy="184" r="22" fill="url(#glow)" opacity="0.9"/>
  <circle cx="186" cy="196" r="2" fill="#ffb347"/>
  <circle cx="214" cy="194" r="1.5" fill="#ffb347"/>
  <circle cx="195" cy="203" r="1.8" fill="#ff8c42"/>
  <circle cx="207" cy="206" r="1.2" fill="#ffd166"/>
</svg>