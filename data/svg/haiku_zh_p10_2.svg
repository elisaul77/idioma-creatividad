<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1f44"/>
      <stop offset="60%" stop-color="#1e5fa8"/>
      <stop offset="100%" stop-color="#7fb8e6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#bfe3ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#bfe3ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scent" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#9fd8ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e6f6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c6e9e"/>
      <stop offset="100%" stop-color="#0d2f52"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="400" height="400" fill="url(#sky)"/>
  <circle cx="200" cy="240" r="170" fill="url(#glow)"/>

  <!-- drifting scent waves -->
  <g fill="none" stroke="url(#scent)" stroke-width="3" stroke-linecap="round" filter="url(#blur)">
    <path d="M120 330 C90 290, 150 260, 120 220 C95 185, 140 160, 115 120"/>
    <path d="M200 340 C170 300, 230 270, 200 225 C175 190, 225 160, 198 110"/>
    <path d="M285 330 C255 285, 315 255, 285 210 C260 175, 305 150, 282 100"/>
  </g>
  <g fill="none" stroke="#d4ecff" stroke-width="1.5" stroke-linecap="round" opacity="0.7">
    <path d="M140 300 C115 265, 165 240, 140 200 C120 170, 160 150, 138 115"/>
    <path d="M250 310 C225 275, 275 245, 250 205 C230 175, 270 150, 248 120"/>
  </g>

  <!-- floating blue particles -->
  <g fill="#cfeeff">
    <circle cx="70" cy="180" r="2.5" opacity="0.8"/>
    <circle cx="95" cy="90" r="1.8" opacity="0.6"/>
    <circle cx="165" cy="70" r="2" opacity="0.7"/>
    <circle cx="240" cy="60" r="2.2" opacity="0.6"/>
    <circle cx="320" cy="110" r="2.6" opacity="0.8"/>
    <circle cx="345" cy="200" r="1.6" opacity="0.5"/>
    <circle cx="55" cy="260" r="1.9" opacity="0.6"/>
    <circle cx="180" cy="160" r="1.5" opacity="0.7"/>
    <circle cx="300" cy="280" r="2" opacity="0.5"/>
  </g>

  <!-- lavender-like blossoms -->
  <g stroke="url(#stem)" stroke-width="4" stroke-linecap="round">
    <line x1="120" y1="400" x2="120" y2="240"/>
    <line x1="200" y1="400" x2="200" y2="215"/>
    <line x1="285" y1="400" x2="285" y2="250"/>
  </g>
  <g fill="#3d7fd1">
    <ellipse cx="120" cy="225" rx="9" ry="20" transform="rotate(-8 120 225)"/>
    <ellipse cx="120" cy="250" rx="8" ry="16"/>
    <ellipse cx="200" cy="200" rx="10" ry="22"/>
    <ellipse cx="200" cy="228" rx="9" ry="17"/>
    <ellipse cx="285" cy="235" rx="9" ry="20" transform="rotate(8 285 235)"/>
    <ellipse cx="285" cy="262" rx="8" ry="15"/>
  </g>
  <g fill="#8cc8f5" opacity="0.9">
    <ellipse cx="118" cy="222" rx="4" ry="7"/>
    <ellipse cx="198" cy="196" rx="4" ry="8"/>
    <ellipse cx="283" cy="232" rx="4" ry="7"/>
  </g>

  <!-- soft ground haze -->
  <rect x="0" y="330" width="400" height="70" fill="#0a1f44" opacity="0.5" filter="url(#blur)"/>
</svg>