<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1040"/>
      <stop offset="60%" stop-color="#1b3a6b"/>
      <stop offset="100%" stop-color="#2fa19a"/>
    </linearGradient>
    <radialGradient id="sol" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff6c9"/>
      <stop offset="60%" stop-color="#ffd166" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tronco" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d2a4d"/>
      <stop offset="50%" stop-color="#3b5b8f"/>
      <stop offset="100%" stop-color="#1d2a4d"/>
    </linearGradient>
    <radialGradient id="copa" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#7ef5e0" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#27c6b0" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#1b7f9e" stop-opacity="0.6"/>
    </radialGradient>
    <linearGradient id="suelo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16324f"/>
      <stop offset="100%" stop-color="#0a1a2e"/>
    </linearGradient>
    <filter id="brillo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Cielo -->
  <rect width="400" height="400" fill="url(#cielo)"/>

  <!-- Estrellas -->
  <g fill="#ffffff">
    <circle cx="40" cy="50" r="1.5" opacity="0.9"/>
    <circle cx="95" cy="28" r="1" opacity="0.7"/>
    <circle cx="150" cy="70" r="1.2" opacity="0.8"/>
    <circle cx="330" cy="45" r="1.5" opacity="0.9"/>
    <circle cx="365" cy="110" r="1" opacity="0.6"/>
    <circle cx="60" cy="130" r="1" opacity="0.6"/>
    <circle cx="280" cy="95" r="1.2" opacity="0.8"/>
    <circle cx="210" cy="30" r="1" opacity="0.7"/>
  </g>

  <!-- Sol / luna futurista -->
  <circle cx="310" cy="120" r="70" fill="url(#sol)"/>
  <circle cx="310" cy="120" r="34" fill="#ffe59a" opacity="0.95" filter="url(#brillo)"/>
  <circle cx="310" cy="120" r="46" fill="none" stroke="#ffd166" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="4 6"/>

  <!-- Colinas -->
  <path d="M0 290 Q90 250 190 280 T400 270 L400 400 L0 400 Z" fill="#1d4a6b" opacity="0.8"/>
  <path d="M0 320 Q120 290 220 320 T400 315 L400 400 L0 400 Z" fill="url(#suelo)"/>

  <!-- Anillos de energía en el suelo -->
  <ellipse cx="200" cy="335" rx="110" ry="18" fill="none" stroke="#5ff2e0" stroke-opacity="0.5" stroke-width="2" filter="url(#brillo)"/>
  <ellipse cx="200" cy="335" rx="150" ry="26" fill="none" stroke="#5ff2e0" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Orbes flotantes -->
  <g filter="url(#brillo)">
    <circle cx="90" cy="190" r="4" fill="#7ef5e0"/>
    <circle cx="335" cy="220" r="3" fill="#ffd166"/>
    <circle cx="70" cy="250" r="2.5" fill="#7ef5e0"/>
    <circle cx="120" cy="150" r="2" fill="#ffd166"/>
  </g>

  <!-- Ramas principales (líneas luminosas) -->
  <g fill="none" stroke-linecap="round" filter="url(#brillo)">
    <path d="M200 330 Q196 260 200 200" stroke="url(#tronco)" stroke-width="22"/>
    <path d="M200 240 Q160 210 130 150" stroke="#3b5b8f" stroke-width="10"/>
    <path d="M200 230 Q245 200 275 140" stroke="#3b5b8f" stroke-width="10"/>
    <path d="M200 200 Q190 160 200 110" stroke="#3b5b8f" stroke-width="10"/>
    <path d="M130 150 Q110 130 95 120" stroke="#5ff2e0" stroke-width="3"/>
    <path d="M275 140 Q295 125 305 110" stroke="#5ff2e0" stroke-width="3"/>
    <path d="M200 110 Q180 90 170 70" stroke="#5ff2e0" stroke-width="3"/>
    <path d="M200 110 Q225 85 235 65" stroke="#5ff2e0" stroke-width="3"/>
  </g>

  <!-- Circuitos en el tronco -->
  <g fill="none" stroke="#7ef5e0" stroke-width="1.2" stroke-opacity="0.8">
    <path d="M192 300 H208 M200 300 V280 H215"/>
    <path d="M192 270 H200 V255"/>
    <path d="M208 250 H192 V235"/>
  </g>
  <g fill="#7ef5e0" filter="url(#brillo)">
    <circle cx="215" cy="280" r="2"/>
    <circle cx="200" cy="255" r="2"/>
    <circle cx="192" cy="235" r="2"/>
  </g>

  <!-- Copa: volúmenes translúcidos -->
  <g fill="url(#copa)" opacity="0.85">
    <circle cx="130" cy="130" r="42"/>
    <circle cx="200" cy="90" r="55"/>
    <circle cx="270" cy="125" r="45"/>
    <circle cx="170" cy="60" r="32"/>
    <circle cx="240" cy="55" r="30"/>
  </g>

  <!-- Nodos de luz en la copa -->
  <g fill="#e0fff9" filter="url(#brillo)">
    <circle cx="95" cy="120" r="3"/>
    <circle cx="170" cy="70" r="3.5"/>
    <circle cx="235" cy="65" r="3"/>
    <circle cx="305" cy="110" r="3"/>
    <circle cx="200" cy="95" r="4"/>
    <circle cx="130" cy="150" r="2.5"/>
  </g>

  <!-- Conexiones entre nodos -->
  <g stroke="#e0fff9" stroke-width="0.8" stroke-opacity="0.5" fill="none">
    <path d="M95 120 L170 70 L200 95 L235 65 L305 110"/>
    <path d="M130 150 L200 95 L270 125"/>
  </g>
</svg>