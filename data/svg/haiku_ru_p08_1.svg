<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1f4b"/>
      <stop offset="1" stop-color="#2d2a64"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3b0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff3b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3566"/>
      <stop offset="1" stop-color="#2a1f3f"/>
    </linearGradient>
  </defs>

  <!-- Стена и пол -->
  <rect width="400" height="400" fill="url(#wall)"/>
  <rect x="0" y="330" width="400" height="70" fill="url(#floor)"/>
  <line x1="0" y1="330" x2="400" y2="330" stroke="#6b5a8f" stroke-width="2"/>

  <!-- Окно с луной -->
  <rect x="22" y="22" width="120" height="130" rx="4" fill="#0d1233"/>
  <circle cx="82" cy="78" r="60" fill="url(#glow)"/>
  <circle cx="82" cy="78" r="30" fill="#fff6cf"/>
  <circle cx="92" cy="70" r="6" fill="#ecdca0" opacity="0.7"/>
  <circle cx="74" cy="90" r="4" fill="#ecdca0" opacity="0.7"/>
  <circle cx="40" cy="40" r="1.5" fill="#fff"/>
  <circle cx="125" cy="38" r="2" fill="#fff"/>
  <circle cx="48" cy="130" r="1.5" fill="#fff"/>
  <rect x="22" y="22" width="120" height="130" rx="4" fill="none" stroke="#8a7bb5" stroke-width="6"/>
  <line x1="82" y1="22" x2="82" y2="152" stroke="#8a7bb5" stroke-width="4"/>
  <line x1="22" y1="87" x2="142" y2="87" stroke="#8a7bb5" stroke-width="4"/>

  <!-- Звёзды -->
  <g fill="#ffffff">
    <circle cx="180" cy="40" r="1.5" opacity="0.8"/>
    <circle cx="250" cy="25" r="2" opacity="0.9"/>
    <circle cx="330" cy="60" r="1.5" opacity="0.7"/>
    <circle cx="368" cy="130" r="2" opacity="0.9"/>
    <circle cx="300" cy="110" r="1.2" opacity="0.6"/>
    <circle cx="200" cy="95" r="1.5" opacity="0.8"/>
    <circle cx="160" cy="150" r="1" opacity="0.6"/>
    <circle cx="350" cy="190" r="1.5" opacity="0.7"/>
  </g>

  <!-- Полка с книгами -->
  <rect x="215" y="180" width="160" height="6" fill="#8a5a3c"/>
  <rect x="225" y="140" width="12" height="40" fill="#e0565b"/>
  <rect x="239" y="150" width="10" height="30" fill="#f2c14e"/>
  <rect x="251" y="135" width="14" height="45" fill="#5bb5d6"/>
  <rect x="268" y="148" width="10" height="32" fill="#9b7fe0"/>
  <rect x="330" y="160" width="36" height="20" rx="3" fill="#6bd39b"/>

  <!-- Самолётик с полосой звёзд -->
  <path d="M 40 300 Q 90 210 150 200" fill="none" stroke="#ffe27a" stroke-width="2" stroke-dasharray="4 6" opacity="0.8"/>
  <g transform="translate(170,190) rotate(-20)">
    <ellipse cx="0" cy="0" rx="26" ry="8" fill="#f5f5f5"/>
    <path d="M -4 0 L -14 -22 L 4 -2 Z" fill="#e0565b"/>
    <path d="M -4 0 L -14 22 L 4 2 Z" fill="#e0565b"/>
    <path d="M 20 0 L 30 -10 L 30 0 Z" fill="#e0565b"/>
    <circle cx="12" cy="-2" r="3" fill="#5bb5d6"/>
  </g>

  <!-- Плюшевый мишка (танцует) -->
  <g transform="translate(130,0)">
    <ellipse cx="0" cy="345" rx="34" ry="6" fill="#1e1638" opacity="0.5"/>
    <ellipse cx="-14" cy="330" rx="9" ry="14" fill="#a8703f"/>
    <ellipse cx="14" cy="330" rx="9" ry="14" fill="#a8703f"/>
    <ellipse cx="0" cy="290" rx="26" ry="32" fill="#b97c49"/>
    <ellipse cx="-30" cy="282" rx="8" ry="16" fill="#a8703f" transform="rotate(-35 -30 282)"/>
    <ellipse cx="30" cy="268" rx="8" ry="16" fill="#a8703f" transform="rotate(35 30 268)"/>
    <circle cx="0" cy="246" r="22" fill="#b97c49"/>
    <circle cx="-16" cy="230" r="8" fill="#a8703f"/>
    <circle cx="16" cy="230" r="8" fill="#a8703f"/>
    <ellipse cx="0" cy="254" rx="10" ry="7" fill="#e9c9a0"/>
    <circle cx="-8" cy="240" r="3" fill="#2a1a10"/>
    <circle cx="8" cy="240" r="3" fill="#2a1a10"/>
    <circle cx="0" cy="250" r="2.5" fill="#2a1a10"/>
    <path d="M -4 258 Q 0 262 4 258" fill="none" stroke="#2a1a10" stroke-width="1.5"/>
  </g>

  <!-- Робот -->
  <g transform="translate(300,0)">
    <ellipse cx="0" cy="345" rx="28" ry="5" fill="#1e1638" opacity="0.5"/>
    <rect x="-20" y="290" width="14" height="40" fill="#5f7fb0"/>
    <rect x="6" y="290" width="14" height="40" fill="#5f7fb0"/>
    <rect x="-22" y="246" width="44" height="50" rx="6" fill="#7fd3e0"/>
    <rect x="-14" y="256" width="28" height="16" rx="3" fill="#2a3a5c"/>
    <circle cx="-6" cy="264" r="3" fill="#ffe27a"/>
    <circle cx="6" cy="264" r="3" fill="#ffe27a"/>
    <rect x="-28" y="258" width="8" height="26" rx="4" fill="#5f7fb0" transform="rotate(25 -24 258)"/>
    <rect x="20" y="258" width="8" height="26" rx="4" fill="#5f7fb0" transform="rotate(-25 24 258)"/>
    <rect x="-18" y="214" width="36" height="28" rx="5" fill="#9ee6f0"/>
    <line x1="0" y1="214" x2="0" y2="202" stroke="#8a7bb5" stroke-width="2"/>
    <circle cx="0" cy="200" r="4" fill="#ff6b6b"/>
    <rect x="-12" y="222" width="7" height="6" fill="#2a3a5c"/>
    <rect x="5" y="222" width="7" height="6" fill="#2a3a5c"/>
  </g>

  <!-- Кубики и мяч -->
  <rect x="40" y="310" width="30" height="30" fill="#f2c14e" rx="2"/>
  <rect x="44" y="282" width="24" height="26" fill="#6bd39b" rx="2"/>
  <circle cx="90" cy="338" r="12" fill="#e0565b"/>
  <path d="M 84 332 Q 90 338 84 344" fill="none" stroke="#ffd0d2" stroke-width="2" opacity="0.7"/>

  <!-- Ночник -->
  <rect x="352" y="300" width="20" height="30" rx="3" fill="#c8b6ff"/>
  <circle cx="362" cy="296" r="40" fill="url(#glow)" opacity="0.5"/>
</svg>