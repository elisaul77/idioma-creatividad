<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b1f"/>
      <stop offset="1" stop-color="#1b2a58"/>
    </linearGradient>
    <radialGradient id="mantle" cx="200" cy="300" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c25a2e"/>
      <stop offset="1" stop-color="#7a3420"/>
    </radialGradient>
    <radialGradient id="outerCore" cx="200" cy="560" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#e0622a"/>
    </radialGradient>
    <radialGradient id="innerCore" cx="200" cy="560" r="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="0.5" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#ffb13b" stop-opacity="0.6"/>
    </radialGradient>
    <radialGradient id="glow" cx="200" cy="560" r="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd36b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd36b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pod" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f9cb8"/>
      <stop offset="0.5" stop-color="#e6ecf7"/>
      <stop offset="1" stop-color="#7d8aa6"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.5" stop-color="#ff9f2e"/>
      <stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="400" height="400" fill="url(#sky)"/>
  <g fill="#ffffff">
    <circle cx="40" cy="30" r="1.2"/>
    <circle cx="90" cy="70" r="0.9"/>
    <circle cx="150" cy="25" r="1"/>
    <circle cx="260" cy="40" r="1.3"/>
    <circle cx="330" cy="18" r="1"/>
    <circle cx="370" cy="75" r="1.2"/>
    <circle cx="20" cy="120" r="0.8"/>
    <circle cx="300" cy="100" r="0.9"/>
    <circle cx="60" cy="160" r="1"/>
    <circle cx="350" cy="150" r="0.8"/>
  </g>

  <!-- Earth cross-section -->
  <circle cx="200" cy="560" r="460" fill="url(#mantle)"/>
  <circle cx="200" cy="560" r="460" fill="none" stroke="#5e8a4a" stroke-width="10"/>
  <circle cx="200" cy="560" r="330" fill="none" stroke="#d8703a" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="6 8"/>
  <circle cx="200" cy="560" r="260" fill="none" stroke="#ffb078" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="3 9"/>
  <circle cx="200" cy="560" r="200" fill="url(#outerCore)"/>
  <circle cx="200" cy="560" r="170" fill="url(#glow)"/>
  <circle cx="200" cy="560" r="90" fill="url(#innerCore)"/>

  <!-- Surface shaft -->
  <rect x="186" y="100" width="28" height="60" fill="#05070f"/>
  <rect x="186" y="100" width="28" height="60" fill="none" stroke="#6b7fa8" stroke-width="2"/>

  <!-- Descent trajectory -->
  <line x1="200" y1="252" x2="200" y2="470" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="4 6"/>

  <!-- Vehicle exhaust flame -->
  <path d="M190 158 L210 158 L200 118 Z" fill="url(#flame)"/>
  <path d="M195 158 L205 158 L200 136 Z" fill="#fff8d0" opacity="0.9"/>

  <!-- Fins -->
  <path d="M178 178 L160 204 L178 200 Z" fill="#5d6b8a"/>
  <path d="M222 178 L240 204 L222 200 Z" fill="#5d6b8a"/>

  <!-- Pod body -->
  <ellipse cx="200" cy="190" rx="24" ry="32" fill="url(#pod)" stroke="#3a4766" stroke-width="2"/>
  <ellipse cx="200" cy="184" rx="9" ry="9" fill="#3ad0ff" stroke="#0c2a4a" stroke-width="1.5"/>
  <ellipse cx="197" cy="181" rx="3" ry="2" fill="#ffffff" opacity="0.8"/>
  <path d="M182 200 Q200 208 218 200" fill="none" stroke="#3a4766" stroke-width="1.5"/>

  <!-- Drill nose -->
  <path d="M180 216 L220 216 L200 252 Z" fill="#aab4c8" stroke="#3a4766" stroke-width="1.5"/>
  <path d="M186 224 L214 224 M190 232 L210 232 M195 240 L205 240" stroke="#5d6b8a" stroke-width="1.5" fill="none"/>

  <!-- Sparks at drill tip -->
  <g fill="#ffd36b">
    <circle cx="196" cy="256" r="1.5"/>
    <circle cx="204" cy="260" r="1.2"/>
    <circle cx="200" cy="264" r="1.8"/>
  </g>
</svg>