<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0" stop-color="#1B2344"/>
      <stop offset="1" stop-color="#05060D"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFF8D6"/>
      <stop offset="0.45" stop-color="#FFD36E"/>
      <stop offset="1" stop-color="#E8862E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="innerCore" cx="40%" cy="40%" r="60%">
      <stop offset="0" stop-color="#FFF9E0"/>
      <stop offset="1" stop-color="#FFC24A"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FDBFF" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#BDEBFF" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FFF3B0" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8E99AE"/>
      <stop offset="0.5" stop-color="#EEF2F8"/>
      <stop offset="1" stop-color="#5E6980"/>
    </linearGradient>
    <linearGradient id="drill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7A8498"/>
      <stop offset="0.5" stop-color="#D5DCE8"/>
      <stop offset="1" stop-color="#525C70"/>
    </linearGradient>
  </defs>

  <!-- Hintergrund -->
  <rect width="400" height="400" fill="url(#bg)"/>
  <g fill="#FFFFFF">
    <circle cx="28" cy="50" r="1.2" opacity="0.8"/>
    <circle cx="90" cy="22" r="1" opacity="0.6"/>
    <circle cx="330" cy="36" r="1.4" opacity="0.9"/>
    <circle cx="372" cy="110" r="1" opacity="0.7"/>
    <circle cx="40" cy="170" r="1.1" opacity="0.6"/>
    <circle cx="360" cy="250" r="1.3" opacity="0.8"/>
    <circle cx="30" cy="330" r="1" opacity="0.7"/>
    <circle cx="110" cy="375" r="1.2" opacity="0.8"/>
    <circle cx="300" cy="372" r="1" opacity="0.6"/>
    <circle cx="350" cy="320" r="1.1" opacity="0.7"/>
  </g>

  <!-- Erdquerschnitt: Kruste, Mantel, äußerer Kern, innerer Kern -->
  <circle cx="200" cy="200" r="160" fill="#6B4A2B"/>
  <circle cx="200" cy="200" r="160" fill="none" stroke="#3E2A18" stroke-width="3"/>
  <g fill="#4F3520" opacity="0.5">
    <ellipse cx="120" cy="110" rx="18" ry="7" transform="rotate(-30 120 110)"/>
    <ellipse cx="290" cy="150" rx="14" ry="6" transform="rotate(20 290 150)"/>
    <ellipse cx="260" cy="290" rx="20" ry="8" transform="rotate(-15 260 290)"/>
    <ellipse cx="110" cy="270" rx="16" ry="6" transform="rotate(25 110 270)"/>
  </g>
  <circle cx="200" cy="200" r="128" fill="#B5552A"/>
  <g fill="#8E3D1C" opacity="0.4">
    <path d="M90,200 Q140,170 200,190 T310,200" stroke="#8E3D1C" stroke-width="4" fill="none"/>
    <path d="M120,250 Q180,230 240,250 T300,240" stroke="#8E3D1C" stroke-width="3" fill="none"/>
  </g>
  <circle cx="200" cy="200" r="80" fill="#E8862E"/>
  <circle cx="200" cy="200" r="80" fill="none" stroke="#F7B45C" stroke-width="2" stroke-dasharray="6 5" opacity="0.7"/>
  <circle cx="200" cy="200" r="36" fill="url(#innerCore)"/>

  <!-- Kernglanz -->
  <circle cx="200" cy="200" r="70" fill="url(#coreGlow)" opacity="0.8"/>

  <!-- Schacht und Antriebsspur -->
  <rect x="189" y="40" width="22" height="160" fill="#140C07" opacity="0.85"/>
  <rect x="196" y="40" width="8" height="150" fill="url(#trail)"/>

  <!-- Fahrzeug -->
  <g transform="translate(200 200)">
    <circle cx="0" cy="-8" r="24" fill="#FFF3B0" opacity="0.15"/>
    <!-- Flossen -->
    <path d="M-14,-8 L-26,6 L-14,8 Z" fill="#D9523A" stroke="#7A2A1A" stroke-width="1"/>
    <path d="M14,-8 L26,6 L14,8 Z" fill="#D9523A" stroke="#7A2A1A" stroke-width="1"/>
    <!-- Rumpf -->
    <path d="M-14,-30 Q-14,-46 0,-46 Q14,-46 14,-30 L14,8 L-14,8 Z" fill="url(#hull)" stroke="#3A4356" stroke-width="1.5"/>
    <!-- Ringe -->
    <rect x="-14" y="-12" width="28" height="3" fill="#3A4356" opacity="0.5"/>
    <rect x="-14" y="0" width="28" height="3" fill="#3A4356" opacity="0.5"/>
    <!-- Sichtfenster -->
    <circle cx="0" cy="-26" r="6" fill="#7FDBFF" stroke="#2A3550" stroke-width="1.5"/>
    <circle cx="-2" cy="-28" r="1.5" fill="#FFFFFF" opacity="0.9"/>
    <!-- Bohrkopf -->
    <path d="M-14,8 L14,8 L5,34 L0,44 L-5,34 Z" fill="url(#drill)" stroke="#3A4356" stroke-width="1.5"/>
    <path d="M-9,16 L9,16 M-7,24 L7,24 M-4,32 L4,32" stroke="#3A4356" stroke-width="1" opacity="0.6"/>
    <!-- Glühende Spitze -->
    <circle cx="0" cy="46" r="4" fill="#FFF3B0" opacity="0.9"/>
    <circle cx="0" cy="46" r="9" fill="#FFD36E" opacity="0.35"/>
  </g>

  <!-- Funken im Kern -->
  <g fill="#FFFFFF">
    <circle cx="170" cy="186" r="1.5" opacity="0.9"/>
    <circle cx="232" cy="214" r="1.2" opacity="0.8"/>
    <circle cx="214" cy="176" r="1" opacity="0.9"/>
    <circle cx="184" cy="222" r="1.3" opacity="0.7"/>
  </g>
</svg>