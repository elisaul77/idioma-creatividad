<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#FFF8D6"/>
      <stop offset="0.55" stop-color="#FFD96B"/>
      <stop offset="1" stop-color="#FF9F6B"/>
    </radialGradient>
    <radialGradient id="core" cx="42%" cy="38%" r="65%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#FFE57A"/>
      <stop offset="1" stop-color="#FFB347"/>
    </radialGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8FB1"/>
      <stop offset="1" stop-color="#FF4D8D"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9BE3A6"/>
      <stop offset="1" stop-color="#5CC47E"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- radiating rays -->
  <g stroke="#FFF4B8" stroke-width="7" stroke-linecap="round" opacity="0.75">
    <line x1="291" y1="190" x2="350" y2="190"/>
    <line x1="291" y1="242" x2="330" y2="265"/>
    <line x1="252" y1="281" x2="275" y2="320"/>
    <line x1="200" y1="295" x2="200" y2="340"/>
    <line x1="147" y1="281" x2="125" y2="320"/>
    <line x1="109" y1="242" x2="70" y2="265"/>
    <line x1="95" y1="190" x2="50" y2="190"/>
    <line x1="109" y1="138" x2="70" y2="115"/>
    <line x1="147" y1="99" x2="125" y2="60"/>
    <line x1="200" y1="85" x2="200" y2="40"/>
    <line x1="252" y1="99" x2="275" y2="60"/>
    <line x1="291" y1="138" x2="330" y2="115"/>
  </g>

  <!-- petals -->
  <g fill="url(#petal)" opacity="0.92">
    <ellipse cx="200" cy="120" rx="22" ry="32" transform="rotate(0 200 190)"/>
    <ellipse cx="200" cy="120" rx="22" ry="32" transform="rotate(72 200 190)"/>
    <ellipse cx="200" cy="120" rx="22" ry="32" transform="rotate(144 200 190)"/>
    <ellipse cx="200" cy="120" rx="22" ry="32" transform="rotate(216 200 190)"/>
    <ellipse cx="200" cy="120" rx="22" ry="32" transform="rotate(288 200 190)"/>
  </g>

  <!-- glowing core -->
  <circle cx="200" cy="190" r="78" fill="#FFFFFF" opacity="0.35"/>
  <circle cx="200" cy="190" r="62" fill="url(#core)"/>

  <!-- small joyful bursts -->
  <g fill="#FFFFFF" opacity="0.9">
    <circle cx="80" cy="80" r="5"/>
    <circle cx="330" cy="72" r="4"/>
    <circle cx="352" cy="300" r="6"/>
    <circle cx="48" cy="280" r="4"/>
    <circle cx="150" cy="40" r="3"/>
    <circle cx="265" cy="355" r="3"/>
  </g>
  <g fill="#FF6B9A">
    <circle cx="62" cy="168" r="6"/>
    <circle cx="340" cy="200" r="5"/>
    <circle cx="300" cy="25" r="4"/>
  </g>
  <g fill="#4FC3F7">
    <circle cx="110" cy="345" r="5"/>
    <circle cx="290" cy="130" r="4"/>
    <circle cx="25" cy="50" r="3"/>
  </g>
  <g fill="#9CCC65">
    <circle cx="370" cy="130" r="4"/>
    <circle cx="130" cy="20" r="5"/>
  </g>

  <!-- ground -->
  <path d="M0 330 Q100 300 200 326 T400 318 V400 H0 Z" fill="url(#hill)"/>
</svg>