<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="fondo" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#e0f7ff"/>
      <stop offset="55%" stop-color="#7fc8f8"/>
      <stop offset="100%" stop-color="#1b3a8a"/>
    </radialGradient>
    <linearGradient id="gota" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5fd3ff"/>
      <stop offset="60%" stop-color="#1e6fe0"/>
      <stop offset="100%" stop-color="#0b2e7a"/>
    </linearGradient>
    <linearGradient id="ola" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a8cff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0d4fb8" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="piruleta" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#9fe6ff"/>
      <stop offset="60%" stop-color="#2d7cf0"/>
      <stop offset="100%" stop-color="#123c94"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#fondo)"/>

  <!-- Burbujas de fondo -->
  <g fill="#ffffff" opacity="0.35">
    <circle cx="60" cy="90" r="8"/>
    <circle cx="95" cy="50" r="5"/>
    <circle cx="330" cy="70" r="7"/>
    <circle cx="360" cy="130" r="4"/>
    <circle cx="45" cy="200" r="5"/>
    <circle cx="350" cy="230" r="9"/>
  </g>

  <!-- Gota principal de sabor azul -->
  <path d="M200 70 C200 70 130 160 130 225 C130 272 162 305 200 305 C238 305 270 272 270 225 C270 160 200 70 200 70 Z" fill="url(#gota)"/>
  <ellipse cx="172" cy="200" rx="10" ry="22" fill="#ffffff" opacity="0.6" transform="rotate(18 172 200)"/>

  <!-- Salpicaduras -->
  <g fill="#1e6fe0">
    <circle cx="105" cy="290" r="10"/>
    <circle cx="90" cy="320" r="6"/>
    <circle cx="295" cy="300" r="12"/>
    <circle cx="315" cy="330" r="7"/>
    <circle cx="250" cy="335" r="5"/>
  </g>

  <!-- Ola inferior -->
  <path d="M0 330 Q50 310 100 330 T200 330 T300 330 T400 330 L400 400 L0 400 Z" fill="url(#ola)"/>
  <path d="M0 355 Q50 340 100 355 T200 355 T300 355 T400 355 L400 400 L0 400 Z" fill="#0a3b96" opacity="0.8"/>

  <!-- Piruleta azul con espiral -->
  <line x1="330" y1="175" x2="330" y2="300" stroke="#f4fbff" stroke-width="6" stroke-linecap="round"/>
  <circle cx="330" cy="150" r="42" fill="url(#piruleta)"/>
  <path d="M330 150 m0 -30 a30 30 0 1 1 -30 30 a18 18 0 1 1 18 -18" fill="none" stroke="#e8faff" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  <ellipse cx="316" cy="132" rx="8" ry="5" fill="#ffffff" opacity="0.7" transform="rotate(-30 316 132)"/>

  <!-- Destellos -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <line x1="60" y1="150" x2="60" y2="170"/>
    <line x1="50" y1="160" x2="70" y2="160"/>
    <line x1="240" y1="110" x2="240" y2="124"/>
    <line x1="233" y1="117" x2="247" y2="117"/>
  </g>
</svg>