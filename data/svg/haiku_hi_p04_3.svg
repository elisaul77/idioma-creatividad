<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BDE7FF"/>
      <stop offset="100%" stop-color="#FFF1DC"/>
    </linearGradient>
    <linearGradient id="monster" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9B8CFF"/>
      <stop offset="100%" stop-color="#6A5ACD"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9BD67A"/>
      <stop offset="100%" stop-color="#6DB455"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="335" cy="65" r="82" fill="#FFE27A" opacity="0.35"/>
  <circle cx="335" cy="65" r="92" fill="none" stroke="#FFD95A" stroke-width="3" opacity="0.3"/>
  <circle cx="335" cy="65" r="40" fill="#FFD84D"/>

  <!-- Clouds -->
  <g fill="#FFFFFF" opacity="0.9">
    <ellipse cx="80" cy="70" rx="38" ry="18"/>
    <ellipse cx="108" cy="60" rx="30" ry="22"/>
    <ellipse cx="128" cy="74" rx="26" ry="14"/>
    <ellipse cx="220" cy="105" rx="30" ry="14"/>
    <ellipse cx="242" cy="97" rx="22" ry="16"/>
  </g>

  <!-- Distant hills -->
  <path d="M0 240 Q90 180 190 235 T400 220 L400 400 L0 400 Z" fill="#B9E5A0"/>

  <!-- Ground -->
  <path d="M0 300 Q120 275 220 292 T400 285 L400 400 L0 400 Z" fill="url(#ground)"/>

  <!-- Path to door -->
  <path d="M185 400 Q190 340 200 300 Q210 340 220 400 Z" fill="#E8D3A8"/>

  <!-- Tree on the left -->
  <rect x="34" y="235" width="14" height="60" rx="5" fill="#8B5E3C"/>
  <circle cx="41" cy="218" r="34" fill="#4FA85A"/>
  <circle cx="20" cy="232" r="22" fill="#5DBB6A"/>
  <circle cx="62" cy="232" r="22" fill="#5DBB6A"/>

  <!-- House body -->
  <rect x="105" y="190" width="180" height="120" rx="6" fill="#FFB38A"/>
  <rect x="105" y="190" width="180" height="14" fill="#F59A70" opacity="0.6"/>

  <!-- Roof -->
  <polygon points="88,196 195,108 302,196" fill="#E4644F"/>
  <polygon points="195,108 302,196 195,196" fill="#CF523D" opacity="0.5"/>

  <!-- Chimney -->
  <rect x="240" y="122" width="22" height="48" rx="3" fill="#B5584A"/>
  <rect x="236" y="116" width="30" height="10" rx="3" fill="#8F4339"/>
  <!-- Chimney smoke puffs -->
  <circle cx="251" cy="104" r="9" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="262" cy="92" r="7" fill="#FFFFFF" opacity="0.7"/>

  <!-- Round attic window -->
  <circle cx="195" cy="155" r="14" fill="#FFF3B0" stroke="#8F5A3C" stroke-width="4"/>
  <line x1="181" y1="155" x2="209" y2="155" stroke="#8F5A3C" stroke-width="2"/>
  <line x1="195" y1="141" x2="195" y2="169" stroke="#8F5A3C" stroke-width="2"/>

  <!-- Front windows -->
  <rect x="122" y="222" width="42" height="36" rx="5" fill="#FFF3B0" stroke="#8F5A3C" stroke-width="4"/>
  <line x1="143" y1="222" x2="143" y2="258" stroke="#8F5A3C" stroke-width="3"/>
  <line x1="122" y1="240" x2="164" y2="240" stroke="#8F5A3C" stroke-width="3"/>
  <rect x="226" y="222" width="42" height="36" rx="5" fill="#FFF3B0" stroke="#8F5A3C" stroke-width="4"/>
  <line x1="247" y1="222" x2="247" y2="258" stroke="#8F5A3C" stroke-width="3"/>
  <line x1="226" y1="240" x2="268" y2="240" stroke="#8F5A3C" stroke-width="3"/>

  <!-- Arched door -->
  <path d="M182 310 L182 268 Q182 250 200 250 Q218 250 218 268 L218 310 Z" fill="#8B5E3C"/>
  <path d="M190 310 L190 272 Q190 262 200 262 Q210 262 210 272 L210 310 Z" fill="#A8744B"/>
  <circle cx="207" cy="290" r="3" fill="#FFD84D"/>

  <!-- Flower garden -->
  <g>
    <circle cx="80" cy="330" r="6" fill="#FF8FB1"/>
    <circle cx="80" cy="330" r="2.5" fill="#FFF"/>
    <circle cx="100" cy="350" r="6" fill="#FFD84D"/>
    <circle cx="100" cy="350" r="2.5" fill="#FFF"/>
    <circle cx="130" cy="336" r="6" fill="#FF8FB1"/>
    <circle cx="130" cy="336" r="2.5" fill="#FFF"/>
    <circle cx="160" cy="352" r="6" fill="#FFFFFF"/>
    <circle cx="160" cy="352" r="2.5" fill="#FFD84D"/>
    <circle cx="250" cy="346" r="6" fill="#FFD84D"/>
    <circle cx="250" cy="346" r="2.5" fill="#FFF"/>
    <circle cx="275" cy="330" r="6" fill="#FF8FB1"/>
    <circle cx="275" cy="330" r="2.5" fill="#FFF"/>
    <circle cx="300" cy="358" r="6" fill="#FFFFFF"/>
    <circle cx="300" cy="358" r="2.5" fill="#FF8FB1"/>
  </g>
  <g stroke="#4FA85A" stroke-width="2">
    <line x1="80" y1="336" x2="80" y2="390"/>
    <line x1="100" y1="356" x2="100" y2="390"/>
    <line x1="130" y1="342" x2="130" y2="390"/>
    <line x1="160" y1="358" x2="160" y2="390"/>
    <line x1="250" y1="352" x2="250" y2="390"/>
    <line x1="275" y1="336" x2="275" y2="390"/>
    <line x1="300" y1="364" x2="300" y2="390"/>
  </g>

  <!-- Kind monster -->
  <!-- Feet -->
  <ellipse cx="338" cy="366" rx="16" ry="9" fill="#5A4BC4"/>
  <ellipse cx="368" cy="366" rx="16" ry="9" fill="#5A4BC4"/>

  <!-- Body -->
  <ellipse cx="354" cy="310" rx="46" ry="54" fill="url(#monster)"/>

  <!-- Fuzzy tufts -->
  <g fill="#8374F0">
    <circle cx="316" cy="290" r="7"/>
    <circle cx="392" cy="292" r="7"/>
    <circle cx="320" cy="330" r="6"/>
    <circle cx="390" cy="330" r="6"/>
  </g>

  <!-- Belly -->
  <ellipse cx="354" cy="326" rx="26" ry="24" fill="#C9C0FF" opacity="0.7"/>

  <!-- Spots -->
  <circle cx="336" cy="300" r="4" fill="#7B68EE"/>
  <circle cx="372" cy="296" r="3" fill="#7B68EE"/>

  <!-- Horns -->
  <path d="M326 266 Q322 244 336 240 Q334 256 340 266 Z" fill="#FFE27A"/>
  <path d="M382 266 Q386 244 372 240 Q374 256 368 266 Z" fill="#FFE27A"/>

  <!-- Eyes -->
  <ellipse cx="338" cy="292" rx="10" ry="12" fill="#FFFFFF"/>
  <ellipse cx="370" cy="292" rx="10" ry="12" fill="#FFFFFF"/>
  <circle cx="340" cy="294" r="5.5" fill="#2E2466"/>
  <circle cx="372" cy="294" r="5.5" fill="#2E2466"/>
  <circle cx="342" cy="292" r="2" fill="#FFFFFF"/>
  <circle cx="374" cy="292" r="2" fill="#FFFFFF"/>

  <!-- Blush -->
  <ellipse cx="326" cy="312" rx="6" ry="4" fill="#FF8FB1" opacity="0.7"/>
  <ellipse cx="382" cy="312" rx="6" ry="4" fill="#FF8FB1" opacity="0.7"/>

  <!-- Smile -->
  <path d="M337 318 Q354 336 371 318" fill="none" stroke="#2E2466" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Waving arm -->
  <path d="M404 312 Q420 290 404 268" fill="none" stroke="#7B68EE" stroke-width="10" stroke-linecap="round"/>
  <circle cx="402" cy="262" r="9" fill="#7B68EE"/>

  <!-- Other arm holding a flower -->
  <path d="M310 318 Q296 330 300 344" fill="none" stroke="#7B68EE" stroke-width="10" stroke-linecap="round"/>
  <line x1="300" y1="344" x2="296" y2="372" stroke="#4FA85A" stroke-width="2.5"/>
  <circle cx="296" cy="368" r="6" fill="#FF8FB1"/>
  <circle cx="296" cy="368" r="2.5" fill="#FFF"/>

  <!-- Floating hearts -->
  <g fill="#FF6F91">
    <path d="M300 220 c-4 -6 -12 -2 -8 5 l8 7 l8 -7 c4 -7 -4 -11 -8 -5 z" transform="translate(0,0)"/>
    <path d="M360 215 c-3 -5 -10 -2 -7 4 l7 6 l7 -6 c3 -6 -4 -9 -7 -4 z"/>
    <path d="M380 240 c-2 -4 -8 -1 -5 3 l5 5 l5 -5 c3 -4 -3 -7 -5 -3 z"/>
  </g>

  <!-- Sparkles -->
  <g fill="#FFFFFF">
    <path d="M60 180 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3 z" opacity="0.9"/>
    <path d="M360 160 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 z" opacity="0.9"/>
  </g>
</svg>