<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0b3d"/>
      <stop offset="60%" stop-color="#3b1f6e"/>
      <stop offset="100%" stop-color="#e0648a"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7ff5e0"/>
      <stop offset="50%" stop-color="#3fb6c9"/>
      <stop offset="100%" stop-color="#5b3fa8"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd27a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ff7a9e" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff6c2" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fff6c2" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="40" cy="50" r="1.5"/>
    <circle cx="95" cy="28" r="1"/>
    <circle cx="160" cy="60" r="1.2"/>
    <circle cx="310" cy="38" r="1.6"/>
    <circle cx="355" cy="92" r="1"/>
    <circle cx="260" cy="20" r="1"/>
    <circle cx="24" cy="150" r="1"/>
    <circle cx="372" cy="180" r="1.3"/>
    <circle cx="70" cy="200" r="0.9"/>
    <circle cx="340" cy="250" r="1"/>
  </g>

  <!-- Moon-like glow behind creature -->
  <circle cx="200" cy="190" r="120" fill="url(#glow)"/>

  <!-- Feathery tail trailing down-left -->
  <g fill="none" stroke-linecap="round">
    <path d="M190 260 C150 290, 120 300, 70 350" stroke="#7ff5e0" stroke-width="10" opacity="0.5"/>
    <path d="M190 260 C140 285, 100 320, 55 380" stroke="#ffd27a" stroke-width="6" opacity="0.6"/>
    <path d="M190 260 C160 300, 140 330, 115 385" stroke="#ff7a9e" stroke-width="5" opacity="0.6"/>
  </g>

  <!-- Leaf-like wings -->
  <path d="M185 190 C140 110, 60 100, 30 140 C70 150, 90 170, 110 200 C90 205, 70 215, 60 235 C110 230, 150 220, 185 210 Z" fill="url(#wing)" opacity="0.85"/>
  <path d="M215 190 C260 110, 340 100, 370 140 C330 150, 310 170, 290 200 C310 205, 330 215, 340 235 C290 230, 250 220, 215 210 Z" fill="url(#wing)" opacity="0.85"/>
  <g stroke="#fff3d6" stroke-width="1.5" fill="none" opacity="0.7">
    <path d="M185 190 Q120 150 40 140"/>
    <path d="M215 190 Q280 150 360 140"/>
  </g>

  <!-- Body: segmented, coiled torso -->
  <path d="M200 120 C230 120, 245 170, 240 215 C236 255, 220 280, 200 285 C180 280, 164 255, 160 215 C155 170, 170 120, 200 120 Z" fill="url(#body)"/>
  <g fill="#2a1d5c" opacity="0.35">
    <ellipse cx="200" cy="170" rx="22" ry="4"/>
    <ellipse cx="200" cy="200" rx="26" ry="4"/>
    <ellipse cx="200" cy="230" rx="22" ry="4"/>
    <ellipse cx="200" cy="258" rx="16" ry="3"/>
  </g>

  <!-- Spiral markings -->
  <path d="M185 185 Q200 175 215 190 Q205 205 190 200" fill="none" stroke="#fff6c2" stroke-width="2" opacity="0.7"/>

  <!-- Legs: four jointed, fanned -->
  <g stroke="#3fb6c9" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M172 270 L150 300 L140 330"/>
    <path d="M186 282 L176 318 L168 345"/>
    <path d="M214 282 L224 318 L232 345"/>
    <path d="M228 270 L250 300 L260 330"/>
  </g>
  <g fill="#fff6c2">
    <circle cx="140" cy="332" r="4"/>
    <circle cx="168" cy="347" r="4"/>
    <circle cx="232" cy="347" r="4"/>
    <circle cx="260" cy="332" r="4"/>
  </g>

  <!-- Neck and head -->
  <path d="M200 125 C205 105, 195 92, 205 78" stroke="#3fb6c9" stroke-width="16" fill="none" stroke-linecap="round"/>
  <ellipse cx="208" cy="72" rx="20" ry="16" fill="url(#body)"/>

  <!-- Beak-snout -->
  <path d="M224 68 Q242 66 246 74 Q236 78 224 78 Z" fill="#ffd27a"/>

  <!-- Eyes -->
  <circle cx="214" cy="66" r="5" fill="#fff6c2"/>
  <circle cx="215" cy="66" r="2.5" fill="#1a0b3d"/>

  <!-- Crystal antlers -->
  <g fill="#fff6c2" stroke="#ff7a9e" stroke-width="1" opacity="0.95">
    <path d="M198 58 L186 30 L192 28 L202 52 Z"/>
    <path d="M190 40 L176 30 L178 26 L193 36 Z"/>
    <path d="M206 56 L214 26 L220 28 L212 58 Z"/>
    <path d="M214 38 L230 28 L231 32 L217 44 Z"/>
  </g>
  <g fill="#ffffff" opacity="0.8">
    <circle cx="186" cy="30" r="2"/>
    <circle cx="214" cy="26" r="2"/>
    <circle cx="176" cy="26" r="1.5"/>
    <circle cx="231" cy="28" r="1.5"/>
  </g>

  <!-- Ear fins -->
  <path d="M196 74 L180 68 L194 82 Z" fill="#ff7a9e" opacity="0.9"/>

  <!-- Floating particles -->
  <g fill="#fff6c2" filter="url(#soft)">
    <circle cx="120" cy="120" r="2.5"/>
    <circle cx="290" cy="110" r="2"/>
    <circle cx="90" cy="290" r="2"/>
    <circle cx="310" cy="300" r="3"/>
    <circle cx="260" cy="350" r="1.8"/>
    <circle cx="135" cy="60" r="1.6"/>
  </g>

  <!-- Ground mist -->
  <ellipse cx="200" cy="362" rx="150" ry="12" fill="#ffffff" opacity="0.08"/>
</svg>