<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070a1c"/>
      <stop offset="1" stop-color="#1b2552"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff8d6"/>
      <stop offset="0.55" stop-color="#ffd25a"/>
      <stop offset="1" stop-color="#ff8a1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="outerCore" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#ffb84d"/>
      <stop offset="1" stop-color="#c7561c"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff3a0"/>
      <stop offset="0.5" stop-color="#ff8a2a"/>
      <stop offset="1" stop-color="#ff3b1a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fa2b8"/>
      <stop offset="0.5" stop-color="#eef4fa"/>
      <stop offset="1" stop-color="#6f8298"/>
    </linearGradient>
  </defs>

  <!-- Night sky -->
  <rect width="400" height="400" fill="url(#sky)"/>
  <g fill="#ffffff">
    <circle cx="40" cy="36" r="1.5" opacity="0.8"/>
    <circle cx="92" cy="18" r="1" opacity="0.6"/>
    <circle cx="150" cy="44" r="1.2" opacity="0.7"/>
    <circle cx="262" cy="22" r="1.4" opacity="0.8"/>
    <circle cx="330" cy="50" r="1" opacity="0.6"/>
    <circle cx="368" cy="20" r="1.5" opacity="0.9"/>
    <circle cx="20" cy="150" r="1" opacity="0.5"/>
    <circle cx="372" cy="150" r="1.2" opacity="0.6"/>
    <circle cx="60" cy="110" r="1" opacity="0.5"/>
    <circle cx="345" cy="110" r="1" opacity="0.7"/>
  </g>

  <!-- Earth cross-section -->
  <circle cx="200" cy="260" r="190" fill="#7a4c2b"/>
  <circle cx="200" cy="260" r="190" fill="none" stroke="#ffb35c" stroke-width="3" opacity="0.35"/>
  <circle cx="200" cy="260" r="150" fill="#b5552a"/>
  <circle cx="200" cy="260" r="105" fill="url(#outerCore)"/>
  <circle cx="200" cy="260" r="60" fill="#ffd966"/>
  <circle cx="200" cy="260" r="95" fill="url(#coreGlow)" opacity="0.7"/>

  <!-- Rock strata texture -->
  <g fill="#5a3620" opacity="0.35">
    <ellipse cx="110" cy="200" rx="30" ry="8"/>
    <ellipse cx="290" cy="215" rx="26" ry="7"/>
    <ellipse cx="130" cy="320" rx="22" ry="6"/>
    <ellipse cx="275" cy="330" rx="28" ry="8"/>
    <ellipse cx="200" cy="395" rx="40" ry="6"/>
  </g>
  <g fill="#ff9d4a" opacity="0.25">
    <circle cx="150" cy="175" r="5"/>
    <circle cx="255" cy="160" r="4"/>
    <circle cx="90" cy="265" r="4"/>
    <circle cx="315" cy="280" r="5"/>
  </g>

  <!-- Tunnel bored by the vehicle -->
  <path d="M200 70 L200 150" stroke="#2a1a10" stroke-width="16" stroke-linecap="round" opacity="0.55"/>
  <path d="M200 70 L200 150" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.5"/>

  <!-- Vehicle -->
  <g transform="translate(200 105)">
    <!-- Exhaust flame (points upward, thrust drives it down) -->
    <path d="M-9 -16 Q0 -58 0 -62 Q0 -58 9 -16 Z" fill="url(#flame)"/>
    <path d="M-4 -16 Q0 -40 0 -44 Q0 -40 4 -16 Z" fill="#fff8c4" opacity="0.9"/>
    <!-- Capsule hull -->
    <ellipse cx="0" cy="0" rx="28" ry="18" fill="url(#hull)" stroke="#4a5a6e" stroke-width="1.5"/>
    <!-- Band -->
    <path d="M-27 2 Q0 8 27 2" fill="none" stroke="#5b6b80" stroke-width="2"/>
    <!-- Porthole -->
    <circle cx="0" cy="-4" r="7" fill="#1f3c5c" stroke="#5ad1ff" stroke-width="2"/>
    <circle cx="-2" cy="-6" r="2" fill="#dff6ff"/>
    <!-- Side fins -->
    <path d="M-24 6 L-36 14 L-22 14 Z" fill="#7d8ea3"/>
    <path d="M24 6 L36 14 L22 14 Z" fill="#7d8ea3"/>
    <!-- Drill nose -->
    <path d="M-14 16 L14 16 L0 46 Z" fill="#b9c4d1" stroke="#56657a" stroke-width="1.2"/>
    <path d="M-7 24 L7 24 M-10 32 L10 32" stroke="#56657a" stroke-width="1.2" fill="none"/>
    <!-- Heat glow at drill tip -->
    <circle cx="0" cy="46" r="5" fill="#ff7a1a" opacity="0.8"/>
  </g>

  <!-- Speed lines -->
  <g stroke="#ffe6b0" stroke-width="1.5" stroke-linecap="round" opacity="0.45">
    <line x1="168" y1="120" x2="168" y2="140"/>
    <line x1="232" y1="120" x2="232" y2="140"/>
    <line x1="160" y1="140" x2="160" y2="160"/>
    <line x1="240" y1="140" x2="240" y2="160"/>
  </g>
</svg>