    <circle cx="13" cy="-4" r="9" fill="#b388ff"/>
    <circle cx="8" cy="11" r="9" fill="#b388ff"/>
    <circle cx="-8" cy="11" r="9" fill="#b388ff"/>
    <circle cx="-13" cy="-4" r="9" fill="#b388ff"/>
