<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fd3ff"/>
      <stop offset="100%" stop-color="#fff3c4"/>
    </linearGradient>
    <radialGradient id="sol" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fff7a1"/>
      <stop offset="70%" stop-color="#ffd23f"/>
      <stop offset="100%" stop-color="#ffb000"/>
    </radialGradient>
    <linearGradient id="suelo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ed957"/>
      <stop offset="100%" stop-color="#3f9e3a"/>
    </linearGradient>
  </defs>

  <!-- Cielo y suelo -->
  <rect width="400" height="400" fill="url(#cielo)"/>
  <path d="M0 300 Q100 270 200 295 T400 290 L400 400 L0 400 Z" fill="url(#suelo)"/>

  <!-- Rayos del sol -->
