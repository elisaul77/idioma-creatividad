  <path d="M220 0" fill="none"/>
  <path d="M170 140 Q178 128 186 140" fill="none" stroke="#5a3200" stroke-width="5" stroke-linecap="round"/>
  <path d="M214 140 Q222 128 230 140" fill="none" stroke="#5a3200" stroke-width="5" stroke-linecap="round"/>

