  <!-- Corazones -->
  <path d="M90 250 C90 238 75 235 75 247 C75 255 90 265 90 265 C90 265 105 255 105 247 C105 235 90 238 90 250 Z" fill="#ff4d6d"/>
  <path d="M320 230 C320 218 305 215 305 227 C305 235 320 245 320 245 C320 245 335 235 335 227 C335 215 320 218 320 230 Z" fill="#ff4d6d"/>
  <path d="M290 275 C290 266 279 264 279 272 C279 278 290 285 290 285 C290 285 301 278 301 272 C301 264 290 266 290 275 Z" fill="#ff8fa3"/>

  <!-- Flores -->
  <g transform="translate(60 330)">
