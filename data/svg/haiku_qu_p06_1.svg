    <circle cx="0" cy="-14" r="9" fill="#ff6b9a"/>
    <circle cx="13" cy="-4" r="9" fill="#ff6b9a"/>
    <circle cx="8" cy="11" r="9" fill="#ff6b9a"/>
    <circle cx="-8" cy="11" r="9" fill="#ff6b9a"/>
    <circle cx="-13" cy="-4" r="9" fill="#ff6b9a"/>
