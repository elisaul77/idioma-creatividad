<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b24"/>
      <stop offset="1" stop-color="#2b0f3d"/>
    </linearGradient>
    <radialGradient id="aura" cx="200" cy="190" r="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3ff2e0" stop-opacity="0.40"/>
      <stop offset="0.6" stop-color="#7a5cff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#7a5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trunk" x1="200" y1="360" x2="200" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c6fb8"/>
      <stop offset="0.6" stop-color="#2fd6ec"/>
      <stop offset="1" stop-color="#9dfff0"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8be0"/>
      <stop offset="1" stop-color="#6ef5ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="400" height="400" fill="url(#bg)"/>
  <circle cx="200" cy="190" r="170" fill="url(#aura)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="40" cy="50" r="1.5" opacity="0.8"/>
    <circle cx="90" cy="25" r="1" opacity="0.6"/>
    <circle cx="350" cy="40" r="1.8" opacity="0.9"/>
    <circle cx="320" cy="90" r="1" opacity="0.5"/>
    <circle cx="55" cy="130" r="1.2" opacity="0.6"/>
    <circle cx="370" cy="170" r="1.4" opacity="0.7"/>
    <circle cx="30" cy="220" r="1" opacity="0.5"/>
    <circle cx="345" cy="260" r="1.2" opacity="0.6"/>
  </g>

  <!-- ground -->
  <ellipse cx="200" cy="362" rx="130" ry="16" fill="#3ff2e0" opacity="0.25" filter="url(#glow)"/>
  <ellipse cx="200" cy="362" rx="90" ry="7" fill="none" stroke="#7cffea" stroke-width="1.5" opacity="0.6"/>

  <!-- trunk -->
  <path d="M200 360 C196 320 204 290 200 250 C197 220 203 200 200 170 L200 110"
        fill="none" stroke="url(#trunk)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>

  <!-- circuit branches -->
  <g fill="none" stroke="#7cffea" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" opacity="0.9">
    <path d="M200 230 H160 V190 H130 V150"/>
    <path d="M200 210 H240 V170 H275 V130"/>
    <path d="M200 150 H180 V110 H180 V70"/>
    <path d="M175 285 H130 V250 H95"/>
    <path d="M200 275 H250 V245 H300 V215"/>
  </g>

  <!-- nodes -->
  <g fill="#0a0f2c" stroke="#9dfff0" stroke-width="1.8">
    <circle cx="160" cy="190" r="3.5"/>
    <circle cx="130" cy="150" r="3.5"/>
    <circle cx="240" cy="170" r="3.5"/>
    <circle cx="275" cy="130" r="3.5"/>
    <circle cx="180" cy="110" r="3.5"/>
    <circle cx="180" cy="70" r="3.5"/>
    <circle cx="130" cy="250" r="3.5"/>
    <circle cx="95" cy="250" r="3.5"/>
    <circle cx="250" cy="245" r="3.5"/>
    <circle cx="300" cy="215" r="3.5"/>
  </g>

  <!-- crystal leaves -->
  <g filter="url(#glow)">
    <g transform="translate(130 150) rotate(-20)"><path d="M0 -14 L8 0 L0 14 L-8 0Z" fill="url(#leaf)"/></g>
    <g transform="translate(275 130) rotate(15)"><path d="M0 -14 L8 0 L0 14 L-8 0Z" fill="url(#leaf)"/></g>
    <g transform="translate(180 70) rotate(0)"><path d="M0 -16 L9 0 L0 16 L-9 0Z" fill="url(#leaf)"/></g>
    <g transform="translate(95 250) rotate(-30)"><path d="M0 -11 L7 0 L0 11 L-7 0Z" fill="url(#leaf)"/></g>
    <g transform="translate(300 215) rotate(25)"><path d="M0 -11 L7 0 L0 11 L-7 0Z" fill="url(#leaf)"/></g>
    <g transform="translate(160 110) rotate(40)"><path d="M0 -9 L6 0 L0 9 L-6 0Z" fill="url(#leaf)" opacity="0.85"/></g>
    <g transform="translate(205 95) rotate(-35)"><path d="M0 -9 L6 0 L0 9 L-6 0Z" fill="url(#leaf)" opacity="0.85"/></g>
    <g transform="translate(115 185) rotate(10)"><path d="M0 -8 L6 0 L0 8 L-6 0Z" fill="url(#leaf)" opacity="0.8"/></g>
    <g transform="translate(262 175) rotate(-10)"><path d="M0 -8 L6 0 L0 8 L-6 0Z" fill="url(#leaf)" opacity="0.8"/></g>
    <g transform="translate(140 240) rotate(30)"><path d="M0 -7 L5 0 L0 7 L-5 0Z" fill="url(#leaf)" opacity="0.75"/></g>
    <g transform="translate(320 250) rotate(-20)"><path d="M0 -7 L5 0 L0 7 L-5 0Z" fill="url(#leaf)" opacity="0.75"/></g>
    <g transform="translate(220 55) rotate(20)"><path d="M0 -7 L5 0 L0 7 L-5 0Z" fill="url(#leaf)" opacity="0.7"/></g>
  </g>

  <!-- floating light particles -->
  <g fill="#ffe27a" filter="url(#glow)">
    <circle cx="105" cy="120" r="2"/>
    <circle cx="300" cy="170" r="2.2"/>
    <circle cx="150" cy="40" r="1.6"/>
    <circle cx="250" cy="60" r="1.8"/>
    <circle cx="70" cy="290" r="1.8"/>
    <circle cx="330" cy="300" r="2"/>
    <circle cx="255" cy="320" r="1.5"/>
    <circle cx="140" cy="320" r="1.6"/>
  </g>
</svg>