<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#FFF6C9"/>
      <stop offset="60%" stop-color="#FFD76A"/>
      <stop offset="100%" stop-color="#FF9F5A"/>
    </radialGradient>
    <radialGradient id="sun" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFBE8"/>
      <stop offset="70%" stop-color="#FFE14D"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </radialGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- Sunburst rays -->
  <g transform="translate(200 200)" fill="url(#ray)" opacity="0.55">
    <path d="M-12 0 L12 0 L0 -190 Z" transform="rotate(0)"/>
    <path d="M-12 0 L12 0 L0 -190 Z" transform="rotate(30)"/>
    <path d="M-12 0 L12 0 L0 -190 Z" transform="rotate(60)"/>
    <path d="M-12 0 L12 0 L0 -190 Z" transform="rotate(90)"/>
    <path d="M-12 0 L12 0 L0 -190 Z" transform="rotate(120)"/>
    <path d="M-12 0 L12 0 L0 -190 Z" transform="rotate(150)"/>
    <path d="M-12 0 L12 0 L0 -190 Z" transform="rotate(180)"/>
    <path d="M-12 0 L12 0 L0 -190 Z" transform="rotate(210)"/>
    <path d="M-12 0 L12 0 L0 -190 Z" transform="rotate(240)"/>
    <path d="M-12 0 L12 0 L0 -190 Z" transform="rotate(270)"/>
    <path d="M-12 0 L12 0 L0 -190 Z" transform="rotate(300)"/>
    <path d="M-12 0 L12 0 L0 -190 Z" transform="rotate(330)"/>
  </g>

  <!-- Sun body -->
  <circle cx="200" cy="200" r="120" fill="url(#sun)"/>
  <circle cx="200" cy="200" r="120" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="4"/>

  <!-- Rosy cheeks -->
  <ellipse cx="160" cy="230" rx="16" ry="10" fill="#FF7F7F" opacity="0.6"/>
  <ellipse cx="240" cy="230" rx="16" ry="10" fill="#FF7F7F" opacity="0.6"/>

  <!-- Joyful eyes (upturned arcs) -->
  <path d="M258 180 Q 170 150 146 185" fill="none" stroke="#7A4A00" stroke-width="0" />
  <path d="M142 186 Q158 160 174 186" fill="none" stroke="#7A4A00" stroke-width="7" stroke-linecap="round"/>
  <path d="M226 186 Q242 160 258 186" fill="none" stroke="#7A4A00" stroke-width="7" stroke-linecap="round"/>

  <!-- Big smile -->
  <path d="M150 215 Q200 275 250 215 Q200 250 150 215 Z" fill="#8B3A00"/>
  <path d="M160 222 Q200 262 240 222 Q200 240 160 222 Z" fill="#FFFFFF" opacity="0.9"/>

  <!-- Sparkles -->
  <g fill="#FFFFFF">
    <path d="M70 90 L76 104 L90 110 L76 116 L70 130 L64 116 L50 110 L64 104 Z"/>
    <path d="M330 300 L335 311 L346 316 L335 321 L330 332 L325 321 L314 316 L325 311 Z"/>
    <path d="M330 70 L333 77 L340 80 L333 83 L330 90 L327 83 L320 80 L327 77 Z"/>
  </g>

  <!-- Confetti dots -->
  <circle cx="90" cy="320" r="7" fill="#FF5E7E"/>
  <circle cx="110" cy="345" r="5" fill="#3EC1D3"/>
  <circle cx="300" cy="120" r="6" fill="#8E6CFF"/>
  <circle cx="60" cy="210" r="5" fill="#3EC1D3"/>
  <circle cx="340" cy="210" r="7" fill="#FF5E7E"/>
  <circle cx="280" cy="365" r="5" fill="#8E6CFF"/>
</svg>