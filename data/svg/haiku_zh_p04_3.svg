<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe6ff"/>
      <stop offset="0.6" stop-color="#ffe9c7"/>
      <stop offset="1" stop-color="#ffd1b8"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="330" cy="85" r="50" fill="#fff0a6" opacity="0.35"/>
  <circle cx="330" cy="85" r="34" fill="#fff0a6"/>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="80" cy="80" rx="30" ry="14"/>
    <ellipse cx="100" cy="72" rx="22" ry="16"/>
    <ellipse cx="60" cy="88" rx="22" ry="12"/>
    <ellipse cx="220" cy="60" rx="24" ry="11"/>
    <ellipse cx="238" cy="54" rx="16" ry="12"/>
  </g>

  <!-- Hills -->
  <path d="M0 230 Q100 180 200 215 T400 200 V400 H0Z" fill="#a8d88f"/>
  <path d="M0 290 Q120 250 220 285 T400 275 V400 H0Z" fill="#7cc06e"/>

  <!-- Tree -->
  <rect x="44" y="270" width="12" height="60" rx="4" fill="#9a6b4f"/>
  <circle cx="50" cy="250" r="30" fill="#5fb17a"/>
  <circle cx="30" cy="265" r="22" fill="#5fb17a"/>
  <circle cx="70" cy="265" r="22" fill="#5fb17a"/>

  <!-- Path -->
  <polygon points="178,318 202,318 244,400 136,400" fill="#f3dcaa"/>

  <!-- House body -->
  <rect x="120" y="205" width="140" height="105" fill="#f7d08a"/>
  <!-- Chimney -->
  <rect x="215" y="150" width="20" height="40" fill="#b5654f"/>
  <!-- Roof -->
  <path d="M100 212 L190 135 L280 212 Z" fill="#d9775f"/>

  <!-- Smoke -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="225" cy="135" r="8"/>
    <circle cx="233" cy="118" r="11"/>
    <circle cx="222" cy="100" r="7"/>
  </g>

  <!-- Windows -->
  <circle cx="150" cy="235" r="13" fill="#fff3c4" stroke="#8a5a3c" stroke-width="4"/>
  <line x1="137" y1="235" x2="163" y2="235" stroke="#8a5a3c" stroke-width="2"/>
  <line x1="150" y1="222" x2="150" y2="248" stroke="#8a5a3c" stroke-width="2"/>
  <circle cx="230" cy="235" r="13" fill="#fff3c4" stroke="#8a5a3c" stroke-width="4"/>
  <line x1="217" y1="235" x2="243" y2="235" stroke="#8a5a3c" stroke-width="2"/>
  <line x1="230" y1="222" x2="230" y2="248" stroke="#8a5a3c" stroke-width="2"/>

  <!-- Door -->
  <path d="M172 310 V270 Q190 250 208 270 V310 Z" fill="#8a5a3c"/>
  <circle cx="202" cy="292" r="2.5" fill="#ffd166"/>
  <!-- Step -->
  <rect x="165" y="310" width="50" height="8" rx="3" fill="#c79b6b"/>

  <!-- Flowers -->
  <g>
    <circle cx="60" cy="350" r="5" fill="#ff8fab"/>
    <circle cx="60" cy="350" r="2" fill="#fff"/>
    <circle cx="90" cy="372" r="5" fill="#ffd166"/>
    <circle cx="90" cy="372" r="2" fill="#fff"/>
    <circle cx="150" cy="362" r="5" fill="#ffd166"/>
    <circle cx="150" cy="362" r="2" fill="#fff"/>
    <circle cx="280" cy="372" r="5" fill="#ff8fab"/>
    <circle cx="280" cy="372" r="2" fill="#fff"/>
    <circle cx="360" cy="365" r="5" fill="#c7a6ff"/>
    <circle cx="360" cy="365" r="2" fill="#fff"/>
  </g>

  <!-- Friendly monster -->
  <!-- Waving arm and other arm -->
  <path d="M362 290 Q384 268 380 245" stroke="#8fd3c8" stroke-width="12" fill="none" stroke-linecap="round"/>
  <circle cx="380" cy="240" r="9" fill="#8fd3c8"/>
  <path d="M280 300 Q262 312 268 326" stroke="#8fd3c8" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- Feet -->
  <ellipse cx="302" cy="336" rx="12" ry="7" fill="#6fb8ad"/>
  <ellipse cx="338" cy="336" rx="12" ry="7" fill="#6fb8ad"/>
  <!-- Horns -->
  <path d="M292 255 L286 232 L304 248 Z" fill="#ffe08a"/>
  <path d="M348 255 L354 232 L336 248 Z" fill="#ffe08a"/>
  <!-- Body -->
  <ellipse cx="320" cy="290" rx="42" ry="46" fill="#8fd3c8"/>
  <ellipse cx="320" cy="300" rx="24" ry="26" fill="#c6f0e8"/>
  <circle cx="300" cy="312" r="4" fill="#7bc4b9"/>
  <circle cx="342" cy="322" r="3" fill="#7bc4b9"/>
  <!-- Eyes -->
  <circle cx="305" cy="280" r="10" fill="#ffffff"/>
  <circle cx="335" cy="280" r="10" fill="#ffffff"/>
  <circle cx="307" cy="282" r="5" fill="#2b2d42"/>
  <circle cx="337" cy="282" r="5" fill="#2b2d42"/>
  <circle cx="309" cy="279" r="2" fill="#ffffff"/>
  <circle cx="339" cy="279" r="2" fill="#ffffff"/>
  <!-- Cheeks -->
  <ellipse cx="292" cy="297" rx="7" ry="4" fill="#ff9eb5" opacity="0.7"/>
  <ellipse cx="348" cy="297" rx="7" ry="4" fill="#ff9eb5" opacity="0.7"/>
  <!-- Smile -->
  <path d="M308 302 Q320 314 332 302" stroke="#2b2d42" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Hearts -->
  <path d="M0 6 C-10 -2 -5 -10 0 -4 C5 -10 10 -2 0 6Z" transform="translate(360,215) scale(1.4)" fill="#ff7a96"/>
  <path d="M0 6 C-10 -2 -5 -10 0 -4 C5 -10 10 -2 0 6Z" transform="translate(388,190) scale(0.9)" fill="#ff7a96"/>
  <path d="M0 6 C-10 -2 -5 -10 0 -4 C5 -10 10 -2 0 6Z" transform="translate(262,184) scale(0.8)" fill="#ff9eb5"/>
</svg>