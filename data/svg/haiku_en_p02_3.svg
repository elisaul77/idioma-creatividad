<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="sky" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#3b2a7a"/>
      <stop offset="55%" stop-color="#1c1450"/>
      <stop offset="100%" stop-color="#0a0824"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd6f5" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#b68cff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#b68cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7ff3ff"/>
      <stop offset="50%" stop-color="#ff8ad8"/>
      <stop offset="100%" stop-color="#ffe27a"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="haze" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="frame">
      <rect width="400" height="400" rx="0"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Night sky -->
    <rect width="400" height="400" fill="url(#sky)"/>

    <!-- Nebula haze -->
    <ellipse cx="120" cy="110" rx="110" ry="60" fill="#ff7ad9" opacity="0.25" filter="url(#haze)"/>
    <ellipse cx="300" cy="290" rx="120" ry="70" fill="#5fe0ff" opacity="0.22" filter="url(#haze)"/>
    <ellipse cx="260" cy="90" rx="80" ry="50" fill="#ffd27a" opacity="0.18" filter="url(#haze)"/>

    <!-- Central glowing core -->
    <circle cx="200" cy="200" r="120" fill="url(#glow)"/>

    <!-- Swirling ribbons of dream -->
    <g fill="none" stroke-linecap="round">
      <path d="M40 260 C 90 180, 150 330, 200 230 S 310 120, 370 190"
            stroke="url(#ribbon)" stroke-width="10" opacity="0.5" filter="url(#soft)"/>
      <path d="M40 260 C 90 180, 150 330, 200 230 S 310 120, 370 190"
            stroke="url(#ribbon)" stroke-width="3" opacity="0.95"/>
      <path d="M60 130 C 140 60, 220 150, 260 110 S 340 50, 360 120"
            stroke="#c9b6ff" stroke-width="2.5" opacity="0.7"/>
      <path d="M30 330 C 110 290, 170 380, 260 340 S 350 300, 390 330"
            stroke="#ff9ee6" stroke-width="2" opacity="0.6"/>
    </g>

    <!-- Floating bubbles -->
    <g fill="url(#bubble)" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1">
      <circle cx="90" cy="180" r="18"/>
      <circle cx="320" cy="160" r="26"/>
      <circle cx="285" cy="265" r="12"/>
      <circle cx="140" cy="300" r="22"/>
      <circle cx="210" cy="95" r="9"/>
      <circle cx="350" cy="235" r="8"/>
      <circle cx="60" cy="90" r="11"/>
    </g>

    <!-- Crescent moon -->
    <circle cx="200" cy="150" r="34" fill="#fff6d8"/>
    <circle cx="214" cy="140" r="30" fill="#2a1d6b"/>
    <circle cx="200" cy="150" r="60" fill="#fff6d8" opacity="0.12" filter="url(#soft)"/>

    <!-- Sparkle stars -->
    <g fill="#ffffff">
      <path d="M70 60 L73 68 L81 71 L73 74 L70 82 L67 74 L59 71 L67 68 Z" opacity="0.95"/>
      <path d="M335 45 L337 51 L343 53 L337 55 L335 61 L333 55 L327 53 L333 51 Z" opacity="0.9"/>
      <path d="M180 330 L182 336 L188 338 L182 340 L180 346 L178 340 L172 338 L178 336 Z" opacity="0.85"/>
      <path d="M365 340 L366 344 L370 345 L366 346 L365 350 L364 346 L360 345 L364 344 Z" opacity="0.8"/>
    </g>

    <!-- Tiny stars -->
    <g fill="#ffffff" opacity="0.8">
      <circle cx="25" cy="30" r="1.5"/>
      <circle cx="150" cy="25" r="1.2"/>
      <circle cx="240" cy="30" r="1.6"/>
      <circle cx="30" cy="200" r="1.3"/>
      <circle cx="380" cy="380" r="1.4"/>
      <circle cx="120" cy="385" r="1.2"/>
      <circle cx="260" cy="385" r="1.5"/>
      <circle cx="385" cy="260" r="1.3"/>
      <circle cx="15" cy="370" r="1.2"/>
    </g>

    <!-- Drifting dream particles -->
    <g fill="#ffd6f5" opacity="0.6">
      <circle cx="170" cy="260" r="2.5"/>
      <circle cx="230" cy="290" r="2"/>
      <circle cx="195" cy="310" r="3"/>
      <circle cx="265" cy="215" r="2"/>
      <circle cx="125" cy="215" r="2.2"/>
    </g>
  </g>
</svg>