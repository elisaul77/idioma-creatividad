<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fd3ff"/>
      <stop offset="100%" stop-color="#ffe9a8"/>
    </linearGradient>
    <radialGradient id="sol" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6a0"/>
      <stop offset="70%" stop-color="#ffc83d"/>
      <stop offset="100%" stop-color="#ffb020"/>
    </radialGradient>
    <linearGradient id="colina" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ed957"/>
      <stop offset="100%" stop-color="#3fa34d"/>
    </linearGradient>
  </defs>

  <!-- Cielo -->
  <rect width="400" height="400" fill="url(#cielo)"/>

  <!-- Nubes -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="70" cy="80" rx="34" ry="16"/>
    <ellipse cx="95" cy="72" rx="26" ry="18"/>
    <ellipse cx="50" cy="74" rx="20" ry="12"/>
    <ellipse cx="330" cy="120" rx="30" ry="14"/>
    <ellipse cx="352" cy="112" rx="22" ry="16"/>
  </g>

  <!-- Rayos del sol -->
  <g stroke="#ffb020" stroke-width="8" stroke-linecap="round">
    <line x1="200" y1="70" x2="200" y2="40"/>
    <line x1="200" y1="210" x2="200" y2="240" opacity="0"/>
    <line x1="120" y1="110" x2="100" y2="90"/>
    <line x1="280" y1="110" x2="300" y2="90"/>
    <line x1="260" y1="170" x2="282" y2="160"/>
    <line x1="140" y1="170" x2="118" y2="160"/>
    <line x1="106" y1="150" x2="84" y2="150"/>
    <line x1="294" y1="150" x2="316" y2="150"/>
  </g>

  <!-- Sol -->
  <circle cx="200" cy="150" r="58" fill="url(#sol)"/>
  <!-- Mejillas -->
  <circle cx="180" cy="165" r="7" fill="#ff8fa3" opacity="0.7"/>
  <circle cx="220" cy="165" r="7" fill="#ff8fa3" opacity="0.7"/>
  <!-- Ojos sonrientes -->
  <path d="M180 140 Q186 130 192 140" fill="none" stroke="#5a3200" stroke-width="4" stroke-linecap="round"/>
  <path d="M208 140 Q214 130 220 140" fill="none" stroke="#5a3200" stroke-width="4" stroke-linecap="round"/>
  <!-- Sonrisa -->
  <path d="M178 158 Q200 184 222 158" fill="none" stroke="#5a3200" stroke-width="4" stroke-linecap="round"/>

  <!-- Pájaros -->
  <g fill="none" stroke="#2b4a6f" stroke-width="3" stroke-linecap="round">
    <path d="M300 60 Q308 52 316 60 Q324 52 332 60"/>
    <path d="M345 90 Q351 84 357 90 Q363 84 369 90"/>
  </g>

  <!-- Colina -->
  <path d="M0 280 Q100 230 200 265 Q300 235 400 275 L400 400 L0 400 Z" fill="url(#colina)"/>

  <!-- Flores -->
  <g>
    <g transform="translate(70 320)">
      <line x1="0" y1="0" x2="0" y2="40" stroke="#2e7d32" stroke-width="4"/>
      <circle cx="0" cy="-8" r="8" fill="#ff6f91"/>
      <circle cx="8" cy="0" r="8" fill="#ff6f91"/>
      <circle cx="-8" cy="0" r="8" fill="#ff6f91"/>
      <circle cx="0" cy="8" r="8" fill="#ff6f91"/>
      <circle cx="0" cy="0" r="5" fill="#ffd54f"/>
    </g>
    <g transform="translate(140 340)">
      <line x1="0" y1="0" x2="0" y2="36" stroke="#2e7d32" stroke-width="4"/>
      <circle cx="0" cy="-8" r="8" fill="#ffd54f"/>
      <circle cx="8" cy="0" r="8" fill="#ffd54f"/>
      <circle cx="-8" cy="0" r="8" fill="#ffd54f"/>
      <circle cx="0" cy="8" r="8" fill="#ffd54f"/>
      <circle cx="0" cy="0" r="5" fill="#ff8f00"/>
    </g>
    <g transform="translate(270 325)">
      <line x1="0" y1="0" x2="0" y2="38" stroke="#2e7d32" stroke-width="4"/>
      <circle cx="0" cy="-8" r="8" fill="#b388ff"/>
      <circle cx="8" cy="0" r="8" fill="#b388ff"/>
      <circle cx="-8" cy="0" r="8" fill="#b388ff"/>
      <circle cx="0" cy="8" r="8" fill="#b388ff"/>
      <circle cx="0" cy="0" r="5" fill="#ffd54f"/>
    </g>
    <g transform="translate(335 348)">
      <line x1="0" y1="0" x2="0" y2="30" stroke="#2e7d32" stroke-width="4"/>
      <circle cx="0" cy="-7" r="7" fill="#ff6f91"/>
      <circle cx="7" cy="0" r="7" fill="#ff6f91"/>
      <circle cx="-7" cy="0" r="7" fill="#ff6f91"/>
      <circle cx="0" cy="7" r="7" fill="#ff6f91"/>
      <circle cx="0" cy="0" r="4" fill="#ffd54f"/>
    </g>
  </g>
</svg>