<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="canvasBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf4e4"/>
      <stop offset="1" stop-color="#eedcc0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8e7" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff8e7" stop-opacity="0"/>
    </radialGradient>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- キャンバス -->
  <rect width="400" height="400" fill="url(#canvasBg)"/>
  <rect width="400" height="400" fill="url(#glow)" opacity="0.7"/>

  <!-- 紙のざらつき -->
  <g fill="#c9a77c" opacity="0.12">
    <circle cx="45" cy="35" r="2"/><circle cx="130" cy="18" r="1.5"/><circle cx="260" cy="30" r="2"/>
    <circle cx="350" cy="55" r="1.5"/><circle cx="25" cy="180" r="1.5"/><circle cx="380" cy="200" r="2"/>
    <circle cx="95" cy="380" r="1.5"/><circle cx="300" cy="385" r="2"/><circle cx="200" cy="10" r="1.5"/>
  </g>

  <!-- 五線（筆のかすれで描かれた線） -->
  <g fill="none" stroke="#3d405b" stroke-width="2" stroke-linecap="round" opacity="0.55" filter="url(#rough)">
    <path d="M30 150 Q200 140 370 150"/>
    <path d="M30 166 Q200 157 370 166"/>
    <path d="M30 182 Q200 174 370 182"/>
    <path d="M30 198 Q200 190 370 198"/>
    <path d="M30 214 Q200 206 370 214"/>
  </g>

  <!-- 絵の具の筆致（うねる色の流れ） -->
  <g fill="none" stroke-linecap="round" filter="url(#rough)">
    <path d="M30 300 C90 230 150 340 210 280 S320 220 375 262" stroke="#e76f51" stroke-width="26" opacity="0.8"/>
    <path d="M18 335 C100 292 160 372 232 322 S340 302 388 332" stroke="#2a9d8f" stroke-width="18" opacity="0.8"/>
    <path d="M48 92 C120 62 182 122 252 82 S352 72 382 102" stroke="#e9c46a" stroke-width="20" opacity="0.85"/>
    <path d="M140 60 C170 110 120 150 165 230" stroke="#8ecae6" stroke-width="12" opacity="0.7"/>
    <path d="M260 330 C300 290 340 350 372 300" stroke="#f4a261" stroke-width="14" opacity="0.75"/>
  </g>

  <!-- 音符（絵の具からにじみ出る） -->
  <g filter="url(#soft)">
    <!-- 単独の音符 -->
    <g fill="#264653">
      <ellipse cx="110" cy="200" rx="10" ry="7.5" transform="rotate(-20 110 200)"/>
    </g>
    <path d="M119 200 L119 150 C135 160 137 175 124 186" fill="none" stroke="#264653" stroke-width="3" stroke-linecap="round"/>

    <!-- 連桁の二音 -->
    <g fill="#e76f51">
      <ellipse cx="210" cy="192" rx="10" ry="7.5" transform="rotate(-20 210 192)"/>
      <ellipse cx="262" cy="178" rx="10" ry="7.5" transform="rotate(-20 262 178)"/>
    </g>
    <path d="M219 192 L219 130 M271 178 L271 116" fill="none" stroke="#e76f51" stroke-width="3" stroke-linecap="round"/>
    <path d="M219 130 L271 116 L271 124 L219 138 Z" fill="#e76f51"/>

    <!-- 高い位置の音符 -->
    <g fill="#2a9d8f">
      <ellipse cx="320" cy="236" rx="9" ry="6.5" transform="rotate(-20 320 236)"/>
    </g>
    <path d="M328 236 L328 186 C342 196 344 210 332 222" fill="none" stroke="#2a9d8f" stroke-width="2.5" stroke-linecap="round"/>

    <!-- 小さな音符 -->
    <g fill="#f4a261">
      <ellipse cx="70" cy="252" rx="7" ry="5" transform="rotate(-20 70 252)"/>
    </g>
    <path d="M76 252 L76 226" fill="none" stroke="#f4a261" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 音の広がり（弧） -->
  <g fill="none" stroke="#3d405b" stroke-width="2" stroke-linecap="round" opacity="0.35">
    <path d="M300 150 Q315 165 300 180"/>
    <path d="M310 140 Q332 165 310 190"/>
    <path d="M320 130 Q350 165 320 200"/>
  </g>

  <!-- 絵の具のしぶき -->
  <g opacity="0.8">
    <circle cx="60" cy="60" r="6" fill="#e76f51"/>
    <circle cx="340" cy="340" r="9" fill="#2a9d8f"/>
    <circle cx="182" cy="362" r="5" fill="#e9c46a"/>
    <circle cx="300" cy="60" r="4" fill="#8ecae6"/>
    <circle cx="36" cy="120" r="3.5" fill="#f4a261"/>
    <circle cx="368" cy="160" r="4.5" fill="#264653" opacity="0.6"/>
    <circle cx="150" cy="30" r="3" fill="#2a9d8f"/>
  </g>

  <!-- 額縁の縁 -->
  <rect x="6" y="6" width="388" height="388" fill="none" stroke="#b08a5a" stroke-width="6" opacity="0.6" filter="url(#rough)"/>
</svg>