<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1a33"/>
      <stop offset="1" stop-color="#1c56a0"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ee0ff"/>
      <stop offset="0.5" stop-color="#2f86ea"/>
      <stop offset="1" stop-color="#123c9e"/>
    </linearGradient>
    <radialGradient id="drop" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#f0fbff"/>
      <stop offset="0.35" stop-color="#5ec4ff"/>
      <stop offset="1" stop-color="#0b3a8f"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7fd0ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7fd0ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cup">
      <path d="M125 150 L275 150 L252 330 Q250 344 236 344 L164 344 Q150 344 148 330 Z"/>
    </clipPath>
  </defs>

  <!-- background -->
  <rect width="400" height="400" fill="url(#bg)"/>
  <circle cx="200" cy="210" r="170" fill="url(#glow)"/>

  <!-- soft light rays -->
  <g fill="#9fdcff" opacity="0.06">
    <path d="M200 0 L230 0 L120 400 L80 400 Z"/>
    <path d="M280 0 L300 0 L210 400 L190 400 Z"/>
  </g>

  <!-- liquid inside cup -->
  <g clip-path="url(#cup)">
    <path d="M110 190 Q150 174 190 190 T270 190 T330 190 L330 360 L110 360 Z" fill="url(#liquid)"/>
    <path d="M110 190 Q150 174 190 190 T270 190 T330 190" fill="none" stroke="#dff6ff" stroke-width="3" opacity="0.7"/>
    <ellipse cx="170" cy="250" rx="14" ry="6" fill="#ffffff" opacity="0.18"/>
    <ellipse cx="225" cy="290" rx="8" ry="4" fill="#ffffff" opacity="0.15"/>
  </g>

  <!-- rising bubbles inside liquid -->
  <g fill="none" stroke="#cdeeff" stroke-width="2" opacity="0.65">
    <circle cx="185" cy="270" r="5"/>
    <circle cx="205" cy="232" r="3.5"/>
    <circle cx="176" cy="210" r="4"/>
    <circle cx="222" cy="312" r="6"/>
  </g>

  <!-- cup body -->
  <path d="M125 150 L275 150 L252 330 Q250 344 236 344 L164 344 Q150 344 148 330 Z"
        fill="#ffffff" fill-opacity="0.08" stroke="#bfe9ff" stroke-width="4" stroke-linejoin="round"/>
  <!-- cup highlight -->
  <path d="M142 170 L152 318" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.35"/>
  <!-- cup rim -->
  <ellipse cx="200" cy="150" rx="75" ry="7" fill="none" stroke="#dff6ff" stroke-width="3" opacity="0.8"/>

  <!-- falling droplets -->
  <g>
    <path d="M200 40 C192 58 186 66 186 78 A14 14 0 0 0 214 78 C214 66 208 58 200 40 Z" fill="url(#drop)"/>
    <path d="M140 80 C134 94 131 99 131 107 A9 9 0 0 0 149 107 C149 99 146 94 140 80 Z" fill="url(#drop)" opacity="0.9"/>
    <path d="M262 92 C256 106 253 112 253 119 A9 9 0 0 0 271 119 C271 112 268 106 262 92 Z" fill="url(#drop)" opacity="0.9"/>
    <path d="M300 54 C296 64 294 68 294 74 A6 6 0 0 0 306 74 C306 68 304 64 300 54 Z" fill="url(#drop)" opacity="0.75"/>
    <path d="M96 126 C93 133 91 137 91 141 A5 5 0 0 0 101 141 C101 137 99 133 96 126 Z" fill="url(#drop)" opacity="0.7"/>
  </g>

  <!-- sparkles -->
  <g fill="#e6f7ff">
    <path d="M330 150 L333 160 L343 163 L333 166 L330 176 L327 166 L317 163 L327 160 Z" opacity="0.9"/>
    <path d="M70 230 L72 236 L78 238 L72 240 L70 246 L68 240 L62 238 L68 236 Z" opacity="0.8"/>
    <path d="M320 300 L322 305 L327 307 L322 309 L320 314 L318 309 L313 307 L318 305 Z" opacity="0.7"/>
  </g>

  <!-- small floating dots -->
  <g fill="#bfeaff" opacity="0.5">
    <circle cx="80" cy="90" r="2.5"/>
    <circle cx="350" cy="230" r="2"/>
    <circle cx="110" cy="330" r="3"/>
    <circle cx="300" cy="370" r="2"/>
  </g>
</svg>