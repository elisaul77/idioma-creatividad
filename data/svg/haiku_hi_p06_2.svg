<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="sky" cx="50%" cy="60%" r="75%">
      <stop offset="0%" stop-color="#FFF6C2"/>
      <stop offset="45%" stop-color="#FFD27A"/>
      <stop offset="100%" stop-color="#FF8A65"/>
    </radialGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FFF176"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFCCBC"/>
      <stop offset="100%" stop-color="#F06292"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- Soft glow -->
  <circle cx="200" cy="200" r="180" fill="url(#glow)"/>

  <!-- Rays -->
  <g stroke="#FFF3C4" stroke-width="6" stroke-linecap="round" opacity="0.7">
    <line x1="200" y1="60" x2="200" y2="20"/>
    <line x1="200" y1="340" x2="200" y2="380"/>
    <line x1="60" y1="200" x2="20" y2="200"/>
    <line x1="340" y1="200" x2="380" y2="200"/>
    <line x1="107" y1="107" x2="78" y2="78"/>
    <line x1="293" y1="107" x2="322" y2="78"/>
    <line x1="107" y1="293" x2="78" y2="322"/>
    <line x1="293" y1="293" x2="322" y2="322"/>
  </g>

  <!-- Sun -->
  <circle cx="200" cy="200" r="90" fill="url(#sun)"/>
  <circle cx="200" cy="200" r="90" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="3"/>

  <!-- Petals blooming around the sun -->
  <g fill="url(#petal)" opacity="0.85">
    <ellipse cx="200" cy="105" rx="26" ry="42"/>
    <ellipse cx="200" cy="295" rx="26" ry="42"/>
    <ellipse cx="105" cy="200" rx="42" ry="26"/>
    <ellipse cx="295" cy="200" rx="42" ry="26"/>
    <ellipse cx="135" cy="135" rx="24" ry="38" transform="rotate(-45 135 135)"/>
    <ellipse cx="265" cy="135" rx="24" ry="38" transform="rotate(45 265 135)"/>
    <ellipse cx="135" cy="265" rx="24" ry="38" transform="rotate(45 135 265)"/>
    <ellipse cx="265" cy="265" rx="24" ry="38" transform="rotate(-45 265 265)"/>
  </g>

  <!-- Inner warmth -->
  <circle cx="200" cy="200" r="48" fill="#FFFDE7" opacity="0.9"/>
  <circle cx="200" cy="200" r="22" fill="#FFFFFF"/>

  <!-- Rising birds of joy -->
  <g fill="none" stroke="#7B3F00" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.7">
    <path d="M60 330 Q72 316 84 330 Q96 316 108 330"/>
    <path d="M300 60 Q310 50 320 60 Q330 50 340 60"/>
    <path d="M320 320 Q328 312 336 320 Q344 312 352 320"/>
  </g>
</svg>