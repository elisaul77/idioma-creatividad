<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="sky" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#2b1b4f"/>
      <stop offset="60%" stop-color="#101633"/>
      <stop offset="100%" stop-color="#05060f"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4fd1c5"/>
      <stop offset="100%" stop-color="#1a7f8a"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#ff5e62"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7b0" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff7b0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- الخلفية -->
  <rect width="400" height="400" fill="url(#sky)"/>
  <g fill="#ffffff" opacity="0.7">
    <circle cx="48" cy="60" r="1.6"/>
    <circle cx="330" cy="46" r="2"/>
    <circle cx="370" cy="150" r="1.4"/>
    <circle cx="28" cy="210" r="1.8"/>
    <circle cx="352" cy="300" r="1.5"/>
    <circle cx="90" cy="330" r="1.3"/>
  </g>

  <!-- الأجنحة الورقية -->
  <g>
    <path d="M195 150 C 215 60, 300 40, 330 90 C 300 120, 250 150, 195 165 Z" fill="url(#wing)" opacity="0.9"/>
    <path d="M205 160 C 240 110, 300 110, 345 150 C 310 170, 250 185, 205 180 Z" fill="url(#wing)" opacity="0.75"/>
    <path d="M190 160 C 170 90, 110 70, 70 105 C 105 130, 140 150, 190 170 Z" fill="url(#wing)" opacity="0.8"/>
  </g>

  <!-- الذيل: مراوح هلالية -->
  <g fill="#f7c948" opacity="0.9">
    <path d="M285 235 C 335 200, 360 240, 325 265 C 350 250, 350 300, 300 290 Z"/>
    <path d="M290 240 C 330 230, 345 265, 310 280 Z" fill="#ff8c42"/>
  </g>

  <!-- الجسم -->
  <ellipse cx="200" cy="230" rx="95" ry="68" fill="url(#body)"/>
  <!-- بقع متوهجة على الجسم -->
  <circle cx="165" cy="215" r="10" fill="#c6fff1" opacity="0.5"/>
  <circle cx="222" cy="250" r="6" fill="#c6fff1" opacity="0.4"/>
  <circle cx="250" cy="215" r="4" fill="#c6fff1" opacity="0.5"/>

  <!-- الرأس -->
  <circle cx="115" cy="185" r="38" fill="#8e6cef"/>
  <!-- قرن حلزوني -->
  <path d="M115 150 C 115 120, 140 105, 150 120 C 160 135, 135 140, 135 122" fill="none" stroke="#ffe27a" stroke-width="7" stroke-linecap="round"/>
  <!-- أذن كالمروحة -->
  <path d="M88 165 C 60 140, 55 185, 82 195 Z" fill="#c084fc"/>

  <!-- العين المتوهجة -->
  <circle cx="128" cy="180" r="18" fill="url(#glow)"/>
  <circle cx="128" cy="180" r="8" fill="#fff7b0"/>
  <circle cx="128" cy="180" r="3" fill="#2b1b4f"/>

  <!-- منقار مزدوج -->
  <path d="M85 192 L 58 200 L 85 205 Z" fill="#ff7eb6"/>

  <!-- الأرجل: أطوال مختلفة وأقدام حلقية -->
  <g stroke="#1a7f8a" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M160 290 L 150 340 L 135 352"/>
    <path d="M180 295 L 180 350 L 195 356"/>
    <path d="M225 295 L 232 335 L 250 340"/>
    <path d="M250 288 L 270 320 L 290 322"/>
  </g>
  <g fill="none" stroke="#ffe27a" stroke-width="3">
    <circle cx="135" cy="352" r="6"/>
    <circle cx="195" cy="356" r="6"/>
    <circle cx="250" cy="340" r="6"/>
    <circle cx="290" cy="322" r="6"/>
  </g>

  <!-- ظل على الأرض -->
  <ellipse cx="205" cy="372" rx="120" ry="8" fill="#000" opacity="0.35"/>
</svg>