<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050b1f"/>
      <stop offset="60%" stop-color="#0d2550"/>
      <stop offset="100%" stop-color="#1b4d6e"/>
    </linearGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a3b5c"/>
      <stop offset="50%" stop-color="#5fd4ff"/>
      <stop offset="100%" stop-color="#2a3b5c"/>
    </linearGradient>
    <radialGradient id="leaf" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0fff7"/>
      <stop offset="50%" stop-color="#4dffc3"/>
      <stop offset="100%" stop-color="#00a6ff" stop-opacity="0.6"/>
    </radialGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6c2"/>
      <stop offset="60%" stop-color="#ffb347" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff7b00" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="40" cy="50" r="1.5" opacity="0.9"/>
    <circle cx="90" cy="25" r="1" opacity="0.7"/>
    <circle cx="150" cy="60" r="1.2" opacity="0.8"/>
    <circle cx="330" cy="40" r="1.6" opacity="0.9"/>
    <circle cx="360" cy="100" r="1" opacity="0.6"/>
    <circle cx="300" cy="75" r="1.1" opacity="0.8"/>
    <circle cx="60" cy="130" r="1" opacity="0.6"/>
    <circle cx="370" cy="200" r="1.3" opacity="0.7"/>
    <circle cx="25" cy="220" r="1" opacity="0.5"/>
  </g>

  <!-- Sun / energy core -->
  <circle cx="200" cy="170" r="110" fill="url(#sun)" opacity="0.5"/>

  <!-- Ground: glowing grid platform -->
  <ellipse cx="200" cy="350" rx="150" ry="30" fill="none" stroke="#5fd4ff" stroke-width="1.5" opacity="0.6" filter="url(#glow)"/>
  <ellipse cx="200" cy="350" rx="110" ry="20" fill="none" stroke="#5fd4ff" stroke-width="1" opacity="0.4"/>
  <ellipse cx="200" cy="350" rx="70" ry="12" fill="#1b4d6e" opacity="0.6"/>

  <!-- Trunk -->
  <path d="M190 350 L192 260 Q193 240 186 220 L190 200 L210 200 L214 220 Q207 240 208 260 L210 350 Z" fill="url(#trunk)" filter="url(#glow)"/>

  <!-- Main branches (circuit-like) -->
  <g fill="none" stroke="#5fd4ff" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)">
    <path d="M200 205 L160 170 L130 170 L110 150"/>
    <path d="M200 205 L240 170 L270 170 L290 150"/>
    <path d="M200 200 L200 150 L195 120"/>
    <path d="M160 170 L150 140 L120 130"/>
    <path d="M240 170 L250 140 L280 130"/>
    <path d="M200 150 L175 115 L165 85"/>
    <path d="M200 150 L225 115 L235 85"/>
  </g>

  <!-- Circuit nodes -->
  <g fill="#ffd166" filter="url(#glow)">
    <circle cx="160" cy="170" r="3"/>
    <circle cx="240" cy="170" r="3"/>
    <circle cx="130" cy="170" r="2.5"/>
    <circle cx="270" cy="170" r="2.5"/>
    <circle cx="150" cy="140" r="2.5"/>
    <circle cx="250" cy="140" r="2.5"/>
    <circle cx="200" cy="150" r="3"/>
    <circle cx="175" cy="115" r="2.5"/>
    <circle cx="225" cy="115" r="2.5"/>
  </g>

  <!-- Canopy: glowing floating leaves -->
  <g filter="url(#glow)">
    <circle cx="110" cy="150" r="14" fill="url(#leaf)"/>
    <circle cx="290" cy="150" r="14" fill="url(#leaf)"/>
    <circle cx="120" cy="130" r="11" fill="url(#leaf)"/>
    <circle cx="280" cy="130" r="11" fill="url(#leaf)"/>
    <circle cx="165" cy="85" r="16" fill="url(#leaf)"/>
    <circle cx="235" cy="85" r="16" fill="url(#leaf)"/>
    <circle cx="195" cy="120" r="13" fill="url(#leaf)"/>
    <circle cx="200" cy="65" r="18" fill="url(#leaf)"/>
    <circle cx="150" cy="115" r="10" fill="url(#leaf)"/>
    <circle cx="250" cy="115" r="10" fill="url(#leaf)"/>
    <circle cx="180" cy="50" r="9" fill="url(#leaf)"/>
    <circle cx="222" cy="48" r="9" fill="url(#leaf)"/>
  </g>

  <!-- Floating data particles -->
  <g fill="#4dffc3" filter="url(#glow)">
    <circle cx="80" cy="200" r="2"/>
    <circle cx="320" cy="210" r="2"/>
    <circle cx="100" cy="260" r="1.5"/>
    <circle cx="305" cy="265" r="1.5"/>
    <circle cx="140" cy="300" r="1.8"/>
    <circle cx="265" cy="305" r="1.8"/>
  </g>
</svg>