<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="himmel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1f4b"/>
      <stop offset="0.6" stop-color="#4a3a7a"/>
      <stop offset="1" stop-color="#e58a7b"/>
    </linearGradient>
    <linearGradient id="koerper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb36b"/>
      <stop offset="0.55" stop-color="#e8637a"/>
      <stop offset="1" stop-color="#7d4fb5"/>
    </linearGradient>
    <linearGradient id="fluegel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ff5e1" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#3fa7c9" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="boden" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2350"/>
      <stop offset="1" stop-color="#120e28"/>
    </linearGradient>
    <radialGradient id="mond" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#fff8e1"/>
      <stop offset="1" stop-color="#f3d59b"/>
    </radialGradient>
  </defs>

  <!-- Himmel -->
  <rect width="400" height="400" fill="url(#himmel)"/>

  <!-- Sterne -->
  <g fill="#ffffff">
    <circle cx="40" cy="50" r="1.5"/>
    <circle cx="92" cy="28" r="1"/>
    <circle cx="150" cy="70" r="1.8"/>
    <circle cx="210" cy="36" r="1.2"/>
    <circle cx="330" cy="90" r="1.6"/>
    <circle cx="365" cy="150" r="1"/>
    <circle cx="60" cy="140" r="1.1"/>
    <circle cx="270" cy="25" r="1"/>
  </g>

  <!-- Mond -->
  <circle cx="320" cy="62" r="28" fill="url(#mond)"/>
  <circle cx="330" cy="54" r="22" fill="#4a3a7a" opacity="0.18"/>

  <!-- Flügel aus Wolkenfäden -->
  <path d="M170 200 C120 120, 60 110, 30 150 C60 150, 85 165, 110 200 C80 190, 55 200, 40 230 C80 225, 120 220, 170 225 Z"
        fill="url(#fluegel)" stroke="#7ff5e1" stroke-width="1.5" opacity="0.9"/>
  <path d="M235 200 C280 120, 340 110, 370 150 C340 150, 315 165, 290 200 C320 190, 345 200, 360 230 C320 225, 280 220, 235 225 Z"
        fill="url(#fluegel)" stroke="#7ff5e1" stroke-width="1.5" opacity="0.9"/>

  <!-- Schweif als Komet -->
  <path d="M265 250 C320 260, 350 290, 378 330 C350 310, 320 300, 280 285 Z" fill="#ffb36b" opacity="0.85"/>
  <path d="M270 262 C315 270, 340 295, 362 318" stroke="#fff3c4" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="380" cy="334" r="7" fill="#fff3c4"/>
  <circle cx="380" cy="334" r="14" fill="#ffd27a" opacity="0.35"/>

  <!-- Beine -->
  <g stroke="#7d4fb5" stroke-width="12" stroke-linecap="round">
    <line x1="150" y1="265" x2="138" y2="330"/>
    <line x1="175" y1="272" x2="170" y2="340"/>
    <line x1="225" y1="272" x2="230" y2="340"/>
    <line x1="250" y1="265" x2="262" y2="330"/>
  </g>
  <!-- Klauen aus Kristall -->
  <g fill="#7ff5e1">
    <path d="M132 330 L138 346 L144 330 Z"/>
    <path d="M164 340 L170 356 L176 340 Z"/>
    <path d="M224 340 L230 356 L236 340 Z"/>
    <path d="M256 330 L262 346 L268 330 Z"/>
  </g>

  <!-- Körper -->
  <ellipse cx="200" cy="230" rx="88" ry="54" fill="url(#koerper)"/>
  <!-- Schuppenmuster -->
  <g fill="none" stroke="#fff3c4" stroke-width="2" opacity="0.4">
    <path d="M160 215 q8 -8 16 0 q8 -8 16 0"/>
    <path d="M195 225 q8 -8 16 0 q8 -8 16 0"/>
    <path d="M170 245 q8 -8 16 0 q8 -8 16 0"/>
    <path d="M225 245 q8 -8 16 0 q8 -8 16 0"/>
  </g>

  <!-- Hals und Kopf -->
  <ellipse cx="128" cy="196" rx="30" ry="26" fill="url(#koerper)"/>
  <circle cx="110" cy="182" r="34" fill="url(#koerper)"/>

  <!-- Spiralhorn -->
  <path d="M104 152 C100 128, 118 118, 128 130 C136 140, 124 150, 118 142"
        fill="none" stroke="#fff3c4" stroke-width="6" stroke-linecap="round"/>
  <path d="M86 156 C74 140, 80 120, 96 118" fill="none" stroke="#ffd27a" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

  <!-- Augen (drei, im Dreieck) -->
  <circle cx="98" cy="178" r="6" fill="#1b1f4b"/>
  <circle cx="122" cy="178" r="6" fill="#1b1f4b"/>
  <circle cx="110" cy="195" r="4.5" fill="#1b1f4b"/>
  <circle cx="100" cy="176" r="2" fill="#fff8e1"/>
  <circle cx="124" cy="176" r="2" fill="#fff8e1"/>
  <circle cx="112" cy="193" r="1.5" fill="#fff8e1"/>

  <!-- Schnauze und Lächeln -->
  <path d="M86 200 Q100 212 118 204" fill="none" stroke="#1b1f4b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Ohren als Blätter -->
  <path d="M88 160 Q72 150 74 132 Q90 140 96 154 Z" fill="#7d4fb5"/>
  <path d="M130 156 Q138 138 152 140 Q146 156 136 164 Z" fill="#7d4fb5"/>

  <!-- Boden -->
  <path d="M0 340 Q100 320 200 338 T400 335 L400 400 L0 400 Z" fill="url(#boden)"/>
  <ellipse cx="200" cy="352" rx="110" ry="8" fill="#000000" opacity="0.3"/>

  <!-- Leuchtende Pilze am Boden -->
  <g>
    <rect x="58" y="340" width="4" height="12" fill="#e8f7ff"/>
    <path d="M52 342 Q60 330 68 342 Z" fill="#7ff5e1"/>
    <rect x="330" y="344" width="3" height="10" fill="#e8f7ff"/>
    <path d="M325 346 Q331 336 337 346 Z" fill="#ff8fab"/>
  </g>
</svg>