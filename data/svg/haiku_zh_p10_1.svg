<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6f7ff"/>
      <stop offset="55%" stop-color="#9fd8f5"/>
      <stop offset="100%" stop-color="#1e6fb8"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#7cc4ff"/>
      <stop offset="70%" stop-color="#2459c9"/>
      <stop offset="100%" stop-color="#14306e"/>
    </radialGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4fb3ec" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#2f7fd1" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2b5fb8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#17448f" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- breath of air / glow -->
  <circle cx="200" cy="170" r="150" fill="url(#glow)"/>

  <!-- scattered drifting bubbles -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5">
    <circle cx="70" cy="80" r="8"/>
    <circle cx="330" cy="60" r="5"/>
    <circle cx="350" cy="130" r="11"/>
    <circle cx="48" cy="190" r="6"/>
    <circle cx="320" cy="230" r="7"/>
  </g>

  <!-- the blue orb: a drop of concentrated flavor -->
  <circle cx="200" cy="165" r="88" fill="url(#orb)"/>
  <ellipse cx="170" cy="130" rx="26" ry="14" fill="#ffffff" fill-opacity="0.6" transform="rotate(-25 170 130)"/>
  <circle cx="228" cy="110" r="4" fill="#ffffff" fill-opacity="0.8"/>

  <!-- rising sparkles around the orb -->
  <g fill="#ffffff">
    <path d="M90 130 l3 -9 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 z" fill-opacity="0.8"/>
    <path d="M305 175 l2 -6 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 z" fill-opacity="0.9"/>
    <path d="M285 95 l1.5 -4 l1.5 4 l4 1.5 l-4 1.5 l-1.5 4 l-1.5 -4 l-4 -1.5 z" fill-opacity="0.7"/>
  </g>

  <!-- layered waves: the sea-salt breeze of blue -->
  <path d="M0 265 Q50 245 100 265 T200 265 T300 265 T400 265 L400 400 L0 400 Z" fill="url(#wave1)"/>
  <path d="M0 295 Q60 275 120 295 T240 295 T360 295 T400 290 L400 400 L0 400 Z" fill="url(#wave2)" fill-opacity="0.9"/>
  <path d="M0 325 Q70 308 140 325 T280 325 T400 320 L400 400 L0 400 Z" fill="#11366f"/>

  <!-- foam crests -->
  <g fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.75">
    <path d="M40 268 Q60 258 80 268"/>
    <path d="M190 268 Q210 258 230 268"/>
    <path d="M300 298 Q320 288 340 298"/>
    <path d="M110 300 Q125 292 140 300"/>
  </g>

  <!-- droplets falling from the orb -->
  <g fill="#7cc4ff" fill-opacity="0.85">
    <path d="M200 262 q-5 9 0 14 q5 -5 0 -14 z"/>
    <path d="M165 258 q-4 7 0 11 q4 -4 0 -11 z"/>
    <path d="M238 255 q-3 6 0 9 q3 -3 0 -9 z"/>
  </g>
</svg>