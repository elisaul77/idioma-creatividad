<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0b24"/>
      <stop offset="0.6" stop-color="#11204a"/>
      <stop offset="1" stop-color="#0b3b4a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7d6"/>
      <stop offset="0.5" stop-color="#ff9ad5" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff5fb0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cf5ff"/>
      <stop offset="1" stop-color="#2a3b7a"/>
    </linearGradient>
    <linearGradient id="branch" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3ee8ff"/>
      <stop offset="1" stop-color="#c77dff"/>
    </linearGradient>
    <radialGradient id="leaf" cx="0.3" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#b8fff0"/>
      <stop offset="1" stop-color="#1fd1a6"/>
    </radialGradient>
    <radialGradient id="ground" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3ee8ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#3ee8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Фон -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- Звёзды -->
  <g fill="#ffffff">
    <circle cx="30" cy="40" r="1.2" opacity="0.8"/>
    <circle cx="80" cy="18" r="0.9" opacity="0.6"/>
    <circle cx="350" cy="30" r="1.4" opacity="0.9"/>
    <circle cx="320" cy="200" r="1" opacity="0.6"/>
    <circle cx="50" cy="210" r="1.1" opacity="0.7"/>
    <circle cx="370" cy="260" r="0.9" opacity="0.6"/>
    <circle cx="25" cy="300" r="1.2" opacity="0.5"/>
    <circle cx="190" cy="16" r="0.8" opacity="0.7"/>
  </g>

  <!-- Солнце / светило -->
  <circle cx="320" cy="90" r="60" fill="url(#sun)"/>
  <circle cx="320" cy="90" r="22" fill="#fff7d6" filter="url(#glow)"/>

  <!-- Орбитальные кольца -->
  <ellipse cx="200" cy="150" rx="175" ry="40" transform="rotate(-12 200 150)"
           fill="none" stroke="#3ee8ff" stroke-width="1" stroke-dasharray="4 6" opacity="0.45"/>
  <ellipse cx="200" cy="150" rx="140" ry="28" transform="rotate(10 200 150)"
           fill="none" stroke="#c77dff" stroke-width="0.8" opacity="0.35"/>

  <!-- Свечение у основания -->
  <ellipse cx="200" cy="345" rx="150" ry="40" fill="url(#ground)"/>

  <!-- Земля -->
  <ellipse cx="200" cy="342" rx="120" ry="16" fill="none" stroke="#3ee8ff" stroke-width="1.5" filter="url(#glow)" opacity="0.8"/>

  <!-- Ствол -->
  <path d="M190,340 Q196,270 188,205 L212,205 Q204,270 210,340 Z" fill="url(#trunk)" opacity="0.95"/>

  <!-- Ветви -->
  <g fill="none" stroke="url(#branch)" stroke-linecap="round" stroke-width="4" filter="url(#glow)">
    <path d="M200,205 Q198,165 200,120"/>
    <path d="M200,172 Q170,152 140,120 Q128,108 120,90"/>
    <path d="M200,160 Q230,140 262,110 Q274,98 285,85"/>
    <path d="M198,142 Q180,120 165,70"/>
    <path d="M201,136 Q220,110 240,62"/>
    <path d="M200,120 Q200,92 205,50"/>
    <path d="M140,120 Q120,110 105,125" stroke-width="2.5"/>
    <path d="M262,110 Q280,120 300,140" stroke-width="2.5"/>
    <path d="M165,70 Q150,60 138,48" stroke-width="2"/>
    <path d="M240,62 Q256,50 262,36" stroke-width="2"/>
  </g>

  <!-- Узлы-схемы на концах ветвей -->
  <g fill="#0a0b24" stroke="#7cf5ff" stroke-width="1.5" filter="url(#glow)">
    <circle cx="120" cy="90" r="3.5"/>
    <circle cx="285" cy="85" r="3.5"/>
    <circle cx="165" cy="70" r="3"/>
    <circle cx="240" cy="62" r="3"/>
    <circle cx="205" cy="50" r="3"/>
    <circle cx="105" cy="125" r="2.5"/>
    <circle cx="300" cy="140" r="2.5"/>
    <circle cx="138" cy="48" r="2.5"/>
    <circle cx="262" cy="36" r="2.5"/>
  </g>

  <!-- Светящаяся листва -->
  <g fill="url(#leaf)" filter="url(#glow)" opacity="0.9">
    <ellipse cx="128" cy="78" rx="9" ry="4" transform="rotate(-30 128 78)"/>
    <ellipse cx="275" cy="72" rx="9" ry="4" transform="rotate(25 275 72)"/>
    <ellipse cx="152" cy="58" rx="8" ry="3.5" transform="rotate(-20 152 58)"/>
    <ellipse cx="226" cy="50" rx="8" ry="3.5" transform="rotate(15 226 50)"/>
    <ellipse cx="196" cy="38" rx="9" ry="4" transform="rotate(-5 196 38)"/>
    <ellipse cx="250" cy="24" rx="7" ry="3" transform="rotate(30 250 24)"/>
    <ellipse cx="140" cy="36" rx="7" ry="3" transform="rotate(-35 140 36)"/>
    <ellipse cx="96" cy="118" rx="8" ry="3.5" transform="rotate(-25 96 118)"/>
    <ellipse cx="312" cy="132" rx="8" ry="3.5" transform="rotate(20 312 132)"/>
    <ellipse cx="180" cy="110" rx="7" ry="3" transform="rotate(-15 180 110)"/>
    <ellipse cx="222" cy="98" rx="7" ry="3" transform="rotate(18 222 98)"/>
    <ellipse cx="270" cy="112" rx="6" ry="2.5" transform="rotate(35 270 112)"/>
  </g>

  <!-- Светящиеся частицы -->
  <g fill="#7cf5ff" filter="url(#glow)">
    <circle cx="95" cy="200" r="2" opacity="0.8"/>
    <circle cx="310" cy="210" r="2.2" opacity="0.8"/>
    <circle cx="150" cy="260" r="1.6" opacity="0.7"/>
    <circle cx="265" cy="280" r="1.8" opacity="0.7"/>
    <circle cx="80" cy="270" r="1.4" opacity="0.6"/>
    <circle cx="335" cy="300" r="1.6" opacity="0.6"/>
  </g>
</svg>