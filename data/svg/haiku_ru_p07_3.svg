<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0f2c"/>
      <stop offset="60%" stop-color="#1b1f4b"/>
      <stop offset="100%" stop-color="#3b2a63"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6c2"/>
      <stop offset="50%" stop-color="#ffb35c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff6b8a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a3b5c"/>
      <stop offset="50%" stop-color="#4fe3ff"/>
      <stop offset="100%" stop-color="#2a3b5c"/>
    </linearGradient>
    <radialGradient id="leaf" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#5cffd6"/>
      <stop offset="100%" stop-color="#5cffd6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Фон -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- Звезды -->
  <g fill="#ffffff">
    <circle cx="40" cy="50" r="1.2" opacity="0.9"/>
    <circle cx="90" cy="30" r="0.8" opacity="0.6"/>
    <circle cx="160" cy="60" r="1" opacity="0.8"/>
    <circle cx="320" cy="40" r="1.3" opacity="0.9"/>
    <circle cx="360" cy="95" r="0.9" opacity="0.7"/>
    <circle cx="260" cy="20" r="0.7" opacity="0.6"/>
    <circle cx="30" cy="150" r="0.8" opacity="0.5"/>
    <circle cx="370" cy="180" r="1" opacity="0.6"/>
  </g>

  <!-- Солнце / светящийся ореол -->
  <circle cx="200" cy="170" r="110" fill="url(#sun)" opacity="0.5"/>
  <circle cx="200" cy="170" r="45" fill="#fff1b8" opacity="0.25" filter="url(#glow)"/>

  <!-- Холмы-платформы -->
  <path d="M0 330 Q100 300 200 320 T400 310 L400 400 L0 400 Z" fill="#0f1738"/>
  <path d="M0 355 Q120 335 220 350 T400 345 L400 400 L0 400 Z" fill="#070b1f"/>

  <!-- Ствол-кабель -->
  <path d="M196 340 C192 300 204 270 198 230 C194 200 206 180 200 150"
        fill="none" stroke="url(#trunk)" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Ветви -->
  <g fill="none" stroke="#4fe3ff" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)">
    <path d="M198 230 C170 215 145 210 120 175"/>
    <path d="M202 225 C230 210 255 205 285 165"/>
    <path d="M200 190 C180 170 165 150 150 115"/>
    <path d="M201 185 C225 165 240 145 260 110"/>
    <path d="M200 150 C190 130 185 110 200 75"/>
    <path d="M120 175 C105 165 95 160 80 165"/>
    <path d="M285 165 C300 155 312 158 322 148"/>
    <path d="M150 115 C135 105 125 95 118 80"/>
    <path d="M260 110 C272 100 282 92 292 96"/>
  </g>

  <!-- Узлы ветвей -->
  <g fill="#ffffff" filter="url(#glow)">
    <circle cx="120" cy="175" r="3"/>
    <circle cx="285" cy="165" r="3"/>
    <circle cx="150" cy="115" r="3"/>
    <circle cx="260" cy="110" r="3"/>
    <circle cx="200" cy="75" r="3.5"/>
    <circle cx="80" cy="165" r="2.5"/>
    <circle cx="322" cy="148" r="2.5"/>
    <circle cx="118" cy="80" r="2.5"/>
    <circle cx="292" cy="96" r="2.5"/>
  </g>

  <!-- Светящаяся крона (листья-сферы) -->
  <g>
    <circle cx="200" cy="72" r="34" fill="url(#leaf)" opacity="0.8"/>
    <circle cx="150" cy="105" r="30" fill="url(#leaf)" opacity="0.75"/>
    <circle cx="258" cy="100" r="30" fill="url(#leaf)" opacity="0.75"/>
    <circle cx="120" cy="170" r="24" fill="url(#leaf)" opacity="0.7"/>
    <circle cx="285" cy="160" r="24" fill="url(#leaf)" opacity="0.7"/>
    <circle cx="80" cy="160" r="16" fill="url(#leaf)" opacity="0.6"/>
    <circle cx="322" cy="145" r="16" fill="url(#leaf)" opacity="0.6"/>
    <circle cx="118" cy="78" r="14" fill="url(#leaf)" opacity="0.6"/>
    <circle cx="292" cy="92" r="14" fill="url(#leaf)" opacity="0.6"/>
  </g>

  <!-- Летящие светлячки-дроны -->
  <g fill="#ffe27a" filter="url(#glow)">
    <circle cx="70" cy="110" r="2"/>
    <circle cx="335" cy="200" r="2"/>
    <circle cx="105" cy="250" r="1.6"/>
    <circle cx="310" cy="265" r="1.6"/>
    <circle cx="170" cy="280" r="1.8"/>
  </g>

  <!-- Орбитальное кольцо -->
  <ellipse cx="200" cy="200" rx="170" ry="30" fill="none" stroke="#9d7bff" stroke-width="1.2" opacity="0.5" transform="rotate(-12 200 200)"/>
</svg>