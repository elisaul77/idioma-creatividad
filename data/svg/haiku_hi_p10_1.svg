<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#e3f2fd"/>
      <stop offset="60%" stop-color="#90caf9"/>
      <stop offset="100%" stop-color="#1a237e"/>
    </radialGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="50%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#0d47a1"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>
    <clipPath id="glassClip">
      <path d="M120 90 L280 90 L256 325 Q254 332 246 332 L154 332 Q146 332 144 325 Z"/>
    </clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- soft shadow beneath glass -->
  <ellipse cx="200" cy="338" rx="110" ry="14" fill="#0d47a1" opacity="0.35" filter="url(#soft)"/>

  <!-- ripples -->
  <ellipse cx="200" cy="345" rx="130" ry="18" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
  <ellipse cx="200" cy="350" rx="165" ry="25" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>

  <!-- liquid, clipped to glass -->
  <g clip-path="url(#glassClip)">
    <rect x="100" y="140" width="200" height="200" fill="url(#liquid)"/>
    <path d="M100 150 Q140 134 180 150 T260 150 T320 150 L320 360 L100 360 Z" fill="#4fc3f7" opacity="0.55"/>
    <path d="M100 158 Q140 144 180 158 T260 158 T320 158 L320 360 L100 360 Z" fill="url(#liquid)" opacity="0.9"/>
    <!-- bubbles -->
    <circle cx="160" cy="250" r="4" fill="#ffffff" opacity="0.6"/>
    <circle cx="200" cy="220" r="3" fill="#ffffff" opacity="0.5"/>
    <circle cx="235" cy="280" r="5" fill="#ffffff" opacity="0.45"/>
    <circle cx="180" cy="300" r="3" fill="#ffffff" opacity="0.6"/>
    <circle cx="215" cy="200" r="2.5" fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- glass body -->
  <path d="M120 90 L280 90 L256 325 Q254 332 246 332 L154 332 Q146 332 144 325 Z" fill="url(#glass)" stroke="#ffffff" stroke-width="3" stroke-opacity="0.8"/>
  <!-- glass rim -->
  <line x1="118" y1="90" x2="282" y2="90" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  <!-- glass highlight -->
  <line x1="138" y1="110" x2="152" y2="300" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.45"/>

  <!-- falling droplets -->
  <path d="M200 30 C192 45 186 53 186 62 A14 14 0 0 0 214 62 C214 53 208 45 200 30 Z" fill="#1e88e5" opacity="0.9"/>
  <path d="M150 48 C145 58 142 63 142 69 A8 8 0 0 0 158 69 C158 63 155 58 150 48 Z" fill="#42a5f5" opacity="0.8"/>
  <path d="M258 20 C254 28 252 32 252 37 A6 6 0 0 0 264 37 C264 32 262 28 258 20 Z" fill="#64b5f6" opacity="0.7"/>

  <!-- taste waves emanating -->
  <path d="M300 130 Q315 145 300 160 Q285 175 300 190" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M320 120 Q340 145 320 170 Q300 195 320 220" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
  <path d="M90 130 Q75 145 90 160 Q105 175 90 190" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M70 120 Q50 145 70 170 Q90 195 70 220" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
</svg>